<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉬는 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --ground:#e4dccb; --ink:#2f3a2c; --soft:#7b8571; --card:#fffdf8; --line:#d8cfbd;
  --accent:#4f8a5b; --glow:#f2c94c; --star:#e7b53c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* ---------- 설정 화면 ---------- */
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:var(--bg)}
#setup .box{width:min(720px,100%);background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 24px 26px}
#setup h1{font-family:Jua;font-weight:400;font-size:30px;margin:0 0 4px}
#setup .sub{color:var(--soft);font-size:15px;margin:0 0 18px}
.row{margin:16px 0 0}
.row>b{display:block;font-size:16px;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:500 17px 'Noto Sans KR';padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:48px}
.seg button.on{border-color:var(--accent);background:#e7f1e5;color:#24502e;font-weight:700}
.seg button small{display:block;font-weight:400;font-size:13px;color:var(--soft)}
#setPreview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;min-height:64px}
#setPreview figure{margin:0;text-align:center;font-family:Jua;font-size:17px}
#setPreview img{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 2px}
#go{margin-top:22px;width:100%;font:400 26px Jua;padding:14px;border-radius:16px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.note{font-size:13px;color:var(--soft);margin-top:12px;line-height:1.55}

/* ---------- 놀이 화면 ---------- */
#game{position:fixed;inset:0;display:none}
#game.show{display:block}
#ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--ground);border-top:2px solid var(--line)}
#game.meadow{background:linear-gradient(#e9f3f7 0%,#f4f8f1 66%)}
#game.meadow #ground{background:linear-gradient(#dcebc9,#cfe2b8);border-top:2px solid #c3d8a6}
#stars{position:absolute;top:14px;left:0;right:0;margin:0 auto;width:fit-content;display:flex;gap:6px}
#stars i{width:30px;height:30px;display:block;opacity:.18;transition:opacity .4s ease}
#stars i.on{opacity:1}
#stars svg{width:100%;height:100%}
#item{position:absolute;left:50%;top:0;transform:translate(-50%,-120%);pointer-events:none;transition:transform 2.6s cubic-bezier(.25,.6,.3,1),opacity .4s ease}
#item img{width:100%;height:100%;object-fit:contain;display:block}
#item .tag{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-family:Jua;color:var(--ink);line-height:1}
#item.card{background:var(--card);border:3px solid var(--line);border-radius:22px}
#targets{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:flex-end}
.tg{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:opacity .35s ease, transform .35s ease}
.tg .pic{position:relative;cursor:pointer}
.tg .pic img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .4s ease}
.tg .word{font-family:Jua;line-height:1.05;cursor:pointer;padding:2px 10px;border-radius:12px;white-space:nowrap}
.tg{border-radius:18px}
.tg.hint{box-shadow:0 0 0 5px var(--glow)}
.tg.basket{justify-content:flex-start;cursor:pointer}
.tg.basket .slot{position:relative;width:100%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.tg.basket .slot img{object-fit:contain;display:block;margin-bottom:-12%;transition:transform .4s ease-in,opacity .4s ease}
.tg.basket .bk{position:absolute;left:0;right:0;bottom:0}
.tg.basket .bk svg{width:100%;height:100%;display:block}
.tg.basket .lbl{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:Jua;line-height:1.1;background:#fffdf8;border:2px solid #7a4f22;border-radius:12px;padding:.04em .4em;white-space:nowrap;color:var(--ink)}
.tg.hop{transform:translateY(-14px)}
#reveal{position:absolute;inset:0;pointer-events:none;transition:opacity .25s ease}
#reveal .rv-pic{position:absolute;object-fit:contain;transition:left .5s ease,top .5s ease,width .5s ease,height .5s ease,opacity .3s ease}
#reveal .rv-word{position:absolute;left:0;right:0;text-align:center;font-family:Jua;line-height:1.2;color:var(--ink);white-space:nowrap}
#reveal .rv-word span{opacity:0;transition:opacity .35s ease}
#reveal .rv-word span.on{opacity:1}
#reveal .rv-word.lab{right:auto;transition:left .5s ease,top .5s ease,font-size .5s ease}
#reveal .rv-word span{display:inline-block;transition:opacity .35s ease,color .25s ease,transform .25s ease}
#reveal .rv-word span.now{color:#c0562b;transform:translateY(-6%)}
#bodyStage{position:absolute}
#bodyStage img{width:100%;height:100%;object-fit:contain;display:block}
#bodyStage .stuck{position:absolute}
#bodyStage .stuck svg,#item.bandage svg{width:100%;height:100%;display:block}
#labels{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px}
.tg.bl{flex-direction:row;justify-content:center;gap:10px;background:#fffdf8;border:2px solid var(--line);border-radius:18px;cursor:pointer;padding:0 10px}
.tg.bl img{object-fit:contain;transition:opacity .4s ease}
.tg.bl .lbl{font-family:Jua;line-height:1.1;white-space:nowrap;color:var(--ink)}
#doneBox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:var(--bg)}
#doneBox.show{display:flex}
#doneBox .big{font-family:Jua;font-size:min(9vw,64px)}
#doneBox .bar{display:flex;gap:10px}
#doneBox button{font:400 24px Jua;padding:12px 26px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}

/* ---------- 관리 버튼 (Aqua 유리알) ---------- */
#mgr{position:fixed;right:14px;bottom:14px;width:43px;height:43px;border-radius:50%;border:0;padding:0;cursor:pointer;z-index:50;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.95) 0 18%,rgba(255,255,255,0) 42%),radial-gradient(circle at 50% 75%,#8fd0ff 0,#1f7fe0 60%,#0b4fa6 100%);
  box-shadow:inset 0 -3px 6px rgba(255,255,255,.45),0 2px 5px rgba(0,0,0,.3);opacity:.4}
#mgr span{font:700 9px 'Noto Sans KR';color:#fff;text-shadow:0 1px 2px #0b4fa6;letter-spacing:.2px}
</style>
</head>
<body>

<div id="setup">
  <div class="box">
    <h1>쉬는 놀이</h1>
    <p class="sub">배운 낱말로 짧게 놀아요. 8번 하면 저절로 끝나요.</p>
    <div class="row"><b>놀이</b><div class="seg" id="segGame">
      <button data-v="feed">먹이 주기<small>동물 이름을 듣고 먹이 주기</small></button>
      <button data-v="basket">바구니 담기<small>낱말을 보고 바구니에 담기</small></button>
      <button data-v="body">스티커 붙이기<small>몸 이름을 듣고 붙이기</small></button>
    </div></div>
    <div class="row"><b>낱말 묶음</b><div class="seg" id="segSet"></div><div id="setPreview"></div></div>
    <div class="row"><b>수준</b><div class="seg" id="segLevel">
      <button data-v="1">1 듣고 고르기<small>그림 2개, 도움 빨리</small></button>
      <button data-v="2">2 글자 알아보기<small>3개, 그림 흐리게</small></button>
      <button data-v="3">3 읽기<small>4개, 글자만</small></button>
    </div></div>
    <div class="row"><b>소리</b><div class="seg" id="segSound">
      <button data-v="on">켜기</button><button data-v="off">끄기</button>
    </div></div>
    <button id="go">시작</button>
    <p class="note">시제품이에요. 목소리는 이 기기의 목소리를 써요. 놀이 중 오른쪽 아래 파란 단추를 한 번 누르면 이 화면으로 돌아와요.</p>
  </div>
</div>

<div id="game">
  <div id="ground"></div>
  <div id="stars"></div>
  <div id="targets"></div>
  <div id="item"></div>
  <div id="doneBox"><div class="big" id="doneMsg"></div><div class="bar"><button id="again">한 번 더</button><button id="toSetup">처음으로</button></div></div>
</div>
<button id="mgr" aria-label="관리"><span>charum</span></button>

<script>
'use strict';
/* ---------- 그림 ---------- */
const BASE = /\/web_app\/007\//.test(location.href) ? 'pics/' : 'https://shim-sung-hyun.github.io/web_app/007/pics/';
const GBASE = /\/web_app\/007\//.test(location.href) ? 'game/feed/' : 'https://shim-sung-hyun.github.io/web_app/007/game/feed/';
const pic = w => BASE + (FILE[w] || BODYFILE[w]) + '.webp';
const BODYIMG = GBASE.replace('game/feed/','game/body/') + 'body.webp';
/* 전신 그림(512×512) 위 몸 부위 자리 */
const PART = {'머리':[253,30],'눈':[262,70],'귀':[223,77],'코':[255,82],'입':[255,94],'이':[245,94],'얼굴':[270,62],'팔':[334,222],'손':[364,292],'손톱':[378,313],'배':[257,222],'다리':[287,420],'무릎':[287,382],'발':[300,490]};

const pose = (w, k) => NOPOSE.has(w) ? pic(w) : GBASE + 'animal/' + FILE[w] + '_' + k + '.webp';
const BODYFILE = {'눈':'nun_sinche','코':'ko','입':'ip','귀':'gwi','이':'i_chia','머리':'meori','얼굴':'eolgul','손':'son','발':'bal','팔':'pal','다리':'dari_sinche','배':'bae_sinche','무릎':'mureup','손톱':'sontop'};

const FEED = {"개": ["bone", "dog_food", "sausage"], "강아지": ["bone", "dog_food", "sausage"], "고양이": ["fish", "cat_food", "milk_saucer"], "토끼": ["carrot", "lettuce", "clover"], "호랑이": ["drumstick", "steak", "ham"], "사자": ["ribs", "roast_chicken", "meat_slab"], "원숭이": ["bananas", "mango", "pineapple"], "곰": ["honey_pot", "salmon", "blueberries"], "소": ["hay", "grass", "corn"], "닭": ["grain", "cabbage_leaf", "corn_kernels"], "병아리": ["grain", "cabbage_leaf", "corn_kernels"], "돼지": ["potato", "sweet_potato", "veg_bucket"], "말": ["apple", "sugar_cubes", "oats"], "코끼리": ["peanuts", "watermelon", "sugar_cane"], "물고기": ["fish_food", "pellets"], "새": ["sunflower_seeds", "crumbs", "red_berries"], "참새": ["sunflower_seeds", "crumbs", "red_berries"], "오리": ["bread_slice", "peas", "water_weed"], "쥐": ["cheese", "rice", "cracker"], "생쥐": ["cheese", "rice", "cracker"], "여우": ["grapes", "egg", "blackberries"], "기린": ["leafy_branch", "cabbage", "celery"], "거북이": ["strawberry", "cucumber", "tomato"], "개구리": ["fly", "dragonfly", "cricket"], "나비": ["pink_flower", "dandelion", "lavender"], "개미": ["cookie", "candy", "cake_slice"], "다람쥐": ["acorn", "chestnut", "walnut"], "펭귄": ["squid", "shrimp", "anchovies"], "하마": ["pumpkin", "melon", "radish"], "사슴": ["deer_cracker", "mushroom", "maple_leaves"], "낙타": ["dates", "cactus", "dry_grass"]};   /* 동물마다 먹이 그림(game/feed/food) */
const FOODKO = {"bone": "뼈다귀", "dog_food": "사료", "sausage": "소시지", "fish": "생선", "cat_food": "통조림", "milk_saucer": "우유", "carrot": "당근", "lettuce": "상추", "clover": "클로버", "drumstick": "닭다리", "steak": "스테이크", "ham": "햄", "ribs": "갈비", "roast_chicken": "통닭", "meat_slab": "고기", "bananas": "바나나", "mango": "망고", "pineapple": "파인애플", "honey_pot": "꿀단지", "salmon": "연어", "blueberries": "블루베리", "hay": "건초", "grass": "풀", "corn": "옥수수", "grain": "모이", "cabbage_leaf": "배춧잎", "corn_kernels": "옥수수", "potato": "감자", "sweet_potato": "고구마", "veg_bucket": "채소", "apple": "사과", "sugar_cubes": "각설탕", "oats": "귀리", "peanuts": "땅콩", "watermelon": "수박", "sugar_cane": "사탕수수", "fish_food": "먹이", "pellets": "먹이", "sunflower_seeds": "해바라기씨", "crumbs": "빵 부스러기", "red_berries": "열매", "bread_slice": "식빵", "peas": "완두콩", "water_weed": "물풀", "cheese": "치즈", "rice": "쌀", "cracker": "크래커", "grapes": "포도", "egg": "달걀", "blackberries": "블랙베리", "leafy_branch": "나뭇잎", "cabbage": "양배추", "celery": "셀러리", "strawberry": "딸기", "cucumber": "오이", "tomato": "토마토", "fly": "파리", "dragonfly": "잠자리", "cricket": "귀뚜라미", "pink_flower": "꽃꿀", "dandelion": "민들레 꿀", "lavender": "라벤더 꿀", "cookie": "과자", "candy": "사탕", "cake_slice": "케이크", "acorn": "도토리", "chestnut": "밤", "walnut": "호두", "squid": "오징어", "shrimp": "새우", "anchovies": "멸치", "pumpkin": "호박", "melon": "멜론", "radish": "무", "deer_cracker": "사슴 과자", "mushroom": "버섯", "maple_leaves": "단풍잎", "dates": "대추야자", "cactus": "선인장", "dry_grass": "마른 풀"};   /* 먹이 이름(말할 때) */
const BASKET = `<svg viewBox="0 0 200 110" preserveAspectRatio="none" aria-hidden="true">
  <defs><clipPath id="bkc"><path d="M8 20 H192 L174 106 Q172 109 168 109 H32 Q28 109 26 106 Z"/></clipPath></defs>
  <path d="M8 20 H192 L174 106 Q172 109 168 109 H32 Q28 109 26 106 Z" fill="#d7a15c"/>
  <g clip-path="url(#bkc)" stroke-width="7" fill="none">
    <path d="M0 36 H200 M0 58 H200 M0 80 H200 M0 102 H200" stroke="#c48a45"/>
    <path d="M0 47 H200 M0 69 H200 M0 91 H200" stroke="#e2b273" stroke-width="5"/>
    <path d="M30 20 L44 110 M62 20 L70 110 M94 20 L97 110 M126 20 L123 110 M158 20 L150 110" stroke="#a8722f" stroke-width="3.5"/>
  </g>
  <path d="M8 20 H192 L174 106 Q172 109 168 109 H32 Q28 109 26 106 Z" fill="none" stroke="#7a4f22" stroke-width="3"/>
  <rect x="3" y="9" width="194" height="18" rx="9" fill="#b97a37" stroke="#7a4f22" stroke-width="3"/>
  <path d="M14 15 H186" stroke="#d9a35f" stroke-width="3" stroke-linecap="round"/>
</svg>`;
const NOPOSE = new Set([]);   /* 모습 그림을 다시 받을 동물: 낱말 그림으로 대신 */
const SETS = {
  body: [{n:'몸 1', w:['눈','코','입','귀']}, {n:'몸 2', w:['손','발','팔','다리']}, {n:'몸 3', w:['머리','배','무릎','손톱']}, {n:'몸 4', w:['얼굴','이','손','발']}],
  feed: [{"n": "동물 1", "w": ["개", "고양이", "토끼", "코끼리"]}, {"n": "동물 2", "w": ["강아지", "호랑이", "오리", "기린"]}, {"n": "동물 3", "w": ["사자", "원숭이", "펭귄", "개구리"]}, {"n": "동물 4", "w": ["곰", "닭", "물고기", "나비"]}, {"n": "동물 5", "w": ["병아리", "소", "여우", "하마"]}, {"n": "동물 6", "w": ["돼지", "새", "거북이", "다람쥐"]}, {"n": "동물 7", "w": ["말", "쥐", "사슴", "개미"]}, {"n": "동물 8", "w": ["참새", "생쥐", "낙타"]}],
  basket: [{n:'과일', w:['사과','바나나','수박','포도']},
           {n:'탈것', w:['버스','자동차','비행기','자전거']}, {n:'안전', w:['정지','위험','금지','비상구']}]
};
const LV = { 1:{n:2, hint:3000, again:7000}, 2:{n:3, hint:6000, again:8000}, 3:{n:4, hint:0, again:6000} };
const TRIALS = 8;

/* ---------- 설정 ---------- */
const LS = { get(k,d){ try{ const v=localStorage.getItem('wordGames.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem('wordGames.'+k, JSON.stringify(v)); }catch(e){} } };
const S = { game:LS.get('game','feed'), set:LS.get('set',0), level:LS.get('level',1), sound:LS.get('sound','on') };
const $ = s => document.querySelector(s);
function paint(){
  document.querySelectorAll('#segGame button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.game));
  document.querySelectorAll('#segLevel button').forEach(b=>b.classList.toggle('on', b.dataset.v===String(S.level)));
  document.querySelectorAll('#segSound button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.sound));
  const sets = SETS[S.game]; if (S.set >= sets.length) S.set = 0;
  $('#segSet').innerHTML = sets.map((s,i)=>`<button data-v="${i}" class="${i===S.set?'on':''}">${s.n}</button>`).join('');
  $('#setPreview').innerHTML = sets[S.set].w.map(w=>`<figure><img src="${pic(w)}" alt="">${w}</figure>`).join('')
    + (S.game==='feed' ? sets[S.set].w.map(w=>`<figure style="opacity:.8"><img src="${foodPic(FEED[w][0])}" alt=""></figure>`).join('') : '');
  ['game','set','level','sound'].forEach(k=>LS.set(k,S[k]));
}
$('#segGame').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; S.game=b.dataset.v; S.set=0; paint();});
$('#segSet').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; S.set=+b.dataset.v; paint();});
$('#segLevel').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; S.level=+b.dataset.v; paint();});
$('#segSound').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; S.sound=b.dataset.v; paint();});
paint();

/* ---------- 목소리 (기기) ---------- */
const Speech = (() => {
  let voice = null;
  const pickVoice = () => {
    const vs = (speechSynthesis.getVoices()||[]).filter(v=>/^ko/i.test(v.lang));
    const rank = v => /premium|프리미엄/i.test(v.name)?0 : /enhanced|향상/i.test(v.name)?1 : /google/i.test(v.name)?2 : /yuna|유나/i.test(v.name)?3 : 4;
    voice = vs.sort((a,b)=>rank(a)-rank(b))[0] || null;
  };
  if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  return {
    say(text){
      return new Promise(res => {
        if (S.sound!=='on' || !('speechSynthesis' in window) || document.hidden) { setTimeout(res, 500 + text.length*120); return; }
        speechSynthesis.cancel();
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.76; if (voice) u.voice=voice; u.volume=0.9;
          let done=false; const fin=()=>{ if(!done){done=true; res();} };
          u.onend=fin; u.onerror=fin; setTimeout(fin, 1500 + text.length*400);
          speechSynthesis.speak(u);
        }, 300);
      });
    },
    stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
  };
})();

/* ---------- 효과음 (작게) ---------- */
let AC=null;
function chime(){
  if (S.sound!=='on') return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    [660,880].forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
      const t=AC.currentTime+i*0.12; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.06,t+0.02); g.gain.exponentialRampToValueAtTime(0.0008,t+0.35);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}

/* ---------- 도우미 ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const hasJong = w => { const c=w.charCodeAt(w.length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; };
const ga = w => w + (hasJong(w)?'이':'가'), eul = w => w + (hasJong(w)?'을':'를');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const PRAISE = ['잘했어요.','맞아요.','좋아요.','바로 그거예요.'];
let G = null;  /* 지금 놀이 */

function preload(urls){ return Promise.all(urls.map(u=>new Promise(r=>{const i=new Image(); i.onload=i.onerror=r; i.src=u;}))); }

/* 정답이 고르게 나오도록 순서 만들기 */
function plan(words){ let seq=[]; while(seq.length<TRIALS) seq=seq.concat(shuffle(words)); seq=seq.slice(0,TRIALS);
  for(let i=1;i<seq.length;i++) if(seq[i]===seq[i-1]){ const j=seq.findIndex((x,k)=>k>i&&x!==seq[i]&&x!==seq[i-1]); if(j>0)[seq[i],seq[j]]=[seq[j],seq[i]]; }
  return seq; }

/* ---------- 시작 ---------- */
$('#go').addEventListener('click', async () => {
  const words = SETS[S.game][S.set].w;
  $('#go').textContent = '그림 불러오는 중…';
  const urls = S.game==='feed'
    ? words.flatMap(w => [pose(w,'yum'), pose(w,'open'), ...FEED[w].map(foodPic)])
    : S.game==='body' ? words.map(pic).concat(BODYIMG) : words.map(pic);
  await preload(urls);
  $('#go').textContent = '시작';
  enterFS(); startGame(words);
});
$('#again').addEventListener('click', () => startGame(G.words));
$('#toSetup').addEventListener('click', toSetup);
$('#mgr').addEventListener('click', () => { if ($('#game').classList.contains('show')) toSetup(); });
function clearPlay(){ $('#targets').innerHTML=''; const bs=$('#bodyStage'); if(bs) bs.remove(); const lb=$('#labels'); if(lb) lb.remove(); $('#ground').style.display=''; const it=$('#item'); it.style.transition='none'; it.style.opacity=0; it.innerHTML=''; const rv=$('#reveal'); if(rv) rv.remove(); $('#doneBox').classList.remove('show'); }
function toSetup(){ if (G) G.run++; Speech.stop(); clearPlay(); exitFS(); $('#game').classList.remove('show'); $('#setup').style.display='flex'; $('#mgr').querySelector('span').textContent='charum'; }

function startGame(words){
  const run = (G && G.run || 0) + 1;
  if (G) G.run = run; Speech.stop(); clearPlay();
  G = { words, run, seq: plan(words), i:0, stars:0, busy:false, food:{}, said:{} };
  $('#game').classList.toggle('meadow', S.game==='feed');
  $('#setup').style.display='none'; $('#game').classList.add('show'); $('#doneBox').classList.remove('show');
  $('#stars').innerHTML = Array.from({length:TRIALS},()=>'<i><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="#e7b53c" stroke="#9c7420" stroke-width="1"/></svg></i>').join('');
  loop(run);
}
const alive = run => { if (!G || run !== G.run) throw 'stop'; };

async function loop(run){
  try{
    await sleep(500); alive(run);
    if (G.i===0) { await Speech.say(S.game==='feed' ? '동물에게 먹이를 줘요.' : S.game==='body' ? '스티커를 붙여요.' : '바구니에 담아요.'); alive(run); await sleep(400); }
    while (G.i < TRIALS){ await (S.game==='body' ? trialBody : trial)(G.seq[G.i], run); G.i++; }
    await sleep(500); alive(run);
    $('#doneMsg').textContent = `별 ${G.stars}개`; $('#doneBox').classList.add('show');
    await Speech.say(`별을 ${['','한','두','세','네','다섯','여섯','일곱','여덟'][G.stars]||G.stars} 개 모았어요.`);
  }catch(e){ if (e!=='stop') console.error(e); }
}

/* 한 번 하기 */
async function trial(ans, run){
  const lv = LV[S.level], feed = S.game==='feed';
  const others = shuffle(G.words.filter(w=>w!==ans)).slice(0, lv.n-1);
  const opts = shuffle(others.concat(ans));
  const W = innerWidth, H = innerHeight;

  /* 아래쪽: 동물(또는 바구니). 모두 땅(아래 34%) 안에 들어가게 */
  const box = $('#targets'); box.innerHTML='';
  const gr = feed ? 0.34 : 0.4; $('#ground').style.height = (gr*100)+'%';
  const groundH = H*gr, th = groundH - 14 - 22;   /* 아래 14px, 위 22px 띄움: 힌트 테두리가 땅 안에만 */
  const gap = Math.max(feed ? 14 : 36, W*(feed ? 0.025 : 0.05));
  const cw = Math.min((W*0.92 - gap*(opts.length-1))/opts.length, feed ? th : th*1.25, 340);
  box.style.gap = gap+'px';
  const wfs = S.level===1 ? Math.min(cw*0.24, 36) : Math.min(cw*0.32, th*0.26, 70);
  let slotP = 0;
  const els = opts.map(w => {
    const d = document.createElement('div'); d.className='tg'+(feed?'':' basket'); d.dataset.w=w;
    d.style.width=cw+'px'; d.style.height=th+'px'; d.style.opacity=0;
    if (feed){
      const showPic = S.level===1 ? 1 : S.level===2 ? 0.35 : 0;
      d.innerHTML = `<div class="pic" style="width:${cw}px;height:${th - wfs*1.2}px"><img src="${pose(w,'yum')}" alt="" style="opacity:${showPic}"></div>`
        + `<div class="word" style="font-size:${wfs}px">${w}</div>`;
    } else {
      /* 바구니: 위쪽 칸에 그림이 바구니에 반쯤 들어가 있고, 바구니 앞에 이름표 */
      const showPic = S.level===1 ? 1 : S.level===2 ? 0.35 : 0;
      const bh = Math.min(th*0.52, cw*0.6), slotH = th - bh*0.78;
      slotP = Math.min(slotH*1.2, cw*0.72);
      const lfs = S.level===1 ? Math.min(cw*0.2, bh*0.34, 34) : Math.min(cw*0.27, bh*0.46, 64);
      d.innerHTML = `<div class="slot" style="height:${slotH}px"><img src="${pic(w)}" alt="" style="width:${slotP}px;height:${slotP}px;opacity:${showPic}"></div>`
        + `<div class="bk" style="height:${bh}px">${BASKET}<div class="lbl" style="font-size:${lfs}px">${w}</div></div>`;
    }
    box.appendChild(d); return d;
  });
  await sleep(30); els.forEach(e=>e.style.opacity=1);

  /* 위에서 내려오는 것 */
  const it = $('#item'); const sz = Math.min(H*0.24, W*0.24, 230);
  it.className=''; it.style.left=''; it.style.minWidth=''; it.style.transition='none'; it.style.opacity=1; it.style.width=sz+'px'; it.style.height=sz+'px';
  it.style.transform=`translate(-50%,-120%)`;
  if (feed){
    const list = FEED[ans], k = G.food[ans] = ((G.food[ans] ?? Math.floor(Math.random()*list.length)) + 1) % list.length;
    it.innerHTML = `<img src="${foodPic(list[k])}" alt="">`; G.cur = list[k];
  }
  else {
    /* 바구니: 내려오는 것은 늘 그림, 아래 그림의 두 배 크기 */
    const s2 = Math.min(slotP*2, H*0.3, W*0.3);
    it.style.width = it.style.height = s2+'px';
    it.innerHTML = `<img src="${pic(ans)}" alt="">`;
  }
  await sleep(40); alive(run);
  it.style.transition=''; it.style.transform=`translate(-50%, ${H*0.12}px)`;
  await sleep(2700); alive(run);

  /* 말하기: 먹이 주기는 동물 이름, 바구니는 수준 3에서만 3초 기다렸다가 */
  if (feed) els.forEach(e => e.querySelector('img').src = pose(e.dataset.w, 'open'));
  let answered = false;
  const speakCue = async () => { if (!answered) await Speech.say(ans); };
  if (feed || S.level!==3) speakCue();

  await new Promise((res, rej) => {
    const t0 = performance.now(); let hinted=false;
    let nextSay = (S.level===3 && !feed) ? 3000 : lv.again;     /* 바구니 3수준: 3초 기다렸다가 처음 말함 */
    const tick = setInterval(() => {
      if (!G || run!==G.run){ clearInterval(tick); rej('stop'); return; }
      const idle = performance.now()-t0;
      if (!hinted && lv.hint && idle > lv.hint){ hinted=true; els.find(e=>e.dataset.w===ans).classList.add('hint'); }
      if (idle > nextSay){ nextSay += lv.again; speakCue(); }
    }, 200);
    els.forEach(e => e.addEventListener('pointerup', async ev => {
      ev.preventDefault();
      if (answered || !G || run!==G.run) return;
      if (e.dataset.w !== ans) return;          /* 틀린 터치에는 반응하지 않음 */
      answered = true; clearInterval(tick); Speech.stop();
      try{ await success(e, ans, feed, hinted, run); res(); }catch(x){ rej(x); }
    }));
  });
}

async function success(el, ans, feed, hinted, run){
  const it = $('#item');
  el.classList.remove('hint');
  if (feed){
    const r = el.querySelector('.pic').getBoundingClientRect();
    el.querySelector('img').style.opacity = 1;
    const tx = r.left + r.width/2, ty = r.top + r.height*0.42;
    const ir = it.getBoundingClientRect();
    it.style.transition = 'transform .65s ease-in-out, opacity .3s ease .5s';
    it.style.transform = `translate(calc(-50% + ${tx - (ir.left+ir.width/2)}px), ${ir.top + (ty - (ir.top+ir.height/2))}px) scale(.45)`;
    await sleep(650); alive(run);
    it.style.opacity = 0; el.classList.add('hop'); chime();
    document.querySelectorAll('#targets .tg img').forEach(im => im.src = pose(im.closest('.tg').dataset.w, 'yum'));
  } else {
    /* 위의 그림이 작아지며 내려와 아래 그림과 겹치고, 둘이 함께 바구니로 쏙 */
    const im = el.querySelector('.slot img'), r = im.getBoundingClientRect();
    im.style.opacity = 1;
    const ir = it.getBoundingClientRect();
    const k = r.width / ir.width;
    it.style.transition = 'transform .7s ease-in-out';
    it.style.transform = `translate(calc(-50% + ${(r.left+r.width/2) - (ir.left+ir.width/2)}px), ${ir.top + ((r.top+r.height/2) - (ir.top+ir.height/2))}px) scale(${k})`;
    await sleep(700); alive(run);
    it.style.transition = 'none'; it.style.opacity = 0;
    im.style.transform = 'translateY(115%)';          /* 바구니 속으로 */
    await sleep(420); alive(run);
    el.classList.add('hop'); chime();
  }
  G.stars++; const st = $('#stars').children[G.stars-1]; if (st) st.classList.add('on');
  await sleep(250); el.classList.remove('hop'); alive(run);
  if (!feed){
    /* 바구니에 들어가자마자: 다른 바구니는 사라지고, 정답 바구니가 가운데로 */
    document.querySelectorAll('#targets .tg').forEach(e => { if (e !== el) e.style.opacity = 0; });
    const r0 = el.getBoundingClientRect();
    el.style.transition = 'opacity .3s ease, transform .5s ease';
    el.style.transform = `translateX(${innerWidth/2 - (r0.left + r0.width/2)}px)`;
    await sleep(550); alive(run);
  }
  /* 구체적 피드백 */
  const praise = PRAISE[(G.i + G.stars) % PRAISE.length];
  const EAT = ['잘 먹어요.', '맛있게 먹어요.', '냠냠 먹어요.'];
  const n = G.said[ans] = (G.said[ans] || 0) + 1;
  if (feed) await Speech.say(`${ga(ans)} ${eul(FOODKO[G.cur] || '먹이')} ${EAT[(G.stars + n) % EAT.length]}`);
  else await Speech.say(n % 2 ? `${eul(ans)} 바구니에 담았어요.` : `${ans}. ${praise}`);
  alive(run);
  if (feed) await picToWord(el, ans, run); else await labelToWord(el, ans, run);
}

/* 맞힌 동물만 남고 가운데로 → (수준 1·2) 그림이 사라지며 글자가 한 자씩 나옴 "토" "끼" → "토끼"
   (수준 3) 글자 위에 그림이 나타나 확인 */
async function picToWord(el, ans, run){
  const W = innerWidth, H = innerHeight;
  const img = el.querySelector('img'), r = img.getBoundingClientRect();
  const ov = document.createElement('div'); ov.id = 'reveal'; $('#game').appendChild(ov);
  const pic = img.cloneNode(); pic.className = 'rv-pic';
  Object.assign(pic.style, { left: r.left+'px', top: r.top+'px', width: r.width+'px', height: r.height+'px', opacity: 1 });
  ov.appendChild(pic);
  document.querySelectorAll('#targets .tg').forEach(e => e.style.opacity = 0);   /* 다른 동물(과 이 동물의 자리)은 사라짐 */
  await sleep(40);
  const big = Math.min(H*0.42, W*0.42);
  const cx = W/2, cy = H*0.42;
  Object.assign(pic.style, { left: (cx-big/2)+'px', top: (cy-big/2)+'px', width: big+'px', height: big+'px' });
  await sleep(520); alive(run);
  const chars = [...ans];
  const fs = Math.min(big*0.62, W*0.8/chars.length);
  const word = document.createElement('div'); word.className = 'rv-word'; word.style.fontSize = fs+'px';
  word.innerHTML = chars.map(c => `<span>${c}</span>`).join('');
  ov.appendChild(word);
  const spans = [...word.children];
  if (S.level < 3){
    word.style.top = (cy - fs*0.62) + 'px';
    pic.style.opacity = 0;                       /* 그림이 글자로 바뀜 */
    await sleep(300); alive(run);
    for (const sp of spans){ sp.classList.add('on'); await Speech.say(sp.textContent); alive(run); await sleep(60); }
    await sleep(120); await Speech.say(ans); alive(run);
  } else {
    /* 3수준: 글자가 먼저, 그림은 확인으로 */
    Object.assign(pic.style, { opacity: 0 });
    word.style.top = (H*0.62) + 'px';
    spans.forEach(sp => sp.classList.add('on'));
    await sleep(250); alive(run);
    Object.assign(pic.style, { top: (H*0.62 - big*0.95)+'px', opacity: 1 });
    await Speech.say(ans); alive(run);
  }
  await sleep(450); alive(run);
  ov.style.opacity = 0; await sleep(250); ov.remove();
}

/* 바구니: 이름표 글자가 가운데로 커지며 (1·2) 한 자씩 짚어 읽고 이어 읽음, (3) 글자 위에 그림이 나타나 확인 */
async function labelToWord(el, ans, run, cx){
  const W = innerWidth, H = innerHeight; cx = cx ?? W/2;
  const lbl = el.querySelector('.lbl'), r = lbl.getBoundingClientRect();
  const fs0 = parseFloat(lbl.style.fontSize);
  const ov = document.createElement('div'); ov.id = 'reveal'; $('#game').appendChild(ov);
  const chars = [...ans];
  const word = document.createElement('div'); word.className = 'rv-word lab';
  word.innerHTML = chars.map(c => `<span class="on">${c}</span>`).join('');
  Object.assign(word.style, { left: r.left+'px', top: r.top+'px', right:'auto', fontSize: fs0+'px' });
  ov.appendChild(word);
  el.style.opacity = 0;
  await sleep(40);
  const fs = Math.min(H*0.26, (cx === W/2 ? W*0.8 : Math.min(cx, W-cx)*1.7)/chars.length);
  const w1 = word.getBoundingClientRect().width * fs/fs0;
  Object.assign(word.style, { fontSize: fs+'px', left: (cx - w1/2)+'px', top: (S.level<3 ? H*0.42 - fs*0.62 : H*0.6)+'px' });
  await sleep(550); alive(run);
  const spans = [...word.children];
  if (S.level < 3){
    for (const sp of spans){ sp.classList.add('now'); await Speech.say(sp.textContent); alive(run); sp.classList.remove('now'); await sleep(60); }
    await sleep(120); await Speech.say(ans); alive(run);
  } else {
    const big = Math.min(H*0.3, W*0.3);
    const p = document.createElement('img'); p.className='rv-pic'; p.src = pic(ans);
    Object.assign(p.style, { left:(cx-big/2)+'px', top:(H*0.6 - big*1.02)+'px', width:big+'px', height:big+'px', opacity:0 });
    ov.appendChild(p); await sleep(40); p.style.opacity = 1;
    await Speech.say(ans); alive(run);
  }
  await sleep(450); alive(run);
  ov.style.opacity = 0; await sleep(250); ov.remove();
}

/* ---------- 스티커 붙이기: 큰 몸 그림 + 옆의 이름표. 이름을 듣고 이름표를 누르면 그 자리에 별·하트 스티커 ---------- */
/* 별·하트 스티커 (번갈아, 부드러운 색) */
const STICKERS = [
  `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6l13 27 30 4-22 21 5 30-26-14-26 14 5-30L7 37l30-4z" fill="#ffd34d" stroke="#c99a12" stroke-width="5" stroke-linejoin="round"/><path d="M36 40l8-2" stroke="#fff6c7" stroke-width="5" stroke-linecap="round"/></svg>`,
  `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88C20 66 6 50 6 32 6 18 17 8 30 8c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 18-14 34-44 56z" fill="#ff8fa8" stroke="#c9506c" stroke-width="5" stroke-linejoin="round"/><path d="M24 26c3-5 8-7 12-6" stroke="#ffe0e7" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`
];
const sticker = () => STICKERS[(G ? G.i : 0) % 2];
function bodyLayout(){
  const W = innerWidth, H = innerHeight, land = W >= H*1.05;
  const bs = land ? Math.min(H*0.94, W*0.52) : Math.min(W*0.92, H*0.58);
  const bx = land ? Math.max(12, W*0.04) : (W-bs)/2, by = land ? (H-bs)/2 : 46;
  const area = land ? {x: bx+bs+W*0.02, y: 50, w: W-(bx+bs+W*0.02)-60, h: H-80} : {x: 12, y: by+bs+8, w: W-24, h: H-(by+bs+8)-12};
  return {land, bs, bx, by, area};
}
async function trialBody(ans, run){
  const lv = LV[S.level];
  const others = shuffle(G.words.filter(w=>w!==ans)).slice(0, lv.n-1);
  const opts = shuffle(others.concat(ans));               /* 이름표 순서를 매번 섞음: 자리로 외우지 않게 */
  const L = bodyLayout(), W = innerWidth, H = innerHeight;
  $('#ground').style.display = 'none';
  let st = $('#bodyStage');
  if (!st){
    st = document.createElement('div'); st.id = 'bodyStage';
    st.innerHTML = `<img src="${BODYIMG}" alt="">`;
    $('#game').insertBefore(st, $('#item'));
  }
  Object.assign(st.style, { left: L.bx+'px', top: L.by+'px', width: L.bs+'px', height: L.bs+'px' });
  let lb = $('#labels'); if (lb) lb.remove();
  lb = document.createElement('div'); lb.id = 'labels'; $('#game').insertBefore(lb, $('#item'));
  Object.assign(lb.style, { left: L.area.x+'px', top: (L.land ? L.area.y + L.area.h*0.34 : L.area.y)+'px', width: L.area.w+'px',
    height: (L.land ? L.area.h*0.66 : L.area.h)+'px', flexDirection: L.land ? 'column' : 'row' });
  const n = opts.length;
  const ih = L.land ? Math.min((L.area.h*0.66 - 14*(n-1))/n, 130) : Math.min(L.area.h*0.9, 130);
  const iw = L.land ? Math.min(L.area.w*0.95, ih*3.4) : Math.min((L.area.w - 12*(n-1))/n, ih*2.4);
  const fs = S.level===1 ? Math.min(ih*0.34, 38) : Math.min(ih*0.5, iw*0.9/2.4, 64);
  const els = opts.map(w => {
    const d = document.createElement('div'); d.className = 'tg bl'; d.dataset.w = w; d.style.opacity = 0;
    Object.assign(d.style, { width: iw+'px', height: ih+'px' });
    const showPic = S.level===1 ? 1 : S.level===2 ? 0.35 : 0;
    d.innerHTML = (S.level < 3 ? `<img src="${pic(w)}" alt="" style="height:${ih*0.86}px;width:${ih*0.86}px;opacity:${showPic}">` : '')
      + `<span class="lbl" style="font-size:${fs}px">${w}</span>`;
    lb.appendChild(d); return d;
  });
  await sleep(30); els.forEach(e => e.style.opacity = 1);
  /* 스티커가 위에서 내려옴 */
  const it = $('#item'); const bw = Math.min(L.bs*0.2, 120);
  it.className = 'bandage'; it.style.transition = 'none'; it.style.opacity = 1; it.style.minWidth = '';
  it.style.width = it.style.height = bw+'px'; it.innerHTML = sticker();
  const ix = L.land ? L.area.x + L.area.w/2 : Math.min(innerWidth*0.84, L.bx + L.bs + 70);   /* 세로 화면: 몸 오른쪽 위 */
  it.style.left = ix+'px'; it.style.transform = 'translate(-50%,-160%)';
  await sleep(40); alive(run);
  it.style.transition = 'transform 1.6s cubic-bezier(.25,.6,.3,1)';
  it.style.transform = `translate(-50%, ${L.land ? L.area.y + L.area.h*0.08 : 8}px)`;
  await sleep(1700); alive(run);
  let answered = false;
  const speakCue = async () => { if (!answered) await Speech.say(ans); };
  speakCue();
  await new Promise((res, rej) => {
    const t0 = performance.now(); let hinted = false, nextSay = lv.again;
    const tick = setInterval(() => {
      if (!G || run !== G.run){ clearInterval(tick); rej('stop'); return; }
      const idle = performance.now() - t0;
      if (!hinted && lv.hint && idle > lv.hint){ hinted = true; els.find(e => e.dataset.w === ans).classList.add('hint'); }
      if (idle > nextSay){ nextSay += lv.again; speakCue(); }
    }, 200);
    els.forEach(e => e.addEventListener('pointerup', async ev => {
      ev.preventDefault();
      if (answered || !G || run !== G.run) return;
      if (e.dataset.w !== ans) return;                    /* 틀린 터치에는 반응하지 않음 */
      answered = true; clearInterval(tick); Speech.stop();
      try { await bodySuccess(e, ans, run, L); res(); } catch (x) { rej(x); }
    }));
  });
}
async function bodySuccess(el, ans, run, L){
  const it = $('#item'), st = $('#bodyStage');
  el.classList.remove('hint');
  /* 스티커가 몸의 그 자리로 날아가 붙음 (붙인 스티커는 판이 끝날 때까지 남음) */
  const [px, py] = PART[ans], k = L.bs/512;
  const tx = L.bx + px*k, ty = L.by + py*k;
  const sw = Math.min(L.bs*0.09, 52);
  const ir = it.getBoundingClientRect(), small = sw / ir.width;
  it.style.transition = 'transform .65s ease-in-out';
  it.style.transform = `translate(calc(-50% + ${tx - (ir.left+ir.width/2)}px), ${ty - ir.height/2}px) scale(${small})`;
  await sleep(650); alive(run);
  const stuck = document.createElement('div'); stuck.className = 'stuck'; stuck.innerHTML = it.innerHTML;
  Object.assign(stuck.style, { left: (px*k - sw/2)+'px', top: (py*k - sw/2)+'px', width: sw+'px', height: sw+'px' });
  st.appendChild(stuck);
  it.style.transition = 'none'; it.style.opacity = 0;
  el.classList.add('hop'); chime();
  G.stars++; const s = $('#stars').children[G.stars-1]; if (s) s.classList.add('on');
  await sleep(250); el.classList.remove('hop'); alive(run);
  /* 다른 이름표는 사라지고 */
  document.querySelectorAll('#labels .tg').forEach(e => { if (e !== el) e.style.opacity = 0; });
  const n = G.said[ans] = (G.said[ans] || 0) + 1;
  await Speech.say(n % 2 ? `${ans}에 스티커를 붙였어요.` : `${ans}. ${PRAISE[(G.i + G.stars) % PRAISE.length]}`); alive(run);
  await labelToWord(el, ans, run, L.land ? L.area.x + L.area.w/2 : innerWidth/2);
  document.querySelectorAll('#labels .tg').forEach(e => e.style.opacity = 0);
}

/* ---------- 전체 화면 ---------- */
function enterFS(){ const d=document.documentElement; try{ const r=(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d); if(r&&r.catch) r.catch(()=>{}); }catch(e){} }
function exitFS(){ try{ if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });
</script>
