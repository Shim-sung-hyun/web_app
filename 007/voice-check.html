let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} count(); };
const count = () => { const n = Object.values(marks).filter(Boolean).length; $('msg').textContent = n ? `${n}개 표시함` : '표시한 것이 없어요'; };
const audio = new Audio();
GROUPS.forEach(g => {
  const h2 = document.createElement('h2'); h2.textContent = g.title; $('list').appendChild(h2);
  if (g.why) { const p = document.createElement('p'); p.className = 'why'; p.textContent = g.why; $('list').appendChild(p); }
  g.items.forEach(it => {
    const row = document.createElement('div'); row.className = 'row' + (marks[it.t] ? ' bad' : '');
    const b = document.createElement('button'); b.className = 'play'; b.textContent = '▶'; b.setAttribute('aria-label', '듣기');
    b.onclick = async () => { audio.src = VBASE + (await hashOf(it.t)) + '.mp3'; audio.play().catch(() => {}); };
    const t = document.createElement('div'); t.className = 't'; t.textContent = it.show || it.t;
    if (it.note) { const s = document.createElement('small'); s.textContent = it.note; t.appendChild(s); }
    const ck = document.createElement('label'); ck.className = 'ck'; ck.innerHTML = '<input type="checkbox"> 이상해요';
    const inp = ck.querySelector('input'); inp.checked = !!marks[it.t];
    inp.onchange = () => { marks[it.t] = inp.checked; row.classList.toggle('bad', inp.checked); save(); };
    row.append(b, t, ck); $('list').appendChild(row);
  });
});
count();
$('copy').onclick = async () => {
  const list = Object.keys(marks).filter(k => marks[k]);
  if (!list.length) { $('msg').textContent = '표시한 것이 없어요'; return; }
  const txt = '이상한 소리:\n' + list.join('\n');
  try { await navigator.clipboard.writeText(txt); $('msg').textContent = `${list.length}개를 복사했어요. Claude에게 붙여 넣어 주세요.`; }
  catch (e) { prompt('아래 글을 복사해 주세요', txt); }
};
</script>
</body>
</html>
