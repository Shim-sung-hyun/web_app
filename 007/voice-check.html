<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>기본 목소리 들어 보기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2133;--sub:#5b6077;--line:#d9dcea;--pri:#2C5FCF;--bg:#f3f5fb;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 120px}
h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:30px;margin:0 0 6px;color:#1E4396}
.lead{color:var(--sub);line-height:1.7;margin:0 0 16px}
h2{font-size:18px;margin:26px 0 4px}
.why{color:var(--sub);font-size:14px;margin:0 0 10px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:6px 0}
.row.bad{border-color:var(--bad);background:#fff5f5}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:18px;cursor:pointer}
.t{flex:1;font-size:18px}
.t small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
label.ck{flex:none;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--bad);cursor:pointer;user-select:none}
label.ck input{width:22px;height:22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar button{font:inherit;font-size:16px;font-weight:700;padding:12px 20px;border-radius:12px;border:0;background:var(--pri);color:#fff;cursor:pointer}
#msg{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
<h1>기본 목소리 들어 보기</h1>
<p class="lead">글자 익히기(007)의 미리 만든 목소리 가운데 <b>이번에 새로 바꾼 말</b>을 모았어요. ▶를 눌러 듣고, 발음이 틀리거나 흐리거나 너무 빠르면 <b>“이상해요”</b>에 표시해 주세요. 다 듣고 아래 <b>“표시한 것 복사”</b>를 눌러 Claude에게 붙여 넣어 주시면 그 말만 다시 만들어요.</p>
<div id="list"></div>
</main>
<div class="bar"><span id="msg"></span><button id="copy">표시한 것 복사</button></div>
<script>
const GROUPS = [{"title": "새로 바꾼 소리 다시 듣기", "why": "고르신 소리로 바꿔 넣었어요(앱과 같은 파일). 아직 이상하면 표시해 주세요.", "items": [{"t": "닭이에요.", "show": "닭이에요.", "note": "고른 것 A · [달기에요]로 만듦"}, {"t": "닭이 모이를 잘 먹어요.", "show": "닭이 모이를 잘 먹어요.", "note": "고른 것 A · [달기 모이를 잘 먹어요]로 만듦"}, {"t": "닭을 찾아요.", "show": "닭을 찾아요.", "note": "고른 것 A · [달글 찾아요]로 만듦"}, {"t": "흙이에요.", "show": "흙이에요.", "note": "고른 것 B · [흘기에요]로 만듦"}, {"t": "흙을 찾아요.", "show": "흙을 찾아요.", "note": "고른 것 A · [흘글 찾아요]로 만듦"}, {"t": "잠자리예요.", "show": "잠자리예요.", "note": "고른 것 C"}, {"t": "돗자리를 찾아요.", "show": "돗자리를 찾아요.", "note": "고른 것 A · [돋짜리를 찾아요]로 만듦"}, {"t": "시장이에요.", "show": "시장이에요.", "note": "고른 것 A"}, {"t": "씨앗.", "show": "씨앗.", "note": "고른 것 A"}, {"t": "나비가 꽃꿀을 맛있게 먹어요.", "show": "나비가 꽃꿀을 맛있게 먹어요.", "note": "고른 것 B · [나비가 꼳꿀을 맛있게 먹어요]로 만듦"}, {"t": "케이크.", "show": "케이크.", "note": "고른 것 A"}, {"t": "치즈예요.", "show": "치즈예요.", "note": "고른 것 A"}, {"t": "공이에요.", "show": "공이에요.", "note": "고른 것 A"}, {"t": "말이에요.", "show": "말이에요.", "note": "고른 것 C"}, {"t": "지하철을 찾아 눌러요.", "show": "지하철을 찾아 눌러요.", "note": "고른 것 C"}, {"t": "두꺼비예요.", "show": "두꺼비예요.", "note": "고른 것 A"}, {"t": "쓰레기봉투예요.", "show": "쓰레기봉투예요.", "note": "고른 것 A"}, {"t": "작업복이에요.", "show": "작업복이에요.", "note": "고른 것 A"}, {"t": "허수아비를 바구니에 담았어요.", "show": "허수아비를 바구니에 담았어요.", "note": "고른 것 C"}, {"t": "바나나를 찾아요.", "show": "바나나를 찾아요.", "note": "고른 것 A"}, {"t": "코끼리,", "show": "코끼리,", "note": "고른 것 A"}, {"t": "남자예요.", "show": "남자예요.", "note": "고른 것 A"}, {"t": "정지", "show": "정지", "note": "고른 것 C"}, {"t": "사다리", "show": "사다리", "note": "고른 것 C"}, {"t": "사다리,", "show": "사다리,", "note": "고른 것 A"}, {"t": "빵찝을 바구니에 담았어요.", "show": "빵집을 바구니에 담았어요.", "note": "고른 것 A · [빵집을 바구니에 담았어요]로 만듦"}, {"t": "컵을 터뜨려요.", "show": "컵을 터뜨려요.", "note": "고른 것 A"}, {"t": "학교를 터뜨려요.", "show": "학교를 터뜨려요.", "note": "고른 것 C"}, {"t": "비를 터뜨려요.", "show": "비를 터뜨려요.", "note": "고른 것 A"}, {"t": "앞.", "show": "앞.", "note": "고른 것 A"}, {"t": "오이.", "show": "오이.", "note": "고른 것 B"}, {"t": "바위.", "show": "바위.", "note": "고른 것 B"}, {"t": "커피", "show": "커피", "note": "고른 것 A"}, {"t": "나비가 꽃꿀을 냠냠 먹어요.", "show": "나비가 꽃꿀을 냠냠 먹어요.", "note": "고른 것 A · [나비가 꼳꿀을 냠냠 먹어요]로 만듦"}, {"t": "나비가 꽃꿀을 잘 먹어요.", "show": "나비가 꽃꿀을 잘 먹어요.", "note": "고른 것 B · [나비가 꼳꿀을 잘 먹어요]로 만듦"}, {"t": "닭을 바구니에 담았어요.", "show": "닭을 바구니에 담았어요.", "note": "고른 것 A · [달글 바구니에 담았어요]로 만듦"}, {"t": "닭을 찾아 눌러요.", "show": "닭을 찾아 눌러요.", "note": "고른 것 A · [달글 찾아 눌러요]로 만듦"}, {"t": "닭을 터뜨려요.", "show": "닭을 터뜨려요.", "note": "고른 것 A · [달글 터뜨려요]로 만듦"}, {"t": "닭이 모이를 냠냠 먹어요.", "show": "닭이 모이를 냠냠 먹어요.", "note": "고른 것 A · [달기 모이를 냠냠 먹어요]로 만듦"}, {"t": "닭이 모이를 맛있게 먹어요.", "show": "닭이 모이를 맛있게 먹어요.", "note": "고른 것 A · [달기 모이를 맛있게 먹어요]로 만듦"}, {"t": "닭이 배춧잎을 냠냠 먹어요.", "show": "닭이 배춧잎을 냠냠 먹어요.", "note": "고른 것 B · [달기 배춧잎을 냠냠 먹어요]로 만듦"}, {"t": "닭이 배춧잎을 맛있게 먹어요.", "show": "닭이 배춧잎을 맛있게 먹어요.", "note": "고른 것 A · [달기 배춧잎을 맛있게 먹어요]로 만듦"}, {"t": "닭이 배춧잎을 잘 먹어요.", "show": "닭이 배춧잎을 잘 먹어요.", "note": "고른 것 A · [달기 배춧잎을 잘 먹어요]로 만듦"}, {"t": "닭이 옥수수를 냠냠 먹어요.", "show": "닭이 옥수수를 냠냠 먹어요.", "note": "고른 것 A · [달기 옥수수를 냠냠 먹어요]로 만듦"}, {"t": "닭이 옥수수를 맛있게 먹어요.", "show": "닭이 옥수수를 맛있게 먹어요.", "note": "고른 것 B · [달기 옥수수를 맛있게 먹어요]로 만듦"}, {"t": "닭이 옥수수를 잘 먹어요.", "show": "닭이 옥수수를 잘 먹어요.", "note": "고른 것 B · [달기 옥수수를 잘 먹어요]로 만듦"}, {"t": "흙을 바구니에 담았어요.", "show": "흙을 바구니에 담았어요.", "note": "고른 것 A · [흘글 바구니에 담았어요]로 만듦"}, {"t": "흙을 찾아 눌러요.", "show": "흙을 찾아 눌러요.", "note": "고른 것 A · [흘글 찾아 눌러요]로 만듦"}, {"t": "흙을 터뜨려요.", "show": "흙을 터뜨려요.", "note": "고른 것 A · [흘글 터뜨려요]로 만듦"}]}];
const VBASE = 'voice/leda/';
const $ = id => document.getElementById(id);
const hashOf = async t => { const d = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16); };
const KEY = 'voiceCheck007b';
let marks = {}; try { marks = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} count(); };
const count = () => { const n = Object.values(marks).filter(Boolean).length; $('msg').textContent = n ? `${n}개 표시함` : '표시한 것이 없어요'; };
const audio = new Audio();
GROUPS.forEach(g => {
  const h2 = document.createElement('h2'); h2.textContent = g.title; $('list').appendChild(h2);
  if (g.why) { const p = document.createElement('p'); p.className = 'why'; p.textContent = g.why; $('list').appendChild(p); }
  g.items.forEach(it => {
    const row = document.createElement('div'); row.className = 'row' + (marks[it.t] ? ' bad' : '');
    const b = document.createElement('button'); b.className = 'play'; b.textContent = '▶'; b.setAttribute('aria-label', '듣기');
    b.onclick = async () => { audio.src = VBASE + (await hashOf(it.t)) + '.mp3'; audio.play().catch(() => {}); };
    const t = document.createElement('div'); t.className = 't'; t.textContent = it.show || it.t;
    if (it.note) { const s = document.createElement('small'); s.textContent = it.note; t.appendChild(s); }
    const ck = document.createElement('label'); ck.className = 'ck'; ck.innerHTML = '<input type="checkbox"> 이상해요';
    const inp = ck.querySelector('input'); inp.checked = !!marks[it.t];
    inp.onchange = () => { marks[it.t] = inp.checked; row.classList.toggle('bad', inp.checked); save(); };
    row.append(b, t, ck); $('list').appendChild(row);
  });
});
count();
$('copy').onclick = async () => {
  const list = Object.keys(marks).filter(k => marks[k]);
  if (!list.length) { $('msg').textContent = '표시한 것이 없어요'; return; }
  const txt = '이상한 소리:\n' + list.join('\n');
  try { await navigator.clipboard.writeText(txt); $('msg').textContent = `${list.length}개를 복사했어요. Claude에게 붙여 넣어 주세요.`; }
  catch (e) { prompt('아래 글을 복사해 주세요', txt); }
};
</script>
</body>
</html>
