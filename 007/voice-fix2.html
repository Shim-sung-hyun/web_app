<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>기본 목소리 고치기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--ink:#1d2133;--sub:#5b6077;--line:#d9dcea;--pri:#2C5FCF;--bg:#f3f5fb;--ok:#1b7f3a;--err:#c62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 120px}
h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:30px;margin:0 0 6px;color:#1E4396}
.lead{color:var(--sub);line-height:1.7;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row2{display:flex;gap:8px;align-items:center}
input.f{flex:1;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px}
button{font:inherit;cursor:pointer}
.sm{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#f4f5fa}
.big{width:100%;font-size:19px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--pri);color:#fff}
.big:disabled{opacity:.5}
.bar{height:14px;border-radius:8px;background:#e6e9f3;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;width:0;background:var(--pri)}
#state{min-height:1.5em;margin:6px 0}#state.err{color:var(--err)}#state.ok{color:var(--ok)}
h2{font-size:17px;margin:22px 0 6px}
.it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.it .t{font-size:19px;font-weight:700}.it .n{color:var(--sub);font-size:13px;margin:2px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;background:#fafbff}
.op.on{border-color:var(--ok);background:#effaf2;box-shadow:0 0 0 2px rgba(27,127,58,.25)}
.op .p{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:15px}
.op .p:disabled{background:#b9c1d6}
.op label{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:15px}
.op input{width:20px;height:20px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.foot button{font-size:16px;font-weight:700;padding:12px 20px;border-radius:12px;border:0;background:var(--ok);color:#fff}
#msg{color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
<h1>기본 목소리 고치기</h1>
<p class="lead">“시계”가 [치개]처럼 들리는 말을 <b>세 가지(A·B·C)로 새로 만들어</b> 들어 보고 고르는 화면이에요. ① 키를 넣고 <b>후보 만들기</b>(1~2분) → ② 말마다 ▶로 듣고 가장 또렷한 것을 고르기(“지금”을 고르면 바꾸지 않아요) → ③ 아래 <b>zip 받기</b>를 눌러 받은 파일을 Claude에게 보내 주세요.</p>
<div class="card">
 <div class="row2"><input class="f" id="key" type="password" autocomplete="off" placeholder="Cloud 키를 넣어 주세요"><button class="sm" id="eye" type="button">보기</button></div>
 <p class="lead" style="margin:8px 0 0;font-size:14px">이 컴퓨터에 넣어 둔 키가 있으면 저절로 채워져요. 만드는 말은 모두 짧아서 Google 음성 무료 사용량 안이에요.</p>
</div>
<button class="big" id="go">① 후보 만들기</button>
<div class="bar"><i id="bar"></i></div>
<p id="state"></p>
<div id="list"></div>
</main>
<div class="foot"><span id="msg"></span><button id="zip">③ zip 받기</button></div>
<script>
const ITEMS = [{"t": "시계", "c": [{"l": "A", "in": "시게", "r": 0.9}, {"l": "B", "in": "시게", "r": 0.84}, {"l": "C", "in": "시계", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계.", "c": [{"l": "A", "in": "시게.", "r": 0.9}, {"l": "B", "in": "시게.", "r": 0.84}, {"l": "C", "in": "시계.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계,", "c": [{"l": "A", "in": "시게,", "r": 0.9}, {"l": "B", "in": "시게,", "r": 0.84}, {"l": "C", "in": "시계,", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계예요.", "c": [{"l": "A", "in": "시게예요.", "r": 0.9}, {"l": "B", "in": "시게예요.", "r": 0.84}, {"l": "C", "in": "시계예요.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계를 찾아요.", "c": [{"l": "A", "in": "시게를 찾아요.", "r": 0.9}, {"l": "B", "in": "시게를 찾아요.", "r": 0.84}, {"l": "C", "in": "시계를 찾아요.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계를 찾아 눌러요.", "c": [{"l": "A", "in": "시게를 찾아 눌러요.", "r": 0.9}, {"l": "B", "in": "시게를 찾아 눌러요.", "r": 0.84}, {"l": "C", "in": "시계를 찾아 눌러요.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계를 바구니에 담았어요.", "c": [{"l": "A", "in": "시게를 바구니에 담았어요.", "r": 0.9}, {"l": "B", "in": "시게를 바구니에 담았어요.", "r": 0.84}, {"l": "C", "in": "시계를 바구니에 담았어요.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시계를 터뜨려요.", "c": [{"l": "A", "in": "시게를 터뜨려요.", "r": 0.9}, {"l": "B", "in": "시게를 터뜨려요.", "r": 0.84}, {"l": "C", "in": "시계를 터뜨려요.", "r": 0.84}], "note": "A·B는 [시게]로 읽게 적어 만든 것(표준 발음 [시계/시게] 둘 다 맞음) · C는 원래 글자로 천천히", "fam": false}, {"t": "시.", "c": [{"l": "A", "in": "글자. 시.", "r": 0.9, "trim": 1}, {"l": "B", "in": "글자. 시.", "r": 0.8, "trim": 1}, {"l": "C", "in": "낱말. 시.", "r": 0.9, "trim": 1}], "note": "글자 하나: 앞말을 붙여 만들고 끝 글자만 잘라 써요", "fam": false}, {"t": "계.", "c": [{"l": "A", "in": "글자. 계.", "r": 0.9, "trim": 1}, {"l": "B", "in": "글자. 계.", "r": 0.8, "trim": 1}, {"l": "C", "in": "낱말. 계.", "r": 0.9, "trim": 1}], "note": "글자 하나: 앞말을 붙여 만들고 끝 글자만 잘라 써요", "fam": false}];
const VOICE = 'Leda', VBASE = 'voice/leda/';
const $ = id => document.getElementById(id);
const ls = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
$('key').value = ls('webapp.cloudKey') || ls('wordLearn.cloudKey') || '';
$('eye').onclick = () => { const i = $('key'), t = i.type === 'password'; i.type = t ? 'text' : 'password'; $('eye').textContent = t ? '숨기기' : '보기'; };
const say = (t, c) => { $('state').textContent = t; $('state').className = c || ''; };
const hashOf = async t => { const d = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(t)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16); };
const DB = { db: null,
  open() { return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('voiceFix007c', 1); r.onupgradeneeded = () => r.result.createObjectStore('mp3'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
  async get(k) { const db = await this.open(); return new Promise(res => { const q = db.transaction('mp3').objectStore('mp3').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const tx = db.transaction('mp3', 'readwrite'); tx.objectStore('mp3').put(v, k); tx.oncomplete = res; tx.onerror = res; }); }
};
const ckey = c => c.in + '|' + c.r;
let ctx = null; const AC = () => ctx || (ctx = new (window.AudioContext || window.webkitAudioContext)());
/* 앞말을 붙여 만든 것: 마지막 소리 덩어리만(앱과 같은 방법) */
function lastSeg(buf) {
  const d = buf.getChannelData(0), sr = buf.sampleRate, fr = Math.round(sr * 0.02), n = Math.floor(d.length / fr), rms = [];
  for (let i = 0; i < n; i++) { let s = 0; for (let j = i * fr; j < (i + 1) * fr; j++) s += d[j] * d[j]; rms.push(Math.sqrt(s / fr)); }
  const thr = Math.max(Math.max(...rms) * 0.08, 0.004); let gs = [];
  for (let i = 0; i < n;) { if (rms[i] > thr) { let j = i; while (j < n && rms[j] > thr) j++; gs.push([i, j]); i = j; } else i++; }
  const m = []; gs.forEach(g => { if (m.length && (g[0] - m[m.length - 1][1]) * 0.02 < 0.15) m[m.length - 1][1] = g[1]; else m.push(g.slice()); });
  const ok = m.filter(g => (g[1] - g[0]) * 0.02 >= 0.08); if (ok.length < 2) return null;
  const [a, b] = ok[ok.length - 1]; return [Math.max(0, a * 0.02 - 0.05), Math.min(d.length / sr, b * 0.02 + 0.10)];
}
let src = null;
async function play(bytes, trim, it, c) {
  try { if (src) src.stop(); } catch (e) {}
  const buf = await AC().decodeAudioData(bytes.slice(0).buffer || bytes.slice(0));
  let off = 0, dur = buf.duration;
  if (trim) { const s = lastSeg(buf); if (s) { c.seg = s; off = s[0]; dur = s[1] - s[0]; } }
  src = AC().createBufferSource(); src.buffer = buf; src.connect(AC().destination); src.start(0, off, dur);
}
const picks = {}; try { Object.assign(picks, JSON.parse(ls('voiceFix007c.picks') || '{}')); } catch (e) {}
const savePicks = () => { try { localStorage.setItem('voiceFix007c.picks', JSON.stringify(picks)); } catch (e) {} const n = Object.values(picks).filter(v => v && v !== 'now').length; $('msg').textContent = `${n}개를 바꿔요`; };
function render() {
  $('list').innerHTML = '';
  let famShown = false;
  ITEMS.forEach((it, k) => {
    if (it.fam && !famShown) { famShown = true; const h = document.createElement('h2'); h.textContent = '같은 받침 소리가 든 다른 말(함께 고치면 좋아요)'; $('list').appendChild(h); }
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = `<div class="t"></div><div class="n"></div><div class="opts"></div>`;
    d.querySelector('.t').textContent = it.t; d.querySelector('.n').textContent = it.note;
    const opts = d.querySelector('.opts');
    const mk = (lab, id, getBytes, trim, c) => {
      const o = document.createElement('div'); o.className = 'op' + ((picks[it.t] || 'now') === id ? ' on' : '');
      const b = document.createElement('button'); b.className = 'p'; b.textContent = '▶';
      b.onclick = async () => { const by = await getBytes(); if (!by) { say('아직 만들지 않았어요. ① 후보 만들기를 눌러 주세요.', 'err'); return; } play(by, trim, it, c); };
      const l = document.createElement('label'); l.innerHTML = `<input type="radio" name="r${k}"> ${lab}`;
      const r = l.querySelector('input'); r.checked = (picks[it.t] || 'now') === id;
      r.onchange = () => { picks[it.t] = id; opts.querySelectorAll('.op').forEach(x => x.classList.remove('on')); o.classList.add('on'); savePicks(); };
      o.append(b, l); opts.appendChild(o);
    };
    mk('지금', 'now', async () => { const r = await fetch(VBASE + (await hashOf(it.t)) + '.mp3', { cache: 'no-cache' }); return r.ok ? new Uint8Array(await r.arrayBuffer()) : null; }, false, null);
    it.c.forEach(c => mk(c.l, c.l, () => DB.get(ckey(c)), !!c.trim, c));
    $('list').appendChild(d);
  });
  savePicks();
}
render();
async function synth(c, key) {
  for (let a = 0; a < 5; a++) {
    const r = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': key },
      body: JSON.stringify({ input: { text: c.in }, voice: { languageCode: 'ko-KR', name: 'ko-KR-Chirp3-HD-' + VOICE }, audioConfig: { audioEncoding: 'MP3', sampleRateHertz: 24000, speakingRate: c.r } }) });
    if (r.ok) { const j = await r.json(); const bin = atob(j.audioContent), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
    if (r.status === 400 || r.status === 401 || r.status === 403) throw Object.assign(new Error('key'), { status: r.status });
    await new Promise(s => setTimeout(s, 1500 * (a + 1)));
  }
  throw new Error('retry');
}
$('go').onclick = async () => {
  const key = $('key').value.trim(); if (!key) { say('Cloud 키를 넣어 주세요.', 'err'); $('key').focus(); return; }
  $('go').disabled = true; say('만들고 있어요. 이 창을 열어 두세요.');
  const all = []; ITEMS.forEach(it => it.c.forEach(c => all.push(c)));
  const todo = []; for (const c of all) if (!(await DB.get(ckey(c)))) todo.push(c);
  let done = all.length - todo.length, fail = 0, stop = null;
  const show = () => { $('bar').style.width = (done / all.length * 100) + '%'; };
  show();
  const worker = async () => { while (todo.length && !stop) { const c = todo.shift(); try { await DB.set(ckey(c), await synth(c, key)); done++; } catch (e) { if (e.message === 'key') { stop = e; break; } fail++; } show(); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  $('go').disabled = false;
  if (stop) { say('키를 확인해 주세요. (' + stop.status + ')', 'err'); return; }
  if (fail) { say(fail + '개를 못 만들었어요. 다시 누르면 그것만 만들어요.', 'err'); return; }
  say('다 만들었어요. 말마다 ▶로 듣고 골라 주세요.', 'ok');
};
$('zip').onclick = async () => {
  if (typeof JSZip === 'undefined') { say('zip 도구를 불러오지 못했어요. 새로 고침해 주세요(고른 것은 남아 있어요).', 'err'); return; }
  const z = new JSZip(), out = [];
  for (const it of ITEMS) {
    const id = picks[it.t]; if (!id || id === 'now') continue;
    const c = it.c.find(x => x.l === id); const by = await DB.get(ckey(c));
    if (!by) { say(`“${it.t}”의 ${id}를 아직 만들지 않았어요.`, 'err'); return; }
    const h = await hashOf(it.t);
    z.file('fix/' + h + '.mp3', by); out.push({ t: it.t, h, pick: id, in: c.in, r: c.r, trim: !!c.trim });
  }
  if (!out.length) { say('바꿀 것을 고르지 않았어요. 모두 “지금”이면 보낼 것이 없어요.', 'err'); return; }
  z.file('fix/choices.json', JSON.stringify(out, null, 1));
  const blob = await z.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'voice-leda-fix4.zip'; a.click();
  say(`${out.length}개를 묶었어요. 받은 zip을 Claude에게 보내 주세요.`, 'ok');
};
</script>
</body>
</html>
