<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[차름 음악] 우리 반 노래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<style>
:root{
  --pink:#B0487A; --pink-d:#7A2C53; --pink-l:#f6e3ec;
  --ink:#2b2622; --ink-2:#6b625a; --line:#d9cfc2;
  --desk:#efe9df; --paper:#fffdf9;
  --f-display:'Jua','Gowun Dodum',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);color:var(--ink);background:var(--desk);-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit}

/* 머리 */
header{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:14px 24px 10px 150px;max-width:1240px;margin:0 auto}
.brand small{display:block;font-family:var(--f-display);color:var(--pink);font-size:15px;letter-spacing:.04em}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15}
.songs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.songs span{color:var(--ink-2);font-size:14px;margin-right:2px}
.songs button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 12px;font-size:15px;cursor:pointer}
.songs button.on{background:var(--paper);border-color:var(--pink);color:var(--pink-d)}

/* 고르는 줄 */
.ctl{max-width:1240px;margin:0 auto;padding:4px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.play{border:0;background:var(--pink);color:#fff;border-radius:8px;padding:10px 20px 10px 16px;font-size:18px;font-family:var(--f-display);cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-width:190px;justify-content:center}
.play:hover{background:#9d3e6c}
.play i{font-style:normal;font-size:15px}
.play.busy{opacity:.75;cursor:progress}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>b{font-weight:400;color:var(--ink-2);font-size:14px;margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:rgba(255,255,255,.35)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:15px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pink);color:#fff}
.seg .lbl{padding:7px 10px;font-size:15px;min-width:74px;text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.tog{border:1px solid var(--line);background:rgba(255,255,255,.35);border-radius:7px;padding:7px 11px 7px 9px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tog::before{content:'';width:13px;height:13px;border:1.5px solid var(--ink-2);border-radius:3px;display:inline-block;box-sizing:border-box}
.tog.on{border-color:var(--pink);color:var(--pink-d)}
.tog.on::before{background:var(--pink);border-color:var(--pink);box-shadow:inset 0 0 0 2px #fff}
.out{margin-left:auto;display:flex;gap:8px}
.out button{border:1px solid var(--ink-2);background:transparent;border-radius:7px;padding:8px 14px;font-size:15px;cursor:pointer}
.out button:hover{background:rgba(255,255,255,.5)}
.note{max-width:1240px;margin:0 auto;padding:0 24px;color:var(--ink-2);font-size:14px;min-height:20px}
.note.warn{color:#9a3b1f}

/* 악보 종이 */
.sheet{max-width:1240px;margin:6px auto 40px;padding:0 24px}
.paper{background:var(--paper);border:1px solid #e4dbcd;padding:26px 34px 30px}
.paper h2{margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:32px}
.paper .by{display:flex;justify-content:space-between;color:var(--ink-2);font-size:15px;margin:4px 0 2px}
#score svg{display:block}
#score .abcjs-chord{fill:#8d8379}
#score .abcjs-annotation{fill:var(--pink-d)}
#score .now path,#score .now .abcjs-notehead{fill:var(--pink)!important;stroke:var(--pink)}
#score text.now-lyric{fill:var(--pink-d);font-weight:700}
.words{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);columns:2;column-gap:40px;font-size:17px;line-height:1.75}
.words p{margin:0 0 12px;break-inside:avoid}
.words em{font-style:normal;color:var(--pink-d);font-size:14px;display:block}

/* 받기 창 */
.dlg{position:fixed;inset:0;background:rgba(43,38,34,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--paper);max-width:460px;width:100%;padding:22px 24px;border-radius:6px}
.dlg h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:22px}
.dlg p{margin:0 0 14px;color:var(--ink-2);font-size:15px;line-height:1.6}
.dlg .row{display:flex;align-items:center;gap:10px;margin:10px 0}
.dlg .row b{font-weight:400;width:70px;color:var(--ink-2);font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.dlg .acts button{border:1px solid var(--ink-2);background:transparent;border-radius:7px;padding:8px 16px;font-size:15px;cursor:pointer}
.dlg .acts .go{background:var(--pink);border-color:var(--pink);color:#fff}

@media (max-width:820px){
  header{padding:54px 16px 8px}
  .ctl,.note,.sheet{padding-left:16px;padding-right:16px}
  .out{margin-left:0}
  .paper{padding:18px 14px 22px}
  .words{columns:1}
}
@media (max-width:600px){ header{padding-top:46px} .brand h1{font-size:26px} .play{min-width:0;width:100%} }
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header,.ctl,.note,.dlg{display:none!important}
  .sheet{padding:0;margin:0;max-width:none}
  .paper{border:0;padding:0}
  #score .now path{fill:#000!important;stroke:#000}
  #score text.now-lyric{fill:#000;font-weight:400}
  .words{font-size:13px;line-height:1.6}
}
</style>
</head>
<body>
<header>
  <div class="brand"><small>차름 음악</small><h1>우리 반 노래</h1></div>
  <div class="songs" id="songs"></div>
</header>

<div class="ctl">
  <button class="play" id="play" type="button"><i>▶</i><span>처음부터 들려주기</span></button>
  <div class="grp"><b>빠르기</b><div class="seg" id="speed">
    <button type="button" data-v="0.82">느리게</button><button type="button" data-v="1" class="on">보통</button><button type="button" data-v="1.15">빠르게</button>
  </div></div>
  <div class="grp"><b>높낮이</b><div class="seg">
    <button type="button" id="down" title="반음 낮게">낮게</button><span class="lbl" id="keyLbl">그대로</span><button type="button" id="up" title="반음 높게">높게</button>
  </div></div>
  <div class="grp"><b>소리</b>
    <button type="button" class="tog on" data-k="melody">멜로디</button>
    <button type="button" class="tog on" data-k="accomp">반주</button>
    <button type="button" class="tog on" data-k="bells">방울</button>
    <button type="button" class="tog on" data-k="count">박자 세기</button>
  </div>
  <div class="grp"><b>되풀이</b><div class="seg" id="reps">
    <button type="button" data-v="1" class="on">한 번</button><button type="button" data-v="2">두 번</button>
  </div></div>
  <div class="out">
    <button type="button" id="mp3">mp3로 받기</button>
    <button type="button" id="print">A4로 뽑기</button>
  </div>
</div>
<div class="note" id="note"></div>

<main class="sheet">
  <div class="paper">
    <h2 id="title"></h2>
    <div class="by"><span id="key"></span><span id="credit"></span></div>
    <div id="score"></div>
    <div class="words" id="words"></div>
  </div>
</main>

<div class="dlg" id="dlg"><div class="box">
  <h3>mp3로 받기</h3>
  <p id="dlgSum"></p>
  <div class="row"><b>되풀이</b><div class="seg" id="dReps"><button type="button" data-v="1">한 번</button><button type="button" data-v="2">두 번</button><button type="button" data-v="3">세 번</button></div></div>
  <p style="margin-top:12px">빠르기·높낮이·소리는 위에서 고른 그대로 들어가요. 사람 목소리는 없고 악기 소리만 들어가요.</p>
  <div class="acts"><button type="button" id="dNo">닫기</button><button type="button" class="go" id="dGo">받기</button></div>
</div></div>

<script>
/* ───────── 노래 ─────────
   곡은 Claude가 선생님이 주신 가사로 지어 여기에 넣는다(앱에서 쓰지 않음).
   abc: ABC 악보 글(L:1/8 — 숫자 없는 음은 8분음표, 2는 4분, 4는 2분, 8은 온음표). "C"는 반주 화음, "^후렴"은 위에 쓰는 글.
   w: 줄은 바로 위 악보 줄의 가사(한 글자 = 한 음, 띄어 씀). words: 아래에 따로 보이는 가사(원래 띄어쓰기).
   새 곡을 넣으면 README의 곡 목록에도 한 줄. */
const SONGS=[
 {id:'carol31', title:'3학년 1반 캐럴', lyricist:'3학년 1반', composer:'차름', tempo:100, key:'C',
  words:[
   ['1절','12월 25일은 크리스마스','산타 할아버지에게 선물받고 싶어요','산타가 선물을 줄거야','난 산타인형 받고 싶어','착한 친구는 사랑해주고','심한 말한 어른에겐 선물 없어!'],
   ['후렴','산타할아버지랑 징글벨 부르고 싶어','선녀가 뿌린 눈송이 속에','신나고 행복한 크리스마스','신나고 행복한 크리스마스']
  ],
  abc:
`"^1절""C"G2 E2 G4 | A A G E G4 | "F"F2 A2 "G7"G2 B2 | "C"c6 z2 |
w: 십 이 월 이 십 오 일 은 크 리 스 마 스
"F"A A A c c2 A2 | "C"G2 E2 G2 G2 | "Dm"F2 E2 D2 F2 | "G7"G6 z2 |
w: 산 타 할 아 버 지 에 게 선 물 받 고 싶 어 요
"C"E E G2 E E G2 | "G7"B2 A2 G4 | "C"c2 G G A2 G2 | "G7"F2 E D G4 |
w: 산 타 가 선 물 을 줄 거 야 난 산 타 인 형 받 고 싶 어
"F"A2 c2 d c A2 | "C"G G E G c4 | "Dm"F F F F A2 F2 | "G7"G G B B d d z2 |
w: 착 한 친 구 는 사 랑 해 주 고 심 한 말 한 어 른 에 겐 선 물 없 어!
"^후렴""C"c c c B A B c2 | "Am"e2 e2 e4 | "F"A2 c2 d4 | "G7"d4 B4 |
w: 산 타 할 아 버 지 랑 징 글 벨 부 르 고 싶 어
"C"e2 d c d2 c2 | "F"c2 A F "G7"G2 B2 | "C"c c G2 e e d2 | "F"c c A2 "G7"B2 G2 |
w: 선 녀 가 뿌 린 눈 송 이 속 에 신 나 고 행 복 한 크 리 스 마 스
"C"c c G2 e e d2 | "F"c2 A2 "G7"B2 d2 | "C"c8 |]
w: 신 나 고 행 복 한 크 리 스 마 스`}
];

/* ───────── 상태 ───────── */
const $=id=>document.getElementById(id);
const S={song:SONGS[0], speed:1, tr:0, reps:1, melody:true, accomp:true, bells:true, count:true};
try{ const v=JSON.parse(localStorage.getItem('charum013')||'{}'); for(const k of ['speed','tr','reps','melody','accomp','bells','count']) if(k in v) S[k]=v[k]; if(v.song){ const s=SONGS.find(x=>x.id===v.song); if(s) S.song=s; } }catch(e){}
function save(){ try{ localStorage.setItem('charum013',JSON.stringify({song:S.song.id,speed:S.speed,tr:S.tr,reps:S.reps,melody:S.melody,accomp:S.accomp,bells:S.bells,count:S.count})); }catch(e){} }
function note(t,warn){ const n=$('note'); n.textContent=t||''; n.classList.toggle('warn',!!warn); }

/* ───────── ABC 읽기(소리용) ───────── */
const LET={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parseAbc(abc){
  const notes=[], chords=[]; let t=0; const bars=[0];
  for(const line of abc.split('\n')){
    if(/^\s*w:/.test(line)||/^\s*%/.test(line)) continue;
    const re=/"([^"]*)"|([=^_]?)([A-Ga-g])([,']*)(\d*)(\/?\d*)|z(\d*)|(\|\]|\|)/g; let m;
    while((m=re.exec(line))){
      if(m[1]!==undefined){ if(/^[A-G]/.test(m[1])) chords.push({t,name:m[1]}); continue; }
      if(m[8]){ if(bars[bars.length-1]!==t) bars.push(t); continue; }
      if(m[7]!==undefined && m[3]===undefined){ const d=m[7]?+m[7]:1; notes.push({t,d,midi:null}); t+=d; continue; }
      const L=m[3]; let midi=60+LET[L.toUpperCase()]+(L===L.toLowerCase()?12:0);
      for(const c of m[4]) midi+=c==="'"?12:-12;
      if(m[2]==='^')midi++; else if(m[2]==='_')midi--;
      let d=m[5]?+m[5]:1; if(m[6]){ const q=m[6].slice(1); d=d/(q?+q:2); }
      notes.push({t,d,midi}); t+=d;
    }
  }
  return {notes,chords,total:t,bars};
}
const CH={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],m7:[0,3,7,10],maj7:[0,4,7,11],dim:[0,3,6],sus4:[0,5,7]};
function chordTones(name){
  const m=/^([A-G])([#b]?)(.*)$/.exec(name); if(!m) return null;
  let root=LET[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  return {root:(root+12)%12, iv:CH[m[3]]||CH['']};
}

/* ───────── 소리 만들기(브라우저 안에서 직접 계산 — 오디오 노드보다 수십 배 빠름) ───────── */
const SR=44100;
const hz=m=>440*Math.pow(2,(m-69)/12);
/* 피아노 비슷한 소리: 배음을 겹치고 높은 배음일수록 빨리 사라지게. 사인은 되풀이 식으로(빠름) */
function tone(buf,t,dur,f,o){
  const s0=Math.round(t*SR), at=Math.max(1,Math.round((o.att||0.006)*SR)), rl=Math.round(dur*SR);
  const end=Math.min(buf.length,s0+rl+Math.round(o.rel*7*SR));
  for(const [k,a] of o.p){
    const fk=f*k*(k>1?1+0.0007*k:1); if(fk>SR/2.2) continue;
    const w=2*Math.PI*fk/SR, c2=2*Math.cos(w), pk=o.peak*a, sus=o.sus;
    const dk=Math.exp(-1/((o.dec/k)*SR)), rk=Math.exp(-1/(o.rel*SR));
    let y1=Math.sin(-w), y2=Math.sin(-2*w), dec=1, env=0, relEnv=0;
    for(let n=s0;n<end;n++){
      const i=n-s0, y=c2*y1-y2; y2=y1; y1=y;
      if(i<at) env=pk*(i/at);
      else if(i<rl){ dec*=dk; env=pk*(sus+(1-sus)*dec); relEnv=env; }
      else { relEnv*=rk; env=relEnv; }
      buf[n]+=y*env;
    }
  }
}
const MEL={p:[[1,1],[2,.42],[3,.16],[4,.08],[6,.03]],peak:.20,sus:.42,dec:.38,rel:.07};
const PNO={p:[[1,1],[2,.45],[3,.18],[5,.05]],peak:.045,sus:.12,dec:.42,rel:.12};
const BAS={p:[[1,1],[2,.35],[3,.08]],peak:.11,sus:.22,dec:.55,rel:.1};
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647*2-1; };
function bell(buf,t,v){   /* 썰매 방울: 높은 소리만 거른 잡음을 세 번 짧게 */
  for(const [off,g] of [[0,1],[0.018,.6],[0.041,.45]]){
    const s0=Math.round((t+off)*SR), len=Math.round(0.2*SR), dk=Math.exp(-1/(0.03*SR));
    let env=v*g, xp=0, y=0; const a=0.62;
    for(let i=0;i<len&&s0+i<buf.length;i++){ const x=rnd(); y=a*(y+x-xp); xp=x; buf[s0+i]+=y*env*(i<130?i/130:1); if(i>=130) env*=dk; }
  }
}
function click(buf,t,hi){
  const s0=Math.round(t*SR), w=2*Math.PI*(hi?1760:1320)/SR, dk=Math.exp(-1/(0.022*SR)); let env=.3;
  for(let i=0;i<SR*0.15&&s0+i<buf.length;i++){ buf[s0+i]+=Math.sin(w*i)*env*(i<80?i/80:1); if(i>=80) env*=dk; }
}
/* 작은 방 울림(콤 4개 + 올패스 2개, 왼쪽·오른쪽 조금 다르게) */
function reverb(src,out,spread,mix){
  const combs=[1116,1188,1277,1356].map(d=>({b:new Float32Array(d+spread),i:0,f:0})), aps=[556,441].map(d=>({b:new Float32Array(d+spread),i:0}));
  const fb=0.8, damp=0.25;
  for(let n=0;n<src.length;n++){
    const x=src[n]*0.25; let s=0;
    for(const c of combs){ const y=c.b[c.i]; c.f=y*(1-damp)+c.f*damp; c.b[c.i]=x+c.f*fb; if(++c.i>=c.b.length) c.i=0; s+=y; }
    for(const a of aps){ const bo=a.b[a.i]; const y=-s+bo; a.b[a.i]=s+bo*0.5; if(++a.i>=a.b.length) a.i=0; s=y; }
    out[n]=src[n]*(1-mix*0.4)+s*mix;
  }
}
function voiceChord(pcs,lo,hi){ const out=[]; for(const pc of pcs){ let m=lo+((pc-lo)%12+12)%12; if(m>hi) m-=12; out.push(m); } return out.sort((a,b)=>a-b); }

/* 곡 전체를 한 번에 만들어 둠(재생·mp3가 같은 소리) — 하이라이트용 시간표도 함께 */
function plan(o){
  const P=parseAbc(o.song.abc), q=60/(o.song.tempo*o.speed), e=q/2; /* 8분음표 길이(초) */
  const lead=0.35, ci=o.count?8:0, loop=P.total;
  const marks=[];
  for(let r=0;r<o.reps;r++) P.notes.forEach((n,i)=>marks.push({t:lead+(ci+r*loop+n.t)*e, d:n.d*e, i, rest:n.midi===null}));
  const len=lead+(ci+o.reps*loop)*e+2.4;
  return {P,e,lead,ci,loop,marks,len};
}
async function renderAudio(o){
  const pl=plan(o), {P,e,lead,ci,loop}=pl, N=Math.ceil(pl.len*SR);
  const mono=new Float32Array(N), tr=o.tr; seed=7;
  if(o.count) for(let b=0;b<4;b++) click(mono,lead+b*2*e,b===0);
  const lastBar=P.bars.length>1?P.bars[P.bars.length-2]:0;
  const chordAt=t=>{ let c=null; for(const x of P.chords){ if(x.t<=t) c=x; else break; } return c; };
  for(let r=0;r<o.reps;r++){
    const base=lead+(ci+r*loop)*e;
    if(o.melody) for(const n of P.notes) if(n.midi!==null) tone(mono,base+n.t*e,n.d*e*0.94,hz(n.midi+tr),MEL);
    if(o.accomp){
      let prev=null;
      for(let s=0;s<loop;s+=2){                 /* 한 박(4분음표)마다 */
        const c=chordAt(s); if(!c) continue;

        if(s>=lastBar){                         /* 마지막 마디: 한 번 길게 */

        if(beat===0||beat===2||changed) tone(mono,t,e*1.8,hz(beat===2&&!changed?fifthB:rootB),BAS);

      }
    }
    if(o.bells) for(let s=0;s<loop;s+=2){ if(s>=lastBar) break; const beat=(s/2)%4; bell(mono,base+s*e,(beat%2)?.1:.055); if(beat%2) bell(mono,base+(s+1)*e,.035); }
    await new Promise(r=>setTimeout(r,0));
  }
  const L=new Float32Array(N), R=new Float32Array(N);
  reverb(mono,L,0,.16); reverb(mono,R,23,.16);
  let pk=0; for(let i=0;i<N;i++){ const a=Math.abs(L[i]), b=Math.abs(R[i]); if(a>pk)pk=a; if(b>pk)pk=b; }

  const buf={sampleRate:SR,length:N,duration:N/SR,getChannelData:c=>c?R:L};
  return {buf,pl};
}

function splitLines(abc){
  const out=[]; const lines=abc.split('\n');
  for(let i=0;i<lines.length;i++){
    const L=lines[i]; if(/^\s*w:/.test(L)) continue;
    const W=(lines[i+1]&&/^\s*w:/.test(lines[i+1]))?lines[i+1].replace(/^\s*w:\s*/,'').trim().split(/\s+/):[];
    const bars=L.split(/(?<=\|\]?)\s*/).filter(x=>x.trim());
    for(let b=0;b<bars.length;b+=2){

window.HomeLink = (function () {
  var URL = 'https://www.charum.org/';
  /* 로고(2026-11-22): 저장소 사본(media/brand/charum-logo.png)을 먼저, 없으면 charum.org 원본 — 서버 주소가 바뀌어도 깨지지 않게 */
  var LOGO = 'https://shim-sung-hyun.github.io/web_app/media/brand/charum-logo.png';
  var LOGO2 = 'https://www.charum.org/files/attach/images/59600/cdff757386e72b62ba5fb17ea83df99e.png';
  var st = document.createElement('style');
  st.textContent = '.chHomeA{display:inline-flex;align-items:center;line-height:0;padding:4px;border-radius:8px;text-decoration:none;opacity:.9;transition:opacity .15s}'
    + '.chHomeA:hover,.chHomeA:focus-visible{opacity:1}.chHomeA:focus-visible{outline:2px solid currentColor;outline-offset:2px}'
    + '.chHomeA img{height:30px;width:auto;display:block}'
    + '.chHomeA .hlTxt{display:none;font:700 14px/1 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#555;letter-spacing:.02em}'
    + '.chHomeA.noimg img{display:none}.chHomeA.noimg .hlTxt{display:inline;line-height:22px}'
    + '#chHome{position:fixed;left:var(--hl-left,14px);top:var(--hl-top,12px);z-index:2147480000;display:none}#chHome.on{display:inline-flex}'
    + '.chHomeSlot{position:relative;height:0;margin:0}.chHomeSlot .chHomeA{position:absolute;left:-4px;bottom:6px}'
    + '.chHomeSlot.flow{height:auto;margin:0 0 6px}.chHomeSlot.flow .chHomeA{position:static;margin-left:-4px}'
    + '@media (max-width:600px){.chHomeA img{height:24px}}@media print{#chHome,.chHomeSlot{display:none!important}}';
  document.head.appendChild(st);
  var show = function () { var c = document.body.classList; return c.contains('setup') || c.contains('admin'); };
  var setupSel = null, bars = [];
  function link(id) {
    var a = document.createElement('a'); if (id) a.id = id; a.className = 'chHomeA'; a.href = URL; a.target = '_blank'; a.rel = 'noopener';
    a.title = '차름 홈페이지(charum.org) — 새 탭으로 열려요'; a.setAttribute('aria-label', '차름 홈페이지 charum.org');
    var img = new Image(); img.alt = ''; img.src = LOGO; img.onerror = function () { if (img.src !== LOGO2) { img.src = LOGO2; return; } a.classList.add('noimg'); };
    img.onload = function () { tick(); };
    var t = document.createElement('span'); t.className = 'hlTxt'; t.textContent = 'charum.org';
    a.appendChild(img); a.appendChild(t); return a;
  }
  function make() { if (!document.getElementById('chHome')) document.body.appendChild(link('chHome')); }
  function visible(el) { if (!el || !el.isConnected) return false; var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; }
  function hit(a, b) { return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom; }
  /* 처음 설정 화면: 첫 카드 바로 위에 로고 자리(높이 0)를 두고, 글자와 겹치면 한 줄을 차지하게 */
  function placeSetup() {
    var card = setupSel && document.querySelector(setupSel);
    var on = false; try { on = !!show(); } catch (e) {}
    var slot = document.querySelector('.chHomeSlot');
    if (!card || !visible(card) || !on) { if (slot) slot.style.display = 'none'; return false; }
    if (!slot || slot.nextElementSibling !== card) {
      if (slot) slot.remove();
      slot = document.createElement('div'); slot.className = 'chHomeSlot'; slot.appendChild(link());
      card.parentNode.insertBefore(slot, card);
    }
    slot.style.display = '';
    slot.classList.remove('flow');
    var a = slot.firstChild, ar = a.getBoundingClientRect(), pad = { left: ar.left - 2, right: ar.right + 2, top: ar.top - 2, bottom: ar.bottom + 2 };
    /* 카드 앞에 있는 글자·그림만 봄(글 상자 전체가 아니라 실제 글줄) */
    var box = card.parentNode, over = false, rg = document.createRange(), n;
    var before = function (x) { return !!(x.compareDocumentPosition(slot) & 4); };
    var tw = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    while (!over && (n = tw.nextNode())) {
      if (!before(n)) break;
      if (!n.nodeValue.trim()) continue;
      rg.selectNodeContents(n); var rs = rg.getClientRects();
      for (var i = 0; i < rs.length && !over; i++) if (rs[i].width > 1 && hit(pad, rs[i])) over = true;
    }
    if (!over) box.querySelectorAll('img,svg,canvas,button,input,select').forEach(function (x) { if (!over && before(x) && !x.closest('.chHomeSlot') && hit(pad, x.getBoundingClientRect())) over = true; });
    if (!over && ar.top < 0) over = true;
    slot.classList.toggle('flow', over);
    return true;
  }
  /* 관리 메뉴: 위 메뉴 줄이 고정 로고와 겹치면 로고 아래로 내림 */
  function pushBars(a, on) {
    var lr = on ? a.getBoundingClientRect() : null;
    bars.forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (el) {
        var fixed = /fixed|absolute|sticky/.test(getComputedStyle(el).position), was = +(el.dataset.hlPush || 0), need = 0;
        if (lr && visible(el)) {
          var r = el.getBoundingClientRect(), top = r.top - (fixed ? was : 0), bot = r.bottom - (fixed ? was : 0);
          if (r.left < lr.right + 6 && r.right > lr.left && top < lr.bottom + 4 && bot > lr.top) need = Math.ceil(lr.bottom + 6 - top);
        }
        if (need === was) return;
        if (fixed) el.style.translate = need ? '0 ' + need + 'px' : '';
        else el.style.marginTop = need ? need + 'px' : '';
        if (need) el.dataset.hlPush = need; else delete el.dataset.hlPush;
      });
    });
  }
  function tick() {
    make(); var a = document.getElementById('chHome'); if (!a) return;
    var on = false; try { on = !!show(); } catch (e) {}
    var inSetup = placeSetup();
    on = on && !inSetup;
    a.classList.toggle('on', on);
    pushBars(a, on);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick); else tick();
  setInterval(tick, 400);
  addEventListener('resize', tick);
  return {
    when: function (fn) { show = fn; tick(); },
    setup: function (sel) { setupSel = sel; tick(); },
    bar: function () { bars = bars.concat([].slice.call(arguments)); tick(); },
    keepTop: function () {},
    at: function (left, top) { var r = document.documentElement.style; if (left != null) r.setProperty('--hl-left', left + 'px'); if (top != null) r.setProperty('--hl-top', top + 'px'); }
  };
})();
</script>
<script>HomeLink.when(function(){return true;});</script>
