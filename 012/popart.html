<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팝아트 변환기 · 차름 AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
  background: #fff; overflow: hidden;
}
.app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

/* 풀스크린 캔버스 */
.canvas {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
}
.result-img { width: 100%; height: 100%; object-fit: contain; display: none; }

.placeholder {
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; text-align: center; pointer-events: none;
}
.placeholder p { font-size: 16px; color: #ccc; line-height: 1.9; }

.loading { display: none; flex-direction: column; align-items: center; gap: 20px; }
.spinner {
  width: 60px; height: 60px;
  border: 5px solid #eee; border-top-color: #0057A8;
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { font-size: 16px; color: #aaa; font-weight: 500; }

.error-box {
  display: none; padding: 18px 24px; border-radius: 14px;
  background: #fff5f5; border: 1px solid #fcc;
  font-size: 13px; color: #c00; line-height: 1.8; max-width: 460px; text-align: center;
}

/* 힌트 탭 */
.hint-tab {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  z-index: 15; background: rgba(0,87,168,0.82);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 5px 20px; border-radius: 0 0 12px 12px;
  pointer-events: none; transition: opacity 0.3s;
  letter-spacing: 0.04em;
}

/* 호버 트리거 (상단 1/3) */
.hover-trigger {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 33vh; z-index: 10;
}

/* 컨트롤 패널 */
.control-panel {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  background: rgba(255,255,255,0.97);
  border-bottom: 2px solid #dde8f5;
  backdrop-filter: blur(10px);
  padding: 24px 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  transform: translateY(-100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 6px 32px rgba(0,87,168,0.10);
}
.control-panel.open { transform: translateY(0); }
.control-panel.open ~ .hint-tab { opacity: 0; }

/* 우편함 SVG 래퍼 */
.mailbox-btn {
  cursor: pointer; user-select: none; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform 0.15s;
}
.mailbox-btn:hover { transform: scale(1.05); }
.mailbox-btn:hover .slot-hole { fill: #003d7a; }
.mailbox-btn:active { transform: scale(0.97); }
.slot-hole { fill: #1a1a1a; transition: fill 0.2s; }

.file-col { display: flex; flex-direction: column; gap: 6px; }
.no-file { font-size: 14px; color: #bbb; }
.fname { font-size: 13px; color: #555; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 2px solid #0057A8; display: none; flex-shrink: 0; }

.btn-go {
  flex-shrink: 0;
  padding: 14px 40px; border-radius: 12px;
  border: none; background: #0057A8;
  color: #fff; font-size: 16px; cursor: pointer;
  font-family: inherit; font-weight: 700;
  transition: background 0.15s, transform 0.1s;
}
.btn-go:hover:not(:disabled) { background: #0069cc; transform: scale(1.03); }
.btn-go:active:not(:disabled) { transform: scale(0.97); }
.btn-go:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

/* 다시 만들기 */
.btn-retry {
  position: absolute; bottom: 24px; right: 28px; z-index: 5;
  padding: 11px 26px; border-radius: 10px;
  border: 2px solid #0057A8; background: rgba(255,255,255,0.92);
  color: #0057A8; font-size: 14px; cursor: pointer;
  font-family: inherit; font-weight: 600;
  display: none; backdrop-filter: blur(4px);
}
.btn-retry:hover { background: #f0f6ff; }

.mode-select {
  padding: 12px 14px; border-radius: 10px; border: 2px solid #0057A8;
  background: #fff; color: #0057A8; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; flex-shrink: 0;
}
#file-in { display: none; }
.mode-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.mbtn { display:flex; flex-direction:column; gap:2px; min-width:150px; padding:10px 16px; text-align:left;
  border:3px solid #000; border-radius:12px; box-shadow:4px 4px 0 #000; cursor:pointer; font-family:inherit;
  transition:transform .1s, box-shadow .1s; }
.mbtn b { font-size:16px; } .mbtn small { font-size:11px; opacity:.9; }
.mbtn:hover:not(:disabled) { transform:translate(-1px,-1px); box-shadow:5px 5px 0 #000; }
.mbtn:active:not(:disabled) { transform:translate(3px,3px); box-shadow:1px 1px 0 #000; }
.mbtn:disabled { opacity:.3; cursor:not-allowed; box-shadow:none; }
.m1 { background:#0057A8; color:#fff; } .m2 { background:#E8001C; color:#fff; } .m3 { background:#FFD700; color:#000; }
.opts { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; align-items:center; font-size:12px; color:#555; }
.opts label { display:flex; align-items:center; gap:6px; }
.opts .mode-select { padding:6px 8px; font-size:12px; border-width:1px; }
.opts input[type=range] { width:90px; }
.tabs { position:absolute; bottom:24px; left:28px; z-index:5; display:none; gap:8px; }
.tabs button { padding:9px 16px; border-radius:10px; border:2px solid #000; background:rgba(255,255,255,.92);
  font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
.tabs button.on { background:#000; color:#fff; }
/* ===== 꾸미기: 팝아트 바탕, 만화 컷 느낌 ===== */
html, body { background-color:#FFD700; background-image:radial-gradient(circle, rgba(232,0,28,.16) 3px, transparent 3.5px); background-size:22px 22px; }
.canvas { background:transparent; }
.canvas.has-result { padding:16px 16px 150px; }
.placeholder h1 { font-size:clamp(36px,8vw,76px); font-weight:900; color:#fff; -webkit-text-stroke:3px #000; text-shadow:5px 5px 0 #000; letter-spacing:.03em; }
.placeholder p { color:#222; font-weight:700; }
.loading p { color:#222; font-weight:700; }
.control-panel { background:#fff; border-bottom:4px solid #000; }
.result-img { width:auto; height:auto; max-width:100%; max-height:100%; border:4px solid #000; box-shadow:8px 8px 0 #000; background:#fff; }
.m4 { background:#fff; color:#000; }
#mb-flag { transform-origin:108px 70px; transform:rotate(150deg); transition:transform .5s cubic-bezier(.3,1.5,.5,1); }
.has-photo #mb-flag { transform:rotate(0); }
#mb-letter { opacity:0; transform:translateY(12px); transition:all .5s; }
.has-photo #mb-letter { opacity:1; transform:none; }
.tray { position:absolute; left:0; right:0; bottom:0; z-index:5; display:none; gap:14px; align-items:flex-end; justify-content:center; flex-wrap:wrap; padding:12px 16px 14px; background:rgba(255,255,255,.95); border-top:4px solid #000; }
.card { width:112px; display:flex; flex-direction:column; gap:4px; align-items:center; padding:6px; background:#fff; border:3px solid #000; border-radius:10px; cursor:pointer; font-family:inherit; font-size:12px; }
.card .tw { width:96px; height:72px; display:flex; align-items:center; justify-content:center; background:#f1f1f1; border-radius:4px; overflow:hidden; color:#888; font-size:11px; }
.card img { width:100%; height:100%; object-fit:cover; display:none; }
.card.has img { display:block; } .card.has .tw span { display:none; }
.card.on { background:#FFD700; box-shadow:4px 4px 0 #000; transform:translate(-2px,-2px); }
.card.fail .tw { background:#fff0f0; color:#c00; }
.acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.act { padding:11px 16px; border-radius:10px; border:3px solid #000; background:#fff; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; box-shadow:3px 3px 0 #000; }
.act.print { background:#E8001C; color:#fff; }
#print-img { display:none; }
@media (max-width:700px) { .canvas.has-result { padding-bottom:230px; } }
@media print {
  .app, #file-in { display:none !important; }
  html, body { background:#fff !important; overflow:visible; height:auto; }
  #print-img { display:block; width:100%; max-height:270mm; object-fit:contain; margin:0 auto; }
  @page { margin:10mm; }
}
/* ===== 놀이 도구 ===== */
.canvas.has-result { padding:16px 16px 215px; }
@media (max-width:700px) { .canvas.has-result { padding-bottom:300px; } }
.play { flex-basis:100%; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.chip { padding:7px 12px; border:2px solid #000; border-radius:999px; background:#fff; font-family:inherit; font-weight:700; font-size:12px; cursor:pointer; }
.chip:hover { background:#FFD700; }
#toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50; background:#000; color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; font-size:14px; display:none; }
#print-area { display:none; }
.pa-one img { width:100%; max-height:270mm; object-fit:contain; display:block; margin:0 auto; }
.pa-mask { width:165mm; margin:6mm auto 0; text-align:center; font:700 12pt sans-serif; }
.pa-mask .cut { border:3px dashed #000; border-radius:14mm; padding:4mm; margin-top:3mm; }
.pa-mask img { width:100%; display:block; }
.pa-mask .stick { margin:5mm auto 0; width:24mm; height:60mm; border:3px dashed #000; display:flex; align-items:center; justify-content:center; writing-mode:vertical-rl; }
.pa-quiz { page-break-after:always; text-align:center; }
.pa-quiz:last-child { page-break-after:auto; }
.pa-quiz h2 { font:900 36pt sans-serif; margin:6mm 0; }
.pa-quiz img { max-width:100%; max-height:215mm; border:3px solid #000; }
.pa-gal { display:grid; grid-template-columns:1fr 1fr; gap:6mm; }
.pa-gal figure { margin:0; break-inside:avoid; }
.pa-gal img { width:100%; display:block; border:2px solid #000; }
.pa-gal figcaption { border-bottom:1.5px solid #000; margin-top:3mm; padding:2mm 0; font:12pt sans-serif; }
@media print { #print-area { display:block !important; } }
.canvas.has-result ~ .hover-trigger { height:56px; }   /* 결과를 볼 때는 위쪽 좁은 띠에서만 우편함이 열려요 */
/* ===== 새 배치: 가로 화면은 왼쪽 1/3 조절판 + 오른쪽 사진, 세로 화면은 위 1/3 조절판 + 가운데 사진 + 아래 칸 ===== */
.hover-trigger, .hint-tab { display:none !important; }
.app { display:grid; width:100vw; height:100vh; height:100dvh; grid-template-columns:minmax(300px,33.333%) minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; grid-template-areas:"ctrl photo" "ctrl tray"; }
.control-panel { grid-area:ctrl; position:relative; top:auto; left:auto; right:auto; z-index:auto; transform:none; transition:none; box-shadow:none; backdrop-filter:none; overflow-y:auto; min-height:0; align-items:stretch; gap:16px; padding:18px 20px; border-bottom:0; border-right:4px solid #000; }
.canvas { grid-area:photo; position:relative; top:auto; left:auto; width:auto; height:auto; min-width:0; min-height:0; overflow:hidden; padding:16px; }
.canvas.has-result { padding:16px; }
.tray { grid-area:tray; position:static; border-top:4px solid #000; }
.cp-head { display:flex; align-items:center; gap:14px; }
.mailbox-btn svg { width:clamp(84px,13vmin,140px); height:auto; display:block; }
.mailbox-btn:not(.has-photo) svg { animation:bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
.mb-label { font-size:13px; color:#555; font-weight:700; }
.cp-file { display:flex; align-items:center; gap:12px; min-width:0; }
.fname { max-width:100%; }
.mode-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mbtn { min-width:0; }
.opts { display:grid; grid-template-columns:1fr; gap:8px 16px; align-items:center; }
.opts label { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.opts input[type=range] { flex:1; width:auto; min-width:60px; }
.opts label:last-child { grid-column:1/-1; justify-content:flex-start; }
@media (max-aspect-ratio:1/1) {
  .app { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,34%) minmax(0,1fr) auto; grid-template-areas:"ctrl" "photo" "tray"; }
  .control-panel { border-right:0; border-bottom:4px solid #000; padding:12px 16px; gap:12px; }
  .mode-btns { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .opts { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
}
/* ----- 다듬기: 파일 이름 말줄임, 슬라이더 줄맞춤, 좁은 화면에서는 아래 칸을 작게 ----- */
.cp-file { flex:1; } .file-col { min-width:0; }
.opts label { display:grid; grid-template-columns:62px 1fr; }
.opts label:last-child { display:flex; }
.opts select { width:100%; }
@media (max-aspect-ratio:1/1) { .mb-label { display:none; } .control-panel { gap:8px; } .mbtn { padding:8px 12px; } }
@media (max-width:700px), (max-height:520px) {
  .mailbox-btn svg { width:clamp(64px,13vmin,140px); }
  .mbtn small { display:none; }
  .tray { gap:8px; padding:8px 10px 10px; }
  .card { flex:1 1 0; width:auto; min-width:0; padding:4px; font-size:11px; }
  .card .tw { width:100%; height:46px; }
  .acts { flex-basis:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .act { padding:7px 4px; font-size:13px; }
  .play { flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; padding-bottom:2px; }
  .chip { flex:0 0 auto; }
}
.smart { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.smart small { font-size:11px; color:#777; line-height:1.4; flex:1; min-width:160px; }
.chip.s { background:#FFD700; }
#sugg { display:none; flex-basis:100%; gap:8px; flex-wrap:wrap; justify-content:center; }
.opts label.wide { display:flex; grid-column:1/-1; justify-content:flex-start; flex-wrap:wrap; gap:4px 10px; }
#selbox { position:absolute; display:none; border:3px dashed #E8001C; border-radius:14px; pointer-events:none; z-index:3; }
#result-img { touch-action:none; }
</style>
</head>
<body>
<div class="app">

  <div class="canvas" id="canvas">
    <div class="placeholder" id="ph">
      <h1>POP ART!</h1>
      <p>우편함을 눌러<br>사진을 넣어 주세요!</p>
    </div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p id="loading-msg">팝아트 만드는 중…</p>
    </div>
    <img class="result-img" id="result-img" alt="팝아트 결과"/>
    <div id="selbox"></div>
    <div class="error-box" id="error-box"></div>
  </div>

  <div class="hover-trigger" id="hover-trigger" onclick="openPanel()" onmouseenter="if(!busy)openPanel()"></div>

  <div class="control-panel" id="control-panel">
    <div class="cp-head">
      <div class="mailbox-btn" onclick="document.getElementById('file-in').click()" title="사진 넣기">
        <svg width="187" height="192" viewBox="0 0 136 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="bd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.5" fill="#9b0014"/></pattern>
          <clipPath id="body"><path d="M14 96 V52 A46 34 0 0 1 106 52 V96 Z"/></clipPath>
        </defs>
        <ellipse cx="60" cy="135" rx="32" ry="4" fill="#000" opacity=".15"/>
        <rect x="53" y="92" width="14" height="42" fill="#8a5a33" stroke="#000" stroke-width="3"/>
        <g id="mb-flag"><rect x="106" y="40" width="4" height="30" fill="#111"/><rect x="110" y="40" width="16" height="11" fill="#0057A8" stroke="#000" stroke-width="2.5"/></g>
        <g id="mb-letter"><rect x="40" y="34" width="40" height="22" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/><path d="M40 34 L60 48 L80 34" fill="none" stroke="#000" stroke-width="2"/></g>
        <path d="M14 96 V52 A46 34 0 0 1 106 52 V96 Z" fill="#E8001C"/>
        <rect x="68" y="14" width="40" height="84" fill="url(#bd)" clip-path="url(#body)"/>
        <path d="M22 90 V54 A38 28 0 0 1 42 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
        <path d="M14 96 V52 A46 34 0 0 1 106 52 V96 Z" fill="none" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="24" y="68" width="72" height="22" rx="4" fill="#FFD700" stroke="#000" stroke-width="3"/>
        <circle cx="60" cy="79" r="3.5" fill="#fff" stroke="#000" stroke-width="2"/>
        <rect class="slot-hole" x="28" y="50" width="64" height="9" rx="4.5" fill="#111" stroke="#000" stroke-width="2"/>
      </svg>
        <span class="mb-label">사진 투입</span>
      </div>
      <div class="cp-file">
        <img id="thumb" class="thumb" alt="미리보기"/>
        <div class="file-col">
          <span id="no-file" class="no-file">우편함을 눌러<br>사진을 넣어주세요!<br><small>얼굴이 크게 나온 사진이 좋아요</small></span>
          <span id="fname" class="fname"></span>
        </div>
      </div>
    </div>
    <div class="mode-btns">
        <button class="mbtn m1" disabled onclick="generate('ai')"><b>① AI 변환</b><small>Cloudflare AI가 다시 그려요</small></button>
        <button class="mbtn m2" disabled onclick="generate('filter')"><b>② 필터</b><small>AI 없이 · 얼굴 그대로</small></button>
        <button class="mbtn m3" disabled onclick="generate('hybrid')"><b>③ 필터 + AI</b><small>윤곽은 필터, 그림은 AI</small></button>
        <button class="mbtn m4" disabled onclick="generateAll()"><b>★ 세 가지 모두</b><small>한 번에 비교 (AI 2번 사용)</small></button>
      </div>
    <div class="smart">
      <button class="chip" id="btn-detect" disabled onclick="autoDetect()">🔍 사진 보고 자동 설정</button>
      <small>사진을 구글 AI(무료)가 살펴봐요. 사진이 구글로 전송되니 학생 얼굴 사진은 동의를 확인한 뒤 쓰세요.</small>
    </div>
    <div class="opts">
      <label>AI 방식 <select class="mode-select" id="mode"><option value="faithful">얼굴 그대로</option><option value="balanced">균형</option><option value="bold">과감하게</option></select></label>
      <label>대상 <select class="mode-select" id="target"><option value="person">사람</option><option value="object">사물</option></select></label>
      <label>색 조합 <select class="mode-select" id="pal"><option value="classic">원색(자연)</option><option value="vivid">강한 원색</option><option value="warm">따뜻한 팝</option><option value="mono">흑백</option></select></label>
      <label>점 크기 <input type="range" id="dot" min="3" max="16" value="6"></label>
      <label>선 굵기 <input type="range" id="line" min="0" max="3" value="1"></label>
      <label>디테일 <input type="range" id="edge" min="3" max="18" value="8"></label>
      <label>점 많이 <input type="range" id="mix" min="0" max="10" value="3"></label>
      <label class="wide">AI에게 알림:
        <input type="checkbox" class="xf" id="x-glasses"> 안경
        <input type="checkbox" class="xf" id="x-hat"> 모자
        <input type="checkbox" class="xf" id="x-beard"> 수염</label>
      <label>필터 방식 <select class="mode-select" id="fstyle"><option value="layers">레이어 (만화+점)</option><option value="dots">단순 점</option></select></label>
      <label class="wide">레이어:
        <input type="checkbox" id="L-bg" checked> 바탕 점
        <input type="checkbox" id="L-f1" checked> 얼굴 점1
        <input type="checkbox" id="L-f2" checked> 얼굴 점2
        <input type="checkbox" id="L-big" checked> 큰 원
        <input type="checkbox" id="L-star" checked> 별
        <button class="chip" id="btn-shuffle" type="button">🎲 배치</button></label>
    </div>
  </div>

  <div class="hint-tab" id="hint-tab">▼ 여기를 클릭해서 사진 투입</div>
  <div class="tray" id="tabs">

  const r = e.target.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const text = pre || window.prompt(type === 'burst' ? '효과음을 써 주세요 (예: 쾅!)' : '말풍선에 들어갈 말을 써 주세요', type === 'burst' ? '쾅!' : '');
  if (!text) return;
  if (current !== 'comic') { if (comicBase !== current) bubbles = []; comicBase = current; }
  bubbles.push({ type, text, x: fx, y: fy }); selected = bubbles.length - 1; await redrawComic(); toast('끌어서 옮기고, 두 번 누르면 글을 고칠 수 있어요');
});
async function undoBubble() {
  if (current !== 'comic' || !bubbles.length) return;
  bubbles.pop(); selected = null; if (bubbles.length) await redrawComic(); else { delete results.comic; showResult(comicBase); }
}
// 인쇄: 한 장 / 막대 가면 / 퀴즈 / 전시판

function printResult() { if (results[current]) printHTML(`<div class="pa-one"><img src="${results[current]}"></div>`); }

// ---------- 구글 AI(무료): 글·사진 이해만 사용 (그림 그리기는 Cloudflare) ----------
const GEMINI_URL = WORKER_URL.replace(/\/cartoon$/, '/gemini');
async function askGemini(parts) {
  const res = await fetch(GEMINI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json' } }) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 403) throw new Error('이 주소에서는 쓸 수 없어요. (Worker의 허용 주소 ALLOW 확인)');
  if (res.status === 429) throw new Error('오늘 쓸 수 있는 구글 AI 횟수를 다 썼어요. 내일 다시 해 보세요.');
  if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
  const t = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').replace(/```json|```/g, '').trim();
  try { return JSON.parse(t); } catch (e) { throw new Error('AI 답을 읽지 못했어요. 다시 눌러 보세요.'); }
}
async function toJpegB64(src, max = 768) {
  let im = src;
  if (typeof src === 'string') { im = new Image(); im.src = src; await im.decode(); }
  const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9).split(',')[1];
}
// 사진을 보고 대상(사람/사물)과 안경·모자·수염을 자동으로 체크
async function autoDetect() {
  if (!srcImg || busy) return;
  const btn = document.getElementById('btn-detect'), label = btn.textContent; btn.disabled = true; btn.textContent = '살펴보는 중…';
  try {
    const j = await askGemini([{ inline_data: { mime_type: 'image/jpeg', data: await toJpegB64(srcImg) } },
      { text: '이 사진을 보고 JSON으로만 답하세요. 형식: {"subject":"person 또는 object","glasses":true/false,"hat":true/false,"beard":true/false,"summary":"한국어 한 문장"}' }]);
    document.getElementById('target').value = j.subject === 'object' ? 'object' : 'person';
    ['glasses', 'hat', 'beard'].forEach(k => document.getElementById('x-' + k).checked = !!j[k]);
    delete results.ai; delete results.hybrid;      // 설정이 바뀌었으니 AI 그림은 다시 만들도록
    toast('🔍 ' + (j.summary || '설정을 채웠어요'));
  } catch (e) { toast('자동 설정 실패: ' + (e.message || e)); }
  finally { btn.textContent = label; btn.disabled = !srcImg; }
}
// 지금 보는 그림에 어울리는 말풍선 대사·효과음 추천 (그림이 구글로 전송됨)
function chipEl(label, fn) { const b = document.createElement('button'); b.className = 'chip s'; b.textContent = label; b.onclick = fn; return b; }
async function suggestLines() {
  if (!results[current]) return;
  toast('대사를 생각하는 중…');
  try {
    const j = await askGemini([{ inline_data: { mime_type: 'image/jpeg', data: await toJpegB64(results[current]) } },
      { text: '이 팝아트 그림에 어울리는 만화 대사를 JSON으로만 답하세요. 어린이도 읽을 수 있는 쉬운 한국어로 각 12자 이내. 형식: {"bubbles":["대사 3개"],"sounds":["효과음 3개 (예: 쾅!)"]}' }]);
    const box = document.getElementById('sugg'); box.innerHTML = '';
    (j.bubbles || []).slice(0, 3).forEach(t => box.appendChild(chipEl('💬 ' + t, () => startPlace('bubble', t))));
    (j.sounds || []).slice(0, 3).forEach(t => box.appendChild(chipEl('💥 ' + t, () => startPlace('burst', t))));
    box.style.display = box.children.length ? 'flex' : 'none';
    toast('마음에 드는 걸 누르고, 그림에서 놓을 자리를 눌러 주세요');
  } catch (e) { toast('대사 추천 실패: ' + (e.message || e)); }
}
