<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팝아트 변환기 · 차름 AI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
  background: #fff; overflow: hidden;
}
.app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

/* 풀스크린 캔버스 */
.canvas {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
}
.result-img { width: 100%; height: 100%; object-fit: contain; display: none; }

.placeholder {
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; text-align: center; pointer-events: none;
}
.placeholder p { font-size: 16px; color: #ccc; line-height: 1.9; }

.loading { display: none; flex-direction: column; align-items: center; gap: 20px; }
.spinner {
  width: 60px; height: 60px;
  border: 5px solid #eee; border-top-color: #0057A8;
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { font-size: 16px; color: #aaa; font-weight: 500; }

.error-box {
  display: none; padding: 18px 24px; border-radius: 14px;
  background: #fff5f5; border: 1px solid #fcc;
  font-size: 13px; color: #c00; line-height: 1.8; max-width: 460px; text-align: center;
}

/* 힌트 탭 */
.hint-tab {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  z-index: 15; background: rgba(0,87,168,0.82);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 5px 20px; border-radius: 0 0 12px 12px;
  pointer-events: none; transition: opacity 0.3s;
  letter-spacing: 0.04em;
}

/* 호버 트리거 (상단 1/3) */
.hover-trigger {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 33vh; z-index: 10;
}

/* 컨트롤 패널 */
.control-panel {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  background: rgba(255,255,255,0.97);
  border-bottom: 2px solid #dde8f5;
  backdrop-filter: blur(10px);
  padding: 24px 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  transform: translateY(-100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 6px 32px rgba(0,87,168,0.10);
}
.control-panel.open { transform: translateY(0); }
.control-panel.open ~ .hint-tab { opacity: 0; }

/* 우편함 SVG 래퍼 */
.mailbox-btn {
  cursor: pointer; user-select: none; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform 0.15s;
}
.mailbox-btn:hover { transform: scale(1.05); }
.mailbox-btn:hover .slot-hole { fill: #003d7a; }
.mailbox-btn:active { transform: scale(0.97); }
.slot-hole { fill: #1a1a1a; transition: fill 0.2s; }

.file-col { display: flex; flex-direction: column; gap: 6px; }
.no-file { font-size: 14px; color: #bbb; }
.fname { font-size: 13px; color: #555; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 2px solid #0057A8; display: none; flex-shrink: 0; }

.btn-go {
  flex-shrink: 0;
  padding: 14px 40px; border-radius: 12px;
  border: none; background: #0057A8;
  color: #fff; font-size: 16px; cursor: pointer;
  font-family: inherit; font-weight: 700;
  transition: background 0.15s, transform 0.1s;
}
.btn-go:hover:not(:disabled) { background: #0069cc; transform: scale(1.03); }
.btn-go:active:not(:disabled) { transform: scale(0.97); }
.btn-go:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

/* 다시 만들기 */
.btn-retry {
  position: absolute; bottom: 24px; right: 28px; z-index: 5;
  padding: 11px 26px; border-radius: 10px;
  border: 2px solid #0057A8; background: rgba(255,255,255,0.92);
  color: #0057A8; font-size: 14px; cursor: pointer;
  font-family: inherit; font-weight: 600;
  display: none; backdrop-filter: blur(4px);
}
.btn-retry:hover { background: #f0f6ff; }

.mode-select {
  padding: 12px 14px; border-radius: 10px; border: 2px solid #0057A8;
  background: #fff; color: #0057A8; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; flex-shrink: 0;
}
#file-in { display: none; }
.mode-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.mbtn { display:flex; flex-direction:column; gap:2px; min-width:150px; padding:10px 16px; text-align:left;
  border:3px solid #000; border-radius:12px; box-shadow:4px 4px 0 #000; cursor:pointer; font-family:inherit;
  transition:transform .1s, box-shadow .1s; }
.mbtn b { font-size:16px; } .mbtn small { font-size:11px; opacity:.9; }
.mbtn:hover:not(:disabled) { transform:translate(-1px,-1px); box-shadow:5px 5px 0 #000; }
.mbtn:active:not(:disabled) { transform:translate(3px,3px); box-shadow:1px 1px 0 #000; }
.mbtn:disabled { opacity:.3; cursor:not-allowed; box-shadow:none; }
.m1 { background:#0057A8; color:#fff; } .m2 { background:#E8001C; color:#fff; } .m3 { background:#FFD700; color:#000; }
.opts { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; align-items:center; font-size:12px; color:#555; }
.opts label { display:flex; align-items:center; gap:6px; }
.opts .mode-select { padding:6px 8px; font-size:12px; border-width:1px; }
.opts input[type=range] { width:90px; }
.tabs { position:absolute; bottom:24px; left:28px; z-index:5; display:none; gap:8px; }
.tabs button { padding:9px 16px; border-radius:10px; border:2px solid #000; background:rgba(255,255,255,.92);
  font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
.tabs button.on { background:#000; color:#fff; }
/* ===== 꾸미기: 팝아트 바탕, 만화 컷 느낌 ===== */
