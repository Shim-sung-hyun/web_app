<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>차름 사진 모으기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2133;--sub:#5b6077;--line:#d9dcea;--pri:#1F6C75;--pri2:#16525A;--bg:#f1f6f6;--ok:#1b7f3a;--err:#c62828;--warn:#8A5A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:22px 16px 120px}
h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:28px;margin:6px 0 6px;color:var(--pri2)}
.lead{margin:0 0 16px;color:var(--sub);font-size:15px;line-height:1.6}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
label.t{display:block;font-weight:700;margin:0 0 8px;font-size:15px}
input.f,select.f{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.krow{display:flex;gap:8px}.krow input{flex:1;min-width:0}
.sm{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#f4f5fa;color:var(--ink);white-space:nowrap}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0;line-height:1.55}.hint a{color:var(--pri2)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{font:inherit;font-size:17px;font-weight:700;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.pick button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.pick svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.warn{margin:12px 2px 0;padding:10px 12px;border-radius:12px;background:#FFF4E5;color:#7A4A00;font-size:14px;line-height:1.5}
.ph{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:104px 1fr;gap:10px}
.ph.bad{border-color:#E8A6A6;background:#FFF7F7}.ph.sent{border-color:#9ED3AE;background:#F4FBF6}
.ph img{width:104px;height:104px;object-fit:cover;border-radius:10px}
.ph .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.ph .top{display:flex;gap:6px;align-items:center}.ph .top input{flex:1;min-width:0;padding:8px 10px;font-size:16px}
.ph .x{font:inherit;font-size:13px;padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.ph .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub)}
.ph select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:#fff}
.ph .tags{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;flex:1;min-width:120px}
.ph label{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--ink)}
.st{font-size:13px;line-height:1.5}.st.bad{color:var(--err);font-weight:700}.st.ok{color:var(--ok)}.st.none{color:var(--warn)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.5}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(241,246,246,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
#send{width:100%;font:inherit;font-size:19px;font-weight:700;padding:14px;border:0;border-radius:16px;background:var(--pri);color:#fff}
#send:disabled{opacity:.55}
#state{min-height:1.4em;margin:6px 2px 0;font-size:14px;text-align:center}#state.err{color:var(--err);font-weight:700}#state.ok{color:var(--ok)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:6px 0}
</style>
</head>
<body>
<main>
  <h1>차름 사진 모으기</h1>
  <p class="lead">짬짬이 찍은 사진을 여러 장 올리면, 사진마다 <b>물건 이름·장소·태그·쓸 앱</b>을 Gemini가 골라 주고 <b>사람·얼굴·이름·번호</b>가 보이는 사진은 막아요. 보낸 사진은 제작자 확인 화면에 모였다가 차름 사진 모음에 들어가요.</p>

  <div class="card">
    <label class="t" for="key">Gemini 키 <span style="font-weight:400;color:var(--sub);font-size:13px">한 번 넣으면 이 휴대폰에 남아요</span></label>
    <div class="krow"><input class="f" id="key" type="password" autocomplete="off" placeholder="AQ. 또는 AIza 로 시작하는 키"><button class="sm" type="button" id="keyShow">보기</button></div>
    <p class="hint">키가 없어도 보낼 수 있어요. 그때는 이름을 직접 쓰고, 확인 화면에 "검사 안 함"이 붙어요. <a href="https://www.charum.org/study/doc.html?gemini-key" target="_blank" rel="noopener">키 받는 법 →</a></p>
  </div>

  <div class="card">
    <div class="pick">
      <button class="pri" type="button" id="shoot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>사진 찍기</button>
      <button type="button" id="album"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M20.5 16l-5-5-8 8"/></svg>앨범에서 여러 장</button>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileIn" accept="image/*" multiple hidden>
    <p class="warn"><b>사람·얼굴·이름·전화번호·차 번호판·학교 이름</b>이 나오지 않게 찍어 주세요. 물건이 화면 안에 통째로 들어오면 여러 앱에서 쓰기 좋아요.</p>
  </div>

  <div id="list"><p class="empty">아직 올린 사진이 없어요.</p></div>

  <div class="card">
    <label class="chk"><input type="checkbox" id="agree"> 제가 찍은 사진이에요. 공개 차름 사진 모음에 올라가 여러 차름 학습 자료에 계속 쓰이고, 그림·도안으로 바꿔 쓰여도 돼요. (출처 표시·비영리 CC BY-NC 4.0)</label>
  </div>
</main>
<div class="bar"><div class="in"><button id="send" type="button" disabled>보내기</button><p id="state" aria-live="polite"></p></div></div>
<script>
(function(){
const DONATE='https://charum.org/charum-api/donate.php';
const PLACES=['교실','복도','화장실','급식실','운동장·바깥','집','가게','교통','기타'];
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(t,c)=>{ $('state').textContent=t||''; $('state').className=c||''; };
$('key').value=ls.get('webapp.geminiKey')||'';
$('key').oninput=()=>{ const k=$('key').value.trim(); if(/^(AIza[\w-]{20,}|AQ\.[\w.\-]{20,})$/.test(k)) ls.set('webapp.geminiKey',k); MODEL=''; };
$('keyShow').onclick=()=>{ const i=$('key'), t=i.type==='password'; i.type=t?'text':'password'; $('keyShow').textContent=t?'숨기기':'보기'; };

/* 사진: 긴 쪽 1280으로 다시 그려 JPEG(위치 정보 등 EXIF가 빠짐) */
function to1280(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u);
    res(c.toDataURL('image/jpeg',0.88)); };
  im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('load')); }; im.src=u; }); }

/* Gemini: 분류 + 개인 정보 검사를 한 번에 */
let MODEL='';
async function model(key){
  if(MODEL) return MODEL;
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}}); if(!r.ok) throw new Error('키 '+r.status);
  const names=((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/^gemini.*flash/.test(n)&&!/(tts|image|audio|live|embedding|thinking)/.test(n));
  const ver=n=>parseFloat((/gemini-(\d+(\.\d+)?)/.exec(n)||[])[1]||0);
  names.sort((a,b)=>(/preview|exp/.test(a)-/preview|exp/.test(b))||(/lite/.test(a)-/lite/.test(b))||ver(b)-ver(a));
  if(!names.length) throw new Error('모델 없음'); return MODEL=names[0];
}
const PROMPT=`This photo was taken by a special-education teacher to use in learning apps for teenage students with developmental disabilities in Korea. Look at it and return JSON only:
{"title": short everyday Korean noun for the main object or scene (1-3 words, the word a student would know, e.g. 신발장, 교실 문, 정수기, 우유 바구니; never 이것 or 물건),
 "place": one of ${JSON.stringify(PLACES)},
 "tags": up to 4 short Korean words (topic, material, color, use; e.g. 학교, 물, 나무, 정리),
 "shape_ok": true if clear circles, ovals, triangles or four-sided shapes are fully visible (not cut off by the edge), good for a "find the shape" lesson,
 "puzzle_ok": true if it is clear, not blurry, has one main subject and would make a nice picture puzzle,
 "person": any human or body part, "face": any face including on posters or screens, "name_text": any readable personal name,
 "phone_or_id_number": any phone, student or ID number, "license_plate": readable vehicle plate, "school_name": readable school or institution name,
 "note": one short Korean sentence about anything the teacher should check (or "")}`;
async function classify(b64,key){
  const m=await model(key);
  const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:PROMPT}]}],generationConfig:{responseMimeType:'application/json',temperature:0.1}};
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status===429?'오늘 무료 한도가 찼어요':'분석 '+r.status);
  const j=await r.json(); return JSON.parse(((j.candidates||[])[0].content.parts||[]).map(p=>p.text||'').join('').replace(/^```(json)?|```$/g,''));
}

/* 목록 */
const ITEMS=[]; let seq=0;
function render(it){
  let el=document.getElementById('ph'+it.n);
  if(!el){ el=document.createElement('div'); el.id='ph'+it.n; const L=$('list'); const e=L.querySelector('.empty'); if(e) e.remove(); L.prepend(el); }
  el.className='ph'+(it.bad?' bad':'')+(it.sent?' sent':'');
  const st=it.sent?'<span class="st ok">✓ 보냈어요</span>':it.busy?'<span class="st">살펴보는 중…</span>':it.bad?`<span class="st bad">보낼 수 없어요: ${esc(it.bad)}이(가) 보여요. 다시 찍어 주세요.</span>`
    :it.check==='gemini'?`<span class="st ok">개인 정보 없음${it.note?' · '+esc(it.note):''}</span>`:`<span class="st none">검사 안 함${it.err?' ('+esc(it.err)+')':''} — 제작자가 확인해요</span>`;
  el.innerHTML=`<img src="${it.img}" alt=""><div class="body">
    <div class="top"><input class="f" data-f="title" maxlength="40" placeholder="물건 이름" value="${esc(it.title)}" ${it.sent?'disabled':''}><button class="x" type="button" data-f="del">빼기</button></div>
    <div class="row"><select data-f="place" ${it.sent?'disabled':''}>${['',...PLACES].map(p=>`<option value="${p}" ${p===it.place?'selected':''}>${p||'장소'}</option>`).join('')}</select>
      <input class="tags" data-f="tags" placeholder="태그(쉼표로)" value="${esc(it.tags.join(', '))}" ${it.sent?'disabled':''}></div>
    <div class="row">쓸 앱: <label><input type="checkbox" data-f="shape" ${it.shape?'checked':''} ${it.sent?'disabled':''}>도형 찾기</label><label><input type="checkbox" data-f="puzzle" ${it.puzzle?'checked':''} ${it.sent?'disabled':''}>그림 조각</label></div>
    ${st}</div>`;
  const q=f=>el.querySelector(`[data-f=${f}]`);
  q('title').oninput=e=>{ it.title=e.target.value.trim(); upd(); };
  q('place').onchange=e=>{ it.place=e.target.value; };
  q('tags').oninput=e=>{ it.tags=e.target.value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).slice(0,6); };
  q('shape').onchange=e=>{ it.shape=e.target.checked; }; q('puzzle').onchange=e=>{ it.puzzle=e.target.checked; };
  q('del').onclick=()=>{ ITEMS.splice(ITEMS.indexOf(it),1); el.remove(); if(!ITEMS.length) $('list').innerHTML='<p class="empty">아직 올린 사진이 없어요.</p>'; upd(); };
}
async function add(file){
  const it={n:++seq,img:'',title:'',place:'',tags:[],shape:false,puzzle:false,check:'none',bad:'',busy:true,sent:false,note:'',err:''};
  try{ it.img=await to1280(file); }catch(e){ say('열 수 없는 사진이 있어요.','err'); return; }
  ITEMS.push(it); render(it); upd();
  const key=$('key').value.trim();
  if(/^(AIza[\w-]{20,}|AQ\.[\w.\-]{20,})$/.test(key)){
    try{ const o=await classify(it.img.split(',')[1],key);
      it.title=it.title||String(o.title||'').trim().slice(0,40); it.place=PLACES.includes(o.place)?o.place:''; it.tags=(Array.isArray(o.tags)?o.tags:[]).map(s=>String(s).trim()).filter(Boolean).slice(0,4);
      it.shape=!!o.shape_ok; it.puzzle=!!o.puzzle_ok; it.note=String(o.note||'').slice(0,80);
      const why=[]; if(o.person||o.face) why.push('사람이나 얼굴'); if(o.name_text) why.push('이름'); if(o.phone_or_id_number) why.push('번호'); if(o.license_plate) why.push('차 번호판'); if(o.school_name) why.push('학교 이름');
      it.bad=why.join(', '); it.check='gemini';
    }catch(e){ it.err=e.message||'분석 실패'; it.check='none'; }
  }
  it.busy=false; render(it); upd();
}
async function addFiles(fs){ for(const f of fs) await add(f); }
$('shoot').onclick=()=>$('camIn').click(); $('album').onclick=()=>$('fileIn').click();
$('camIn').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; addFiles(f); };
$('fileIn').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; addFiles(f); };
$('agree').onchange=upd;
function ready(){ return ITEMS.filter(it=>!it.sent&&!it.busy&&!it.bad); }
function upd(){ const r=ready(); $('send').disabled=!r.length; $('send').textContent=r.length?`${r.length}장 보내기`:'보내기'; }

$('send').onclick=async()=>{
  const r=ready(); if(!r.length) return;
  if(!$('agree').checked){ say('맨 아래 동의 칸에 표시해 주세요.','err'); $('agree').scrollIntoView({block:'center'}); return; }
  const noName=r.find(it=>!it.title); if(noName){ say('이름이 빈 사진이 있어요. 물건 이름을 써 주세요.','err'); document.querySelector('#ph'+noName.n+' [data-f=title]').focus(); return; }
  $('send').disabled=true; let ok=0, fail='';
  for(const it of r){
    say(`보내는 중… ${ok+1} / ${r.length}`);
    try{
      const res=await fetch(DONATE,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a:'give',app:'000',check:it.check,agree:true,title:it.title,img:it.img.split(',')[1],
        meta:{place:it.place,tags:it.tags,suggest:{shape:it.shape,puzzle:it.puzzle},note:it.note}})});
      let j={}; try{ j=await res.json(); }catch(e){}
      if(!res.ok||j.error) throw new Error(j.error||('http '+res.status));
      it.sent=true; ok++; render(it);
    }catch(e){ fail=e.message; if(fail==='busy'||fail==='full') break; }
  }
  upd();
  if(!fail) say(`${ok}장 보냈어요. 고마워요! 확인 화면에서 골라 사진 모음에 넣어요.`,'ok');
  else say(`${ok}장 보냈어요. 나머지는 보내지 못했어요: `+(fail==='busy'?'오늘 보낼 수 있는 만큼 다 보냈어요(내일 다시)':fail==='full'?'기증함이 가득 찼어요(확인 화면에서 비워 주세요)':fail),'err');
};
})();
</script>
</body>
</html>
