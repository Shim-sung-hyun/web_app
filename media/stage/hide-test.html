<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>숨기기 시험</title>
<style>
 :root{--bg:#f6f3ec;--ink:#3a3328;--line:#d8d0c0}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22201c;--ink:#ece6da;--line:#4a4438}}
 :root[data-theme="dark"]{--bg:#22201c;--ink:#ece6da;--line:#4a4438}
 body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
 header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
 h1{font-size:17px;margin:0 8px 0 0}
 select,button,label{font:inherit}
 button{padding:4px 12px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;cursor:pointer}
 #note{font-size:13px;opacity:.8;margin:0 0 12px;max-width:72em}
 #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
 figure{margin:0} figcaption{font-size:13px;opacity:.75;margin-top:2px}
 .st{border-radius:4px;background:#ddd}
 .ring{position:absolute;z-index:9600;border:3px solid #e0533a;border-radius:50%;pointer-events:none}
 .hideAns .ring{display:none}
</style></head><body>
<header>
 <h1>숨기기 시험 (무대 베타 · 숲)</h1>
 <label>단계 <select id="lv"><option value="1">하</option><option value="2" selected>중</option><option value="3">상</option><option value="4">스페셜</option></select></label>
 <button id="again">새 판</button>
 <label><input id="ans" type="checkbox" checked> 숨은 자리 보기</label>
</header>
<p id="note">무대가 장면을 원리대로 놓고, 동물을 <b>그 깊이의 원근 크기</b>로 같은 땅의 소품 <b>바로 뒤</b>에 숨겨요(가릴 소품이 없으면 하나를 앞에 더 놓음). 보이는 몫은 그림 모양으로 셈해 단계마다 맞춰요 — 하 65~95% · 중 30~60% · 상 10~27% · 스페셜 4~15%(6마리), 상이면 상 80%·중·스페셜 10%씩 섞임 — 색이 바탕과 얼마나 다른지(찾기 쉬움 점수)도 함께 맞춰요.
어긋난 장면은 판 번호와 함께 어떤 원리가 어긋났는지 말해 주세요.</p>
<div id="grid"></div>
<script id="stagekit">
/* 무대(stage) 공통 모듈 stagekit — 원본은 common/stagekit.js 한 곳. 앱 안의 이 칸은 손으로 고치지 말고 python3 tools/sync-modules.py
   빈 배경 위에 요소를 '밑동이 아래인 것이 앞'으로 쌓는다(만화영화 셀·포토샵 레이어처럼).
   자료: media/stage/<갈래>/<장소>/ (bg.jpg · items/ · skirt/ 밑동 덮개 · front/ 앞가림 띠 · far/ 먼 띠 · stage.json), 차림표 media/stage/index.json
   장면의 규칙은 stage.json 이 가짐(2026-11-04 다시 짬):
     beds  자리 — {이름:{y:[위,아래], x:[[왼,오른]…], persp:원근 여부, skirt:[그 자리에 까는 덮개]}}  예) 땅·물속 바닥·물낯·물가 둑·흙 속·하늘
     items 요소 — {이름:{real:[m,m], bed:놓일 자리, role:'big'|'frame', base·foot(그림의 실제 밑동 — tools/stage-meta.py가 잼)}}
   → 요소는 제 자리에만 놓이고(물풀이 공중에 뜨거나 땅 요소가 물에 서지 않음), 밑동이 그 자리의 땅·바닥·물낯에 정확히 닿음.
   쓰는 법
     const pl = await Stage.load('nature/desert');
     const lay = Stage.compose(pl, {seed: 7});          // 무작위(같은 seed면 같은 장면) · {fixed:[{id,x,y,r,flip}]} · {avoid:[[x0,y0,x1,y1]…], min:0}
     Stage.add(pl, lay, {src, real, x, y, w, h, bed});   // 동물도 같은 규칙으로(real이면 그 깊이의 원근 크기)
     Stage.render(div, pl, lay, {shadow:.28, haze:.3});  // look: layer·bg·zOf·farZ·frontZ·front·skirt·showBeds
   좌표 x·y는 장면 대비 0~1, y는 밑동(땅에 닿는 곳). 모듈은 동작만, 얼굴(그림자 세기·흐림)은 앱이 넘겨 줌. */
(function (G) {
  const BASE = 'https://shim-sung-hyun.github.io/web_app/media/stage/';
  const rnd = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const img = src => new Promise(ok => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  async function load(id, opt = {}) {
    const base = opt.base || BASE, dir = base + id + '/';
    const cfg = await fetch(dir + 'stage.json', {cache: 'no-cache'}).then(r => r.json());
    const pl = Object.assign({id, dir, horizon: .35, groundTop: .36, unit: .22}, cfg);
    if (!pl.beds) pl.beds = {ground: {y: [pl.groundTop, 1], persp: true, skirt: pl.skirt || []}};
    const bed0 = Object.keys(pl.beds)[0];
    const jobs = [img(dir + (opt.bg || 'bg') + '.jpg').then(i => pl.bgImg = i)];
    for (const [k, it] of Object.entries(pl.items || {})) {
      it.id = k; it.bed = pl.beds[it.bed] ? it.bed : bed0; it.src = (it.from ? base + it.from + '/' : dir) + 'items/' + k + '.webp';
      jobs.push(img(it.src).then(i => { it.img = i; if (i) { it.w = i.naturalWidth; it.h = i.naturalHeight; } }));
    }
    for (const f of pl.front || []) { f.srcUrl = dir + 'front/' + f.src + '.webp'; jobs.push(img(f.srcUrl).then(i => f.img = i)); }
    for (const f of pl.far || []) { f.srcUrl = dir + 'far/' + f.src + '.webp'; jobs.push(img(f.srcUrl).then(i => f.img = i)); }
    pl.skirtImg = {};
    const sk = new Set(Object.values(pl.beds).flatMap(b => b.skirt || []));
    Object.values(pl.items || {}).forEach(i => Array.isArray(i.skirt) && i.skirt.forEach(k => sk.add(k)));
    for (const k of sk) {
      const source = pl.skirtFrom && pl.skirtFrom[k] ? base + pl.skirtFrom[k] + '/skirt/' + k + '.webp' : dir + 'skirt/' + k + '.webp';
      jobs.push(img(source).then(i => { if (i) pl.skirtImg[k] = i; }));
    }
    await Promise.all(jobs);
    for (const k of Object.keys(pl.items || {})) if (!pl.items[k].img) delete pl.items[k];
    await Promise.all(Object.values(pl.items || {}).filter(it => it.ownShadow).map(splitShadow));
    groundMap(pl);
    return pl;
  }

  /* 그림자 땅 층(2026-11-12 선생님): 그림에 그림자가 든 소품(ownShadow)은 몸과 그림자를 나눠 그림자를 모든 소품·동물 아래(땅)에 깖 —
     뒤에 숨은 동물 몸 위로 그림자가 덮이지 않아, 소품 바로 뒤(그림자 쪽)에도 숨을 수 있음. 그림자 점 = 검고(밝기 40 아래) 반투명(알파 110 이하) */
  const isShade = (r, g, b, a) => a > 0 && a <= 110 && r < 40 && g < 40 && b < 40;
  async function splitShadow(it) {
    try {
      const W = it.img.naturalWidth, H = it.img.naturalHeight, c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(it.img, 0, 0); const D = x.getImageData(0, 0, W, H), d = D.data, S = x.createImageData(W, H), s = S.data; let n = 0;
      for (let i = 0; i < d.length; i += 4) if (isShade(d[i], d[i + 1], d[i + 2], d[i + 3])) { s[i + 3] = d[i + 3]; d[i + 3] = 0; n++; }
      if (!n) return;
      const url = async img => { const k = document.createElement('canvas'); k.width = W; k.height = H; k.getContext('2d').putImageData(img, 0, 0);
        const b = await new Promise(ok => k.toBlob(ok, 'image/webp', .9)); return b ? URL.createObjectURL(b) : k.toDataURL(); };
      [it.bodySrc, it.shadowSrc] = await Promise.all([url(D), url(S)]);
    } catch (e) { /* 그림을 못 읽으면(다른 곳 그림) 예전처럼 한 장으로 */ }
  }
  /* 빈 땅 지도(2026-11-09 선생님: 배경에 그려진 나무뿌리 위에 소품이 서면 떠 보임 — 밑동은 배경의 빈 땅 위에만, 아니면 그 앞으로).
     배경 맨 아래 띠의 가운데 색을 '빈 땅 색'으로 보고, 160×120 칸마다 그 색과 가까운지(groundTol, 기본 48) 적어 둠 */
  function groundMap(pl) {
    if (!pl.bgImg || pl.groundCheck === false) return;
    try {
      const W = 160, H = 120, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(pl.bgImg, 0, 0, W, H);
      const d = x.getImageData(0, 0, W, H).data, ref = [[], [], []];
      for (let y = Math.floor(H * .86); y < H; y++) for (let i = Math.floor(W * .3); i < Math.floor(W * .7); i++) { const k = (y * W + i) * 4; ref[0].push(d[k]); ref[1].push(d[k + 1]); ref[2].push(d[k + 2]); }
      const med = a => a.sort((p, q) => p - q)[a.length >> 1], R0 = med(ref[0]), G0 = med(ref[1]), B0 = med(ref[2]), tol = pl.groundTol || 48, g = new Uint8Array(W * H);
      for (let k = 0; k < W * H; k++) g[k] = Math.hypot(d[k * 4] - R0, d[k * 4 + 1] - G0, d[k * 4 + 2] - B0) < tol ? 1 : 0;
      pl.ground = {W, H, g};
    } catch (e) { pl.ground = null; }
  }
  const isGround = (pl, x, y) => { const G = pl.ground; if (!G) return true; const i = Math.floor(x * G.W), j = Math.floor(y * G.H); if (i < 0 || j < 0 || i >= G.W || j >= G.H) return true; return G.g[j * G.W + i] === 1; };
  function footOnGround(pl, o, covers) {   // 밑동 줄을 따라 다섯 점 중 넷 이상이 빈 땅이면 됨(낙엽 몇 장 정도는 괜찮게)
    const B = pl.beds[o.bed] || {}; if (!pl.ground || B.persp === false || B.groundCheck === false) return true;
    const fx = f => o.x + (o.flip ? -1 : 1) * o.w * (f - .5), L = Math.min(fx(o.foot[0]), fx(o.foot[1])), Rr = Math.max(fx(o.foot[0]), fx(o.foot[1]));
    /* 밑동 전체가 빈 땅 위(2026-11-09 다시 — 넷만 보면 넓은 밑동의 한쪽이 배경 뿌리에 걸쳐도 통과했음): 밑동 줄과 그 조금 아래 두 줄, 9점 모두 */
    for (const dy of [.004, .014]) for (let k = 0; k < 9; k++) { const x = L + (Rr - L) * k / 8, y = Math.min(.999, o.y + dy);
      if (!isGround(pl, x, y) || (covers && covers.some(f => f !== o && f.img && blockedAt(f, x, y)))) return false; } return true;
    /* covers(원리 19 다시, 2026-11-09 선생님 '큰 줄기도 배경으로 생각하면 된다'): 큰 줄기 그림이 덮은 곳은 빈 땅에서 뺌 —
       뿌리 끝 앞의 땅(뿌리 끝을 가리며)과, 줄기 그림 안의 '설 땅'(뿌리 사이 움푹한 이끼 자리·맨 아래 흙 테두리 — nestOf)에만 밑동이 옴 */
  }
  /* 앞뒤를 정하는 높이(원리 4·18): 보통은 밑동 y, 가장자리 큰 줄기는 퍼진 뿌리를 땅처럼 뒤에 깔고 줄기가 올라오는 곳 */
  const depthY = o => o.sortY ?? o.y;
  const realMax = it => Array.isArray(it.real) ? it.real[1] : (it.real || 1);
  /* 그 자리에서 1m가 장면 높이의 몇 몫인가. 원근 자리(땅·바닥)는 지평선에서 내려온 만큼에 비례, 아니면(물낯·흙 속·하늘) 어디서나 같음 */
  const perM = (pl, y, bed) => {
    const b = typeof bed === 'string' ? pl.beds[bed] : bed;
    if (b && b.persp === false) return b.unit || pl.unit;
    return pl.unit * Math.max(.04, (y - pl.horizon) / (1 - pl.horizon));
  };
  const inX = (b, x) => !b.x || b.x.some(r => x >= r[0] && x <= r[1]);
  const inAvoid = (pl, x, y) => (pl.avoid || []).some(r => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]);

  function pickSkirt(pl, it, r) {
    if (it.skirt === false) return null;
    const list = (Array.isArray(it.skirt) ? it.skirt : (pl.beds[it.bed] || {}).skirt || []).filter(k => pl.skirtImg[k]);
    return list.length ? list[Math.floor(((r * 7919) % 1) * list.length)] : null;
  }

  /* 하나 놓기: 실제 높이(m)와 밑동 자리로 크기를 셈. base = 그림 높이 중 밑동 줄의 몫(그 아래는 투명 여백) */
  function place(pl, it, x, y, r, flip, extra) {
    if (it.flip === false || it.ownShadow) flip = false;   // 그림자가 그림에 든 소품(빙, 2026-11-10)은 뒤집으면 해 방향이 거꾸로 됨
    const realH = Array.isArray(it.real) ? it.real[0] + (it.real[1] - it.real[0]) * r : (it.real || 1);
    const base = it.base ?? 1;
    const h = realH * perM(pl, y, it.bed) / base * (it.scale || 1);
    const w = h * (it.w / it.h) * .75;   // 장면이 4:3
    const R = rnd(Math.floor(r * 4294967296));
    const skirtMargin = it.skirtMargin || [.03 + R() * .04, .03 + R() * .04];
    return Object.assign({id: it.id, src: it.src, bed: it.bed, x, y, w, h, base, flip: !!flip, foot: it.foot || [.2, .8], skirt: pickSkirt(pl, it, r), skirtMargin, skirtHeightScale: it.skirtHeightScale, skirtOffset: it.skirtOffset, skirtScale: it.skirtScale}, extra || {});
  }

  /* 무작위 배치: 자리마다 그 자리의 요소만. 고르게 흩뿌리지 않고 2~4 덩어리(큰 것 하나 + 앞쪽 작은 것) + 빈 땅 */
  /* 배치 고치기에서 익힌 원리(2026-11-12, 선생님이 사막 32판을 고친 것 — media/stage/arrange.html):
     ① 앞뒤 분명히: 큰 소품(role big) 둘의 밑동이 가로로 30% 넘게 겹치면 밑동 높이 차이가 stackGap(기본 .04, 장면 높이 대비) 이상 — 거의 같은 줄에 겹쳐 서면 앞의 것이 뒤의 것 위에 떠 보임.
        고친 판들: 고치기 전 차이 .00~.03 → 고친 뒤 .03~.08. 뒤의 것을 뒤로 물림(원근으로 작아짐), 자리 끝이면 앞의 것을 앞으로.
     ② 그림자는 하늘로 안 감: 그림자가 그려진 소품(ownShadow)은 그림 속 그림자 꼭대기(stage.json shadowTop, stage-meta가 잼)가 지평선 아래.
        원근에서는 앞뒤로 옮겨도 지평선 위로 나온 몫의 비율이 같아서(키가 눈높이를 넘으면 어디서나 넘음) 크기만 줄임 — 선생님도 대부분 '작게'로 고침 */
  const footSpan = o => { const f = o.foot || [.2, .8], a = o.flip ? 1 - f[1] : f[0], b = o.flip ? 1 - f[0] : f[1]; return [o.x - o.w / 2 + o.w * a, o.x - o.w / 2 + o.w * b]; };
  function settle(pl, out) {
    const gap = (pl.compose || {}).stackGap ?? .04, big = o => (pl.items[o.id] || {}).role === 'big' && o.sortY == null;
    const moveY = (o, y) => { const B = pl.beds[o.bed] || {y: [pl.horizon, 1]}; y = Math.max(B.y[0], Math.min(1.02, y)); const k = perM(pl, y, o.bed) / perM(pl, o.y, o.bed); o.w *= k; o.h *= k; o.y = y; };
    /* ⑥ 같은 종류는 크기를 달리(2026-11-12 2차, 선생님: '비슷한 것 여러 개가 같은 크기면 단순해 보임'): 가까이(가로 .2·밑동 .08 안) 있는 같은 종류가 크기 차이 15% 안이면 뒤의 것을 줄이거나 키움 */
    { let t = 0; for (const p of out) for (const q of out) { if (p === q || p.y > q.y || p.sortY != null || q.sortY != null) continue; const ip = pl.items[p.id] || {}, iq = pl.items[q.id] || {};
      if (!ip.kind || ip.kind !== iq.kind || Math.abs(p.x - q.x) > .2 || q.y - p.y > .08) continue; const r = q.h / p.h; if (r < .87 || r > 1.15) continue;
      const k = (t++ % 2) ? 1.25 : .78; p.w *= k; p.h *= k; } }
    const tol = (pl.compose || {}).shadowSky ?? .1;   // 2026-11-12 2차: 선생님은 그림자 꼭대기를 지평선보다 .013~.024 아래까지(밑동 깊이 .19쯤에서) 줄임 → 밑동 깊이(y−지평선)의 10%만큼 아래 — 앞뒤로 옮겨도 그대로인 비율
    const sky = () => {
    for (const o of out) { const it = pl.items[o.id] || {}; if (it.shadowTop == null) continue;
      const base = o.base || 1, top = o.y - o.h * (base - it.shadowTop);
      if (top - pl.horizon < tol * (o.y - pl.horizon)) { const s = Math.max(.3, (1 - tol) * (o.y - pl.horizon) / (o.h * (base - it.shadowTop))); o.w *= s; o.h *= s; } } };
    for (let round = 0; round < 3; round++) { sky();   // 크기를 먼저 정하고(⑥·②) 자리를 맞춤(①④⑤) — 앞뒤로 옮겨도 그림자가 지평선 위로 나오는 비율은 같음
    for (let pass = 0; pass < 3; pass++) for (let i = 0; i < out.length; i++) for (let j = 0; j < out.length; j++) {
      const p = out[i], q = out[j]; if (i === j || !big(p) || !big(q) || p.y > q.y) continue;   // p 뒤(밑동이 위), q 앞
      if (q.y - p.y >= gap) continue;
      const A = footSpan(p), C = footSpan(q), ov = Math.min(A[1], C[1]) - Math.max(A[0], C[0]);
      if (ov <= .3 * Math.min(A[1] - A[0], C[1] - C[0])) continue;
      const B = pl.beds[p.bed] || {y: [pl.horizon, 1]};
      if (q.y - gap >= B.y[0]) moveY(p, q.y - gap); else moveY(q, p.y + gap);
