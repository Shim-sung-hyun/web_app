<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 시험</title>
<style>
 :root{--bg:#f6f3ec;--ink:#3a3328;--line:#d8d0c0}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22201c;--ink:#ece6da;--line:#4a4438}}
 :root[data-theme="dark"]{--bg:#22201c;--ink:#ece6da;--line:#4a4438}
 body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
 header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
 h1{font-size:17px;margin:0 8px 0 0}
 select,button,label{font:inherit}
 button{padding:4px 12px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:6px;cursor:pointer}
 #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
 figure{margin:0} figcaption{font-size:13px;opacity:.75;margin-top:4px;line-height:1.6}
 .no{position:absolute;z-index:9500;transform:translate(-50%,-100%);min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#fff;color:#7a2e1f;border:1.5px solid #7a2e1f;font:600 12px/17px system-ui,sans-serif;text-align:center;pointer-events:none}
 .no.sel{background:#7a2e1f;color:#fff}
 .no.sk{color:#2f5f2a;border-color:#2f5f2a;border-style:dashed}
 #grid.moving .no{pointer-events:auto;cursor:grab}
 .hideNo .no{display:none}
 textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;min-height:52px}
 #placeNote{margin:0 0 12px}
 #copyBtn{font-weight:600}
 #copied{font-size:13px;opacity:.75}
 .st{border-radius:4px;background:#ddd;touch-action:none}
 #msg{font-size:14px;opacity:.8}
</style></head><body>
<header>
 <h1>무대 시험</h1>
 <select id="pl"></select>
 <button id="again">새 판</button>
 <label>그림자 <input id="sh" type="range" min="0" max="0.6" step="0.02" value="0.28"></label>
 <label>먼 것 흐림 <input id="hz" type="range" min="0" max="1" step="0.05" value="0.3"></label>
 <label><input id="fr" type="checkbox" checked> 앞가림 띠</label>
 <label><input id="bd" type="checkbox"> 자리 보기</label>
 <label><input id="nb" type="checkbox" checked> 번호</label>
 <label title="끌어 옮기기 · 바퀴로 고른 요소 크기 · 두 번 누름 소품 뒤집기 · K 덮개 바꾸기 · N 덮개 없애기 · Delete 빼기"><input id="mv" type="checkbox"> 옮기기</label>
 <button id="copyBtn">대화에 보낼 글 복사</button> <span id="copied"></span>
 <span id="msg"></span>
</header>
<textarea id="placeNote" placeholder="이 곳 전체에 대한 멘트(배경·먼 띠·어울리지 않는 요소 등)"></textarea>
<p id="mvHelp" style="display:none;font-size:13px;margin:0 0 10px;opacity:.85">옮기기: 소품과 덮개(점선 번호)를 각각 끌어 옮겨요 · 바퀴 = 고른 요소 크기 · 위아래로 옮기면 소품은 원근대로 크기가 바뀜 · 두 번 누르기 = 소품 좌우 뒤집기 · K = 덮개 바꾸기, N = 덮개 없애기, Delete = 고른 요소 빼기. 옮긴 것은 '멘트 모아 복사'에 함께 들어가요(새 판을 누르면 사라지니 그 전에 복사).</p>
<div id="grid"></div>
<script id="stagekit">
/* 무대(stage) 공통 모듈 stagekit — 원본은 common/stagekit.js 한 곳. 앱 안의 이 칸은 손으로 고치지 말고 python3 tools/sync-modules.py
   빈 배경 위에 요소를 '밑동이 아래인 것이 앞'으로 쌓는다(만화영화 셀·포토샵 레이어처럼).
   자료: media/stage/<갈래>/<장소>/ (bg.jpg · items/ · skirt/ 밑동 덮개 · front/ 앞가림 띠 · far/ 먼 띠 · stage.json), 차림표 media/stage/index.json
   장면의 규칙은 stage.json 이 가짐(2026-11-04 다시 짬):
     beds  자리 — {이름:{y:[위,아래], x:[[왼,오른]…], persp:원근 여부, skirt:[그 자리에 까는 덮개]}}  예) 땅·물속 바닥·물낯·물가 둑·흙 속·하늘
     items 요소 — {이름:{real:[m,m], bed:놓일 자리, role:'big'|'frame', base·foot(그림의 실제 밑동 — tools/stage-meta.py가 잼)}}
   → 요소는 제 자리에만 놓이고(물풀이 공중에 뜨거나 땅 요소가 물에 서지 않음), 밑동이 그 자리의 땅·바닥·물낯에 정확히 닿음.
   쓰는 법
     const pl = await Stage.load('nature/desert');
     const lay = Stage.compose(pl, {seed: 7});          // 무작위(같은 seed면 같은 장면) · {fixed:[{id,x,y,r,flip}]} · {avoid:[[x0,y0,x1,y1]…], min:0}
     Stage.add(pl, lay, {src, real, x, y, w, h, bed});   // 동물도 같은 규칙으로(real이면 그 깊이의 원근 크기)
     Stage.render(div, pl, lay, {shadow:.28, haze:.3});  // look: layer·bg·zOf·farZ·frontZ·front·skirt·showBeds
   좌표 x·y는 장면 대비 0~1, y는 밑동(땅에 닿는 곳). 모듈은 동작만, 얼굴(그림자 세기·흐림)은 앱이 넘겨 줌. */
(function (G) {
  const BASE = 'https://shim-sung-hyun.github.io/web_app/media/stage/';
  const rnd = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const img = src => new Promise(ok => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  async function load(id, opt = {}) {
    const base = opt.base || BASE, dir = base + id + '/';
    const cfg = await fetch(dir + 'stage.json', {cache: 'no-cache'}).then(r => r.json());
    const pl = Object.assign({id, dir, horizon: .35, groundTop: .36, unit: .22}, cfg);
    if (!pl.beds) pl.beds = {ground: {y: [pl.groundTop, 1], persp: true, skirt: pl.skirt || []}};
    const bed0 = Object.keys(pl.beds)[0];
    const jobs = [img(dir + (opt.bg || 'bg') + '.jpg').then(i => pl.bgImg = i)];
    for (const [k, it] of Object.entries(pl.items || {})) {
      it.id = k; it.bed = pl.beds[it.bed] ? it.bed : bed0; it.src = (it.from ? base + it.from + '/' : dir) + 'items/' + k + '.webp';
      jobs.push(img(it.src).then(i => { it.img = i; if (i) { it.w = i.naturalWidth; it.h = i.naturalHeight; } }));
    }
    for (const f of pl.front || []) { f.srcUrl = dir + 'front/' + f.src + '.webp'; jobs.push(img(f.srcUrl).then(i => f.img = i)); }
    for (const f of pl.far || []) { f.srcUrl = dir + 'far/' + f.src + '.webp'; jobs.push(img(f.srcUrl).then(i => f.img = i)); }
    pl.skirtImg = {};
    const sk = new Set(Object.values(pl.beds).flatMap(b => b.skirt || []));
    Object.values(pl.items || {}).forEach(i => Array.isArray(i.skirt) && i.skirt.forEach(k => sk.add(k)));
    for (const k of sk) jobs.push(img(dir + 'skirt/' + k + '.webp').then(i => { if (i) pl.skirtImg[k] = i; }));
    await Promise.all(jobs);
    for (const k of Object.keys(pl.items || {})) if (!pl.items[k].img) delete pl.items[k];
    return pl;
  }

  /* 그 자리에서 1m가 장면 높이의 몇 몫인가. 원근 자리(땅·바닥)는 지평선에서 내려온 만큼에 비례, 아니면(물낯·흙 속·하늘) 어디서나 같음 */
  const perM = (pl, y, bed) => {
    const b = typeof bed === 'string' ? pl.beds[bed] : bed;
    if (b && b.persp === false) return b.unit || pl.unit;
    return pl.unit * Math.max(.04, (y - pl.horizon) / (1 - pl.horizon));
  };
  const inX = (b, x) => !b.x || b.x.some(r => x >= r[0] && x <= r[1]);
  const inAvoid = (pl, x, y) => (pl.avoid || []).some(r => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]);

  function pickSkirt(pl, it, r) {
    if (it.skirt === false) return null;
    const list = (Array.isArray(it.skirt) ? it.skirt : (pl.beds[it.bed] || {}).skirt || []).filter(k => pl.skirtImg[k]);
    return list.length ? list[Math.floor(((r * 7919) % 1) * list.length)] : null;
  }

  /* 하나 놓기: 실제 높이(m)와 밑동 자리로 크기를 셈. base = 그림 높이 중 밑동 줄의 몫(그 아래는 투명 여백) */
  function place(pl, it, x, y, r, flip, extra) {
    const realH = Array.isArray(it.real) ? it.real[0] + (it.real[1] - it.real[0]) * r : (it.real || 1);
    const base = it.base ?? 1;
    const h = realH * perM(pl, y, it.bed) / base * (it.scale || 1);
    const w = h * (it.w / it.h) * .75;   // 장면이 4:3
    return Object.assign({id: it.id, src: it.src, bed: it.bed, x, y, w, h, base, flip: !!flip, foot: it.foot || [.2, .8], skirt: pickSkirt(pl, it, r)}, extra || {});
  }

  /* 무작위 배치: 자리마다 그 자리의 요소만. 고르게 흩뿌리지 않고 2~4 덩어리(큰 것 하나 + 앞쪽 작은 것) + 빈 땅 */
  function compose(pl, opt = {}) {
    if (opt.fixed) return opt.fixed.map(f => place(pl, pl.items[f.id], f.x, f.y, f.r ?? .5, f.flip));
    const R = rnd(opt.seed ?? Math.floor(Math.random() * 1e9)), pick = a => a[Math.floor(R() * a.length)];
    const items = Object.values(pl.items || {}), out = [];
    const byBed = {}; items.forEach(i => { if (i.role !== 'frame') (byBed[i.bed] = byBed[i.bed] || []).push(i); });
    const beds = Object.keys(byBed);
    if (!beds.length) return out;
    const spot = (b, it, near) => {   // 그 자리 안의 x·y (it.ground: 자리 위아래 범위 중 놓일 몫)
      const B = pl.beds[b], g = it.ground || [0, 1], y0 = B.y[0] + (B.y[1] - B.y[0]) * g[0], y1 = B.y[0] + (B.y[1] - B.y[0]) * g[1];
      for (let t = 0; t < 20; t++) {
        const x = near ? clamp(near.x + (R() - .5) * near.w * 1.4, .03, .97) : (B.x ? (r => r[0] + (r[1] - r[0]) * R())(pick(B.x)) : .04 + R() * .92);
        const y = near ? clamp(near.y + .01 + R() * .05, y0, y1) : y0 + (y1 - y0) * R();
        if (inX(B, x) && !inAvoid(pl, x, y)) return {x, y};
      }
      return null;
    };
    const clash = p => out.some(o => o.bed === p.bed && Math.abs(o.x - p.x) < (o.w + p.w) * .3 && Math.abs(o.y - p.y) < .04);
    const n = opt.clusters ?? (2 + Math.floor(R() * 3));
    for (let c = 0; c < n; c++) {
      const b = pick(beds.filter(k => pl.beds[k].persp !== false || pl.beds[k].y[1] - pl.beds[k].y[0] > .1)) || pick(beds);
      const list = byBed[b], big = list.filter(i => i.role === 'big'), small = list.filter(i => i.role !== 'big');
      const lead = big.length && R() < .75 ? pick(big) : pick(small.length ? small : big);
      const s = spot(b, lead); if (!s) continue;
      const L = place(pl, lead, s.x, s.y, R(), lead.flip !== false && R() < .5); if (clash(L)) continue; out.push(L);
      for (let j = 0, k = Math.floor(R() * 3); j < k && small.length; j++) {
        const it = pick(small), s2 = spot(b, it, L); if (!s2) continue;
        const p = place(pl, it, s2.x, s2.y, R() * .7, it.flip !== false && R() < .5); if (!clash(p)) out.push(p);
      }
    }
    const loose = opt.loose ?? (1 + Math.floor(R() * 3));   // 덩어리 밖 작은 것, 물낯·하늘 같은 얇은 자리의 것도 여기서
    for (let j = 0, t = 0; j < loose && t < 30; t++) {
      const b = pick(beds), it = pick(byBed[b].filter(i => i.role !== 'big').length ? byBed[b].filter(i => i.role !== 'big') : byBed[b]), s = spot(b, it);
      if (!s) continue; const p = place(pl, it, s.x, s.y, R() * .6, R() < .5); if (!clash(p)) { out.push(p); j++; }
    }
    const frame = items.filter(i => i.role === 'frame');   // 가까운 줄기: 화면 가장자리, 위는 화면 밖
    if (frame.length && R() < (opt.frame ?? .5)) {
      const it = pick(frame), left = R() < .5, p = place(pl, it, 0, .9 + R() * .08, R(), !left);
      p.h = 1.08 + R() * .12; p.w = p.h * (it.w / it.h) * .75; p.x = left ? -p.w * .15 : 1 + p.w * .15; out.push(p);
    }
    if (opt.avoid && opt.avoid.length) {
      const hit = o => opt.avoid.some(r => o.x + o.w / 2 > r[0] && o.x - o.w / 2 < r[2] && o.y > r[1] && o.y - o.h * o.base < r[3]);
      for (let i = out.length - 1; i >= 0; i--) if (hit(out[i])) out.splice(i, 1);
      if (opt.min === 0) return out;
    }
    if ((opt._t || 0) < 5 && out.filter(o => o.h > .06).length < 2)
      return compose(pl, Object.assign({}, opt, {seed: (opt.seed ?? Math.floor(R() * 1e9)) + 1, _t: (opt._t || 0) + 1}));
    return out;
  }

  /* 동물·앱 소품을 같은 규칙으로. real(m)을 주면 그 자리·깊이의 크기로, 아니면 sw·sh(장면 대비)를 그대로 */
  function add(pl, lay, a) {
    const it = {id: a.name || 'actor', src: a.src, real: a.real || 1, w: a.w || 1, h: a.h || 1, base: a.base, foot: a.foot, bed: a.bed || Object.keys(pl.beds)[0], skirt: a.skirt ? undefined : false};
    const p = a.real ? place(pl, it, a.x, a.y, .5, a.flip, {actor: true, el: a.el})
      : {id: it.id, src: a.src, bed: it.bed, x: a.x, y: a.y, w: a.sw, h: a.sh, base: a.base ?? 1, flip: !!a.flip, foot: a.foot || [.2, .8], skirt: null, actor: true, el: a.el};
    lay.push(p); return p;
  }

  function render(box, pl, lay, look = {}) {
    const sh = look.shadow ?? .28, hz = look.haze ?? .3;
    box.innerHTML = '';
    if (!look.layer) { box.style.position = 'relative'; box.style.aspectRatio = box.style.aspectRatio || '4 / 3'; box.style.overflow = 'hidden'; }
    const mk = (tag, css) => { const e = document.createElement(tag); e.style.cssText = 'position:absolute;pointer-events:none;' + css; box.appendChild(e); return e; };
    const fog = far => `saturate(${1 - .4 * hz * far}) brightness(${1 + .12 * hz * far}) contrast(${1 - .25 * hz * far})`;
    if (pl.bgImg && look.bg !== false) { const b = mk('img', 'left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0'); b.src = pl.bgImg.src; b.alt = ''; }
    for (const f of pl.far || []) if (f.img) {   // 먼 띠: 밑동이 지평선에, 모든 요소 뒤
      const h = f.h || .08, y = f.y ?? pl.horizon + .01, e = mk('img', `left:-1%;width:102%;top:${(y - h * (f.base || 1)) * 100}%;height:${h * 100}%;z-index:${look.farZ ?? 2};object-fit:fill;filter:${fog(1)}`); e.src = f.srcUrl; e.alt = '';
    }
    if (look.showBeds) Object.entries(pl.beds).forEach(([k, b]) => (b.x || [[0, 1]]).forEach(r => {
      const e = mk('div', `left:${r[0] * 100}%;width:${(r[1] - r[0]) * 100}%;top:${b.y[0] * 100}%;height:${Math.max(.004, b.y[1] - b.y[0]) * 100}%;z-index:8000;outline:2px dashed rgba(200,40,40,.8);background:rgba(255,255,255,.08);font:12px sans-serif;color:#a00`); e.textContent = b.name || k; }));
    const order = lay.slice().sort((a, b) => a.y - b.y);
    order.forEach((o, i) => {
      const z = look.zOf ? look.zOf(o, i) : 10 + i * 2;
      const B = pl.beds[o.bed] || {}, far = B.persp === false ? 0 : clamp(1 - (o.y - pl.horizon) / (1 - pl.horizon), 0, 1);
      const top = o.y - o.h * o.base, left = o.x - o.w / 2, fx = f => o.x + (o.flip ? -1 : 1) * o.w * (f - .5);
      const footL = Math.min(fx(o.foot[0]), fx(o.foot[1])), footR = Math.max(fx(o.foot[0]), fx(o.foot[1]));
      if (B.persp !== false && sh > 0 && !o.noShadow) {   // 땅에 닿는 옅은 그림자(같은 방향·진하기)
        const fw = (footR - footL) * 1.1, fh = Math.max(.006, fw * .16);
        mk('div', `left:${((footL + footR) / 2 - fw / 2) * 100}%;top:${(o.y - fh * .55) * 100}%;width:${fw * 100}%;height:${fh * 100}%;z-index:${z - 1};border-radius:50%;background:radial-gradient(closest-side,rgba(40,28,14,${sh}),rgba(40,28,14,0))`);
      }
      const e = o.el || document.createElement('img');
      if (!o.el) { e.src = o.src; e.alt = ''; e.draggable = false; }
      e.style.cssText += `;position:absolute;left:${left * 100}%;top:${top * 100}%;width:${o.w * 100}%;height:${o.h * 100}%;z-index:${z};transform:${o.flip ? 'scaleX(-1)' : 'none'};` + (o.actor ? '' : `filter:${fog(far)};pointer-events:none;`);
      box.appendChild(e); o.z = z;
      const si = o.skirt && pl.skirtImg[o.skirt];
      if (si && look.skirt !== false && o.h > .05) {   // 밑동 덮개: 덮개의 밑동 줄을 요소의 밑동 줄에 맞춰 땅에 붙임
        const m = (pl.skirtMeta || {})[o.skirt] || {base: 1, foot: [0, 1]}, vis = Math.max(.2, m.foot[1] - m.foot[0]);
        const ks = o.skirtScale || 1;   // 앱·선생님이 바꾼 덮개 배율
        let sw = (footR - footL) * 1.3 * ks / vis, shh = sw * (si.naturalHeight / si.naturalWidth) * 4 / 3;
        const cap = o.h * o.base * .16 * ks; if (shh * m.base > cap) { const k = cap / (shh * m.base); sw *= k; shh *= k; }
        const cx = (footL + footR) / 2 - sw * ((m.foot[0] + m.foot[1]) / 2 - .5);
        const k = mk('img', `left:${(cx - sw / 2) * 100}%;top:${(o.y + o.h * .004 - shh * m.base) * 100}%;width:${sw * 100}%;height:${shh * 100}%;z-index:${z + 1};filter:${fog(far)}`); k.src = si.src; k.alt = ''; o.skirtAt = [cx, o.y - shh * m.base * .45];   // 덮개 가운데(앱이 표시할 때)
      }
    });
    if (look.front !== false) for (const f of pl.front || []) if (f.img) {
      const h = f.h || .12, e = mk('img', `left:-1%;width:102%;top:${(1 - h * (f.base || 1)) * 100}%;height:${h * 100}%;z-index:${look.frontZ ?? 9000};object-fit:fill`); e.src = f.srcUrl; e.alt = '';
    }
    return order;
  }

  G.Stage = {load, compose, add, render, perM, place, BASE};
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* 무작위 네 판을 나란히 그려 본다. 판 아래 번호(seed)를 적어 두면 같은 장면을 다시 볼 수 있음: test.html#nature/desert/123 */
const $=id=>document.getElementById(id); let pl=null, seeds=[];
async function start(){
  const idx=await fetch('index.json',{cache:'no-cache'}).then(r=>r.json());
  for(const [k,v] of Object.entries(idx)) $('pl').add(new Option(v.name+' · '+k+(v.ready?'':' (그림 기다림)'),k));
  const h=location.hash.slice(1).split('/'); if(h.length>=2) $('pl').value=h[0]+'/'+h[1];
  if(h[2]) seeds=[+h[2]];
  $('pl').onchange=()=>{seeds=[];open()};
  $('mv').oninput=()=>{ $('mvHelp').style.display=$('mv').checked?'':'none'; $('grid').style.cursor=$('mv').checked?'grab':''; $('grid').classList.toggle('moving',$('mv').checked); };
  $('nb').oninput=()=>$('grid').classList.toggle('hideNo',!$('nb').checked);
  $('placeNote').oninput=()=>note($('pl').value+'/all',$('placeNote').value);
  $('copyBtn').onclick=async()=>{ const t=gather(); if(!t){ $('copied').textContent='쓴 멘트가 없어요'; return; }
    try{ await navigator.clipboard.writeText(t); $('copied').textContent='복사했어요 — 이 대화에 붙여 넣으세요'; }
    catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); $('copied').textContent='복사했어요 — 이 대화에 붙여 넣으세요'; } }; $('again').onclick=()=>{seeds=[];draw()};
  for(const id of ['sh','hz','fr','bd']) $(id).oninput=()=>draw(true);
  open();
}
async function open(){ $('msg').textContent='읽는 중…'; $('placeNote').value=note($('pl').value+'/all'); pl=await Stage.load($('pl').value,{base:'./'}); draw(); }
const LEG={};
function note(k,v){ try{ const all=JSON.parse(localStorage.getItem('stageNotes')||'{}'); if(v===undefined) return all[k]||''; if(v) all[k]=v; else delete all[k]; localStorage.setItem('stageNotes',JSON.stringify(all)); }catch(e){ return ''; } }
/* 멘트 모아 복사: 이 대화(Claude)에 붙여 넣을 글 — 장소·판 번호·번호표·멘트. 판 번호로 같은 장면을 다시 띄워 고침 */
function gather(){ let out=[];
  let all={}; try{ all=JSON.parse(localStorage.getItem('stageNotes')||'{}'); }catch(e){}
  Object.keys(all).sort().forEach(k=>{ const [g,place,seed]=k.split('/'); const id=g+'/'+place;
    if(seed==='all') out.push(`■ ${id} 전체: ${all[k]}`);
    else out.push(`■ ${id} 판 ${seed}${LEG[seed]?'\n  번호표: '+LEG[seed].join(' · '):''}\n  멘트: ${all[k]}`); });
  Object.values(FIG).forEach(F=>{ const ch=changes(F.s); if(!ch.length) return;
    out.push(`■ ${pl.id} 판 ${F.s} — 선생님이 옮긴 것\n  번호표: ${LEG[F.s].join(' · ')}\n  `+ch.join('\n  ')); });
  return out.length?'[무대 시험 멘트]\n※ 위치 이동은 멘트에 따로 적용 요청이 있을 때만 반영해 주세요. 위치 수치는 측정 참고용입니다.\n'+out.join('\n'):''; }
/* 옮기기: 소품과 밑동 덮개를 독립된 요소로 재고, 옮긴 값은 복사 멘트에 함께 넣음. */
const FIG={};
const look=()=>({shadow:+$('sh').value,haze:+$('hz').value,front:$('fr').checked,showBeds:$('bd').checked});
const nm=o=>(pl.items[o.id]||{}).name||o.id, skn=k=>((pl.skirtMeta||{})[k]||{}).name||k, f2=v=>v.toFixed(2);
function makeSkirt(owner,key,no){
  const img=pl.skirtImg[key]; if(!img) return null;
  const m=(pl.skirtMeta||{})[key]||{base:1,foot:[0,1]}, vis=Math.max(.2,m.foot[1]-m.foot[0]);
  const fx=f=>owner.x+(owner.flip?-1:1)*owner.w*(f-.5);
  const footL=Math.min(fx(owner.foot[0]),fx(owner.foot[1])), footR=Math.max(fx(owner.foot[0]),fx(owner.foot[1]));
  let w=(footR-footL)*1.3/vis, h=w*(img.naturalHeight/img.naturalWidth)*4/3;
  const cap=owner.h*owner.base*.16;
  if(h*m.base>cap){ const ratio=cap/(h*m.base); w*=ratio; h*=ratio; }
  const skirt={kind:'skirt',no,owner,key,img,x:(footL+footR)/2-w*((m.foot[0]+m.foot[1])/2-.5),y:owner.y+owner.h*.004,w,h,base:m.base,gone:false};
  skirt.orig={x:skirt.x,y:skirt.y,w:skirt.w,h:skirt.h,key};
  return skirt;
}
function setSkirt(F,owner,key){
  owner.skirt=key;
  let skirt=F.skirts.find(o=>o.owner===owner&&!o.gone);
  if(!key){ if(skirt) skirt.gone=true; return; }
  if(skirt) skirt.gone=true;
  skirt=makeSkirt(owner,key,F.lay.length+F.skirts.length+1);
  if(skirt) F.skirts.push(skirt);
}
function paint(s){ const F=FIG[s], d=F.d, lay=F.lay.filter(o=>!o.gone);
  const skirts=F.skirts.filter(o=>!o.gone), all=[...lay,...skirts].sort((a,b)=>a.y-b.y), rank=new Map(all.map((o,i)=>[o,20+i*4]));
  Stage.render(d,pl,lay,{...look(),skirt:false,zOf:o=>rank.get(o)});
  all.filter(o=>o.kind==='skirt').forEach(o=>{
    const img=document.createElement('img'); img.className='st-cover'; img.src=o.img.src; img.alt='';
    const bed=pl.beds[o.owner.bed]||{}, far=bed.persp===false?0:Math.max(0,Math.min(1,1-(o.y-pl.horizon)/(1-pl.horizon))), hz=+$('hz').value;
    img.style.cssText=`position:absolute;left:${(o.x-o.w/2)*100}%;top:${(o.y-o.h*o.base)*100}%;width:${o.w*100}%;height:${o.h*100}%;z-index:${rank.get(o)+2};filter:saturate(${1-.4*hz*far}) brightness(${1+.12*hz*far}) contrast(${1-.25*hz*far});pointer-events:none`;
    d.appendChild(img);
  });
  all.forEach(o=>{ const b=document.createElement('div'); b.className='no'+(o.kind==='skirt'?' sk':'')+(F.sel===o?' sel':''); b.dataset.no=o.no; b.textContent=o.no;
    b.style.left=Math.max(2,Math.min(98,o.x*100))+'%'; b.style.top=Math.max(4,(o.y-o.h*o.base*.92)*100)+'%'; d.appendChild(b); });
  LEG[s]=lay.map(o=>`${o.no} ${nm(o)}(${o.id}·${(pl.beds[o.bed]||{}).name||o.bed})`).concat(skirts.map(o=>`${o.no} 덮개 ${skn(o.key)}(${o.key}·처음 ${o.owner.no}번 밑)`));
  F.c.innerHTML=`판 <a href="#${pl.id}/${s}" style="color:inherit">${s}</a> · `+LEG[s].join(' · ');
  const ch=changes(s); if(ch.length) F.c.innerHTML+=`<br><b>옮긴 것</b>: `+ch.join(' · '); }
function changes(s){ const F=FIG[s]; if(!F) return []; const out=[];
  F.lay.forEach(o=>{ const g=o.orig, w=[];
    if(o.gone){ out.push(`${o.no} ${nm(o)}: 뺌`); return; }
    if(Math.abs(o.x-g.x)>.005||Math.abs(o.y-g.y)>.005) w.push(`자리 (${f2(g.x)}, ${f2(g.y)}) → (${f2(o.x)}, ${f2(o.y)})`);
    if(Math.abs((o.kk||1)-1)>.01) w.push(`크기 ×${f2(o.kk)}(원근과 따로)`);
    if(o.flip!==g.flip) w.push('좌우 뒤집음');
    if(o.skirt!==g.skirt) w.push(`덮개 종류 ${g.skirt?skn(g.skirt):'없음'} → ${o.skirt?skn(o.skirt):'없음'}`);
    if(w.length) out.push(`${o.no} ${nm(o)}: `+w.join(', ')); });
  F.skirts.forEach(o=>{ const g=o.orig, w=[];
    if(o.gone){ if(!g.gone) out.push(`${o.no} 덮개 ${skn(g.key)}: 뺌`); return; }
    if(Math.abs(o.x-g.x)>.005||Math.abs(o.y-g.y)>.005) w.push(`자리 (${f2(g.x)}, ${f2(g.y)}) → (${f2(o.x)}, ${f2(o.y)})`);
    const scale=o.w/g.w; if(Math.abs(scale-1)>.01) w.push(`크기 ×${f2(scale)}`);
    if(o.key!==g.key) w.push(`종류 ${skn(g.key)} → ${skn(o.key)}`);
    if(w.length) out.push(`${o.no} 덮개 ${skn(o.key)}: `+w.join(', ')); });
  return out; }
/* 그 깊이의 원근 크기 × 선생님이 바꾼 배율 */
function resize(o){ if(!o.k0){ o.k0=o.orig.h/Stage.perM(pl,o.orig.y,o.bed); o.ar=o.w/o.h; }
  o.h=o.k0*(o.kk||1)*Stage.perM(pl,o.y,o.bed); o.w=o.h*o.ar; }
function hit(F,fx,fy){ const L=[...F.lay.filter(o=>!o.gone),...F.skirts.filter(o=>!o.gone)].sort((a,b)=>b.y-a.y);
  return L.find(o=>fx>=o.x-o.w/2&&fx<=o.x+o.w/2&&fy>=o.y-o.h*o.base&&fy<=o.y+.01); }
function wire(s){ const F=FIG[s], d=F.d; let drag=null;
  const at=e=>{ const r=d.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  d.addEventListener('pointerdown',e=>{ if(!$('mv').checked) return; const [fx,fy]=at(e), label=e.target.closest('.no');
    const o=label?[...F.lay,...F.skirts].find(x=>x.no===+label.dataset.no):hit(F,fx,fy); SEL=F.sel=o||null; Object.values(FIG).forEach(G=>{ if(G!==F&&G.sel){ G.sel=null; paint(G.s); } });
    if(o){ const now=Date.now(); if(o.kind!=='skirt'&&F.last&&F.last.o===o&&now-F.last.t<380){ o.flip=!o.flip; F.last=null; paint(s); return; } F.last={o,t:now};   /* 두 번 누름 = 뒤집기(다시 그려도 알아채게 직접 셈) */
      drag={o,dx:fx-o.x,dy:fy-o.y}; d.setPointerCapture(e.pointerId); e.preventDefault(); } paint(s); });
  d.addEventListener('pointermove',e=>{ if(!drag) return; const [fx,fy]=at(e), o=drag.o; o.x=Math.max(0,Math.min(1,fx-drag.dx)); o.y=Math.max(.02,Math.min(1,fy-drag.dy)); if(o.kind!=='skirt') resize(o); paint(s); });
  d.addEventListener('pointerup',()=>{ drag=null; });
  d.addEventListener('wheel',e=>{ if(!$('mv').checked) return; const [fx,fy]=at(e), label=e.target.closest('.no');
    const o=label?[...F.lay,...F.skirts].find(x=>x.no===+label.dataset.no):hit(F,fx,fy)||F.sel; if(!o) return; e.preventDefault();
    const k=e.deltaY<0?1.06:1/1.06;
    if(o.kind==='skirt'){ o.w*=k; o.h*=k; }
    else { o.kk=(o.kk||1)*k; resize(o); }
    paint(s); },{passive:false});
}
let SEL=null;
document.addEventListener('keydown',e=>{ if(!SEL||!$('mv').checked||/TEXTAREA|INPUT|SELECT/.test(e.target.tagName)) return;
  const F=Object.values(FIG).find(G=>G.sel===SEL); if(!F) return; const o=SEL;
  if(e.key==='Delete'||e.key==='Backspace'){ o.gone=true; SEL=F.sel=null; }
  else if(e.key==='k'||e.key==='K'){ const owner=o.kind==='skirt'?o.owner:o, L=((pl.beds[owner.bed]||{}).skirt||[]).filter(k=>pl.skirtImg[k]); if(L.length) setSkirt(F,owner,L[(L.indexOf(owner.skirt)+1)%L.length]); }
  else if(e.key==='n'||e.key==='N'){ if(o.kind==='skirt'){ o.gone=true; o.owner.skirt=null; } else setSkirt(F,o,null); }
  else return;
  e.preventDefault(); paint(F.s); });
function draw(keep){
  const n=Object.keys(pl.items||{}).length;
  $('msg').textContent=(pl.bgImg?'':'배경 없음 · ')+'요소 '+n+'개'+(n?'':' — 아직 그림을 받기 전');
  if(!keep||!seeds.length) seeds=seeds.length===1?seeds:[...Array(4)].map(()=>Math.floor(Math.random()*1e5));
  if(keep&&seeds.every(s=>FIG[s])){ seeds.forEach(paint); return; }   /* 그림자·띠 등만 바꿀 때는 옮긴 것을 지키며 다시 그림 */
  $('grid').innerHTML=''; for(const k in FIG) delete FIG[k]; SEL=null;
  for(const s of seeds){
    const f=document.createElement('figure'), d=document.createElement('div'), c=document.createElement('figcaption');
    d.className='st'; f.append(d,c); $('grid').append(f);
    const lay=Stage.compose(pl,{seed:s}).sort((a,b)=>a.x-b.x), skirts=[];   /* 번호는 왼쪽부터, 옮겨도 그대로 */
    lay.forEach((o,i)=>{ o.no=i+1; o.orig={x:o.x,y:o.y,h:o.h,flip:o.flip,skirt:o.skirt}; });
    lay.forEach(o=>{ if(o.skirt){ const skirt=makeSkirt(o,o.skirt,lay.length+skirts.length+1); if(skirt) skirts.push(skirt); } });
    FIG[s]={s,d,c,lay,skirts,sel:null}; wire(s); paint(s);
    const t=document.createElement('textarea'); t.placeholder='이 판에 대한 멘트(번호로: 예) 3번이 너무 큼, 5번은 물가에 있어야 함)'; t.value=note(pl.id+'/'+s);
    t.oninput=()=>note(pl.id+'/'+s,t.value); f.append(t);
  }
}
start();
</script>
</body></html>
