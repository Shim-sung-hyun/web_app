<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[차름 과학] 동물원 2편 · 동물 다섯 고개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 차름 동물원 2편 — 동물 다섯 고개 (009). 과학 영역: 보라. 뼈대는 1편(008)과 같음 */
:root{
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sci:#6A4C9C; --sci-d:#4E3478; --sci-l:#EEE8F6; --sci-m:#C9BCE0;
  --bg:#F7F4FA; --card:#FFFFFF; --ink:#2B2838; --muted:#6B6777; --line:#E2DCEB;
  --bubble:#EAF3FC; --bubble-b:#BCD6EF; --ok:#3E8E63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.setup{overflow:auto}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== 설정 화면 ===== */
#setupView{min-height:100%;padding:28px 16px 0;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12px 12px, rgba(106,76,156,.07) 2px, transparent 2.5px);background-size:28px 28px}
body:not(.setup) #setupView{display:none}
.wrap{max-width:900px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:var(--sci-d);line-height:1.1}
.title h1 small{display:block;font-size:24px;color:var(--sci);margin-top:4px;letter-spacing:.01em}
.title h1 small.kick{font-size:20px;margin:0 0 4px}
.title .mark{width:40px;height:40px}
.title .mark{display:flex;flex-direction:column;width:34px;height:34px;border-radius:9px;overflow:hidden;border:2px solid var(--sci-d)}
.title .mark i{flex:1}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,40,100,.04);transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--sci-m)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:var(--sci);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:400;font-size:18px;
  box-shadow:inset 0 0 0 3px var(--sci),inset 0 0 0 5px #fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--sci);border-color:var(--sci);color:#fff}
.chip.add{border-style:dashed;color:var(--sci)}
.lv{flex:1 1 220px;text-align:left;padding:12px 14px;min-height:74px}
.lv b{display:block;font-size:17px;margin-bottom:3px}
.lv span{font-size:13.5px;opacity:.85}
.mode{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.mode .chip{min-width:110px}
.pickNote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.pickWarn{font-size:14px;color:#9A3328;margin:8px 0 0;font-weight:700}
.bd .ord{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--sci);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:6px}
.plc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.plc button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;text-align:center;font-weight:700;font-size:16px}
.plc button img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}
.plc button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.plc button.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.agrp{margin-top:12px}
.agrp h4{margin:0 0 6px;font-size:15px;color:var(--sci-d);display:flex;align-items:center;gap:8px}
.agrp h4 img{width:44px;height:33px;object-fit:cover;border-radius:6px}
.agrp .row{gap:6px}
.achip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:3px 10px 3px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;font-family:inherit}
.achip img{width:36px;height:36px;object-fit:contain}
.achip.on{border-color:var(--sci);background:var(--sci);color:#fff}
.achip:disabled{opacity:.35;cursor:default}
.today .plan{flex:1 1 100%}
.today .plan h4{margin:0 0 6px;font-size:15px;color:var(--sci-d)}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.bd{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bd.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.bd .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.bd .bh em{font-style:normal;font-weight:500;font-size:12px;color:var(--sci-d);background:var(--sci-l);padding:2px 8px;border-radius:8px}
.bd .pl{font-size:13px;color:var(--muted)}
.bd .an{display:flex;flex-wrap:wrap;gap:2px}
.bd .an img{width:34px;height:34px;object-fit:contain}
.bd .done{font-size:12px;color:var(--ok)}
.today{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.today .places{display:flex;gap:10px;flex-wrap:wrap}
.today .pl1{width:120px;text-align:center;font-size:14px;font-weight:700}
.today .pl1 img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:4px}
.today .pl1 .ans{display:flex;justify-content:center;flex-wrap:wrap}
.today .pl1 .ans img{width:34px;height:34px;border:0;object-fit:contain;margin:0}
.steps{font-size:14px;color:var(--muted);line-height:1.7}
.resume{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #EBD9A6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 4px}
details.more .card{margin-top:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.opt>span{min-width:120px;color:var(--muted)}
.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:10px}
.startBar{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(to top,var(--bg) 70%,rgba(247,244,250,0));display:flex;justify-content:center;gap:12px;z-index:5}
#startBtn{min-width:260px;height:62px;border-radius:18px;border:0;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(78,52,120,.25)}
.linkish{background:none;border:0;color:var(--sci-d);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.newStu{display:flex;gap:8px;margin-top:10px}
.newStu input{flex:1;max-width:260px;height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit}

/* ===== 학생 화면 ===== */
#game{position:fixed;inset:0;background:#FBFAF7;display:none;user-select:none;-webkit-user-select:none}
body:not(.setup) #game{display:block}
body.admin #stage{pointer-events:none}
#prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#prog i{display:block;width:44px;height:8px;border-radius:4px;background:#E6E1EC}
#prog i.d{background:#C9BCE0}#prog i.n{background:var(--sci)}
#prog.bar{width:min(520px,70vw);height:8px;border-radius:4px;background:#E6E1EC;overflow:hidden;gap:0}
#prog.bar b{display:block;height:100%;background:linear-gradient(90deg,#C9BCE0 0 calc(100% - 10px),var(--sci) 0);border-radius:4px;transition:width .4s}
#stage{position:absolute;inset:36px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:20px 16px 8px}   /* 그림·글은 빈 곳의 위아래 가운데(조금 아래로, 뜬 느낌 없게) */
.recDot{position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:#D24B3E;opacity:.75;z-index:4}

/* 견본 말풍선 */
.bubble{position:relative;background:var(--bubble);border:2px solid var(--bubble-b);border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:16px solid var(--bubble-b);border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--bubble);border-bottom:0;z-index:1}
.bubble img.a{display:block;object-fit:contain}
/* 보기 카드: 모두 같은 크기·같은 테두리 */
.opts{display:flex;justify-content:center;align-items:flex-start;gap:2.2vw}
.ac{background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:10px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s}
.ac img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.fadeIn{opacity:0}
.glow{border-color:#E8B84A!important;box-shadow:0 0 0 6px rgba(232,184,74,.35)}
.right{border-color:var(--ok)!important}
/* ===== 학생 화면: 고개 말풍선 · 들은 고개 · 동물 카드 ===== */
.bubble.hint{min-width:min(520px,86vw);max-width:94vw;min-height:80px;padding:12px 28px;gap:16px}
.bubble.hint .hi{display:none;width:78px;height:58px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.bubble.hint .hi.food{object-fit:contain;background:#fff}
.bubble.hint .ht{font-family:var(--f-display);font-size:clamp(24px,3.4vw,44px);line-height:1.25;color:var(--ink);text-align:center}
.bubble.hint.name .ht{color:var(--sci-d)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;min-height:30px;max-width:94vw}
.chip1{font-size:clamp(13px,1.5vw,17px);padding:4px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--sci-m);color:var(--sci-d);line-height:1.3}
.chip1.now{background:var(--sci-l);border-color:var(--sci)}
.ac{position:relative}
.ac.out{opacity:.16!important;pointer-events:none}
.ac.done{opacity:.5}
.ac.done::after{content:"✓";position:absolute;right:8px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;font-size:19px;line-height:32px;text-align:center}
/* 고개 장면(중·상): 배경이 깔리고, 그림자·부위가 쌓이다가 맞히면 동물이 나타남 */
.rscene{position:relative;flex:none;border-radius:18px;overflow:hidden;background:#EFEBE3;box-shadow:inset 0 0 0 2px #E2DCD0}
.rscene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.rscene>img.bg.on{opacity:1}
.rscene canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .7s ease}
.rscene canvas.on{opacity:1}
.rscene canvas.full{transition:opacity .45s ease,transform .45s ease;transform:scale(.97)}
.rscene canvas.full.on{transform:scale(1)}
.rscene .food{position:absolute;right:3%;top:4%;width:15%;aspect-ratio:1;object-fit:contain;opacity:0;transition:opacity .7s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.rscene .food.on{opacity:1}
.rscene .food+.food{right:20%}
.rscene .food+.food+.food{right:37%}
.answer{display:flex;gap:10px;align-items:center;justify-content:center}
.answer input{font-family:var(--f-display);font-size:clamp(24px,3vw,36px);width:min(360px,60vw);height:62px;border-radius:16px;border:2px solid var(--sci-m);padding:0 18px;text-align:center;color:var(--ink);background:#fff;outline:none}
.answer input:focus{border-color:var(--sci)}
.answer .pass{background:#fff;color:var(--sci-d);border:2px solid var(--sci-m);min-width:90px}
.answer button{height:62px;min-width:100px;border:0;border-radius:16px;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer}
.answer .micBtn{display:inline-flex;justify-content:center;min-width:180px;align-items:center;gap:8px;padding:0 20px 0 16px;background:#fff;color:var(--sci-d);border:2px solid var(--sci)}
.answer .micBtn svg{width:26px;height:26px;flex:0 0 auto}
.answer .micBtn.on{background:#3E8E63;border-color:#3E8E63;color:#fff;animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 7px rgba(62,142,99,.18)}}
.answer #tIn{font-family:var(--f-body);font-size:20px;width:min(240px,34vw);height:52px;border-width:1.5px;border-style:dashed}
.answer #tIn:focus{border-style:solid}
.answer .tOk{height:52px;min-width:72px;font-size:22px;background:var(--sci-m);color:var(--sci-d)}
.micNote{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin-top:6px}
/* 상 학습: 열 마리 카드 */
.lgrid{display:grid;justify-content:center}
.lcard{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:18px;padding:8px;cursor:pointer;touch-action:none}
.lcard img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.lcard.seen::after{content:"✓";position:absolute;right:6px;top:4px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font-size:17px;line-height:28px;text-align:center}
.lpanel{display:flex;gap:2.5vw;align-items:center;justify-content:center}
.lpanel .ac{flex:0 0 auto}
.facts{max-width:min(560px,50vw)}
.facts h3{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,52px);margin:0 0 10px;color:var(--sci-d)}
.facts p{margin:0 0 6px;font-size:clamp(18px,2.1vw,26px);line-height:1.45;opacity:.25;transition:opacity .4s}
.facts p.on{opacity:1}
.sumBar{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:72px}
.sumBtn{min-width:200px;height:68px;padding:0 26px;border-radius:18px;border:2px solid var(--sci);background:#fff;color:var(--sci-d);font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);cursor:pointer;touch-action:manipulation}
.sumBtn.go{background:var(--sci);color:#fff}
/* 놀이: 같은 동물 찾기 — 뒷면은 다섯 점 */
.mem{display:grid;justify-content:center}
.fc{position:relative;cursor:pointer;touch-action:none;perspective:900px}
.fc .in{position:absolute;inset:0;transition:transform .45s ease;transform-style:preserve-3d}
.fc.open .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc .back{background:var(--sci);border:3px solid var(--sci-d)}
.fc .back i{position:absolute;width:14%;aspect-ratio:1;border-radius:50%;background:#EEE8F6;transform:translate(-50%,-50%)}
.fc .back i:nth-child(1){left:30%;top:30%}.fc .back i:nth-child(2){left:70%;top:30%}.fc .back i:nth-child(3){left:50%;top:50%;background:#C9BCE0}
.fc .back i:nth-child(4){left:30%;top:70%}.fc .back i:nth-child(5){left:70%;top:70%}
.fc .front{background:#fff;border:3px solid #D8D3CC;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;padding:8%}
.fc .front img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.fc.got .front{border-color:var(--ok)}
@media (prefers-reduced-motion: reduce){.fc .in,.rscene canvas,.rscene>img.bg{transition:none}}
/* 오늘의 동물(설정) */
.pick{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.pick span{display:inline-flex;flex-direction:column;align-items:center;font-size:12.5px;color:var(--muted);width:58px}
.pick img{width:52px;height:52px;object-fit:contain}
.title svg.five{width:34px;height:34px;flex:0 0 auto}
#printArea{display:none}
@media print{body.sheet *{visibility:hidden!important}body.sheet #printArea,body.sheet #printArea *{visibility:visible!important}body.sheet #printArea{display:block;position:absolute;left:0;top:0;width:100%;font-family:'Noto Sans KR',sans-serif;color:#222}body.sheet #recView{display:none!important}}

/* ===== 관리 메뉴 ===== */
.dock{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:none;max-width:calc(100vw - 24px);
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(40,30,70,.15)}
body.admin .dock{display:block}
#dockTop{top:10px} #dockBot{bottom:12px;max-width:calc(100vw - 2*200px)}
@media (max-width:900px){ #dockBot{bottom:104px;max-width:calc(100vw - 24px)} }
.dock .rowx{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:7px 10px;scrollbar-width:none}
.dock .rowx::-webkit-scrollbar{display:none}
.dock .g{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding:0 8px;border-left:1px solid var(--line)}
.dock .g:first-child{border-left:0;padding-left:0}
.dock .lbl{font-size:12px;color:var(--muted);margin-right:2px;white-space:nowrap}
.dock button{flex:0 0 auto;min-height:42px;padding:5px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;touch-action:pan-x;white-space:nowrap}
.dock button.on{background:var(--sci);border-color:var(--sci);color:#fff}
.dock button.now{box-shadow:inset 0 -3px 0 var(--sci)}
.dock button.go{background:var(--sci-d);border-color:var(--sci-d);color:#fff;font-weight:700}
.dock button:disabled{opacity:.35;cursor:default}
#dockNote{margin:0 10px 7px;text-align:center;font-size:13px;color:#8A5A12;background:#FFF6E0;border-radius:10px;padding:4px 10px}
#dockNote:empty{display:none}

/* 기록 */
#recView{position:fixed;inset:0;z-index:90;background:rgba(30,24,44,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#recView.on{display:flex}
#recBox{background:#fff;border-radius:18px;max-width:900px;width:100%;padding:20px 22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#recBox h2{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#recBox h3{font-size:16px;margin:18px 0 8px;color:var(--sci-d)}
#recBox table{border-collapse:collapse;width:100%;font-size:14px}
#recBox th,#recBox td{border-bottom:1px solid #EEE;padding:6px 6px;text-align:left}
#recBox th{background:#F7F4FA;font-weight:700}
.bar100{display:inline-block;width:120px;height:9px;border-radius:5px;background:#EEE;vertical-align:middle;overflow:hidden;margin-right:6px}
.bar100 b{display:block;height:100%;background:var(--sci)}
.tip{font-size:13px;color:var(--muted);background:#F7F4FA;border-radius:10px;padding:10px 12px;line-height:1.7}
.sugg{background:#F1FAF4;border:1px solid #CFE7D8;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}

/* 도움말·빠뜨린 곳 */
#spot{position:fixed;z-index:2147480500;border:3px solid #D24B3E;border-radius:14px;pointer-events:none;display:none;box-shadow:0 0 0 4000px rgba(0,0,0,.18)}
#spotTip{position:fixed;z-index:2147480501;max-width:300px;background:#fff;border:1px solid #DDD;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#spotTip b{display:block;margin-bottom:2px}
#spotTip .k{color:var(--muted);font-size:12px;float:right}

/* 교사 버튼 (3초 누르기) — 공통 규격 */

'소':`*땅 위에 살아요.#h|*다리가 네 개예요.#p:legs|몸집이 커요.|*풀을 먹어요.#f:hay|농장에서 길러요.|먹은 풀을 다시 꺼내 씹어요.|*꼬리가 길고 끝에 털이 있어요.#p:tail|발굽이 두 갈래예요.|우유를 줘요.#p:udder|무리를 지어 살아요.|하루 내내 풀을 먹어요.|*몸에 검은 얼룩무늬가 있어요.#p:spots|옛날에는 밭을 가는 일을 도왔어요.|*머리에 작은 뿔이 있어요.#p:horns|아기는 송아지라고 불러요.|*송아지의 엄마예요.|*얼굴이 길어요.#p:head|고기와 가죽도 얻어요.|*이름은 한 글자예요.|*'음매' 하고 우는 농장 동물이에요.`,
'호랑이':`*땅 위에 살아요.#h|숲에 살아요.|*다리가 네 개예요.#p:legs|몸집이 커요.|*고기를 먹어요.#f:meat_slab|혼자 살아요.|헤엄을 잘 쳐요.|*꼬리가 길어요.#p:tail|밤에 사냥을 해요.|발소리를 내지 않고 걸어요.|*고양이와 같은 무리의 동물이에요.|우리나라 옛이야기에 자주 나와요.|몸이 주황색이에요.|*어흥 소리를 내요.|*줄무늬가 있어요.#p:stripes|줄무늬는 저마다 달라요.|*얼굴 둘레에 흰 털이 있어요.#p:face|'범'이라고도 불러요.|*이름은 세 글자예요.|*이름은 '호'로 시작해요.`,
'곰':`*땅 위에 살아요.#h|숲에 살아요.|*다리가 네 개예요.#p:legs|몸집이 아주 커요.|*털이 많고 갈색이에요.#p:body|*고기도 먹고 열매도 먹어요.#f:red_berries|*꿀을 좋아해요.#f:honey_pot|물고기를 잡아먹기도 해요.|나무를 잘 타요.|*겨울에는 굴에서 겨울잠을 자요.|뒷다리로 일어서기도 해요.|냄새를 아주 잘 맡아요.|발톱이 길고 날카로워요.|꼬리가 아주 짧아요.|*귀가 동그래요.#p:ears|마늘과 쑥 이야기에 나와요.|겨울잠을 자기 전에 많이 먹어요.|*얼굴이 동그래요.#p:head|*이름은 한 글자예요.|*단군 이야기에 나오는 동물이에요.`,
'원숭이':`*숲에 살아요.#h|*털이 있어요.|나무 위에서 지내요.|*과일을 먹어요.#f:apple|무리를 지어 살아요.|*꼬리가 길어요.#p:tail|*손으로 물건을 잡아요.#p:hands|나뭇가지를 잘 타요.|서로 털을 골라 줘요.|*얼굴 표정이 여러 가지예요.|사람과 닮은 점이 많아요.|흉내를 잘 내요.|동물원에서 인기가 많아요.|소리를 지르며 서로 불러요.|*바나나를 좋아해요.#f:bananas|*귀가 얼굴 옆에 동그랗게 있어요.#p:head|엉덩이가 빨간 것도 있어요.|'원숭이 엉덩이는 빨개' 노래가 있어요.|*이름은 세 글자예요.|*이름은 '원'으로 시작해요.`,
'개':`*땅 위에 살아요.#h|*다리가 네 개예요.#p:legs|*털이 있어요.|사람과 함께 살아요.|*꼬리를 흔들어요.#p:tail|냄새를 아주 잘 맡아요.|소리를 잘 들어요.|산책을 좋아해요.|집을 지켜 줘요.|*뼈다귀를 좋아해요.#f:bone|주인을 잘 따라요.|공을 물어 와요.|혀를 내밀고 숨을 쉬어 더위를 식혀요.|*귀가 축 늘어져 있어요.#p:ears|냄새로 길을 찾아요.|몸에 갈색 무늬가 있어요.#p:body|*사람의 가장 친한 친구라고 해요.|*멍멍 짖어요.|*이름은 한 글자예요.|*아기를 강아지라고 불러요.`,
'고양이':`*땅 위에 살아요.#h|*다리가 네 개예요.#p:legs|*털이 부드러워요.|사람과 함께 살아요.|높은 곳에 잘 올라가요.|*꼬리가 길어요.#p:tail|밤에도 잘 봐요.|발소리를 내지 않고 걸어요.|혀로 털을 핥아 몸을 닦아요.|*생선을 좋아해요.#f:fish|상자 안에 들어가기를 좋아해요.|기분이 좋으면 가르랑 소리를 내요.|발톱을 숨길 수 있어요.|쥐를 잡아요.|*뾰족한 귀가 두 개 있어요.#p:ears|*수염이 길어요.#p:face|높은 데서 떨어져도 사뿐히 내려앉아요.|*야옹 소리를 내요.|*이름은 세 글자예요.|*이름은 '고'로 시작해요.`,
'독수리':`*하늘을 날아다녀요.#h|*깃털이 있어요.|*다리가 두 개예요.#p:feet|몸집이 큰 새예요.|높은 산이나 절벽에 둥지를 지어요.|*날개가 아주 커요.#p:wings|하늘 높이 빙빙 돌며 날아요.|*고기를 먹어요.#f:meat_slab|눈이 아주 좋아요.|멀리 있는 먹이도 잘 찾아요.|*발톱이 날카로워요.|물고기를 잡기도 해요.|알을 낳아요.|*부리가 갈고리처럼 구부러졌어요.#p:beak|하늘의 왕이라고 불러요.|*머리가 하얘요.#p:head|미국을 대표하는 새예요.|날개를 펴면 어른 키만큼 길어요.|*이름은 세 글자예요.|*이름은 '독'으로 시작해요.`,

'나비':`*풀밭과 꽃밭을 날아다녀요.#h|*곤충이에요.|*다리가 여섯 개예요.#p:body|몸이 작아요.|알에서 애벌레가 나와요.|애벌레는 잎을 먹어요.|번데기가 되었다가 어른이 돼요.|*꽃의 꿀을 먹어요.#f:pink_flower|입이 빨대처럼 길어요.|*더듬이가 두 개 있어요.#p:antenna|낮에 날아다녀요.|날개에 고운 가루가 있어요.|*날개가 네 장이에요.#p:wing1|쉴 때 날개를 접어요.|꽃가루를 옮겨 줘요.|*날개에 예쁜 무늬가 있어요.#p:wing2|팔랑팔랑 날아요.|*나풀나풀 날아다니는 곤충이에요.|*이름은 두 글자예요.|*이름은 '나'로 시작해요.`,

  return null; }

function pickLesson(n){ let best=null, bs=-1;
  for(let k=0;k<400;k++){ const L=shuffle(ALL).slice(0,n);
    if(L.some(t=>!sortHints(t,L))) continue;

function cleanF(f,rate){
  const n=f.length, W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }
  const th=Math.max(0.003,mx*0.04), seg=[]; let on=-1;
  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));

function sha1Bytes(msg){
  const l=msg.length, w=[], H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  const m=new Uint8Array(((l+9+63)>>6)<<6); m.set(msg); m[l]=0x80; const bl=l*8; const dv=new DataView(m.buffer); dv.setUint32(m.length-4,bl>>>0); dv.setUint32(m.length-8,Math.floor(bl/4294967296));
  for(let i=0;i<m.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<80;t++){ const x=w[t-3]^w[t-8]^w[t-14]^w[t-16]; w[t]=(x<<1)|(x>>>31); }
    let [a,b,c,d,e]=H;
    for(let t=0;t<80;t++){ const f=t<20?(b&c)|(~b&d):t<40?b^c^d:t<60?(b&c)|(b&d)|(c&d):b^c^d, k=t<20?0x5A827999:t<40?0x6ED9EBA1:t<60?0x8F1BBCDC:0xCA62C1D6;
      const tmp=(((a<<5)|(a>>>27))+f+e+k+w[t])>>>0; e=d; d=c; c=(b<<30)|(b>>>2); b=a; a=tmp; }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0;
  }
  const out=new Uint8Array(20); const ov=new DataView(out.buffer); H.forEach((h,i)=>ov.setUint32(i*4,h)); return out;
}

   말을 시작하지 않고 끝난 뒤 0.6초(늦어도 2초) 기다렸다 말함. 안 보임·소리 끊김으로 멈춘 말은 돌아온 뒤 처음부터 다시 */
let fsAskAt=0, fsChangeAt=0;

/* 보이지 않는 동안은 말하지 않고, 말하던 중이었으면 돌아온 뒤 그 말을 처음부터 다시(말이 끝나기를 기다리던 다음 할 일도 이어짐) */

function speak(text){ return new Promise(resolve=>{

  if(fsBusy()){ const s0=speakSeq; afterFull(()=>{ if(speakSeq===s0) speak(text).then(resolve); else resolve(false); }); return; }
  lastSay=text; stopVoice();
  const tries=(speak.retry&&speak.retry.text===text)?speak.retry.n:0; speak.retry=null;
  const id=++speakSeq, me={id,text,resolve}; curSay=me;
  let fired=false; const done=why=>{ if(fired) return; fired=true; if(me.held) return;
    /* 도중에 끊겼으면 잠깐 뒤 그 말을 처음부터 다시(두 번까지) */
    if(why==='cut'&&tries<2&&id===speakSeq){ setTimeout(()=>{ if(me.held) return; if(id!==speakSeq){ resolve(false); return; } speak.retry={text,n:tries+1}; speak(text).then(resolve); },400); return; }

  if(!S.sound||!text){ setTimeout(done,Math.max(900,(text||'').length*120)); return; }
  if(S.engineNow==='device'){ deviceSay(text,id,done); return; }
  const parts=splitSay(text), ps=parts.map(x=>getClip(x));
  (async()=>{
    for(let i=0;i<parts.length;i++){
      let clip=null; try{ clip=await Promise.race([ps[i],new Promise((_,rj)=>setTimeout(()=>rj(new Error('slow')),8000))]); }catch(e){}
      if(id!==speakSeq) return done();
      if(!clip){ S.engineNow='device'; S.voiceNote='내장 목소리를 받지 못해, 이번 수업은 기기 목소리로 바꿨어요.'; renderDock(); deviceSay(parts.slice(i).join(' '),id,done); return; }
      if(await playClip(clip)==='cut') return done(id===speakSeq?'cut':''); if(id!==speakSeq) return done();
      if(i<parts.length-1) await wait(/,$/.test(parts[i])?220:320);
    }
    done();

}); }

  F.bub.querySelector('.ht').textContent=text; F.bub.classList.toggle('name',cls==='name'); }
function addChip(F,text,now){ F.chips.querySelectorAll('.now').forEach(x=>x.classList.remove('now')); const c=document.createElement('span'); c.className='chip1'+(now?' now':''); c.textContent=text.replace(/[.]$/,''); F.chips.appendChild(c); }
function chime(){ if(!S.sound) return; try{ const c=getCtx(); if(!c) return; const t=c.currentTime;
  [[660,0],[880,0.12]].forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.16,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.35); o.connect(g); g.connect(c.destination); o.start(t+d); o.stop(t+d+0.4); }); }catch(e){} }
function logRow(ph,a,w,help,n,h){

/* ---- 학습(하·중): 동물 한 마리를 크게, 이름 → 그 수준의 고개를 하나씩(무오류 시범) ---- */
async function stepShow(it,tok){
  const t=it.a, F=frame(1,true), c=animalCard(t,F.cs); c.style.cursor='default'; F.row.appendChild(c);
  await wait(500); if(!alive(tok)) return;
  setBubble(F,t,'','name'); await speak(nameLine(t)); if(!alive(tok)) return; await wait(400);
  const list=RUN.lv===1?easyHints(t).map(h=>({t:factText(h),img:factImg(h)})):learnFacts(t).concat(RIDDLE[t].filter(h=>h.star&&!learnFacts(t).includes(h.t)&&!/^이름은|^'/.test(h.t)).slice(0,1).map(h=>h.t)).map(x=>({t:x,img:''}));
  for(const h of list){ if(!alive(tok)) return; setBubble(F,h.t,h.img); addChip(F,h.t,true); await speak(h.t); if(!alive(tok)) return; await wait(450); }
  await wait(900); if(alive(tok)) advance();
}
/* ---- 학습(상): 열 마리 카드를 펼쳐 놓고, 누르면 크게 + 특징을 글과 함께 들려줌. 다 보면 다음으로 ---- */
function learnGrid(it,tok){
  const st=$('stage'), A=area(), L=RUN.animals, n=L.length, por=portrait(), cols=por?3:5, rows=Math.ceil(n/cols), gap=Math.max(12,A.w*.018);
  const cs=Math.min((A.w-gap*(cols-1))/cols,(A.h-gap*(rows-1))/rows,200);
  const g=document.createElement('div'); g.className='lgrid'; g.style.gap=gap+'px'; g.style.gridTemplateColumns='repeat('+cols+','+cs+'px)'; st.appendChild(g);
  let busy=false;
  const nudge=()=>{ later(()=>{ if(!alive(tok)||busy) return; speak(LCARD).then(nudge); },8000); };
  L.forEach(a=>{ const c=document.createElement('div'); c.className='lcard'+(RUN.seen.includes(a)?' seen':''); c.style.width=c.style.height=cs+'px'; c.innerHTML='<img src="'+pic(a)+'" alt="" draggable="false">'; sizeImg(c.firstChild,a,L);
    tapper(c,()=>{ if(!alive(tok)||busy) return; busy=true; clearTimers(); showFacts(a,tok).then(()=>{ if(!alive(tok)) return; if(!RUN.seen.includes(a)) RUN.seen.push(a);
      if(L.every(x=>RUN.seen.includes(x))){ later(()=>{ if(alive(tok)) nextItem(); },600); return; } busy=false; runStep(); }); });
    g.appendChild(c); });
  speak(LCARD).then(()=>{ if(alive(tok)&&!busy) nudge(); });
  later(()=>{ if(alive(tok)&&!busy){ const c=[...g.children].find((x,i)=>!RUN.seen.includes(L[i])); if(c) c.classList.add('glow'); } },16000);
}
async function showFacts(a,tok){
  clearStage(); const st=$('stage'), A=area(), por=portrait(), cs=Math.min(por?A.w*.7:A.w*.38,A.h*(por?.42:.8),360);
  const p=document.createElement('div'); p.className='lpanel'; if(por) p.style.flexDirection='column';
  const c=animalCard(a,cs); p.appendChild(c);
  const f=document.createElement('div'); f.className='facts'; if(por) f.style.maxWidth='88vw';
  const facts=learnFacts(a);

/* ---- 퀴즈(하): 고개 하나 → 카드 2장(그 동물 + 그 고개에 확실히 맞지 않는 동물 하나, 매번 다름) ----
   견본(고개) 먼저 → 약 1초 뒤 카드가 서서히. 8초 뒤 다시, 16초 뒤 정답 빛남. 틀리면 반응 없이 정답이 빛남 */
function quizPick(it,tok){
  const t=it.a, h=easyHints(t)[it.i]; if(!h){ nextItem(); return; }
  const used=RUN.used[t]=RUN.used[t]||[];
  const cand=ALL.filter(d=>d!==t&&fails(d,h)), pref=cand.filter(d=>RUN.animals.includes(d)&&!used.includes(d)), fresh=cand.filter(d=>!used.includes(d));
  const d=shuffle(pref.length?pref:fresh.length?fresh:cand)[0]; used.push(d);
  const F=frame(2), cards=shuffle([t,d]).map(a=>{ const c=animalCard(a,F.cs,[t,d]); c.classList.add('fadeIn'); F.row.appendChild(c); return c; });
  setBubble(F,factText(h),factImg(h));
  for(let i=0;i<it.i;i++) addChip(F,factText(easyHints(t)[i])); addChip(F,factText(h),true);
  let wrong='', helped=false, over=false, armed=false;
  const target=cards.find(c=>c.dataset.a===t), glow=()=>{ helped=true; target.classList.add('glow'); };
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(factText(h)+' '+ASK).then(()=>{ if(!alive(tok)||over) return;
    later(()=>{ if(alive(tok)&&!over) speak(factText(h)+' '+ASK); },8000);
    later(()=>{ if(alive(tok)&&!over) glow(); },16000); });
  cards.forEach(c=>{ c._tap=()=>{ if(!armed||over||!alive(tok)) return;
    if(c===target){ over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); cards.forEach(x=>{ if(x!==c) x.classList.add('out'); }); chime();
      logRow('quiz',t,wrong,helped||!!wrong,it.i+1,h.k); setBubble(F,t,'','name');
      speak(nameLine(t)).then(async()=>{ if(!alive(tok)) return; await wait(700); if(!alive(tok)) return;
        advance(); }); }
    else if(!wrong){ wrong=c.dataset.a; glow(); } }; });
}

/* ---- 고개 장면(중·상) ----
   중: 첫 고개에 사는 곳 배경이 깔리고, 고개를 넘을 때마다 동물의 그림자가 조금씩 차오름(마지막 고개에 다 참). 학생이 이름을 말하면 쫙.
   상: 처음 서식지 배경만 보여 주고 고개는 말과 글로만(그림 단서 없음). 학생이 이름을 쓰면 동물이 쫙. 중·상 모두 '패스'로 다음 고개.
   고개는 말이 끝나고 중 7초·상 9초 뒤 저절로 다음(쓰는 중·말하는 중이면 기다림). 다 들어도 못 맞히면 12초 뒤 정답을 보여 줌(도움). 틀려도 반응 없음 */
function imgLoad(src){ return new Promise(r=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>r(im); im.onerror=()=>r(null); im.src=src; }); }
async function riddle(it,tok){
  const t=it.a, lv=RUN.lv, list=lv===2?RIDDLE[t].filter(h=>h.star):RIDDLE[t];
  const st=$('stage'), A=area(), por=portrait();
  const F={bub:document.createElement('div'),chips:document.createElement('div')};
  F.bub.className='bubble hint'; F.bub.innerHTML='<img class="hi" alt=""><span class="ht"></span>'; F.chips.className='chips';
  const ansH=104, sh=Math.min(A.h-150-ansH, (A.w*(por?.96:.62))*3/4), sw=sh*4/3;
  const sc=document.createElement('div'); sc.className='rscene'; sc.style.width=sw+'px'; sc.style.height=sh+'px';
  sc.innerHTML='<img class="bg" alt="" draggable="false" src="'+HAB+SCENE[t]+'.jpg">';
  const ans=document.createElement('div'); ans.className='answer';
  /* 답하는 칸(2026-10-31): 앞에 "정답"(마이크) 단추 — 누르면 듣고, 맞으면 넘어감.
     중: 그 뒤에 선생님이 들은 이름을 쓰는 칸(마이크가 안 되거나 기기가 못 알아들을 때) / 상: 학생이 이름을 쓰는 칸 */
  const micB='<button type="button" class="micBtn">'+MIC_SVG+'<span>정답</span></button>';
  if(lv===3) ans.innerHTML=micB+'<input id="sIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="이름을 써요" enterkeyhint="done"><button type="button" id="sOk">확인</button>';
  else ans.innerHTML=micB+'<input id="tIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="선생님이 넣어 주세요" enterkeyhint="done"><button type="button" class="tOk" id="tOk">확인</button>';
  { const b=document.createElement('button'); b.type='button'; b.className='pass'; b.textContent='패스'; ans.appendChild(b); b.onclick=()=>{ skip=true; b.blur(); }; }   /* 모르면 다음 고개로(2026-10-27) */
  const note=document.createElement('div'); note.className='micNote';
  st.append(F.bub,sc,F.chips,ans,note);
  setBubble(F,WHO,'');
  /* 그림 준비: 동물을 배경 아래쪽 가운데에(장면 높이의 72%) */
  const img=await imgLoad(pic(t)); if(!alive(tok)) return;
  const dpr=Math.min(2,window.devicePixelRatio||1), CW=Math.round(sw*dpr), CH=Math.round(sh*dpr), AS=CH*.72, AX=(CW-AS)/2, AY=CH-AS-CH*.03;
  const layer=()=>{ const c=document.createElement('canvas'); c.width=CW; c.height=CH; sc.appendChild(c); return c; };
  const shape=(ctx,p)=>{ const k=AS/512, [x0,y0,x1,y1]=p.b.map((v,i)=>v*k+(i%2?AY:AX)); ctx.beginPath(); if(p.t==='e') ctx.ellipse((x0+x1)/2,(y0+y1)/2,(x1-x0)/2,(y1-y0)/2,0,0,Math.PI*2); else ctx.rect(x0,y0,x1-x0,y1-y0); };
  const drawPart=p=>{ if(!img) return; const c=layer(), x=c.getContext('2d'); x.save(); shape(x,p); x.clip(); x.drawImage(img,AX,AY,AS,AS); x.restore(); requestAnimationFrame(()=>c.classList.add('on')); };
  /* 차오르는 그림(2026-10-31 선생님 의견): 물이 차오르듯 발부터 위로, 윗선은 일렁이는 물결.
     그림자 대신 원래 동물 그림을 아주 흐리게(GHOST — 살짝 신경 써서 보면 보일 만큼). 고개마다 정해진 높이까지 천천히 오르고(마지막 고개에 다 참) */
  const GHOST=.05;
  const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shd=null, lvNow=0, lvTo=0;
  const shadowInit=()=>{ const c=layer(); c.classList.add('on');
    const off=document.createElement('canvas'); off.width=CW; off.height=CH; const o=off.getContext('2d');
    o.drawImage(img,AX,AY,AS,AS);
    const tmp=document.createElement('canvas'); tmp.width=tmp.height=64; const tx=tmp.getContext('2d'); tx.drawImage(img,0,0,64,64); const d=tx.getImageData(0,0,64,64).data;
    let ty=64, by=-1; for(let y=0;y<64;y++) for(let x=0;x<64;x++) if(d[(y*64+x)*4+3]>40){ if(y<ty) ty=y; by=y; }
    shd={x:c.getContext('2d'),off,top:AY+AS*ty/64,bot:AY+AS*(by+1)/64,amp:AS*.02}; };
  const drawShadow=t=>{ const {x,off,top,bot,amp}=shd; x.clearRect(0,0,CW,CH); if(lvNow<=.001) return;
    const y0=bot-(bot-top+amp*3.2)*lvNow, w1=AS*.12, w2=AS*.05;
    x.save(); x.beginPath(); x.moveTo(0,CH);
    for(let px=0;px<=CW+8;px+=8) x.lineTo(px,y0+amp*Math.sin(px/w1+t/900)+amp*.55*Math.sin(px/w2-t/560));
    x.lineTo(CW,CH); x.closePath(); x.clip(); x.globalAlpha=GHOST; x.drawImage(off,0,0); x.restore(); };
  const tick=t=>{ if(!alive(tok)||over) return; lvNow+=(lvTo-lvNow)*(RM?1:.035); drawShadow(RM?0:t); requestAnimationFrame(tick); };
  const growShadow=frac=>{ if(!img) return; if(!shd){ shadowInit(); requestAnimationFrame(tick); } lvTo=frac; };
  const bg=sc.querySelector('.bg');
  let over=false, wrong='', heard=0, lastType=0, skip=false;
  const win=(who)=>{ if(over||!alive(tok)) return; over=true; clearTimers(); Ear.stop(); micNote('');
    const full=layer(); full.classList.add('full'); const fx=full.getContext('2d'); if(img) fx.drawImage(img,AX,AY,AS,AS);
    bg.classList.add('on'); requestAnimationFrame(()=>{ full.classList.add('on'); sc.querySelectorAll('canvas:not(.full)').forEach(c=>c.style.opacity=0); });
    chime(); logRow('quiz',t,wrong,who==='reveal',heard); setBubble(F,t,'','name');
    const inp=$('sIn')||$('tIn'); if(inp){ inp.value=t; inp.disabled=true; inp.blur(); }
    later(()=>{ if(alive(tok)) speak(nameLine(t)).then(async()=>{ if(!alive(tok)) return; await wait(1600); if(!alive(tok)) return;
      advance(); }); },500); };
  const check=(texts,who)=>{ if(over) return false; if(isName(t,texts)){ win(who); return true; } const s=[].concat(texts)[0]; if(s&&!wrong) wrong=String(s).slice(0,20); return false; };
  /* 답하는 길: 쓰는 칸(상 학생·중 선생님) + "정답" 마이크 */
  { const inp=$(lv===3?'sIn':'tIn'), who=lv===3?'type':'teacher', ok=()=>{ const v=inp.value.trim(); if(!v) return; if(!check(v,who)) inp.select(); };
    $(lv===3?'sOk':'tOk').onclick=ok;
    inp.addEventListener('keydown',e=>{ lastType=performance.now(); if(e.key==='Enter'){ e.preventDefault(); ok(); } }); inp.addEventListener('input',()=>{ lastType=performance.now(); }); }
  ans.querySelector('.micBtn').onclick=e=>{ e.currentTarget.blur(); if(over) return;
    if(Ear.on){ Ear.stop(); return; }
    if(!Ear.ok()){ micNote(Ear.denied?S.voiceNote:'이 브라우저는 말을 알아듣지 못해요. 크롬에서 열거나, 들은 이름을 칸에 넣어 주세요.'); return; }
    speakSeq++; stopVoice();   /* 읽던 고개를 멈추고 들음 */
    micNote('');
    Ear.listen((alts,fin)=>{ if(check(alts,'voice')) return; if(lv===3&&fin){ const v=$('sIn'); if(v&&!v.value) v.value=String(alts[0]||'').trim(); } micNote('들은 말: '+String(alts[0]||'').trim()); },7000); };
  /* 고개를 차례로 */
  const wait2=ms=>new Promise(r=>{ const t0=performance.now(); const chk=()=>{ if(!alive(tok)||over) return r(false); if(skip){ skip=false; return r(true); }
    const busy=performance.now()-lastType<3500||Ear.on||performance.now()-Ear.heardAt<2500||pdown;
    if(performance.now()-t0>=ms&&!busy) return r(true); setTimeout(chk,250); }; chk(); });
  await wait(700); if(!alive(tok)) return;
  for(let i=0;i<list.length;i++){
    const h=list[i]; heard=i+1;
    if(h.h||i===0) bg.classList.add('on');
    if(lv===2) growShadow((i+1)/list.length);
    /* 상: 그림 단서 없이 말과 글로만(처음 서식지 배경만, 2026-10-27 선생님 의견) */
    setBubble(F,h.t,''); addChip(F,h.t,true);
    await speak(h.t); if(!alive(tok)||over) return;
    if(i===list.length-1){ skip=false; break; }
    if(!await wait2(lv===2?7000:9000)) return;
  }
  setBubble(F,lv===2?SAY:TYPE,''); await speak(lv===2?SAY:TYPE); if(!alive(tok)||over) return;
  if(await wait2(12000)) win('reveal');
}

/* ---- 특징 정리(하·중, 2026-10-26 선생님 의견): 고개를 마치면 그 동물과 특징을 한 화면에 일목요연하게 보여 주고 한 번 읽어 준 뒤 정지.
   단추 둘: "○○ 한 번 더"(특징 학습부터 고개까지 다시) / "다음 동물"(마지막이면 다음 단계로). 저절로 넘어가지 않음 ---- */
async function summary(it,tok){
  const t=it.a, st=$('stage'), A=area(), por=portrait(), cs=Math.min(por?A.w*.6:A.w*.34,A.h*(por?.36:.62),340);
  const list=RUN.lv===1?easyHints(t).map(factText):RIDDLE[t].filter(h=>h.star&&!/^이름은|^'/.test(h.t)).map(h=>h.t);
  const p=document.createElement('div'); p.className='lpanel'; if(por) p.style.flexDirection='column';
  const c=animalCard(t,cs); c.style.cursor='default'; p.appendChild(c);
  const f=document.createElement('div'); f.className='facts'; if(por) f.style.maxWidth='88vw';
  f.innerHTML='<h3>'+esc(t)+'</h3>'+list.map(x=>'<p class="on">'+esc(x)+'</p>').join(''); if(list.length>6) f.style.columnCount=por?1:2;
  p.appendChild(f); st.appendChild(p);
  const bar=document.createElement('div'); bar.className='sumBar'; st.appendChild(bar);
  const last=RUN.ii>=RUN.phases[RUN.pi].items.length-1, nx=RUN.phases[RUN.pi+1];
  await speak(nameLine(t)); if(!alive(tok)) return;
  for(const x of list){ await speak(x); if(!alive(tok)) return; await wait(250); }
  if(!alive(tok)) return;
  const b1=document.createElement('button'); b1.type='button'; b1.className='sumBtn'; b1.textContent=t+' 한 번 더';
  const b2=document.createElement('button'); b2.type='button'; b2.className='sumBtn go'; b2.textContent=last?(nx?STEP_NAME(nx.k)+'(으)로':S.steps.game?'같은 동물 찾기로':'마치기'):'다음 동물';
  bar.append(b1,b2);
  tapper(b1,()=>{ if(!alive(tok)) return; RUN.used[t]=[]; RUN.sub={st:S.steps.learn?'learn':'quiz',qi:0}; saveSpot(); runStep(); });
  tapper(b2,()=>{ if(!alive(tok)) return; nextItem(); });
}
/* ---- 정리하기: 오늘의 동물을 늘 같은 자리에 펼쳐 놓고, 그 동물만 남는 고개를 한꺼번에. 찾은 동물은 ✓.
   놀이처럼: 틀리면 반응 없음(먼저 누른 것만 기록), 말이 끝나고 3초마다 다시, 16초 뒤 정답이 빛남 ---- */
function stepSort(it,tok){
  const t=it.a, all=RUN.animals, found=RUN.phases[RUN.pi].items.slice(0,RUN.ii).map(x=>x.a), SH=sortHints(t,all)||factsOf(t);
  const F=frame(all.length), R={wrong:'',helped:false}; let over=false;
  const cards=all.map(a=>{ const c=animalCard(a,F.cs,all); if(found.includes(a)) c.classList.add('done'); F.row.appendChild(c); return c; });
  SH.forEach(h=>addChip(F,factText(h)));
  setBubble(F,WHO,'');
  const line=SH.map(factText).join(' ')+' '+WHO;
  speak(line).then(()=>{ if(!alive(tok)) return;
    const again=()=>later(()=>{ if(alive(tok)&&!over){ if(pdown) return again(); speak(line).then(again); } },3000); again();
    later(()=>{ if(alive(tok)&&!over){ R.helped=true; cards.find(c=>c.dataset.a===t).classList.add('glow'); } },16000); });
  cards.forEach(c=>{ c._tap=()=>{ if(over||!alive(tok)||c.classList.contains('done')) return;
    if(c.dataset.a!==t){ if(!R.wrong) R.wrong=c.dataset.a; return; }
    over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); chime(); logRow('sort',t,R.wrong,R.helped||!!R.wrong,SH.length);
    setBubble(F,t,'','name');
    speak(nameLine(t)).then(async()=>{ if(!alive(tok)) return; c.classList.add('done'); await wait(700); if(alive(tok)) nextItem(); }); }; });
}

/* ---- 끝: 같은 동물 찾기(학습 뒤 놀이, 기록 안 함, 진 것·시간 제한 없음) ----
   하 2쌍(카드 4): 첫 카드는 열린 채로 두 번째를 엶, 틀리면 둘 다 닫힘
   중 5쌍(카드 10): 틀리면 1초 뒤 둘 다 닫힘
   상 10쌍(카드 20): 첫 카드는 1초만 보이고 닫힘 → 기억해서 두 번째를 엶(맞으면 둘 다 열린 채로) */
function finishLesson(){
  delete RESUME[S.stu||'_']; saveResume();
  delete S.picks[RUN.lv]; saveS();   /* 다음 수업은 새 동물로 */
  RUN.ending=true; startEnd();
}
function startEnd(){
  RUN.token++; const tok=RUN.token; clearTimers(); stopVoice(); clearStage(); renderProg(); saveSpot();
  if(!RUN.gameDone) memGame(tok); else drawEnd(tok);
}
function memGame(tok){
  const lv=RUN.lv, pairs=[2,5,10][lv-1], pool=shuffle(RUN.animals.length>=pairs?RUN.animals:ALL).slice(0,pairs);
  const deck=shuffle([...pool,...pool]), n=deck.length, A=area(), por=portrait();
  const cols=n<=4?(por?2:4):n<=10?(por?2:5):(por?4:5), rows=Math.ceil(n/cols), gap=Math.max(10,A.w*.015);
  const cs=Math.min((A.w-gap*(cols-1))/cols,(A.h-gap*(rows-1))/rows,lv===1?260:200);
  const g=document.createElement('div'); g.className='mem'; g.style.gap=gap+'px'; g.style.gridTemplateColumns='repeat('+cols+','+cs+'px)'; $('stage').appendChild(g);
  let first=null, lock=false, got=0;
  const cards=deck.map(a=>{ const c=document.createElement('div'); c.className='fc'; c.dataset.a=a; c.style.width=c.style.height=cs+'px';
    c.innerHTML='<div class="in"><div class="face back"><i></i><i></i><i></i><i></i><i></i></div><div class="face front"><img src="'+pic(a)+'" alt="" draggable="false"></div></div>';
    sizeImg(c.querySelector('.front img'),a,pool); g.appendChild(c); return c; });
  const close=(...cs)=>cs.forEach(c=>c&&c.classList.remove('open'));
  cards.forEach(c=>tapper(c,()=>{ if(!alive(tok)||lock||c.classList.contains('got')||c===first||c.classList.contains('open')) return;
    c.classList.add('open');
    if(!first){ first=c; if(lv===3){ lock=true; later(()=>{ if(!alive(tok)) return; close(first); lock=false; },1000); } return; }
    const a=first, b=c; first=null;
    if(a.dataset.a===b.dataset.a){ a.classList.add('open','got'); b.classList.add('got'); chime(); got++; speak(shortName(b.dataset.a));
      if(got===pairs) later(()=>{ if(alive(tok)){ RUN.gameDone=true; startEnd(); } },2200); return; }
    lock=true; later(()=>{ if(!alive(tok)) return; close(a,b); lock=false; },lv===1?1300:1000); }));
  speak(MEM);
}
function drawEnd(tok){
  const list=RUN.animals, A=area(), por=portrait(), n=list.length, cols=por?Math.min(3,n):Math.min(5,n), rows=Math.ceil(n/cols), gap=Math.max(14,A.w*.02);
  const cs=Math.min((A.w-gap*(cols-1))/cols,(A.h-rows*46-gap*(rows-1))/rows,220);
  const g=document.createElement('div'); g.className='mem'; g.style.gap=gap+'px'; g.style.gridTemplateColumns='repeat('+cols+','+cs+'px)';
  list.forEach(a=>{ const d=document.createElement('div'); d.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px'; const c=animalCard(a,cs); c._tap=()=>{ if(alive(tok)) speak(nameLine(a)); };
    d.appendChild(c); const b=document.createElement('b'); b.style.cssText='font-family:var(--f-display);font-weight:400;font-size:clamp(18px,2.2vw,28px)'; b.textContent=a; d.appendChild(b); g.appendChild(d); });
  $('stage').appendChild(g);
  if(!RUN.endSaid){ RUN.endSaid=true; speak(END_LINE); }
}

const weekOf=t=>{ const d=new Date(t); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return dayOf(m); };
function exampleLog(){ /* 가상의 학생 홍길동의 한 달(이 기기 기록에 넣지 않음) */
  const rows=[], start=Date.now()-28*864e5; let seed=11; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let d=0;d<28;d+=2){ const lv=d<14?1:2, L=shuffle(ALL).slice(0,LV[lv].n), g=start+d*864e5+9*36e5;
    const items=lv===1?L.flatMap(a=>easyHints(a).map((h,i)=>({a,i,h}))):L.map(a=>({a}));
    items.forEach((it,i)=>{ const ok=rnd()<Math.min(.95,.5+d*.017); rows.push({s:'ex',t:g+i*40e3,g,lv,ph:'quiz',a:it.a,res:ok?'first':'help',w:ok?'':L.find(x=>x!==it.a),n:lv===1?it.i+1:3+Math.floor(rnd()*7),h:it.h?it.h.k:''}); });

      +rows.slice().reverse().slice(0,400).map(r=>'<tr><td>'+dayOf(r.t)+' '+new Date(r.t).toTimeString().slice(0,5)+'</td><td>'+r.lv+'</td><td>'+PH_NAME[r.ph]+'</td><td>'+esc(r.a)+'</td><td>'+(r.n||'')+'</td><td>'+(r.res==='first'?'바로':'도움 받아')+'</td><td>'+esc(r.w)+'</td></tr>').join('')+'</table></details>';
  }

  h+='<div class="row noprint" style="margin-top:12px"><button class="chip sm" id="recCsv">CSV 내보내기</button><button class="chip sm" id="recPrint">출력 (A4)</button></div>';

<script id="holdBubble">
/* 관리 버튼을 3초 누르는 동안: (휴대폰·태블릿을 손가락으로 누를 때만) 버튼 조금 위에 투명한 아쿠아 원이 세 번. 전자칠판·PC는 버튼 둘레 고리만 */
(function(){
  const btn = document.querySelector('#adminBtn, #aqua'); if (!btn) return;
  const st = document.createElement('style');
  st.textContent = '.hb-dot{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:2147483000;opacity:0;'
    + 'background:radial-gradient(circle at 50% 40%,rgba(200,250,252,.75),rgba(120,225,232,.35) 60%,rgba(80,200,210,.2));'
    + 'border:1.5px solid rgba(70,185,200,.55);box-shadow:0 0 10px rgba(130,230,238,.55)}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.className = 'hb-dot'; document.body.appendChild(dot);
  let down = false, raf = 0, useDot = false;
  const mobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const prog = () => { const v = getComputedStyle(btn).getPropertyValue('--p').trim(); const n = parseFloat(v) || 0; return /%$/.test(v) ? n / 100 : n; };
  const hide = () => { dot.style.opacity = 0; btn.style.opacity = ''; };
  const loop = () => {
    const p = prog();
    if (down && p > 0.01 && p < 1) {
      const r = btn.getBoundingClientRect(), S = 40;
      dot.style.left = Math.max(4, Math.min(innerWidth - S - 4, r.left + r.width / 2 - S / 2)) + 'px';
      dot.style.top = Math.max(4, r.top - S - 34) + 'px';
      btn.style.opacity = '.75';
      if (!useDot) return void (raf = requestAnimationFrame(loop));
      dot.style.opacity = (0.9 * Math.sin(Math.PI * ((p * 3) % 1))).toFixed(3);
    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);
  const up = () => { down = false; cancelAnimationFrame(raf); hide(); };
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, up, true));
})();
</script>
<script id="adminGate">
/* 관리 메뉴 열기 2단계: 관리 버튼을 3초 누른 뒤, 왼쪽 위에 3초 동안 나타나는 작은 점을 눌러야 열림 */
window.AdminGate = (function () {
  const st = document.createElement('style');
  st.textContent = '#agDot{position:fixed;left:18px;top:18px;width:62px;height:62px;border-radius:50%;z-index:2147483600;display:none;cursor:pointer;touch-action:none;'
    + 'background:radial-gradient(circle at 50% 38%,rgba(210,252,253,.9),rgba(120,225,232,.55) 60%,rgba(70,190,205,.4));border:2px solid rgba(34,175,188,.75);box-shadow:0 0 10px rgba(120,225,232,.6)}'
    + '#agDot svg{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}'
    + '#agDot circle{fill:none;stroke:#22AFBC;stroke-width:4;stroke-linecap:round}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.id = 'agDot'; dot.setAttribute('aria-label', '관리 열기');
  dot.innerHTML = '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="34"/></svg>';
  document.body.appendChild(dot);
  const ring = dot.querySelector('circle'), L = 2 * Math.PI * 34;
  ring.style.strokeDasharray = L;
  let cb = null, t0 = 0, raf = 0, WAIT = 3000;
  const hide = () => { dot.style.display = 'none'; cancelAnimationFrame(raf); cb = null; };
  const tick = () => { const p = (performance.now() - t0) / WAIT; if (p >= 1 || !cb) return hide(); ring.style.strokeDashoffset = L * p; raf = requestAnimationFrame(tick); };
  let armed = false;
  dot.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!cb) return; armed = true; cancelAnimationFrame(raf); try { dot.setPointerCapture(e.pointerId); } catch (x) {} });
  const done = e => { e.preventDefault(); e.stopPropagation(); if (!armed) return; armed = false; const f = cb; cb = null; setTimeout(() => { dot.style.display = 'none'; }, 60); if (f) f(); };
  dot.addEventListener('pointerup', done); dot.addEventListener('pointercancel', done);
  dot.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  return { ask(fn) { cb = fn; t0 = performance.now(); ring.style.strokeDashoffset = 0; dot.style.display = 'block'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, cancel: hide };
})();
</script>
<script id="reportLink">

<script id="endLesson">
/* 수업 끝내기: 관리 메뉴를 열면 전체 화면에서 나오고(잠깐 나가기), 관리 메뉴에 있는 동안 왼쪽 아래 "⏻ 수업 끝내기"(두 번 눌러야)로 앱을 아예 끝냄 */
(function(){
  var BOARD='https://www.charum.org/webapp';
  var ctxs=[]; ['AudioContext','webkitAudioContext'].forEach(function(n){ var C=window[n]; if(!C||C.__endWrap) return;
    var W=function(){ var c=new (Function.prototype.bind.apply(C,[null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    W.prototype=C.prototype; W.__endWrap=true; try{ window[n]=W; }catch(e){} });
  var css=document.createElement('style');
  css.textContent='#endBtn{position:fixed;left:12px;bottom:52px;z-index:2147480001;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
   +'#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
   +'#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
   +'#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin(){ try{ return document.body.classList.contains('admin'); }catch(e){ return false; } }
  function exitFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
  function hush(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio,video').forEach(function(m){ try{ m.pause(); }catch(e){} }); ctxs.forEach(function(c){ try{ c.suspend(); }catch(e){} }); }
  function end(){
    hush(); try{ window.dispatchEvent(new Event('pagehide')); }catch(e){} exitFull();
    var cv=document.createElement('div'); cv.id='endCover';
    cv.innerHTML='<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="'+BOARD+'">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick=function(){ location.reload(); };
    ['pointerdown','click','touchstart','keydown'].forEach(function(t){ cv.addEventListener(t,function(e){ e.stopPropagation(); });   /* 단추가 받은 뒤 막음(잡는 단계에서 막으면 "다시 시작"까지 막힘, 2026-10-26) */ });
    setTimeout(function(){ try{ window.close(); }catch(e){} },150);
    setInterval(hush,1000);
  }
  var was=false, sureT=0;
  function tick(){
    var b=document.getElementById('endBtn');
    if(!b){ b=document.createElement('button'); b.id='endBtn'; b.type='button'; b.title='앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML='<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
        if(!b.classList.contains('sure')){ b.classList.add('sure'); b.querySelector('.t').textContent='한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT=setTimeout(function(){ b.classList.remove('sure'); b.querySelector('.t').textContent='수업 끝내기'; },3000); return; }
        end(); });
      ['click','pointerup'].forEach(function(t){ b.addEventListener(t,function(e){ e.stopPropagation(); }); });
      document.body.appendChild(b); }
    var a=admin();
    b.classList.toggle('on',a);
    if(a&&!was) exitFull();
    was=a;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,400);
})();
</script>
<script id="printFit">
/* 차름 공통: 출력 — 전체 화면이면 먼저 나간 뒤 인쇄(전체 화면에서 바로 인쇄하면 미리보기가 왼쪽 위에 작게 붙음),
   PrintFit.page(방향, 여백mm, 덧붙일 인쇄 CSS) 로 이번 한 번의 종이 방향을 정함(인쇄가 끝나면 원래대로) */
(function(){
  var P=window.print.bind(window);
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  window.print=function(){
    if(!fsEl()){ P(); return; }
    var done=false; function go(){ if(done) return; done=true; setTimeout(P,300); }
    document.addEventListener('fullscreenchange',go,{once:true});
    document.addEventListener('webkitfullscreenchange',go,{once:true});
    try{ var ex=document.exitFullscreen||document.webkitExitFullscreen; var r=ex&&ex.call(document); if(r&&r.catch) r.catch(go); }catch(e){ go(); }
    setTimeout(go,1200);
  };
  function st(){ var s=document.getElementById('printPage'); if(!s){ s=document.createElement('style'); s.id='printPage'; document.head.appendChild(s); } return s; }
  window.PrintFit={
    orient:function(w,h){ return w>h*1.02?'landscape':'portrait'; },
    /* 종이 안쪽 크기(mm): 이 높이에 맞춰 그림을 꽉 채움 */
    inner:function(o,m){ return o==='landscape'?{w:297-2*m,h:210-2*m}:{w:210-2*m,h:297-2*m}; },
    page:function(o,m,css){ st().textContent='@media print{@page{size:A4 '+o+';margin:'+m+'mm}'+(css||'')+'}'; }
  };
  window.addEventListener('afterprint',function(){ var s=document.getElementById('printPage'); if(s) s.textContent=''; });
})();
</script>
