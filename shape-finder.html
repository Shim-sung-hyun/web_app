<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 속 도형 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 학생 화면 = 지금 할 과제 하나만. 교사 모드에서만 위(일정표)·아래(버튼) 메뉴가 나타남 */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --ink:#1C2A31; --muted:#56666E; --line:#C9D4D8;
  --accent:#1F6C75; --accent-soft:#D9ECEE; --ok:#2C7A4E; --ok-soft:#E1F1E7;
  --aqua:#3FCFD2; --aqua-deep:#0E3B3E;
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
input,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

/* 학생 모드: 메뉴 숨김 */
body:not(.admin) .top, body:not(.admin) .bar, body.setup .top, body.setup .bar{display:none}
body:not(.admin) .admin-only{display:none!important}
body.setup #adminBtn{display:none}
body.setup{overflow:auto}

/* 교사 버튼 (3초 누르기) */
#adminBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:43px;height:43px;border-radius:50%;
  z-index:50;touch-action:none;--p:0;padding:0;opacity:.4;transition:opacity .3s;
  border:1px solid rgba(14,92,170,.55);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(170,245,255,.95), rgba(170,245,255,0) 70%),
    radial-gradient(circle at 50% 40%, #4FC4F5 0%, #1E8BE0 55%, #0D5FB8 100%);
  box-shadow:inset 0 -4px 10px rgba(150,240,255,.55), inset 0 3px 6px rgba(0,40,100,.45), 0 4px 10px rgba(0,60,130,.35), 0 1px 2px rgba(0,30,70,.4)}
#adminBtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  background:linear-gradient(to bottom, rgba(255,255,255,.95), rgba(255,255,255,.35) 60%, rgba(255,255,255,.05));pointer-events:none}
#adminBtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(var(--aqua) calc(var(--p)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);opacity:.9}
#adminBtn .ab-label{position:relative;display:block;text-align:center;font-family:var(--f-body);font-weight:700;font-size:8.5px;letter-spacing:.02em;line-height:1;color:#FFFFFF;text-shadow:0 1px 1.5px rgba(0,50,110,.65);pointer-events:none}
body.admin #adminBtn .ab-label{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:0;color:#9FF3F5;text-shadow:0 0 6px rgba(63,207,210,.7),0 1px 1px rgba(0,0,0,.6)}
body.admin #adminBtn{opacity:.6;border-color:rgba(10,20,26,.8);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(110,230,240,.85), rgba(110,230,240,0) 70%),
    radial-gradient(circle at 50% 40%, #3D4F5A 0%, #17242C 60%, #05090C 100%);
  box-shadow:inset 0 -4px 10px rgba(90,220,235,.45), inset 0 3px 6px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4), 0 0 0 3px rgba(63,207,210,.35)}
body.admin .bar{padding-right:80px}

/* 일정표 */
.top{grid-row:1;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:2px solid var(--line)}
.schedule{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1;min-width:0}
.schedule li{flex:1;display:flex;border-radius:12px;color:var(--muted);font-family:var(--f-display);font-size:19px;min-width:0;position:relative}
.stage-btn{all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:12px;cursor:pointer;font:inherit;color:inherit}
.stage-btn:disabled{opacity:.35;cursor:default}
.stage-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.schedule li:not(.now) .stage-btn:not(:disabled):hover{background:var(--accent-soft)}
.schedule li svg{width:26px;height:26px;flex:none}
.schedule li.now{background:var(--accent);color:#fff}
.schedule li.done{color:var(--ok)}
.schedule li.done .lbl::after{content:" ✓"}
.schedule .now-tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-family:var(--f-body);font-weight:700;padding:0 8px;border-radius:8px;line-height:18px}
.tools{display:flex;gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700;min-width:58px}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:560px){.schedule li .lbl{display:none}}
svg.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 과제 영역 */
main{grid-row:2;min-height:0;overflow:hidden;padding-block:18px;padding-inline:18px;display:flex}
body.setup main{overflow:auto}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;max-width:1500px;margin:0 auto;width:100%}
.say{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,56px);line-height:1.2;margin:0;text-align:center;text-wrap:balance;cursor:pointer}
.task-head{display:flex;align-items:center;justify-content:center;gap:16px}
.task-head .mini{width:clamp(52px,6vw,76px);height:auto;flex:none}

/* 아래 버튼 줄 (교사 모드) */
.bar{grid-row:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-top:2px solid var(--line)}
.bar .left{justify-self:start}.bar .right{justify-self:end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:12px 20px;font-weight:700;min-height:60px}
.btn svg{width:26px;height:26px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--f-display);font-size:24px;font-weight:400;padding:12px 28px;min-width:150px}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.dots i.cur{background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft);border-width:4px}

/* 사진 + 오른쪽 판 */
.stage-split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (orientation:portrait),(max-width:760px){.stage-split{grid-template-columns:1fr;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr)}}
.stage-split{transition:grid-template-columns .9s ease,grid-template-rows .9s ease,gap .9s ease}
.stage-split.solo{grid-template-columns:minmax(0,1fr) minmax(0,0fr);gap:0}
.stage-split .panel{transition:opacity .5s ease .45s,padding .9s ease}
.stage-split.solo .panel{opacity:0;padding:0;overflow:hidden;transition:none}
@media (orientation:portrait),(max-width:760px){.stage-split.solo{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,0fr)}}
.go-row{display:flex;justify-content:center;gap:16px;align-items:center}
.go-row.gone{visibility:hidden}
.go-btn{display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border:0;border-radius:24px;padding:14px 40px;font-family:var(--f-display);font-size:clamp(28px,3.4vw,40px)}
.go-btn svg{width:40px;height:40px}
.go-btn.alt{background:var(--surface);color:var(--accent);border:3px solid var(--accent)}
.page-dots{display:flex;gap:10px}
.page-dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.page-dots i.on{background:var(--accent)}
.fly{position:fixed;z-index:40;pointer-events:none;transform-origin:50% 50%;overflow:visible}
.pop-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.icon-slot{width:clamp(120px,15vw,200px);aspect-ratio:1;display:grid;place-items:center}
.icon-slot svg{width:100%;height:auto}
.pop-wrap .after,.lrow .after{opacity:0}
.pop-wrap.shown .after,.lrow.shown .after{opacity:1}
.learned{flex:1;align-self:stretch;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:8px}
.lrow{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lrow .ltext{display:flex;flex-direction:column;align-items:center;gap:8px}
.lrow .objs{display:none;color:var(--muted);font-size:20px}
.lrow.small{flex-direction:row;gap:18px}
.lrow.small .ltext{align-items:flex-start;gap:2px;text-align:left}
.lrow.small .icon-slot{width:clamp(56px,6vw,84px)}
.lrow.small .big-name{font-size:clamp(30px,3.6vw,46px)}
.lrow.small .line{display:none}
.lrow.small .objs{display:block}
.meters{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center}
.meters .meter{width:clamp(90px,11vw,170px);height:auto}
.meters .meter-item:only-child .meter{width:clamp(140px,16vw,220px)}
@media (prefers-reduced-motion:no-preference){.meter-item.got{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}}
@media (prefers-reduced-motion:no-preference){.pop-wrap.shown .after,.icon-slot.shown{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}}
.end-wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.end-art{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.end-art .photo-box{flex:1;width:100%}
.end-art img.cartoon{max-width:100%;max-height:100%;min-height:0;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 10px 30px rgba(28,42,49,.18)}
@media (prefers-reduced-motion:no-preference){.end-art img.cartoon{animation:fadein .9s ease both}}
.art-note{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 18px;font-family:var(--f-display);font-size:22px;color:var(--accent)}
.art-note .waiting i{width:14px;height:14px}
.photo-box{min-height:200px;min-width:0;display:flex;align-items:center;justify-content:center}
.vp{position:relative;overflow:hidden;border-radius:18px;background:#fff;touch-action:manipulation}
.photo-wrap{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff}
.photo-wrap img{display:block;width:100%;height:100%;max-width:none;-webkit-user-drag:none;transition:opacity 1.6s ease,filter 1.6s ease}
.photo-wrap img.faint{opacity:.42;filter:saturate(.8)}
.photo-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vp.tap{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.vp.nudge{animation:nudge 1.6s ease-in-out infinite}}
.vp.nudge{box-shadow:0 0 0 5px var(--accent-soft)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(31,108,117,.0)}50%{box-shadow:0 0 0 8px rgba(31,108,117,.35)}}
.vp.paint{cursor:crosshair;touch-action:none}

.panel{background:var(--surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-width:0;min-height:0}
.big-name{font-family:var(--f-display);font-size:clamp(52px,8vw,104px);line-height:1}
.sub-name{color:var(--muted);font-size:20px}
.line{font-family:var(--f-display);font-size:clamp(24px,3vw,38px);line-height:1.3;text-wrap:balance}
.shape-ic{width:clamp(120px,15vw,200px);height:auto}
.pop{display:flex;flex-direction:column;align-items:center;gap:12px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}

.feedback{width:100%;min-height:84px;border-radius:16px;padding:14px 18px;font-family:var(--f-display);font-size:clamp(24px,3vw,36px);display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;background:var(--bg);color:var(--muted)}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.hint{background:var(--accent-soft);color:var(--accent)}
.feedback svg{width:44px;height:44px;flex:none}
.find-panel{justify-content:flex-start}
.slots-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.slots-row svg{width:58px;height:58px}
.found{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.found .crop{width:100%;max-width:280px;max-height:min(30vh,260px);border-radius:14px;background:#fff;border:2px solid var(--line)}
.found .row2{display:flex;align-items:center;gap:14px}
.found .row2 svg{width:72px;height:72px}

.meter{width:clamp(140px,16vw,220px);height:auto}

/* 세기 */
.count-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (orientation:portrait),(max-width:760px){.count-wrap{grid-template-columns:1fr}}
.count-svg{width:100%;max-height:min(60vh,520px);background:var(--surface);border-radius:20px}
.count-svg .vt{cursor:pointer}
.slots{display:flex;gap:14px;justify-content:center}
.slots span{width:66px;height:66px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--muted)}
.slots span.on{border:3px solid var(--accent);background:var(--accent);color:#fff}

/* 붓 고르기 */
.swatches{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.swatch{color:var(--ink);width:clamp(150px,20vw,230px);aspect-ratio:1;border-radius:28px;border:5px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-size:30px;padding:10px}
.swatch svg{width:70%;height:auto}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.swatch[aria-pressed="true"]{transform:scale(1.06)}.swatch{transition:transform .2s,border-color .2s}}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.huge-btn{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:32px 52px;font-family:var(--f-display);font-size:38px}
.huge-btn svg{width:96px;height:96px}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:18px;padding:8px}
.waiting{display:flex;gap:14px}
.waiting i{width:24px;height:24px;border-radius:50%;background:var(--line);display:block}
.waiting i.on{background:var(--accent)}
.count-num{width:140px;height:140px;border-radius:50%;border:6px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:70px;color:var(--accent)}
.next-ic{width:120px;height:120px;color:var(--accent)}
.reveal{flex:1;min-height:0;display:flex}
.reveal .photo-box{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:12px 18px;font-family:var(--f-display);font-size:26px}
.chip svg{width:46px;height:46px}

/* 교사 설정 */
.setup-page{max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.setup-page h1{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0}
.setup-page .lead{margin:0;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:18px;display:flex;gap:10px;align-items:center}
.card h2 .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.card h3{margin:6px 0 0;font-size:16px}
.card p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{flex:1;min-width:200px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.status{font-size:15px;color:var(--muted)}
.status.good{color:var(--ok);font-weight:700}
.status.bad{color:#A6382B;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.opt b{display:block}
.opt span{font-size:14px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:15px;color:var(--muted);background:var(--surface);border-left:4px solid var(--aqua);padding:10px 14px;border-radius:0 10px 10px 0}
details.log{background:var(--surface);border-radius:14px;padding:12px 16px;width:100%;max-width:620px;text-align:left}
details.log summary{cursor:pointer;font-weight:700}
details.log table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
details.log td,details.log th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}

.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-in-out forwards}
.fadein{opacity:0;animation:fadein .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font-family:var(--f-body);max-height:279mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid}
  .pa-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:3mm;font-size:11pt}
  .pa-head h1{font-family:var(--f-display);font-weight:400;font-size:18pt;margin:0}
  .pa-img{display:block;margin:0 auto;max-width:100%;max-height:200mm;border:1px solid #999}
  .pa-legend{display:flex;flex-wrap:wrap;gap:2mm 6mm;justify-content:center;margin-top:3mm;font-size:10.5pt}
  .pa-legend span{display:flex;align-items:center;gap:1.5mm}
  .pa-legend svg{width:7mm;height:7mm}

}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0;animation:none}.fadein{opacity:1;animation:none}.photo-wrap img{transition:none}}
</style>
</head>
<body class="setup">
<div class="app">
  <header class="top">
    <ol class="schedule" id="schedule" aria-label="오늘 할 일"></ol>
    <div class="tools">
      <button class="tool" id="soundBtn" aria-pressed="false" type="button"></button>
      <span class="status" id="voiceNote" hidden style="max-width:260px;font-size:13px"></span>
      <button class="tool" id="setupBtn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>설정</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="bar">
    <div class="left"><button class="btn" id="replayBtn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>다시 듣기</button></div>
    <div class="dots" id="dots"></div>

/* ================= 한국어 ================= */
function batchim(w){const c=w.charCodeAt(w.length-1); if(c>=0xAC00&&c<=0xD7A3) return (c-0xAC00)%28!==0; return /[0-9LMNlmn]$/.test(w);}
const eun=w=>w+(batchim(w)?'은':'는');
const eul=w=>w+(batchim(w)?'을':'를');
const yeyo=w=>w+(batchim(w)?'이에요':'예요');

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 소리 ================= */
let lastSay='', speakSeq=0;
/* ---------- 목소리: 한 수업은 한 목소리로 ----------
   engine: gemini(지금 키) · cloud(Google Cloud TTS, 같은 목소리를 빠르게) · device(기기)
   문장마다 잘라 저장해 두고 다시 씀(브라우저에 저장되어 다음 수업에도 바로 나옴). */
let actx=null, curSrc=null, softTimer=null, pdown=false;
document.addEventListener('pointerdown',()=>{pdown=true;},true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{pdown=false;},true));
function getCtx(){ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } return actx; }
function unlockAudio(){
  try{ const c=getCtx(); if(!c) return; if(c.state==='suspended') c.resume();
    const b=c.createBuffer(1,240,24000), x=c.createBufferSource(); x.buffer=b; x.connect(c.destination); x.start(); }catch(e){}
}
/* 소리 정리: 말소리는 건드리지 않고, 앞뒤 빈 곳과 끝에 따로 붙은 아주 짧은 잡음만 정리 */
function cleanPCM(bin,rate){
  const n=bin.length>>1, f=new Float32Array(n);
  for(let k=0;k<n;k++){ let v=bin.charCodeAt(2*k)|(bin.charCodeAt(2*k+1)<<8); if(v>32767) v-=65536; f[k]=v/32768; }
  const W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }
  const th=Math.max(0.003,mx*0.04);
  const seg=[]; let on=-1;
  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));
  const body=f.slice(st,en), L=body.length, fi=Math.min(L,Math.round(rate*0.008)), fo=Math.min(L,Math.round(rate*0.04));
  for(let k=0;k<fi;k++) body[k]*=k/fi;
  for(let k=0;k<fo;k++) body[L-1-k]*=k/fo;
  const lead=Math.round(rate*0.06), out=new Float32Array(lead+L); out.set(body,lead);
  return {data:out,rate};
}
function playClip(clip,id){
  return new Promise(res=>{
    const c=getCtx(); if(!c){res(); return;}
    if(c.state==='suspended') c.resume();
    const b=c.createBuffer(1,clip.data.length,clip.rate);
    if(b.copyToChannel) b.copyToChannel(clip.data,0); else b.getChannelData(0).set(clip.data);
    const x=c.createBufferSource(), g=c.createGain(); g.gain.value=0.9;
    x.buffer=b; x.connect(g); g.connect(c.destination);
    x.onended=()=>{ if(curSrc&&curSrc.src===x) curSrc=null; res(); };
    curSrc={src:x,g,res}; x.start();
  });
}
function stopVoice(){
  try{speechSynthesis.cancel();}catch(e){}
  if(curSrc){ const {src,g,res}=curSrc; curSrc=null; try{ src.onended=null; const t=actx.currentTime; g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+0.05); src.stop(t+0.06); }catch(e){} if(res) res(); }
}
/* 브라우저에 목소리 저장 (IndexedDB) */
const vdb={db:null, ready:null};
vdb.ready=new Promise(r=>{ try{ const q=indexedDB.open('shapeFinderVoice',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('clips');
  q.onsuccess=()=>{vdb.db=q.result; r();}; q.onerror=()=>r(); }catch(e){ r(); } });
async function idbGet(k){ await vdb.ready; if(!vdb.db) return null; return new Promise(r=>{ try{ const q=vdb.db.transaction('clips').objectStore('clips').get(k); q.onsuccess=()=>{ const v=q.result; r(v?{data:new Float32Array(v.buf),rate:v.rate}:null); }; q.onerror=()=>r(null); }catch(e){ r(null); } }); }
function idbPut(k,clip){ try{ if(vdb.db) vdb.db.transaction('clips','readwrite').objectStore('clips').put({buf:clip.data.buffer.slice(0),rate:clip.rate},k); }catch(e){} }

const VQ={list:[], busy:false, clips:new Map()};
const timbre=()=>['Leda','Aoede','Kore'].includes(S.timbre)?S.timbre:'Leda';
function engineReady(e){ return e==='cloud'?!!S.cloudKey:e==='device'; }
function chooseEngine(){ S.engineNow = engineReady(S.engine)?S.engine:'device'; S.voiceNote=''; }
function getClip(text,urgent){
  const k=S.engineNow+'|'+timbre()+'|'+text;
  let c=VQ.clips.get(k);
  if(!c){
    c={text,key:k,engine:S.engineNow,done:false}; c.p=new Promise((res,rej)=>{c.res=res; c.rej=rej;}); c.p.catch(()=>{});
    VQ.clips.set(k,c);
    idbGet(k).then(v=>{ if(v){ c.done=true; c.res(v); } else { urgent?VQ.list.unshift(c):VQ.list.push(c); pumpVoice(); } });
  } else if(urgent && !c.done){ const i=VQ.list.indexOf(c); if(i>0){ VQ.list.splice(i,1); VQ.list.unshift(c); } }
  return c.p;
}
async function pumpVoice(){
  if(VQ.busy) return; VQ.busy=true;
  while(VQ.list.length){
    const c=VQ.list.shift();
    if(c.engine!==S.engineNow){ c.rej(new Error('engine changed')); VQ.clips.delete(c.key); continue; }
    let tries=0;
    for(;;){
      try{ const clip=await synth(c.text,c.engine); c.done=true; idbPut(c.key,clip); c.res(clip); break; }
      catch(e){
        tries++;
        if(e.quota){
          if(tries<=2){ await new Promise(r=>setTimeout(r,e.wait||12000)); continue; }
          S.engineNow='device'; S.voiceNote='Google 목소리 사용량이 다 되어, 이번 수업은 기기 목소리로 바꿨어요.';
          showVoiceNote(); VQ.list.forEach(x=>{x.rej(e); VQ.clips.delete(x.key);}); VQ.list=[];
          c.rej(e); VQ.clips.delete(c.key); break;
        }
        if(tries<2){ await new Promise(r=>setTimeout(r,1500)); continue; }
        c.rej(e); VQ.clips.delete(c.key); break;
      }
    }
  }
  VQ.busy=false;
}
async function synth(text,engine){
  if(engine==='cloud'){
    const call=async withRate=>{
      const audioConfig={audioEncoding:'LINEAR16',sampleRateHertz:24000}; if(withRate) audioConfig.speakingRate=0.92;
      return fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(S.cloudKey),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({input:{text},voice:{languageCode:'ko-KR',name:`ko-KR-Chirp3-HD-${timbre()}`},audioConfig})});
    };
    let r=await call(S.cloudRate!==false);
    if(r.status===400 && S.cloudRate!==false){ S.cloudRate=false; r=await call(false); }
    if(!r.ok){ let m=''; try{m=(await r.json()).error.message||'';}catch(e){} S.ttsError=r.status+' '+m; const er=new Error(S.ttsError); if(r.status===429) er.quota=true; throw er; }
    const j=await r.json(); const bin=atob(j.audioContent||'');
    const di=bin.indexOf('data'); const pcm=di>=0&&di<200?bin.slice(di+8):bin.slice(44);
    return cleanPCM(pcm,24000);
  }
  throw new Error('device');
}
function prefetchVoice(lines,urgent){
  if(S.engineNow==='device') return;
  const parts=[]; lines.forEach(t=>splitSay(t).forEach(x=>{ if(!parts.includes(x)) parts.push(x); }));
  (urgent?parts.reverse():parts).forEach(x=>getClip(x,!!urgent));
}
/* 문장 단위로 나눔 → 같은 문장은 다시 만들지 않음 */
function splitSay(t){ return String(t||'').split(/(?<=[.!?,])\s+/).map(x=>x.trim()).filter(Boolean); }
function deviceSay(text,id,done){
  if(!('speechSynthesis' in window)){ done(); return; }
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=0.85; u.volume=0.7;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ko')); if(v) u.voice=v;
    u.onend=u.onerror=()=>{ if(id===speakSeq) done(); };
    speechSynthesis.speak(u);
  }catch(e){ done(); }
}
function showVoiceNote(){ const n=$('voiceNote'); if(n){ n.textContent=S.voiceNote||''; n.hidden=!S.voiceNote; } }
/* 바로 말하기 */
function speak(text,onEnd){
  if(text) lastSay=text;
  if(softTimer){ clearTimeout(softTimer); softTimer=null; }
  stopVoice();
  const id=++speakSeq; let fired=false; const done=()=>{ if(fired) return; fired=true; if(onEnd) onEnd(); };
  if(!S.engineNow) chooseEngine();
  if(!S.sound || !lastSay){ if(onEnd) setTimeout(done,Math.max(1200,(lastSay||'').length*150)); return; }
  if(S.engineNow==='device'){ deviceSay(lastSay,id,done); return; }
  const parts=splitSay(lastSay), ps=parts.map(x=>getClip(x,true));
  (async()=>{
    for(let i=0;i<parts.length;i++){
      let clip=null;
      try{ clip=await Promise.race([ps[i],new Promise((_,rj)=>setTimeout(()=>rj(new Error('slow')),20000))]); }catch(e){}
      if(id!==speakSeq) return;
      if(!clip){ if(S.engineNow==='device'){ deviceSay(parts.slice(i).join(' '),id,done); return; } continue; }
      await playClip(clip,id);
      if(id!==speakSeq) return;
      if(i<parts.length-1) await new Promise(r=>setTimeout(r,/,$/.test(parts[i])?220:320));
      if(id!==speakSeq) return;
    }
    done();
  })();
}
/* 아이가 계속 누르는 동안은 기다렸다가, 마지막 행동이 끝나면 말함 */
function speakSoon(text,onEnd,wait=650){
  lastSay=text; stopVoice(); speakSeq++;
  if(softTimer) clearTimeout(softTimer);
  const go=()=>{ if(pdown){ softTimer=setTimeout(go,250); return; } softTimer=null; speak(text,onEnd); };
  softTimer=setTimeout(go,wait);
}
/* 말이 끝난 뒤 잠시 쉬고 다음으로 */
function speakThen(text,pause,fn,soft){ const tk=token; (soft?speakSoon:speak)(text,()=>timers.push(setTimeout(()=>{ if(tk===token) fn(); },pause))); }
/* 같은 칭찬을 되풀이하지 않음: 한 수업에서 같은 말은 2번까지, 연속으로는 안 씀 */
const PHRASES={
  praise:['맞아요','좋아요','그래요','바로 그거예요','훌륭해요','잘했어요','멋져요'],
  more:['또 있어요','하나 더 있어요','더 찾아봐요','다른 것도 찾아봐요'],
  all:['다 찾았어요','모두 찾았어요','빠짐없이 다 찾았어요'],
  painted:['다 칠했어요','예쁘게 칠했어요','꼼꼼하게 칠했어요','다 채웠어요']
};
function phrase(kind){
  const used=S.said||(S.said={}), last=S.lastPhrase||(S.lastPhrase={});
  const pool=PHRASES[kind].filter(p=>p!==last[kind] && (used[p]||0)<2);
  if(!pool.length) return '';
  const min=Math.min(...pool.map(p=>used[p]||0)), c=pool.filter(p=>(used[p]||0)===min);
  const p=c[Math.floor(Math.random()*c.length)];
  used[p]=(used[p]||0)+1; last[kind]=p; return p;
}

  ...Object.values(PHRASES).flat().map(x=>x+'.'), ...NUM_WORD.map(x=>x+'.'),

/* ================= 도형 그리기 ================= */
function iconShape(type,a){
  return type==='circle' ? `<circle cx="50" cy="50" r="40" ${a}/>`
    : type==='ellipse' ? `<ellipse cx="50" cy="50" rx="44" ry="27" ${a}/>`
    : type==='triangle' ? `<polygon points="50,10 92,86 8,86" ${a}/>`
    : `<rect x="12" y="12" width="76" height="76" rx="2" ${a}/>`;
}
function shapeIcon(type, color, cls='shape-ic', fillOn=true){
  const c=color||hex(), id='gi'+Math.random().toString(36).slice(2,8);
  const a=`fill="${fillOn?`url(#${id})`:'none'}" stroke="${c}" stroke-width="6" stroke-linejoin="round"`;
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity=".2"/></linearGradient></defs>${iconShape(type,a)}</svg>`;
}
function brushInner(c){
  return `<path d="M14 100 C 34 82, 58 104, 86 86" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" opacity=".9"/>
    <g transform="rotate(38 72 48)">
      <rect x="65" y="2" width="14" height="56" rx="7" fill="#B98A5E"/>
      <rect x="62" y="56" width="20" height="14" rx="3" fill="#A9B4BA"/>
      <path d="M62 70 h20 c0 16 -4 26 -10 34 c-6 -8 -10 -18 -10 -34z" fill="${c}"/>
    </g>`;
}
const brushSVG=(c,cls='')=>`<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">${brushInner(c)}</svg>`;
/* 0~1000 → 사진 픽셀 */
function geo(s){
  const sx=S.img.w/1000, sy=S.img.h/1000, b=s.box;
  if(s.type==='circle'||s.type==='ellipse'){
    const cx=(b.x0+b.x1)/2*sx, cy=(b.y0+b.y1)/2*sy;
    let rx=(b.x1-b.x0)/2*sx, ry=(b.y1-b.y0)/2*sy;
    if(s.type==='circle'){rx=ry=(rx+ry)/2;}
    return {e:true,cx,cy,rx,ry};
  }
  const P = s.pts ? s.pts.map(([x,y])=>[x*sx,y*sy])
    : s.type==='triangle' ? [[(b.x0+b.x1)/2*sx,b.y0*sy],[b.x1*sx,b.y1*sy],[b.x0*sx,b.y1*sy]]
    : [[b.x0*sx,b.y0*sy],[b.x1*sx,b.y0*sy],[b.x1*sx,b.y1*sy],[b.x0*sx,b.y1*sy]];
  return {P};
}
function pxBounds(s){
  const g=geo(s);
  if(g.e) return {x0:g.cx-g.rx,y0:g.cy-g.ry,x1:g.cx+g.rx,y1:g.cy+g.ry};
  const xs=g.P.map(p=>p[0]), ys=g.P.map(p=>p[1]);
  return {x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};
}
function unit(to,from){const dx=to[0]-from[0],dy=to[1]-from[1],l=Math.hypot(dx,dy)||1; return [dx/l,dy/l];}
function hasRight(s){
  if(s.realRight) return true;
  if(s.type!=='quad') return false;
  const P=geo(s).P;
  return P.every((p,i)=>{const a=unit(P[(i+3)%4],p), c=unit(P[(i+1)%4],p); return Math.abs(a[0]*c[0]+a[1]*c[1])<Math.sin(RIGHT_TOL*Math.PI/180);});
}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1; let t=((px-a[0])*dx+(py-a[1])*dy)/l; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy);}
function inside(s,x,y,tol=0){
  const g=geo(s);
  if(g.e){const rx=g.rx+tol, ry=g.ry+tol; return ((x-g.cx)/rx)**2+((y-g.cy)/ry)**2<=1;}
  const P=g.P; let c=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++){
    if(((P[i][1]>y)!==(P[j][1]>y)) && (x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])) c=!c;
  }
  if(c||!tol) return c;
  return P.some((p,i)=>segDist(x,y,p,P[(i+1)%P.length])<=tol);
}
const area=s=>{const b=pxBounds(s); return (b.x1-b.x0)*(b.y1-b.y0);};
function shapeEl(s, attrs){
  const g=geo(s), f=v=>v.toFixed(1);
  return g.e ? `<ellipse cx="${f(g.cx)}" cy="${f(g.cy)}" rx="${f(g.rx)}" ry="${f(g.ry)}" ${attrs}/>`
             : `<polygon points="${g.P.map(p=>p.map(f).join(',')).join(' ')}" ${attrs}/>`;
}
/* 그리는 방식: base(흰 선) · reveal(종류별 색) · focus(고른 색 칠) · outline(고른 색 선만) · hint(점선) · wrong(회색 점선) */
function renderItems(items, b, gid){
  const grads={}; let body='', defs='', ci=0;
  const grad=(c,strong)=>{const k=gid+c.slice(1)+(strong?'s':''); if(!grads[k]) grads[k]=`<linearGradient id="${k}" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="${c}" stop-opacity="${strong?.88:.5}"/><stop offset="1" stop-color="${c}" stop-opacity="${strong?.62:.12}"/></linearGradient>`; return `url(#${k})`;};
  const J='stroke-linejoin="round" stroke-linecap="round"';
  [...items].sort((x,y)=>(x.style==='base'?0:1)-(y.style==='base'?0:1)).forEach(({s,style,delay})=>{
    const anim=delay!=null;
    const dA=anim?` pathLength="1" class="draw" style="animation-delay:${delay}s"`:'';
    const fA=anim?` class="fadein" style="animation-delay:${(delay+0.6).toFixed(2)}s"`:'';
    if(style==='base'){
      body+=shapeEl(s,`fill="none" stroke="#1C2A31" stroke-opacity=".28" stroke-width="${b*2.6}" ${J}`);
      body+=shapeEl(s,`fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-width="${b*1.1}" ${J}`);
      return;
    }
    if(style==='clear'){
      const cid=gid+'c'+(ci++);
      defs+=`<clipPath id="${cid}">${shapeEl(s,'')}</clipPath>`;
      body+=`<image href="${S.img.url}" x="0" y="0" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" clip-path="url(#${cid})"${fA}/>`;
      body+=shapeEl(s,`fill="none" stroke="#FFFFFF" stroke-opacity=".95" stroke-width="${b*4.4}" ${J}`);
      body+=shapeEl(s,`fill="none" stroke="${hex()}" stroke-width="${b*2.1}" ${J}`);
      return;
    }
    if(style==='wrong'){
      body+=shapeEl(s,`fill="none" stroke="#FFFFFF" stroke-width="${b*3}" ${J}`);
      body+=shapeEl(s,`fill="none" stroke="#7E8B92" stroke-width="${b*1.6}" stroke-dasharray="${b*4} ${b*3}" ${J}`);
      return;
    }
    const c = style==='reveal' ? TYPE_COLOR[s.type] : hex();
    const dash = style==='hint' ? ` stroke-dasharray="${b*4} ${b*3}"` : '';
    if(style!=='outline') body+=`<g${fA}>${shapeEl(s,`fill="${grad(c,style==='focus')}" stroke="none"`)}</g>`;
    body+=shapeEl(s,`fill="none" stroke="#FFFFFF" stroke-opacity=".95" stroke-width="${b*4.4}" ${J}${dA}`);
    body+=shapeEl(s,`fill="none" stroke="${c}" stroke-width="${b*2.1}" ${J}${dash}${dA}`);
    const g=geo(s);
    if(g.P && style!=='hint') g.P.forEach(p=>{
      body+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(b*2.4).toFixed(1)}" fill="#FFFFFF" stroke="${c}" stroke-width="${b*1.1}"${fA}/>`;
    });
  });
  return `<defs>${Object.values(grads).join('')}${defs}</defs>`+body;
}
const strokeBase=()=>Math.max(2.5, Math.min(S.img.w,S.img.h)/170);
function drawOverlay(id, items=[], pre=''){
  const svg=document.querySelector('#'+id+' svg'); if(!svg) return;
  const k=(S.zoom[id]&&S.zoom[id].k)||1;
  svg.innerHTML=pre+renderItems(items, strokeBase()/Math.sqrt(k), id);
}
const baseAll=(except=[])=>S.shapes.filter(s=>!except.includes(s)).map(s=>({s,style:'base'}));

/* 사진 틀, 맞추기, 확대 */
let fitIds=[];
function photoHTML(id, faint=true){
  return `<div class="photo-box" id="${id}"><div class="vp"><div class="photo-wrap"><img class="${faint?'faint':''}" src="${S.img.url}" alt="고른 사진" draggable="false"><svg viewBox="0 0 ${S.img.w} ${S.img.h}" preserveAspectRatio="none" aria-hidden="true"></svg></div></div></div>`;
}
function fitPhoto(id){
  const box=$(id); if(!box) return;
  const vp=box.querySelector('.vp'), wrap=box.querySelector('.photo-wrap');
  const W=box.clientWidth, H=Math.max(box.clientHeight,200), ar=S.img.w/S.img.h;
  let w=W, h=W/ar; if(h>H){h=H; w=H*ar;}
  w=Math.floor(w); h=Math.floor(h);
  vp.style.width=w+'px'; vp.style.height=h+'px'; wrap.style.width=w+'px'; wrap.style.height=h+'px';
}
function zoomTo(id, pbox, animate){
  const box=$(id); if(!box) return;
  const vp=box.querySelector('.vp'), wrap=box.querySelector('.photo-wrap');
  const w=vp.clientWidth, h=vp.clientHeight, sx=w/S.img.w, sy=h/S.img.h;
  const bw=(pbox.x1-pbox.x0)*sx, bh=(pbox.y1-pbox.y0)*sy, cx=(pbox.x0+pbox.x1)/2*sx, cy=(pbox.y0+pbox.y1)/2*sy;
  let k=Math.min(0.58*w/Math.max(bw,1), 0.58*h/Math.max(bh,1), 4); k=Math.max(1,k);
  let tx=w/2-k*cx, ty=h/2-k*cy;
  tx=Math.min(0,Math.max(w-k*w,tx)); ty=Math.min(0,Math.max(h-k*h,ty));
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  wrap.style.transition = animate&&!reduce ? 'transform 1.5s cubic-bezier(.45,0,.25,1)' : 'none';
  wrap.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;
  S.zoom[id]={k,pbox};
}
function refit(){ fitIds.forEach(id=>{fitPhoto(id); const z=S.zoom[id]; if(z) zoomTo(id,z.pbox,false);}); }
window.addEventListener('resize',refit);
/* 화면 좌표 → 사진 픽셀 좌표 (확대해도 맞음) */
function toImg(id,e){
  const r=document.querySelector('#'+id+' .photo-wrap').getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*S.img.w, (e.clientY-r.top)/r.height*S.img.h];
}
function unionPx(list){
  const bs=list.map(pxBounds);
  return {x0:Math.min(...bs.map(b=>b.x0)),y0:Math.min(...bs.map(b=>b.y0)),x1:Math.max(...bs.map(b=>b.x1)),y1:Math.max(...bs.map(b=>b.y1))};
}

function rankModel(m){
  const v=(m.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]; let s=v?parseFloat(v)*100:0;
  if(/flash/.test(m)) s+=40; if(/pro/.test(m)) s+=10; if(/lite/.test(m)) s-=25; if(/preview|exp/.test(m)) s-=15;
  return s;
}
async function checkKey(){
  readKeyFields();

    if(!r.ok){ setStatus(r.status===400||r.status===403?'키가 맞지 않아요. 복사한 키를 다시 붙여 넣어 주세요.':'확인하지 못했어요 (오류 '+r.status+'). 잠시 뒤 다시 눌러 주세요.','bad'); return false; }

      .map(m=>m.name.replace(/^models\//,'')).filter(n=>/^gemini.*image/.test(n));
    imgs.sort((a,b)=>rankModel(b)-rankModel(a)); S.imageModel=imgs[0]||'';
    const tts=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace(/^models\//,'')).filter(n=>/^gemini.*tts/.test(n));
    tts.sort((a,b)=>rankModel(b)-rankModel(a)); S.ttsModel=tts[0]||'';
    const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>m.name.replace(/^models\//,''))
      .filter(n=>/^gemini/.test(n)&&!/(tts|image|audio|live|embedding|transcribe|thinking|computer)/.test(n));
    if(!names.length){setStatus('이 키로 쓸 수 있는 Gemini 모델을 찾지 못했어요.','bad'); return false;}
    names.sort((a,b)=>rankModel(b)-rankModel(a));
    S.models=names; if(!names.includes(S.model)) S.model=names[0];

}

function loadPhoto(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const max=1280, sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.round(im.naturalWidth*sc), h=Math.round(im.naturalHeight*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(u);
      res({url:c.toDataURL('image/jpeg',0.86), w, h});
    };
    im.onerror=()=>{URL.revokeObjectURL(u); rej(new Error('load'));};
    im.src=u;
  });
}

/* ================= Gemini 분석 ================= */
const PROMPT = `You are helping a special-education teacher make a shape-recognition lesson for students with developmental disabilities.
The app will show the photo faded and draw lines exactly on top of the shapes you find. So every outline you return must follow the real outline in the photo.

Think like a teacher who looks at everyday things and says "this looks like a circle". Real objects are never perfect shapes, so:
- APPROXIMATE shapes are welcome. Something roughly round counts as a circle (acorns, chestnuts, balls, fruit, buttons, coins, dots, round lids).
- BREAK objects into simple parts. Example: a mug on a saucer = ellipse (top rim of the mug) + quadrilateral (the side/body of the mug seen from the side) + ellipse (the saucer). A bottle = quadrilateral (body) + ellipse (cap top). A house = triangle (roof) + quadrilateral (wall) + quadrilateral (window).
- Each separate thing gets its own shape. Example: three acorns = three circles.

Shape types:
- circle: round-ish things seen from the front or roughly round objects
- ellipse: oval things, or round things seen at an angle (rims of cups, bowls, plates, saucers, cans)
- triangle: three-sided things or parts (roofs, pizza slices, signs, pointed parts)
- quadrilateral: four-sided things or parts (books, windows, doors, phones, screens, boards, planks, the side of a cup, labels, keys)

Rules:
- Include shapes a child can see: at least about 3% of the image width. Skip tiny details.
- Only include things whose WHOLE outline is inside the photo. Skip anything cut off by the edge of the photo (for example a laptop screen that runs off the side) or mostly hidden behind something, because its corners would not be real.
- Do not include people's faces or bodies.
- At most 5 shapes of the same type. If there are many of the same type (keyboard keys, tiles, planks, windows), pick at most 5 that are spread out across different parts of the photo, not bunched together.
- At most 12 shapes in total. Try to include more than one shape type when the photo allows it.
- "object": a short, everyday Korean noun for the thing or part (1-3 words, e.g. 도토리, 컵 입구, 컵 몸통, 컵 받침, 창문, 책, 나무판).
- "box_2d": [ymin, xmin, ymax, xmax], integers normalized to 0-1000, tightly around that shape's outline only.
- "points": for triangle and quadrilateral, the corner points as [y, x] pairs normalized to 0-1000 in clockwise order, placed on the corners in the photo (3 for triangle, 4 for quadrilateral). For circle and ellipse, an empty list.
- "right_angles": for a quadrilateral, true if the real object has right-angled (90 degree) corners in real life, such as a book, window, door, phone, sheet of paper, picture frame, screen or box face, even when the photo shows it at an angle. Otherwise false. Always false for other shapes.
- "real_ratio": for a quadrilateral, the REAL object's width divided by its height when seen straight on, keeping the same up/down direction as in the photo. Use what you know about the real object, not how stretched it looks in the photo (a standing book cover about 0.7, an upright A4 sheet about 0.71, a wide picture frame about 1.4, a phone lying sideways about 2.1, a square tile 1). Use 0 for other shapes.
If there are no suitable shapes, return an empty "shapes" list.`;
const SCHEMA = {
  type:'OBJECT',
  properties:{ shapes:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
    type:{type:'STRING', enum:['circle','ellipse','triangle','quadrilateral']},
    object:{type:'STRING'},
    box_2d:{type:'ARRAY', items:{type:'INTEGER'}},
    points:{type:'ARRAY', items:{type:'ARRAY', items:{type:'INTEGER'}}},
    right_angles:{type:'BOOLEAN'},
    real_ratio:{type:'NUMBER'}
  }, required:['type','object','box_2d','points','right_angles','real_ratio'] } } },
  required:['shapes']
};
async function callGemini(withSchema){
  const body={
    contents:[{parts:[{inline_data:{mime_type:'image/jpeg', data:S.img.url.split(',')[1]}},{text:PROMPT}]}],
    generationConfig: withSchema ? {responseMimeType:'application/json', responseSchema:SCHEMA, temperature:0.2} : {temperature:0.2}
  };
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`,{
    method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey}, body:JSON.stringify(body)});
  if(!r.ok){ let msg=''; try{msg=(await r.json()).error.message||'';}catch(e){} const e=new Error(msg); e.status=r.status; throw e; }
  const j=await r.json();
  const text=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  const m=text.match(/\{[\s\S]*\}/); if(!m) throw Object.assign(new Error('응답을 읽지 못했어요.'),{status:0});
  return JSON.parse(m[0]);
}
async function analyze(){
  let data;
  try{ data=await callGemini(true); }
  catch(e){
    if(e.status===400 && !/API key|API_KEY/i.test(e.message)) data=await callGemini(false).catch(err=>{throw friendly(err)});
    else throw friendly(e);
  }
  /* 사진 가장자리에 걸려 잘린 도형은 뺌 (잘린 모서리는 진짜 꼭짓점·각이 아니므로) */
  const whole=x=>x.box.x0>8 && x.box.y0>8 && x.box.x1<992 && x.box.y1<992;
  return pickShapes((data.shapes||[]).map(normShape).filter(Boolean).filter(whole));
}
function friendly(e){
  const s=e.status; let m='도형을 찾지 못했어요. 다시 해 볼까요?';
  if(s===400 && /API key|API_KEY/i.test(e.message)) m='API 키가 맞지 않아요. 교사 설정에서 키를 확인해 주세요.';
  else if(s===403) m='이 키로는 사용할 수 없어요. 교사 설정에서 키를 확인해 주세요.';
  else if(s===404) m='모델을 찾을 수 없어요. 교사 설정에서 "키 확인"을 다시 눌러 주세요.';
  else if(s===429) m='쓸 수 있는 양을 다 썼거나 너무 빨리 눌렀어요. 잠시 뒤 다시 해 주세요.';
  else if(s>=500) m='Gemini 서버가 바빠요. 잠시 뒤 다시 해 주세요.';
  else if(e instanceof TypeError) m='인터넷 연결을 확인해 주세요.';
  return new Error(m);
}
/* 같은 도형은 최대 5개, 사진 곳곳에 고르게. 겹치는 것은 하나만. 전체 최대 12개 */
const PER_TYPE=5, MAX_ALL=12;
function iou(a,b){
  const x0=Math.max(a.box.x0,b.box.x0), y0=Math.max(a.box.y0,b.box.y0), x1=Math.min(a.box.x1,b.box.x1), y1=Math.min(a.box.y1,b.box.y1);
  const inter=Math.max(0,x1-x0)*Math.max(0,y1-y0), ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0);
  return inter/(ar(a)+ar(b)-inter||1);
}
function spread(list,n){
  if(list.length<=n) return list;
  const c=s=>[(s.box.x0+s.box.x1)/2,(s.box.y0+s.box.y1)/2];
  const ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0);
  const rest=[...list].sort((a,b)=>ar(b)-ar(a)), out=[rest.shift()];
  while(out.length<n && rest.length){
    let best=0, bd=-1;
    rest.forEach((s,i)=>{const p=c(s); const d=Math.min(...out.map(o=>{const q=c(o); return Math.hypot(p[0]-q[0],p[1]-q[1]);})); if(d>bd){bd=d; best=i;}});
    out.push(rest.splice(best,1)[0]);
  }
  return out;
}
function pickShapes(list){
  const kept=[];
  list.forEach(s=>{ if(!kept.some(k=>k.type===s.type && iou(k,s)>0.6)) kept.push(s); });
  let out=[];
  TYPE_ORDER.forEach(t=>{ out=out.concat(spread(kept.filter(s=>s.type===t),PER_TYPE)); });
  if(out.length>MAX_ALL){ const ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0); out=out.sort((a,b)=>ar(b)-ar(a)).slice(0,MAX_ALL); }
  return out;
}
const clamp=v=>Math.max(0,Math.min(1000,Math.round(+v)));
function normShape(s){
  if(!s) return null;
  let t=String(s.type||'').toLowerCase();
  if(['square','rectangle','quadrilateral','trapezoid'].includes(t)) t='quad'; if(t==='oval') t='ellipse';
  if(!TYPES[t]) return null;
  const b=(s.box_2d||[]).map(Number); if(b.length!==4||b.some(isNaN)) return null;
  let y0=clamp(b[0]),x0=clamp(b[1]),y1=clamp(b[2]),x1=clamp(b[3]);
  if(y1<y0)[y0,y1]=[y1,y0]; if(x1<x0)[x0,x1]=[x1,x0];
  if(x1-x0<15||y1-y0<15) return null;
  let pts=Array.isArray(s.points)?s.points.filter(p=>Array.isArray(p)&&p.length===2).map(([y,x])=>[clamp(x),clamp(y)]):[];
  if(pts.length!==TYPES[t].corners||pts.length===0) pts=null;
  return {type:t, obj:String(s.object||'').trim().slice(0,10)||'이것', box:{x0,y0,x1,y1}, pts, realRight:t==='quad'&&s.right_angles===true, ratio:(t==='quad'&&+s.real_ratio>0.15&&+s.real_ratio<7)?+s.real_ratio:0};
}

function onAnalysis(){

/* ================= 사진 위에 도형 나타나기 ================= */
const ARROW='<svg class="ic" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function refitFor(ms){
  const t0=performance.now(), tk=token;
  const f=()=>{ if(tk!==token) return; refit(); if(performance.now()-t0<ms) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function showReveal(){

  screen('photo','reveal',`<h2 class="say" id="cvSay">사진을 보아요</h2>
    <div class="stage-split solo" id="split">${photoHTML('ph',false)}<div class="panel" id="lp"></div></div>`,'사진을 보아요.',{next:go});
  fitIds=['ph']; fitPhoto('ph');
  const vp=document.querySelector('#ph .vp'); vp.classList.add('tap');

  const order=[...S.shapes].sort((a,b)=>area(b)-area(a));
  function drawShapes(){

    later(1200,()=>drawOverlay('ph',order.map((s,i)=>({s,style:'reveal',delay:i*0.8}))));
    later(1200+(order.length-1)*800+1500+3000, toLearn);

/* ================= 수업 만들기 ================= */
function buildLesson(shapes){
  S.shapes=shapes;
  S.types=TYPE_ORDER.filter(t=>shapes.some(s=>s.type===t));
  S.steps=[{kind:'showAll'}];
  if(S.paint) S.types.forEach(t=>S.steps.push({kind:'paint',type:t}));
  S.types.forEach(t=>{
    if(TYPES[t].corners===0) return;
    if(S.level===2) S.steps.push({kind:'edge',type:t},{kind:'vertex',type:t});
    if(S.level===3) S.steps.push({kind:'angle',type:t});
  });
  S.tasks=S.types.map(t=>({kind:'type',type:t}));
  if(S.level===3 && shapes.some(hasRight) && shapes.some(s=>!hasRight(s))) S.tasks.push({kind:'right'});
  S.li=0; S.ti=0; S.log=[]; S.foundAll=new Set(); S.said={}; S.lastPhrase={}; S.defsSaid=new Set();
  const L=[...S.types.map(t=>`${nm(t)}. ${learnLine(t)}.`)];
  S.types.forEach(t=>{ const nn=nm(t), c=ofType(t).length;
    if(S.paint) L.push(c>1?`붓으로 ${nn} ${KO_COUNT[c-1]} 개를 모두 칠해요.`:`붓으로 ${eul(nn)} 칠해요.`);
    L.push(`${nn} ${KO_COUNT[c-1]} 개를 찾아 눌러요.`); });
  shapes.forEach(x=>L.push(`${eun(x.obj)} ${shapeOf(x.type)}.`));
  if(S.level===2) L.push('변을 눌러서 세어요. 곧은 선을 변이라고 해요.','꼭짓점을 눌러서 세어요. 두 곧은 선이 만나는 점을 꼭짓점이라고 해요.');
  if(S.level===3) L.push('각을 눌러서 세어요. 한 점에서 그은 두 반직선으로 이루어진 도형을 각이라고 해요.',...Object.values(ANGLE_DEF),'직각이에요.','각이에요.');
  prefetchVoice(L);
}

/* 확대 → 도형이 사진에서 빠져나와 오른쪽으로 → 이름 */
function flyShape(s, target, delay){
  const wrap=document.querySelector('#ph .photo-wrap'); if(!wrap||!target) return;
  const r=wrap.getBoundingClientRect(), b=pxBounds(s);
  const pad=Math.max(b.x1-b.x0,b.y1-b.y0)*0.12, kx=r.width/S.img.w, ky=r.height/S.img.h;
  const vx=b.x0-pad, vy=b.y0-pad, vw=b.x1-b.x0+2*pad, vh=b.y1-b.y0+2*pad;
  const left=r.left+vx*kx, top=r.top+vy*ky, w=vw*kx, h=vh*ky;
  const k=(S.zoom.ph&&S.zoom.ph.k)||1;
  const el=document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('class','fly'); el.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`); el.setAttribute('preserveAspectRatio','none');
  el.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px`;
  el.innerHTML=renderItems([{s,style:'focus'}],strokeBase()/Math.sqrt(k),'fl'+Math.random().toString(36).slice(2,6));
  document.body.appendChild(el);
  const tr=target.getBoundingClientRect();
  const sc=Math.min(tr.width/w,tr.height/h)*0.9;
  const dx=tr.left+tr.width/2-(left+w/2), dy=tr.top+tr.height/2-(top+h/2);
  const end=`translate(${dx}px,${dy}px) scale(${sc})`;
  const a=el.animate([
    {transform:'translate(0,0) scale(1)',opacity:1},
    {transform:'translate(0,-6px) scale(1.15)',opacity:1,offset:.2},
    {transform:end,opacity:1,offset:.85},
    {transform:end,opacity:0}
  ],{duration:1300,delay,easing:'cubic-bezier(.55,0,.25,1)',fill:'both'});
  a.onfinish=a.oncancel=()=>el.remove();
  const tk=token; setTimeout(()=>{ if(tk!==token) el.remove(); },1300+delay+50);
}
/* FLIP: 줄이 늘어날 때 기존 줄이 부드럽게 위로 */
function flip(box, mutate){
  const before=new Map([...box.children].map(k=>[k,k.getBoundingClientRect()]));
  mutate();
  if(reduceMotion()) return;
  [...box.children].forEach(k=>{
    const b=before.get(k); if(!b) return;
    const a=k.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2), sc=b.height/(a.height||1);
    if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(sc-1)<.02) return;
    k.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.3,0,.2,1)'});
  });
}
function roundExtra(t){ return ''; }
/* 도형 종류마다: 확대 → 도형이 빠져나와 오른쪽 → 이름과 "○○은 △△ 모양이에요" → 위로 올라가 쌓임 */

/* 붓으로 칠하기: 같은 도형을 모두 칠함. 다 칠하면 그 안에 사진 속 물체가 선명하게 드러남 */
function clearCrop(s){
  const b=pxBounds(s), w=b.x1-b.x0, h=b.y1-b.y0, pad=Math.max(w,h)*0.08;
  return `<svg class="meter" viewBox="${(b.x0-pad).toFixed(1)} ${(b.y0-pad).toFixed(1)} ${(w+2*pad).toFixed(1)} ${(h+2*pad).toFixed(1)}" aria-hidden="true">${renderItems([{s,style:'clear'}],Math.max(w,h)/45,'cc'+Math.random().toString(36).slice(2,7))}</svg>`;
}
function showPaint(t){
  const name=nm(t);
  const list=[...ofType(t)].sort((a,b)=>a.box.x0-b.box.x0||a.box.y0-b.box.y0);
  const ask=`붓으로 ${eul(name)} 칠해요`;
  const uid='p'+Math.random().toString(36).slice(2,7);
  const meter=i=>`<svg class="meter" viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="${uid}m${i}">${iconShape(t,'')}</clipPath></defs>
      ${iconShape(t,'fill="#F1F4F5" stroke="none"')}
      <rect id="${uid}f${i}" x="0" y="100" width="100" height="0" fill="${hex()}" clip-path="url(#${uid}m${i})"/>
      ${iconShape(t,`fill="none" stroke="${hex()}" stroke-width="6" stroke-linejoin="round"`)}</svg>`;
  screen('learn','paint',`
    <div class="task-head">${brushSVG(hex(),'mini')}<h2 class="say">${esc(ask)}</h2></div>
    <div class="stage-split">${photoHTML('ph')}
      <div class="panel">
        <div class="meters">${list.map((s,i)=>`<div class="meter-item" id="${uid}i${i}">${meter(i)}</div>`).join('')}</div>
        <div class="line" id="pmsg">${esc(name)}${list.length>1?` ${list.length}개`:''}</div>
      </div>
    </div>`, list.length>1?`붓으로 ${name} ${KO_COUNT[list.length-1]} 개를 모두 칠해요.`:ask+'.', {next:nextLearn,dots:learnDots()});
  fitIds=['ph']; fitPhoto('ph');
  zoomTo('ph',unionPx(list),false);
  const pre=`<defs>${list.map((s,i)=>`<clipPath id="${uid}c${i}">${shapeEl(s,'')}</clipPath>`).join('')}</defs>`
    +list.map((s,i)=>`<g id="${uid}g${i}" clip-path="url(#${uid}c${i})"></g>`).join('')+`<g id="${uid}d"></g>`;
  drawOverlay('ph',list.map(s=>({s,style:'outline'})),pre);
  const wr=document.querySelector('#ph .photo-wrap').getBoundingClientRect();
  const r=26/(wr.width/S.img.w);
  const samples=list.map(s=>{
    const bb=pxBounds(s), out=[], G=18;
    for(let i=0;i<G;i++) for(let j=0;j<G;j++){
      const x=bb.x0+(i+.5)/G*(bb.x1-bb.x0), y=bb.y0+(j+.5)/G*(bb.y1-bb.y0);
      if(inside(s,x,y)) out.push([x,y,false]);
    }
    return {pts:out, n:0, done:false};
  });
  const vp=document.querySelector('#ph .vp'); vp.classList.add('paint');
  let paths=null, pts=[];
  const allDone=()=>samples.every(q=>q.done);
  const complete=i=>{
    const q=samples[i], s=list[i]; q.done=true;
    const g=$(uid+'g'+i); g.innerHTML=shapeEl(s,`fill="${hex()}"`);
    const mf=$(uid+'f'+i); if(mf){mf.setAttribute('y',0); mf.setAttribute('height',100);}
    const msg=withP(phrase('painted'),`${eun(s.obj)} ${shapeOf(t)}.`);
    $('pmsg').textContent=msg;
    S.log.push({task:`${name} 칠하기`, result:'다 칠함', obj:s.obj});
    later(650,()=>{
      g.innerHTML='';
      $(uid+'d').insertAdjacentHTML('beforeend',`<image class="fadein" href="${S.img.url}" x="0" y="0" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" clip-path="url(#${uid}c${i})"/>`);
      const mi=$(uid+'i'+i); mi.innerHTML=clearCrop(s); mi.classList.add('got');
    });
    if(allDone()){ vp.classList.remove('paint'); paths=null; speakThen(msg,2200,nextLearn,true); }
    else speakSoon(msg);
  };
  let cur=-1;
  const mark=(x,y)=>{
    const i=cur, q=samples[i]; if(i<0||q.done) return;
    for(const p of q.pts){ if(!p[2] && (p[0]-x)**2+(p[1]-y)**2<=r*r*0.9){p[2]=true; q.n++;} }
    const pct=q.pts.length?q.n/q.pts.length:1;
    const mf=$(uid+'f'+i); if(mf){mf.setAttribute('y',100-pct*100); mf.setAttribute('height',pct*100);}
    if(pct>=0.78) complete(i);
  };
  /* 붓을 댄 곳의 도형 하나만 칠함 (가까운 도형으로 번지지 않게) */
  const pickShape=(x,y)=>{
    const open=list.map((s,i)=>i).filter(i=>!samples[i].done);
    const ins=open.filter(i=>inside(list[i],x,y)).sort((a,b)=>area(list[a])-area(list[b]));
    if(ins.length) return ins[0];
    let best=-1, bd=Infinity;
    open.forEach(i=>{ const b=pxBounds(list[i]); const dx=Math.max(b.x0-x,0,x-b.x1), dy=Math.max(b.y0-y,0,y-b.y1), d=Math.hypot(dx,dy); if(d<bd){bd=d; best=i;} });
    return bd<=r*1.5?best:-1;
  };
  vp.addEventListener('pointerdown',e=>{
    if(allDone()) return; e.preventDefault(); try{vp.setPointerCapture(e.pointerId);}catch(_){}
    const [x,y]=toImg('ph',e); pts=[[x,y]];
    cur=pickShape(x,y); if(cur<0){ paths=null; return; }
    paths=list.map((s,i)=>{
      if(i!==cur) return null;
      const pa=document.createElementNS('http://www.w3.org/2000/svg','path');
      pa.setAttribute('fill','none'); pa.setAttribute('stroke',hex()); pa.setAttribute('stroke-opacity','.85');
      pa.setAttribute('stroke-width',(r*2).toFixed(1)); pa.setAttribute('stroke-linecap','round'); pa.setAttribute('stroke-linejoin','round');
      pa.setAttribute('d',`M${x.toFixed(1)} ${y.toFixed(1)} l0.1 0`);
      $(uid+'g'+i).appendChild(pa); return pa;
    });
    mark(x,y);
  });
  vp.addEventListener('pointermove',e=>{
    if(!paths||allDone()) return;
    const [x,y]=toImg('ph',e), last=pts[pts.length-1];
    if((x-last[0])**2+(y-last[1])**2 < (r*0.3)**2) return;
    pts.push([x,y]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
    paths.forEach((pa,i)=>{ if(pa&&!samples[i].done) pa.setAttribute('d',d); });
    const steps=Math.ceil(Math.hypot(x-last[0],y-last[1])/(r*0.5));
    for(let k=1;k<=steps;k++) mark(last[0]+(x-last[0])*k/steps, last[1]+(y-last[1])*k/steps);
  });
  const end=()=>{paths=null; cur=-1;};
  vp.addEventListener('pointerup',end); vp.addEventListener('pointercancel',end);
}

/* 꼭짓점·각 세기 */
/* 변·꼭짓점·각: 사진 속 실제 도형으로 배움 */
const ANGLE_DEF={
  '직각':'종이를 반듯하게 두 번 접었을 때 생기는 각을 직각이라고 해요.',
};
const ANGLE_COLOR={'직각':'#1F6C75','각':'#E07A1F'};
/* 직각(88.5°~91.5°)인 각만 정확히 90°로 맞추고, 나머지 각은 사진 그대로 둠 */
function rotV(v,deg){ const r=deg*Math.PI/180, c=Math.cos(r), s2=Math.sin(r); return [v[0]*c-v[1]*s2, v[0]*s2+v[1]*c]; }
function interiorAngles(P){ const n=P.length; return P.map((p,i)=>{ const u1=unit(P[(i+n-1)%n],p), u2=unit(P[(i+1)%n],p); return Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])))*180/Math.PI; }); }
function idealPolygon(P){
  const n=P.length, deg=interiorAngles(P), total=(n-2)*180;
  const kind=deg.map(d=>Math.abs(d-90)<=RIGHT_TOL?'R':'X');
  const lo=k=>k==='R'?90:5, hi=k=>k==='R'?90:175;
  let T=deg.map((d,i)=>Math.min(hi(kind[i]),Math.max(lo(kind[i]),d)));
  for(let it=0;it<30;it++){
    const diff=total-T.reduce((a,b)=>a+b,0); if(Math.abs(diff)<0.01) break;
    const free=T.map((t,i)=>i).filter(i=>kind[i]!=='R' && (diff>0?T[i]<hi(kind[i]):T[i]>lo(kind[i])));
    if(!free.length) break;
    free.forEach(i=>{ T[i]=Math.min(hi(kind[i]),Math.max(lo(kind[i]),T[i]+diff/free.length)); });
  }
  if(Math.abs(total-T.reduce((a,b)=>a+b,0))>0.5){
    if(n===4) T=[90,90,90,90];
    else { const sum=deg.reduce((a,b)=>a+b,0); T=deg.map(d=>d*total/sum); }
  }
  const cr=(a,b)=>a[0]*b[1]-a[1]*b[0];

    const sc=document.querySelector('#ph .photo-wrap').getBoundingClientRect().width/S.img.w;
    const tolFor=s=>{const b=pxBounds(s); return Math.max(30/sc, 0.2*Math.min(b.x1-b.x0,b.y1-b.y0));};
    const hits=S.shapes.filter(s=>inside(s,x,y,tolFor(s))).sort((a,b)=>area(a)-area(b));
    const fb=$('fb');
    const hit=hits.find(s=>isTarget(s,task)&&!found.has(s));
    if(hit){
      found.add(hit); S.foundAll.add(hit);
      S.log.push({task:what+' 찾기', result:hinted?'도움 받아 맞힘':wrong?'다시 해서 맞힘':'바로 맞힘', obj:hit.obj});
      wrong=0; hinted=false; redraw();
      const left=targets.length-found.size;
      const say1 = withP(phrase('praise'), task.kind==='type' ? `${eun(hit.obj)} ${shapeOf(hit.type)}.` : `${hit.obj}에 직각이 있어요.`);
      const say2 = ' '+(left ? phrase('more')||'' : phrase('all')||'다 찾았어요')+(left?'.':'!');
      const sayAll=(say1+(say2.trim()==='.'?'':say2)).trim();
      fb.className='feedback ok'; fb.innerHTML=ICON.check+`<span>${esc(sayAll)}</span>`;
      $('slots').innerHTML=targets.map((_,i)=>i<found.size?shapeIcon(iconType,null,''):shapeIcon(iconType,'#B9C5CA','',false)).join('');
      $('found').innerHTML=`<div class="pop">${cropHTML(hit)}<div class="row2">${shapeIcon(hit.type,null,'')}<div class="line">${esc(hit.obj)} · ${esc(nm(hit.type))}</div></div></div>`;
      if(!left) speakThen(sayAll,2200,nextFind,true); else speakSoon(sayAll);
      return;
    }
    if(hits.some(s=>found.has(s)&&isTarget(s,task))){
      fb.className='feedback'; fb.innerHTML='<span>찾았어요. 또 찾아요.</span>'; speakSoon('찾았어요. 또 찾아요.'); return;
    }
    wrong++;
    const other=hits[0];
    const oWhat=other?`${eun(other.obj)} ${shapeOf(other.type)}.`:'';
    const rest=targets.filter(s=>!found.has(s));
    if(S.errorMode==='retry' && wrong===1){
      redraw(other?[{s:other,style:'wrong'}]:[]);
      fb.className='feedback'; fb.innerHTML=`<span>${esc(oWhat)} 다시 찾아요.</span>`; speakSoon(oWhat+' 다시 찾아요.');
      return;
    }
    hinted=true;
    redraw(rest.map(s=>({s,style:'hint'})));
    fb.className='feedback hint'; fb.innerHTML=ICON.point+`<span>${esc(oWhat)} 여기 있어요. 눌러요.</span>`;
    speakSoon(oWhat+' 여기 있어요. 눌러요.');
  });
}
function nextFind(){
  S.ti++;
  if(S.ti<S.tasks.length) showFind();
  else showEnd();
}

/* ================= 4. 끝: 만화 그림 ================= */
const CARTOON_EN={circle:'circle',ellipse:'oval (ellipse)',triangle:'triangle',quad:'rectangle / four-sided shape'};
function cartoonPrompt(){
  const list=S.shapes.map(s=>{
    const cx=Math.round((s.box.x0+s.box.x1)/20), cy=Math.round((s.box.y0+s.box.y1)/20);
    return `- a ${CARTOON_EN[s.type]}: the ${s.obj} (about ${cx}% from the left, ${cy}% from the top)`;
  }).join('\n');
  return `Redraw this exact photo as a bright, cute cartoon illustration for young children, in the style of a soft, rounded 3D preschool TV animation: cheerful pastel colors, smooth simple surfaces, clean outlines, gentle lighting.
Keep the same composition, camera angle, objects and their positions, so a child can recognize the original photo.
Do not add any characters, people, animals, faces, text, letters, numbers or logos. Remove any brand names or writing.
Make these shapes stand out clearly, each with a thick bright outline and a soft glow, and make them look clean and geometric:
${list}`;
}
function startCartoon(){
  if(!S.apiKey || !S.imageModel){ S.cartoon={status:'none'}; return; }
  S.cartoon={status:'pending'}; const myImg=S.img;
  (async()=>{
    const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:S.img.url.split(',')[1]}},{text:cartoonPrompt()}]}],
      generationConfig:{responseModalities:['TEXT','IMAGE']}};
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.imageModel)}:generateContent`,{
      method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey}, body:JSON.stringify(body)});
    if(!r.ok){ let m=''; try{m=(await r.json()).error.message||'';}catch(e){} throw new Error(r.status+' '+m); }
    const j=await r.json();
    const part=((j.candidates||[])[0]?.content?.parts||[]).find(p=>p.inlineData||p.inline_data);
    if(!part) throw new Error('그림이 오지 않았어요');
    const d=part.inlineData||part.inline_data;
    return `data:${d.mimeType||d.mime_type||'image/png'};base64,${d.data}`;
  })().then(url=>{ if(S.img!==myImg) return; S.cartoon={status:'done',url}; onCartoon(); })
     .catch(e=>{ if(S.img!==myImg) return; S.cartoon={status:'error',msg:String(e.message||e)}; onCartoon(); });
}
function artHTML(){
  const c=S.cartoon||{status:'none'};
  if(c.status==='done') return `<img class="cartoon" src="${c.url}" alt="도형이 강조된 만화 그림">`;
  const note = c.status==='pending' ? `<div class="art-note">${waitingHTML()}<span>그림으로 바꾸고 있어요</span></div>`
    : c.status==='error' ? `<div class="art-note admin-only" style="font-size:15px;font-family:var(--f-body)">만화 그림을 만들지 못했어요: ${esc(c.msg.slice(0,120))}</div>` : '';
  return photoHTML('eph')+note;
}
function paintArt(){
  const art=$('art'); if(!art) return;
  art.innerHTML=artHTML();
  if(!(S.cartoon&&S.cartoon.status==='done')){
    fitIds=['eph']; fitPhoto('eph'); drawOverlay('eph',S.shapes.map(s=>({s,style:'focus'})));
    if(S.cartoon&&S.cartoon.status==='pending') spin();
  } else fitIds=[];
}
function onCartoon(){
  if(S.view!=='end') return;
  paintArt();
  if(S.cartoon.status==='done') speak('와! 사진이 그림이 되었어요.');
}
function showEnd(){
  const chips=S.types.map(t=>`<div class="chip">${shapeIcon(t,null,'')}<span>${esc(nm(t))}, ${esc(objList(ofType(t),5))}</span></div>`).join('');
  const rows=S.log.map(l=>`<tr><td>${esc(l.task)}</td><td>${esc(l.result)}${l.obj?' ('+esc(l.obj)+')':''}</td></tr>`).join('');
  screen('end','end',`<div class="end-wrap">
      <h2 class="say admin-only">다 했어요</h2>
      <div class="end-art" id="art"></div>
      <div class="chips">${chips}</div>
      <div class="row admin-only" style="justify-content:center">
        <button class="btn" id="same" type="button">같은 사진 한 번 더</button>
        <button class="btn primary" id="again" type="button">다른 사진으로</button>
        <button class="btn" id="printBtn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg>출력 (색칠용)</button>
      </div>
      <details class="log admin-only"><summary>교사용 기록 (${S.level}단계 · ${S.errorMode==='show'?'바로 정답 보여주기':'한 번 더 기회'}${S.demo?' · 예시 사진':''})</summary>
        <table><thead><tr><th>과제</th><th>결과</th></tr></thead><tbody>${rows||'<tr><td colspan="2">기록 없음</td></tr>'}</tbody></table>
        <p class="status" style="margin:8px 0 0">이 기록은 화면을 닫으면 사라져요. 필요하면 사진으로 남겨 두세요.</p>
      </details>
    </div>`, S.cartoon&&S.cartoon.status==='done' ? '다 했어요. 사진이 그림이 되었어요.' : '다 했어요.');
  paintArt();
  $('again').onclick=()=>{newSession(); showPhoto();};
  $('same').onclick=()=>{buildLesson(S.shapes); showReveal();};
  $('printBtn').onclick=()=>printSheet();
}

/* ================= 색칠용 출력: 색을 빼고 선만 ================= */
const loadImg=url=>new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url;});
async function makeLineArt(){
  const cartoon=!!(S.cartoon&&S.cartoon.status==='done');
  const im=await loadImg(cartoon?S.cartoon.url:S.img.url);
  const sc=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));
  const W=Math.round(im.naturalWidth*sc), H=Math.round(im.naturalHeight*sc);
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.drawImage(im,0,0,W,H);
  const src=g.getImageData(0,0,W,H), d=src.data, N=W*H;
  let a=new Float32Array(N);
  for(let i=0;i<N;i++) a[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  const blur=f=>{ const o=new Float32Array(N);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let t=0,n=0;
      for(let j=-1;j<=1;j++) for(let k=-1;k<=1;k++){ const yy=y+j, xx=x+k; if(yy>=0&&yy<H&&xx>=0&&xx<W){t+=f[yy*W+xx]; n++;} }
      o[y*W+x]=t/n; } return o; };
  a=blur(blur(a)); if(!cartoon) a=blur(a);
  const m=new Float32Array(N); const hist=new Uint32Array(1024);
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-a[i-W-1]-2*a[i-1]-a[i+W-1]+a[i-W+1]+2*a[i+1]+a[i+W+1];
    const gy=-a[i-W-1]-2*a[i-W]-a[i-W+1]+a[i+W-1]+2*a[i+W]+a[i+W+1];
    const v=Math.hypot(gx,gy); m[i]=v; hist[Math.min(1023,v|0)]++;
  }
  const keep=cartoon?0.10:0.07; let acc=0, T=1023;
  for(;T>0;T--){ acc+=hist[T]; if(acc>=N*keep) break; }
  const ink=cartoon?20:150;
  for(let i=0;i<N;i++){
    const v=m[i]>T ? ink+(255-ink)*Math.max(0,1-(m[i]-T)/(T*0.6)) : 255;
    d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255;
  }
  g.putImageData(src,0,0);
  if(!cartoon){
    const k=W/S.img.w; g.strokeStyle='#111'; g.lineJoin='round'; g.lineWidth=Math.max(3,W/170);
    S.shapes.forEach(s=>{ const q=geo(s); g.beginPath();
      if(q.e) g.ellipse(q.cx*k,q.cy*k,q.rx*k,q.ry*k,0,0,Math.PI*2);
      else { q.P.forEach((p,i)=>i?g.lineTo(p[0]*k,p[1]*k):g.moveTo(p[0]*k,p[1]*k)); g.closePath(); }
      g.stroke(); });
  }
  return c.toDataURL('image/png');
}
async function printSheet(){
  const b=$('printBtn'); const label=b.innerHTML; b.disabled=true; b.textContent='준비하고 있어요…';
  try{
    const url=await makeLineArt();
    const legend=S.types.map(t=>`<span>${shapeIcon(t,'#111','',false)}${esc(nm(t))}, ${esc(objList(ofType(t),5))}</span>`).join('');
    $('printArea').innerHTML=`<div class="pa-head"><h1>도형에 색칠해요</h1><div>이름: ____________</div></div>
      <img class="pa-img" id="paImg" src="${url}" alt=""><div class="pa-legend">${legend}</div>`;
    try{ await $('paImg').decode(); }catch(e){}
    window.print();
  }catch(e){ b.textContent='출력하지 못했어요'; await new Promise(r=>setTimeout(r,1500)); }
  b.disabled=false; b.innerHTML=label;
}

renderSoundBtn();
showSetup();
