<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="발달장애 학생을 위한 수의 자릿값 읽기 웹앱">
<title>숫자 익히기 — 자릿값 읽기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6FB; --panel:#FFFFFF; --ink:#26283B; --ink-soft:#6B6D82; --line:#E3E4F0;
  --shadow:0 10px 30px -12px rgba(38,40,59,.20);
  --base:#3B6FD1; --dark:#28509C; --tint:#E4ECFB; --rec:#E0353B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;color:var(--ink);font-family:'Noto Sans KR',sans-serif;
  background:radial-gradient(circle at 10% -10%,#E8ECFB 0%,transparent 45%),radial-gradient(circle at 105% 110%,#FBE9F1 0%,transparent 42%),var(--paper);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3vw,32px)}

/* ---------- 첫 화면: 자리 고르기 ---------- */
#pickScreen{justify-content:center;overflow-y:auto}
body.playing #pickScreen{display:none}
.hero{text-align:center}
.hero h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(34px,5.6vw,58px);margin:0 0 6px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--ink-soft);font-size:clamp(14px,2vw,18px);font-weight:500}
.pick-grid{margin-top:clamp(18px,3.4vh,34px);display:grid;grid-template-columns:repeat(5,minmax(116px,170px));gap:clamp(10px,1.6vw,16px);justify-content:center}
@media (max-width:760px){.pick-grid{grid-template-columns:repeat(3,1fr);width:100%;max-width:520px}}
@media (max-width:480px){.pick-grid{grid-template-columns:repeat(2,1fr)}}
.tier-card{border:none;border-radius:18px;padding:16px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--tcard-tint);box-shadow:var(--shadow);transition:transform .15s ease}
.tier-card:active{transform:scale(.95)}
.tier-card .tc-name{font-family:'Jua',sans-serif;font-size:clamp(20px,2.6vw,25px);color:var(--tcard-dark)}
.tier-card .tc-range{font-size:12px;font-weight:700;color:var(--tcard-dark);opacity:.78;text-align:center;line-height:1.3}
.tier-card .tc-dot{width:34px;height:6px;border-radius:4px;background:var(--tcard-base);margin-top:2px}
.pick-foot{margin-top:clamp(16px,3vh,28px);display:flex;flex-direction:column;align-items:center;gap:12px}
.voice-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px 10px;max-width:100%}
.voice-row .lbl{font-size:12.5px;font-weight:800;color:var(--ink-soft);margin:0 4px}
.seg{border:0;background:transparent;border-radius:10px;min-height:40px;padding:4px 12px;font-weight:700;font-size:14px}
.seg[aria-pressed="true"]{background:var(--tint);color:var(--dark);box-shadow:inset 0 0 0 1.5px var(--base)}
.voice-row .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 4px}
.voice-row a{color:var(--dark);font-weight:700;font-size:13.5px;text-underline-offset:3px;padding:0 6px}
.voice-row input.key{width:190px;font:inherit;font-size:13.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;-webkit-user-select:text;user-select:text}
.voice-row label{font-size:12.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.voice-note{font-size:13px;color:#9A2E1C;font-weight:700;min-height:1em}
.howto-btn{border:none;background:var(--panel);color:var(--ink-soft);font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.howto-btn svg{width:16px;height:16px}

/* ---------- 연습 화면 ---------- */
#playScreen{display:none}
body.playing #playScreen{display:flex}
.topbar{width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tb-side{display:flex;align-items:center;gap:8px;flex:1}
.tb-side.right{justify-content:flex-end}
.icon-btn{border:none;background:var(--panel);color:var(--ink);height:46px;min-width:46px;border-radius:15px;flex-shrink:0;padding:0 11px;
  display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:var(--shadow);font-weight:700;font-size:13.5px}
.icon-btn svg{width:21px;height:21px;flex:none}
.icon-btn.on{color:#fff;background:var(--base)}
.badge-wrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.badge{font-family:'Jua',sans-serif;font-size:clamp(14px,2vw,16px);color:#fff;background:var(--base);padding:9px 18px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.badge-range{font-size:11px;color:var(--ink-soft);font-weight:700}
/* 기록 중 표시: 녹화처럼 빨간 점 (깜빡이지 않음) */
.rec{display:none;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--rec);opacity:.75;padding:0 4px;white-space:nowrap}
.rec::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(224,53,59,.18)}
body.recording .rec{display:inline-flex}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px;margin-top:10px;min-height:10px}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--ink-soft);font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:999px;transition:all .15s ease}
.chip.on{background:var(--tint);border-color:var(--base);color:var(--dark)}
.chip.fixed{background:var(--base);border-color:var(--base);color:#fff;cursor:default}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:0}
.pv-table{display:flex;align-items:flex-end;justify-content:center;flex-wrap:nowrap;font-size:var(--fs,120px)}
.pv-col{display:flex;flex-direction:column;align-items:center}
.pv-digit{font-family:'Jua',sans-serif;font-variant-numeric:tabular-nums;font-size:1em;line-height:1;padding:0 .03em;color:var(--ink-soft)}
.pv-digit.filled{color:var(--base)}
/* 쉼표: 생활 표기 그대로 세 자리마다. 숫자와 헷갈리지 않게 작게, 바닥선에, 다른 글꼴(고딕)로 */
.pv-digit.comma{height:1em;display:flex;align-items:flex-end;padding:0;margin:0 -.03em}
.pv-digit.comma span{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:.56em;line-height:1;color:var(--base);transform:translateY(-.33em)}
.pv-digit.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.pv-label{font-weight:800;color:var(--dark);font-size:.24em;height:1.6em;line-height:1.6em;min-width:1.2em;text-align:center;margin-top:.2em;cursor:pointer}
.pv-label.hidden{opacity:.28}
.pv-label.spacer{opacity:0;cursor:default}
.hint{margin-top:clamp(12px,2.6vh,24px);color:var(--ink-soft);font-weight:700;font-size:clamp(14px,2vw,17px);min-height:1.4em;text-align:center}
.footer-row{width:100%;max-width:1000px;display:flex;align-items:center;padding-bottom:4px}
.counter{font-size:13px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;gap:6px}
.counter .dot{width:6px;height:6px;border-radius:50%;background:var(--base)}

/* ---------- 관리: 학생 기록 (오른쪽 서랍) ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:40;background:#fff;box-shadow:-12px 0 40px rgba(38,40,59,.18);
  transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
body.admin #drawer{transform:none}
body:not(.admin) #drawer{box-shadow:none;visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.dw-head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dw-head h2{font-family:'Jua',sans-serif;font-weight:400;font-size:24px;margin:0 0 8px}
.dw-status{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--ink-soft)}
.dw-status.on{color:var(--rec)}
.dw-status.on::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--rec)}
.dw-body{flex:1;overflow-y:auto;padding:6px 20px 90px}
.dw-sec{padding:14px 0;border-bottom:1px solid var(--line)}
.dw-sec:last-child{border-bottom:0}
.dw-sec h3{font-size:13px;color:var(--ink-soft);margin:0 0 8px;font-weight:800}
.dw-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dw select,.dw input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.dw select{flex:1;min-width:0;appearance:auto}
.dw input[type=text]{flex:1;min-width:0}
.dw .btn{border:0;border-radius:12px;min-height:44px;padding:8px 14px;font-weight:700;font-size:14.5px;background:var(--paper)}
.dw .btn.main{background:var(--base);color:#fff}
.dw .btn.stop{background:#FCE6E9;color:#A12A31}
.dw .btn.warn{background:#FCE6E9;color:#A12A31}
.dw .btn:disabled{opacity:.4;cursor:default}
.dw .small{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:8px 0 0}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.roster span{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border-radius:999px;padding:3px 4px 3px 12px;font-size:14px;font-weight:700}
.roster button{border:0;background:transparent;width:30px;height:30px;border-radius:50%;color:var(--ink-soft);font-size:17px;line-height:1}
.sum{background:var(--tint);border-radius:12px;padding:10px 12px;margin:10px 0 8px;font-size:14px;line-height:1.7}
.sum b{color:var(--dark)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:86px 1fr 74px;align-items:center;gap:8px;font-size:13.5px}
.bar .pat{font-family:'Jua',sans-serif;font-size:19px;letter-spacing:1px;text-align:right}
.bar .track{height:16px;background:var(--paper);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--base);border-radius:8px}
.bar .pct{font-weight:700;color:var(--ink-soft);font-size:12.5px}
.bar .tag{display:block;font-size:11px;font-weight:800}
.tag.now{color:var(--dark)} .tag.sup{color:#9C7A19} .tag.rev{color:var(--ink-soft)}
.flow{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.flow td{padding:5px 4px;border-bottom:1px solid var(--line)}
.flow td:first-child{color:var(--ink-soft);white-space:nowrap}
.empty{color:var(--ink-soft);font-size:13.5px;padding:8px 0}
.seg-row{display:flex;gap:4px}
.seg-row .seg{flex:1}

/* 관리 버튼 — 공통 규격 모양 (교사가 다루는 앱이라 한 번 눌러 켜고 끔) */
#adminBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:43px;height:43px;border-radius:50%;
  z-index:50;touch-action:none;padding:0;opacity:.4;transition:opacity .3s;border:1px solid rgba(14,92,170,.55);
  background:radial-gradient(ellipse 70% 45% at 50% 88%,rgba(170,245,255,.95),rgba(170,245,255,0) 70%),radial-gradient(circle at 50% 40%,#4FC4F5 0%,#1E8BE0 55%,#0D5FB8 100%);
  box-shadow:inset 0 -4px 10px rgba(150,240,255,.55),inset 0 3px 6px rgba(0,40,100,.45),0 4px 10px rgba(0,60,130,.35),0 1px 2px rgba(0,30,70,.4)}
#adminBtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(255,255,255,.35) 60%,rgba(255,255,255,.05));pointer-events:none}
#adminBtn .ab-label{position:relative;display:block;text-align:center;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:8.5px;letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 1px 1.5px rgba(0,50,110,.65);pointer-events:none}
body.admin #adminBtn .ab-label{font-family:'Jua',sans-serif;font-weight:400;font-size:17px;letter-spacing:0;color:#9FF3F5;text-shadow:0 0 6px rgba(63,207,210,.7),0 1px 1px rgba(0,0,0,.6)}
body.admin #adminBtn{opacity:.6;border-color:rgba(10,20,26,.8);
  background:radial-gradient(ellipse 70% 45% at 50% 88%,rgba(110,230,240,.85),rgba(110,230,240,0) 70%),radial-gradient(circle at 50% 40%,#3D4F5A 0%,#17242C 60%,#05090C 100%);
  box-shadow:inset 0 -4px 10px rgba(90,220,235,.45),inset 0 3px 6px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4),0 0 0 3px rgba(63,207,210,.35)}

/* ---------- 사용법: 말풍선 둘러보기 ---------- */
#tour{position:fixed;inset:0;z-index:60;display:none}
#tour.show{display:block}
#tourHole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(38,40,59,.55);transition:all .25s ease;pointer-events:none}
#tourTip{position:fixed;width:min(340px,calc(100% - 24px));background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:16px 18px 12px;transition:top .25s ease,left .25s ease}
#tourTip::before{content:"";position:absolute;left:var(--ax,40px);width:16px;height:16px;background:#fff;transform:rotate(45deg)}
#tourTip.below::before{top:-7px} #tourTip.above::before{bottom:-7px}
#tourTip h4{margin:0 0 6px;font-size:16px;font-weight:800;color:var(--dark)}
#tourTip p{margin:0;font-size:14.5px;line-height:1.6}
.tour-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.tour-foot span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.tour-foot div{display:flex;gap:6px}
.tour-foot button{border:0;border-radius:10px;min-height:40px;padding:6px 14px;font-weight:700;font-size:14px;background:var(--paper)}
.tour-foot button.next{background:var(--base);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============== 첫 화면: 자리 고르기 ============== -->
<section id="pickScreen" class="screen">
  <div class="hero">
    <h1>숫자 익히기</h1>
    <p>자리를 골라 수를 읽어 봐요</p>
  </div>
  <div class="pick-grid" id="pickGrid"></div>
  <div class="pick-foot">
    <div class="voice-row" id="voiceRow"></div>
    <div class="voice-note" id="voiceNote"></div>
    <button class="howto-btn" id="howtoBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>사용법</button>
  </div>
</section>

<!-- ============== 연습 화면 ============== -->
<section id="playScreen" class="screen">
  <div class="topbar">
    <div class="tb-side">
      <button class="icon-btn" id="backBtn" type="button" aria-label="처음 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="rec" id="recMark">기록 중 <span id="recCount"></span></span>
    </div>
    <div class="badge-wrap"><span class="badge" id="tierBadge">십의 자리</span><span class="badge-range" id="tierRange">10 ~ 99</span></div>
    <div class="tb-side right">
      <button class="icon-btn" id="waitBtn" type="button" aria-label="읽어 주는 때"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="waitText">바로</span></button>
      <button class="icon-btn on" id="labelBtn" type="button" aria-label="자리 이름 보이기/감추기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/></svg></button>
      <button class="icon-btn on" id="voiceBtn" type="button" aria-label="소리 켜기/끄기">
        <svg id="vOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
        <svg id="vOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M22 9l-6 6M16 9l6 6"/></svg></button>
      <button class="icon-btn" id="helpBtn" type="button" aria-label="사용법"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9.2 9a3 3 0 1 1 4.1 2.8c-.8.3-1.3 1-1.3 1.9v.6M12 17.5h.01"/></svg></button>
    </div>
  </div>
  <div class="chip-row" id="chipRow"></div>
  <div class="stage" id="stage">
    <div class="pv-table" id="pvTable"></div>
    <div class="hint" id="hintText"></div>
  </div>
  <div class="footer-row"><div class="counter"><span class="dot"></span><span id="counterText">오늘 만든 수 0개</span></div></div>
</section>

<!-- ============== 관리: 학생 기록 ============== -->
<aside id="drawer" class="dw" aria-label="학생 기록">
  <div class="dw-head"><h2>학생 기록</h2><div class="dw-status" id="dwStatus">기록 안 함</div></div>
  <div class="dw-body">
    <div class="dw-sec">
      <h3>기록할 학생</h3>
      <div class="dw-row"><select id="recSelect" aria-label="기록할 학생"></select><button class="btn stop" id="recStop" type="button">기록 끝내기</button></div>
      <p class="small">학생을 고르면 그때부터 그 학생의 학습이 기록돼요. 다른 학생을 고르거나 끝내면 앞 학생의 기록이 끝나요.</p>
    </div>
    <div class="dw-sec">
      <h3>학생 넣기</h3>
      <div class="dw-row"><input type="text" id="newName" placeholder="이름" autocomplete="off" maxlength="20"><button class="btn main" id="addName" type="button">넣기</button></div>
      <div class="roster" id="roster"></div>
    </div>
    <div class="dw-sec">
      <h3>기록 보기</h3>
      <div class="dw-row"><select id="viewStudent" aria-label="볼 학생"></select><select id="viewTier" aria-label="자리"></select></div>
      <div class="seg-row" style="margin-top:8px"><button class="seg" type="button" data-range="recent">최근 3번 수업</button><button class="seg" type="button" data-range="all">전체</button></div>
      <div id="viewOut"></div>
    </div>
    <div class="dw-sec">
      <h3>파일</h3>
      <div class="dw-row"><button class="btn" id="exportBtn" type="button">내보내기 (엑셀)</button><button class="btn" id="importBtn" type="button">불러오기</button><input type="file" id="importFile" accept=".csv,text/csv" hidden></div>
      <p class="small">다른 기기에서 보려면 내보낸 파일을 그 기기에서 불러오세요. 기록은 이 기기 안에만 저장되고 바깥으로 보내지 않아요.</p>
      <div class="dw-row" style="margin-top:10px"><button class="btn warn" id="wipeBtn" type="button">기록 모두 지우기</button></div>
    </div>
  </div>
</aside>
<button id="adminBtn" type="button" aria-label="관리"><span class="ab-label" id="abLabel">charum</span></button>

<div id="tour"><div id="tourHole"></div><div id="tourTip" class="below"><h4 id="tourTitle"></h4><p id="tourText"></p>
  <div class="tour-foot"><span id="tourStep"></span><div><button type="button" id="tourEnd">그만</button><button type="button" class="next" id="tourNext">다음</button></div></div></div></div>

<script>
'use strict';
/* ================= 자리 이름 =================
   exp: 10의 거듭제곱 (0=일, 1=십, 2=백, 3=천, 4=만 … 8=억)
   숫자 아래 이름표는 네 자리마다 "일·십·백·천"이 되풀이되는 교과서 방식(만·억에서 끊어 읽기) */
const GROUP_NAMES=['일','만','억'], POS_NAMES=['','십','백','천'];
const groupOf=e=>Math.floor(e/4), posOf=e=>e%4;
function fullPlaceName(e){ const g=groupOf(e),p=posOf(e); return p===0?GROUP_NAMES[g]:POS_NAMES[p]+(g>0?GROUP_NAMES[g]:''); }
function chartLabel(e){ const g=groupOf(e),p=posOf(e); return p===0?GROUP_NAMES[g]:POS_NAMES[p]; }
const TIER_COLORS=[
  {base:'#2C9C9C',dark:'#1D6E6E',tint:'#DFF3F3'},{base:'#3B6FD1',dark:'#28509C',tint:'#E4ECFB'},
  {base:'#5B67CA',dark:'#3E4795',tint:'#E7E8FA'},{base:'#8E5FBF',dark:'#664389',tint:'#F0E7F8'},
  {base:'#C0559E',dark:'#8C3C72',tint:'#F8E6F1'},{base:'#E0576B',dark:'#A63C4B',tint:'#FCE6E9'},
  {base:'#E27A3F',dark:'#A9581F',tint:'#FBEADC'},{base:'#B98A12',dark:'#8A6608',tint:'#FBF1D6'},
  {base:'#C23B4E',dark:'#8E2536',tint:'#FADEE2'}];
const BIG_COLOR={base:'#3A3550',dark:'#221F30',tint:'#E4E2EC'};
function tierMeta(top){ const min=top===0?1:10**top, max=10**(top+1)-1;
  return {top,label:fullPlaceName(top)+'의 자리',range:min.toLocaleString()+' ~ '+max.toLocaleString(),color:TIER_COLORS[top]}; }
const TIERS=[0,1,2,3,4,5,6,7,8].map(tierMeta);
const BIG_LEVELS=[3,4,5,6,7,8,9,10,11]; /* 큰 수: 천 단위 ~ 천억 단위 */

/* ================= 수 → 한글 읽기 (예: 32507 → 삼만 이천오백칠) ================= */
const SINO=['','일','이','삼','사','오','육','칠','팔','구'];
function readGroup(n){ let s=''; [[1000,'천'],[100,'백'],[10,'십']].forEach(([u,w])=>{ const d=Math.floor(n/u)%10; if(d) s+=(d===1?'':SINO[d])+w; }); return s+SINO[n%10]; }
function readKo(n){
  if(n===0) return '영';
  const units=['','만','억','조'], parts=[]; let g=0;
  while(n>0){ const v=n%10000; if(v) parts.unshift((g===1&&v===1)?'만':readGroup(v)+units[g]); n=Math.floor(n/10000); g++; }
  return parts.join(' ');
}

/* ================= 저장 ================= */
const ls={ get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };
const store={ get:k=>ls.get('placeValue.'+k), set:(k,v)=>ls.set('placeValue.'+k,v) };
const S={mode:null, top:null, mix:{}, labels:{}, count:0, cur:null, next:null,
  sound:true, wait:0, engine:'cloud', timbre:'Leda', cloudKey:'', saveCloud:false, engineNow:'', admin:false};
(function load(){
  S.sound=store.get('sound')!=='off';
  const w=+store.get('wait'); if([0,3,5].includes(w)) S.wait=w;
  const en=store.get('engine'); if(['cloud','device'].includes(en)) S.engine=en;
  const tb=store.get('timbre'); if(['Leda','Aoede','Kore'].includes(tb)) S.timbre=tb;
  S.cloudKey=store.get('cloudKey')||''; S.saveCloud=!!S.cloudKey;
  /* 같은 사이트의 다른 앱에 저장해 둔 Cloud 키가 있으면 빈칸에 채움 */
  if(!S.cloudKey){ for(const k of ['poemRecite.cloudKey','colorFind.cloudKey','shapeFinder.cloudKey']){ const v=ls.get(k); if(v){ S.cloudKey=v; break; } } }
  if(!store.get('engine')&&!S.cloudKey) S.engine='device';
})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 목소리: 한 수업은 한 목소리 ================= */
let lastSay='', speakSeq=0, actx=null, curSrc=null;
function getCtx(){ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } return actx; }
function unlockAudio(){ try{ const c=getCtx(); if(!c) return; if(c.state==='suspended') c.resume();
  const b=c.createBuffer(1,240,24000), x=c.createBufferSource(); x.buffer=b; x.connect(c.destination); x.start(); }catch(e){} }
function cleanPCM(bin,rate){
  const n=bin.length>>1, f=new Float32Array(n);
  for(let k=0;k<n;k++){ let v=bin.charCodeAt(2*k)|(bin.charCodeAt(2*k+1)<<8); if(v>32767) v-=65536; f[k]=v/32768; }
  const W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }
  const th=Math.max(0.003,mx*0.04), seg=[]; let on=-1;
  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));
  const body=f.slice(st,en), L=body.length, fi=Math.min(L,Math.round(rate*0.008)), fo=Math.min(L,Math.round(rate*0.04));
  for(let k=0;k<fi;k++) body[k]*=k/fi;
  for(let k=0;k<fo;k++) body[L-1-k]*=k/fo;
  const lead=Math.round(rate*0.06), out=new Float32Array(lead+L); out.set(body,lead);
  return {data:out,rate};
}
function playClip(clip){
  return new Promise(res=>{
    const c=getCtx(); if(!c){res(); return;}
    if(c.state==='suspended') c.resume();
    const b=c.createBuffer(1,clip.data.length,clip.rate);
    if(b.copyToChannel) b.copyToChannel(clip.data,0); else b.getChannelData(0).set(clip.data);
    const x=c.createBufferSource(), g=c.createGain(); g.gain.value=0.75;
    x.buffer=b; x.connect(g); g.connect(c.destination);
    x.onended=()=>{ if(curSrc&&curSrc.src===x) curSrc=null; res(); };
    curSrc={src:x,g,res}; x.start();
  });
}
function stopVoice(){
  try{speechSynthesis.cancel();}catch(e){}
  if(curSrc){ const {src,g,res}=curSrc; curSrc=null; try{ src.onended=null; const t=actx.currentTime; g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+0.05); src.stop(t+0.06); }catch(e){} if(res) res(); }
}
/* 만든 목소리는 브라우저(IndexedDB)에 저장해 다시 만들지 않음 */
const vdb={db:null, ready:null};
vdb.ready=new Promise(r=>{ try{ const q=indexedDB.open('placeValueVoice',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('clips');
  q.onsuccess=()=>{vdb.db=q.result; r();}; q.onerror=()=>r(); }catch(e){ r(); } });
async function idbGet(k){ await vdb.ready; if(!vdb.db) return null; return new Promise(r=>{ try{ const q=vdb.db.transaction('clips').objectStore('clips').get(k); q.onsuccess=()=>{ const v=q.result; r(v?{data:new Float32Array(v.buf),rate:v.rate}:null); }; q.onerror=()=>r(null); }catch(e){ r(null); } }); }
function idbPut(k,clip){ try{ if(vdb.db) vdb.db.transaction('clips','readwrite').objectStore('clips').put({buf:clip.data.buffer.slice(0),rate:clip.rate},k); }catch(e){} }
const VQ={list:[], busy:false, clips:new Map()};
const timbre=()=>['Leda','Aoede','Kore'].includes(S.timbre)?S.timbre:'Leda';
function chooseEngine(){ S.engineNow=(S.engine==='cloud'&&S.cloudKey)?'cloud':'device'; }
function getClip(text,urgent){
  const k=S.engineNow+'|'+timbre()+'|'+text;
  let c=VQ.clips.get(k);
  if(!c){
    c={text,key:k,engine:S.engineNow,done:false}; c.p=new Promise((res,rej)=>{c.res=res; c.rej=rej;}); c.p.catch(()=>{});
    VQ.clips.set(k,c);
    idbGet(k).then(v=>{ if(v){ c.done=true; c.res(v); } else { urgent?VQ.list.unshift(c):VQ.list.push(c); pumpVoice(); } });
  } else if(urgent && !c.done){ const i=VQ.list.indexOf(c); if(i>0){ VQ.list.splice(i,1); VQ.list.unshift(c); } }
  return c.p;
}
async function pumpVoice(){
  if(VQ.busy) return; VQ.busy=true;
  while(VQ.list.length){
    const c=VQ.list.shift();
    if(c.engine!==S.engineNow){ c.rej(new Error('engine changed')); VQ.clips.delete(c.key); continue; }
    let tries=0;
    for(;;){
      try{ const clip=await synth(c.text); c.done=true; idbPut(c.key,clip); c.res(clip); break; }
      catch(e){
        tries++;
        if(e.quota){
          if(tries<=2){ await new Promise(r=>setTimeout(r,12000)); continue; }
          /* 사용량 초과: 이번 수업 전체를 기기 목소리로 한 번만 바꾸고 알림 */
          S.engineNow='device'; voiceNote('Google 목소리 사용량이 다 되어, 이번 수업은 기기 목소리로 바꿨어요.');
          VQ.list.forEach(x=>{x.rej(e); VQ.clips.delete(x.key);}); VQ.list=[];
          c.rej(e); VQ.clips.delete(c.key); break;
        }
        if(tries<2){ await new Promise(r=>setTimeout(r,1500)); continue; }
        c.rej(e); VQ.clips.delete(c.key); break;
      }
    }
  }
  VQ.busy=false;
}
async function synth(text){
  const call=async withRate=>{
    const audioConfig={audioEncoding:'LINEAR16',sampleRateHertz:24000}; if(withRate) audioConfig.speakingRate=0.92;
    return fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(S.cloudKey),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({input:{text},voice:{languageCode:'ko-KR',name:`ko-KR-Chirp3-HD-${timbre()}`},audioConfig})});
  };
  let r=await call(S.cloudRate!==false);
  if(r.status===400 && S.cloudRate!==false){ S.cloudRate=false; r=await call(false); }
  if(!r.ok){ let m=''; try{m=(await r.json()).error.message||'';}catch(e){} const er=new Error(r.status+' '+m); if(r.status===429) er.quota=true; throw er; }
  const j=await r.json(); const bin=atob(j.audioContent||'');
  const di=bin.indexOf('data'); const pcm=di>=0&&di<200?bin.slice(di+8):bin.slice(44);
  return cleanPCM(pcm,24000);
}
function prefetchVoice(text){ if(S.engineNow==='cloud'&&S.sound&&text) getClip(text,false); }
let koVoice=null;
function pickKoVoice(){
  const vs=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ko')):[];
  if(!vs.length) return null;
  const score=v=>(/premium|프리미엄/i.test(v.name)?4:0)+(/enhanced|향상/i.test(v.name)?3:0)+(/google/i.test(v.name)?2:0)+(/yuna|유나/i.test(v.name)?1:0)+(v.localService?0.5:0);
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
if('speechSynthesis' in window){ koVoice=pickKoVoice(); speechSynthesis.addEventListener?.('voiceschanged',()=>{ koVoice=pickKoVoice(); }); }
function deviceSay(text,id){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(()=>{
    if(id!==speakSeq) return;
    try{ if(!koVoice) koVoice=pickKoVoice();
      const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.78; u.volume=0.7; if(koVoice) u.voice=koVoice;
      speechSynthesis.speak(u); }catch(e){}
  },300);
}
let hiddenSay=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stopVoice(); speakSeq++; }
  else if(hiddenSay){ const h=hiddenSay; hiddenSay=null; speak(h); }
});
function speak(text){
  if(document.hidden){ hiddenSay=text||lastSay; return; }
  if(text) lastSay=text;
  stopVoice();
  const id=++speakSeq;
  if(!S.engineNow) chooseEngine();
  if(!S.sound||!lastSay) return;
  if(S.engineNow==='device'){ deviceSay(lastSay,id); return; }
  (async()=>{
    let clip=null;
    try{ clip=await Promise.race([getClip(lastSay,true),new Promise((_,rj)=>setTimeout(()=>rj(new Error('slow')),20000))]); }catch(e){}
    if(id!==speakSeq) return;
    if(!clip){ if(S.engineNow==='device') deviceSay(lastSay,id); return; }
    await playClip(clip);
  })();
}
/* 계속 누르는 동안은 기다렸다가 마지막으로 누른 뒤에 읽음. "3초 뒤"면 학생이 먼저 읽어 볼 시간을 줌 */
let sayTimer=null;
function sayLater(text){ clearTimeout(sayTimer); stopVoice(); speakSeq++; sayTimer=setTimeout(()=>speak(text), Math.max(650,S.wait*1000)); }
function hush(){ clearTimeout(sayTimer); stopVoice(); speakSeq++; }

/* ================= 전체 화면 ================= */
function goFull(){ try{ const d=document.documentElement; if(document.fullscreenElement||document.webkitFullscreenElement) return;
  if(d.requestFullscreen) d.requestFullscreen().catch(()=>{}); else if(d.webkitRequestFullscreen) d.webkitRequestFullscreen(); }catch(e){} }
function leaveFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }

/* ================= 첫 화면 ================= */
function addCard(color,name,range,onClick){
  const btn=document.createElement('button'); btn.className='tier-card'; btn.type='button';
  btn.style.setProperty('--tcard-base',color.base); btn.style.setProperty('--tcard-dark',color.dark); btn.style.setProperty('--tcard-tint',color.tint);
  btn.innerHTML=`<span class="tc-name">${name}</span><span class="tc-range">${range}</span><span class="tc-dot"></span>`;
  btn.addEventListener('click',()=>{
    unlockAudio();
    /* Google 목소리를 골랐는데 키가 없으면 시작하지 않고 안내 */
    if(S.engine==='cloud'&&!S.cloudKey){ voiceNote('Cloud 키를 넣거나 "기기"를 고르세요.'); $('voiceKey')&&$('voiceKey').focus(); return; }
    onClick(); if(!S.admin) goFull();
  });
  $('pickGrid').appendChild(btn);
}
TIERS.forEach(t=>addCard(t.color,t.label,t.range.length>16?t.range.replace(' ~ ','<br>~ '):t.range,()=>startTier(t.top)));
addCard(BIG_COLOR,'큰 수','천 ~ 천억',()=>startBig());

function voiceNote(t){ $('voiceNote').textContent=t||''; }
function renderVoiceRow(){
  const b=(a,l,p)=>`<button type="button" class="seg" data-v="${a}" aria-pressed="${p}">${l}</button>`;
  $('voiceRow').innerHTML=`<span class="lbl">목소리</span>${b('engine:device','기기',S.engine==='device')}${b('engine:cloud','Google',S.engine==='cloud')}`+
    `<a href="cloud-key.html" target="_blank" rel="noopener">Cloud 키 넣는 방법</a>`+
    (S.engine==='cloud'?`<span class="sep"></span>${[['Leda','밝은'],['Aoede','산뜻한'],['Kore','또렷한']].map(([k,l])=>b('timbre:'+k,l,S.timbre===k)).join('')}`+
      `<input class="key" id="voiceKey" type="password" autocomplete="off" placeholder="Cloud 키를 넣어 주세요" value="${esc(S.cloudKey)}" aria-label="Google Cloud 키">`+
      `<label><input type="checkbox" id="voiceSave" ${S.saveCloud?'checked':''}>이 기기에 키 저장</label>`:'')+
    `<span class="sep"></span>${b('test','들어 보기',false)}`;
  const k=$('voiceKey');
  if(k){ const save=()=>store.set('cloudKey',S.saveCloud&&S.cloudKey?S.cloudKey:null);
    k.oninput=()=>{ S.cloudKey=k.value.trim(); save(); chooseEngine(); voiceNote(''); };
    $('voiceSave').onchange=e=>{ S.saveCloud=e.target.checked; save(); }; }
}
$('voiceRow').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-v]'); if(!btn) return; unlockAudio();
  const [a,v]=btn.dataset.v.split(':');
  if(a==='engine'){ S.engine=v; store.set('engine',v); voiceNote(''); }
  if(a==='timbre'){ S.timbre=v; store.set('timbre',v); }
  chooseEngine();
  if(a==='test'){ if(S.engine==='cloud'&&!S.cloudKey){ voiceNote('Cloud 키를 넣거나 "기기"를 고르세요.'); } else speak('삼만 이천오백칠'); }
  renderVoiceRow();
});
renderVoiceRow();

/* ================= 시작 · 자리 바꾸기 ================= */
function applyTheme(c){ const r=document.documentElement.style; r.setProperty('--base',c.base); r.setProperty('--dark',c.dark); r.setProperty('--tint',c.tint); }
function enterPlay(){
  document.body.classList.add('playing'); chooseEngine(); S.cur=null; S.count=0;
  refreshNext(); renderEmpty(); updateCounter();
}
function startTier(top){
  S.mode='tier'; S.top=top; S.mix={}; for(let e=top-1;e>=0;e--) S.mix[e]=true;
  S.labels={}; for(let e=0;e<=11;e++) S.labels[e]=true; syncLabelBtn();
  const m=TIERS[top]; applyTheme(m.color); $('tierBadge').textContent=m.label; $('tierRange').textContent=m.range;
  renderChips(); enterPlay();
}
function startBig(){
  S.mode='big'; S.top=null;
  S.labels={}; for(let e=0;e<=11;e++) S.labels[e]=true; syncLabelBtn();
  applyTheme(BIG_COLOR); $('tierBadge').textContent='큰 수'; $('tierRange').textContent='천 ~ 천억 사이의 수';
  $('chipRow').innerHTML=''; enterPlay();
}
function goHome(){ hush(); document.body.classList.remove('playing'); S.mode=null; applyTheme(TIER_COLORS[1]); }
$('backBtn').addEventListener('click',goHome);

/* 자리 칩: 켠 자리에는 1~9, 끈 자리에는 0 (교사가 고른 모양 그대로 나옴) */
function renderChips(){
  const row=$('chipRow'); row.innerHTML='';
  const top=document.createElement('span'); top.className='chip fixed'; top.textContent=fullPlaceName(S.top)+'의 자리'; row.appendChild(top);
  for(let e=S.top-1;e>=0;e--){
    const c=document.createElement('button'); c.type='button'; c.className='chip'+(S.mix[e]?' on':''); c.textContent=fullPlaceName(e)+'의 자리'; c.dataset.exp=e;
    c.addEventListener('click',()=>{ S.mix[e]=!S.mix[e]; c.classList.toggle('on',S.mix[e]); refreshNext(); });
    row.appendChild(c);
  }
}

/* ================= 수 만들기 (바로 앞과 같은 수는 피함) ================= */
function patternOf(){ let p=''; for(let e=S.top;e>=0;e--) p+=(e===S.top||S.mix[e])?'1':'0'; return p; }
function makeOnce(){
  const digits={};
  if(S.mode==='tier'){
    for(let e=S.top;e>=0;e--) digits[e]=(e===S.top||S.mix[e])?1+Math.floor(Math.random()*9):0;
    let n=0; for(const e in digits) n+=digits[e]*10**e;
    return {n,digits,top:S.top,key:'t'+S.top,pat:patternOf()};
  }
  const L=BIG_LEVELS[Math.floor(Math.random()*BIG_LEVELS.length)];
  const n=10**L+Math.floor(Math.random()*9*10**L), s=String(n);
  for(let i=0;i<s.length;i++) digits[s.length-1-i]=+s[i];
  return {n,digits,top:L,key:'b',pat:fullPlaceName(L)+' 단위'};
}
function makeNumber(){ const avoid=S.cur&&S.cur.n; let r=makeOnce(); for(let i=0;i<10&&r.n===avoid;i++) r=makeOnce(); return r; }
function refreshNext(){ S.next=makeNumber(); prefetchVoice(readKo(S.next.n)); }

/* ================= 그리기 ================= */
function renderRow(top,digitOf){
  const t=$('pvTable'); t.innerHTML='';
  for(let e=top;e>=0;e--){
    const d=digitOf(e), col=document.createElement('div'); col.className='pv-col'; col.dataset.exp=e;
    const vis=!!S.labels[e];
    col.innerHTML=`<div class="pv-digit${d!=null?' filled':''}">${d!=null?d:'?'}</div><div class="pv-label${vis?'':' hidden'}">${vis?chartLabel(e):'·'}</div>`;
    t.appendChild(col);
    if(e%3===0&&e!==0){ const c=document.createElement('div'); c.className='pv-col comma-col'; c.innerHTML='<div class="pv-digit comma"><span>,</span></div><div class="pv-label spacer">·</div>'; t.appendChild(c); }
  }
  fitTable();
}
function renderEmpty(){
  if(S.mode==='tier') renderRow(S.top,()=>null); else $('pvTable').innerHTML='';
  $('hintText').textContent='눌러서 수를 만들어요'; fitTable();
}
function showNumber(){
  if(!document.body.classList.contains('playing')) return;
  S.cur=S.next; S.count++;
  renderRow(S.cur.top,e=>S.cur.digits[e]);
  $('pvTable').querySelectorAll('.pv-digit.filled').forEach(x=>x.classList.add('pop'));
  $('hintText').textContent='';
  sayLater(readKo(S.cur.n));
  logNumber(S.cur);
  refreshNext(); updateCounter();
}
function updateCounter(){ $('counterText').textContent='오늘 만든 수 '+S.count+'개'; }
/* 화면 크기에 맞춰 수를 되도록 크게 */
function fitTable(){
  const t=$('pvTable'), st=$('stage'); if(!document.body.classList.contains('playing')) return;
  t.style.setProperty('--fs','100px');
  requestAnimationFrame(()=>{
    const W=st.clientWidth, H=st.clientHeight-50;
    const w=t.scrollWidth||1, h=t.scrollHeight||1;
    t.style.setProperty('--fs',Math.max(28,Math.min(100*W*0.92/w,100*H*0.88/h,300))+'px');
  });
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ fitTable(); if(TOUR.on) placeTour(); },150); });

/* ================= 누르기 =================
   자리 이름을 누르면 그 이름만 켜고 끔. 나머지 곳을 누르면 새 수.
   관리가 열린 채로 수를 누르면 관리를 닫고 바로 학생 화면으로 */
$('stage').addEventListener('click',e=>{
  unlockAudio();
  const lab=e.target.closest('.pv-label');
  if(lab&&!lab.classList.contains('spacer')){
    const ex=+lab.parentElement.dataset.exp; S.labels[ex]=!S.labels[ex];
    lab.classList.toggle('hidden',!S.labels[ex]); lab.textContent=S.labels[ex]?chartLabel(ex):'·'; syncLabelBtn(); return;
  }
  if(S.admin) setAdmin(false);
  goFull(); showNumber();
});
document.addEventListener('keydown',e=>{
  if(TOUR.on){ if(e.code==='Escape') endTour(); return; }
  if(!document.body.classList.contains('playing')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(S.admin) setAdmin(false); showNumber(); }
});

/* ================= 위쪽 단추 ================= */
function syncLabelBtn(){ $('labelBtn').classList.toggle('on',Object.keys(S.labels).every(k=>S.labels[k])); }
$('labelBtn').addEventListener('click',()=>{
  const on=!$('labelBtn').classList.contains('on'); for(let e=0;e<=11;e++) S.labels[e]=on; syncLabelBtn();
  $('pvTable').querySelectorAll('.pv-col').forEach(col=>{ const l=col.querySelector('.pv-label'); if(!l||l.classList.contains('spacer')) return;
    const ex=+col.dataset.exp; l.classList.toggle('hidden',!on); l.textContent=on?chartLabel(ex):'·'; });
});
function syncVoiceBtn(){ $('voiceBtn').classList.toggle('on',S.sound); $('vOn').style.display=S.sound?'':'none'; $('vOff').style.display=S.sound?'none':''; }
$('voiceBtn').addEventListener('click',()=>{ S.sound=!S.sound; store.set('sound',S.sound?'on':'off'); syncVoiceBtn(); if(!S.sound) hush(); else if(S.next) prefetchVoice(readKo(S.next.n)); });
function syncWaitBtn(){ $('waitText').textContent=S.wait?S.wait+'초 뒤':'바로'; $('waitBtn').classList.toggle('on',S.wait>0); }
$('waitBtn').addEventListener('click',()=>{ S.wait=S.wait===0?3:S.wait===3?5:0; store.set('wait',S.wait); syncWaitBtn(); });
syncVoiceBtn(); syncWaitBtn();

/* ================= 학생 기록 =================
   학생 명단은 같은 사이트의 다른 앱과 함께 씀(webapp.students).
   기록: {s:학생, t:시각, k:'t2'(백의 자리)|'b'(큰 수), p:모양('101')|단위, n:수} */
let students=[], log=[], recId='';
function loadRec(){
  try{ students=JSON.parse(ls.get('webapp.students')||'[]')||[]; }catch(e){ students=[]; }
  try{ log=JSON.parse(store.get('log')||'[]')||[]; }catch(e){ log=[]; }
}
const saveStudents=()=>ls.set('webapp.students',JSON.stringify(students));
const saveLog=()=>store.set('log',JSON.stringify(log));
loadRec();
const nameOf=id=>(students.find(s=>s.id===id)||{}).name||'';
const dayOf=t=>{ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function sessionCount(){ const today=dayOf(Date.now()); return log.filter(r=>r.s===recId&&dayOf(r.t)===today).length; }
function logNumber(cur){
  if(!recId) return;
  log.push({s:recId,t:Date.now(),k:cur.key,p:cur.pat,n:cur.n}); saveLog(); updateRec();
}
function setRecording(id){
  recId=students.some(s=>s.id===id)?id:'';
  updateRec(); renderDrawer();
}
function updateRec(){
  document.body.classList.toggle('recording',!!recId);
  $('recCount').textContent=recId?sessionCount():'';
  const st=$('dwStatus'); st.classList.toggle('on',!!recId);
  st.textContent=recId?nameOf(recId)+' 기록 중':'기록 안 함';
}
const keyLabel=k=>k==='b'?'큰 수':TIERS[+k.slice(1)].label;
const keyOrder=k=>k==='b'?99:+k.slice(1);
let view={student:'',key:'',range:'recent'};
function renderDrawer(){
  const opts=students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  $('recSelect').innerHTML=`<option value="">기록 안 함</option>`+opts; $('recSelect').value=recId;
  $('recStop').disabled=!recId;
  $('roster').innerHTML=students.map(s=>`<span>${esc(s.name)}<button type="button" data-del="${esc(s.id)}" aria-label="${esc(s.name)} 지우기">×</button></span>`).join('')||'<div class="empty">아직 넣은 학생이 없어요.</div>';
  if(!students.some(s=>s.id===view.student)) view.student=recId||(students[0]&&students[0].id)||'';
  $('viewStudent').innerHTML=opts||'<option value="">학생 없음</option>'; $('viewStudent').value=view.student;
  const keys=[...new Set(log.filter(r=>r.s===view.student).map(r=>r.k))].sort((a,b)=>keyOrder(a)-keyOrder(b));
  if(!keys.includes(view.key)){ const last=log.filter(r=>r.s===view.student).pop(); view.key=last?last.k:(keys[0]||''); }
  $('viewTier').innerHTML=keys.map(k=>`<option value="${k}">${keyLabel(k)}</option>`).join('')||'<option value="">기록 없음</option>'; $('viewTier').value=view.key;
  document.querySelectorAll('.seg[data-range]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.range===view.range));
  renderView();
}
/* 모양별 비율: 가장 많은 모양 = 지금 배우는 중, 다음 = 보충, 나머지 = 복습 */
function renderView(){
  const out=$('viewOut');
  let rows=log.filter(r=>r.s===view.student&&r.k===view.key);
  if(!rows.length){ out.innerHTML='<div class="empty">기록이 없어요.</div>'; return; }
  const days=[...new Set(rows.map(r=>dayOf(r.t)))].sort();
  const useDays=view.range==='recent'?days.slice(-3):days;
  rows=rows.filter(r=>useDays.includes(dayOf(r.t)));
  const cnt={}; rows.forEach(r=>cnt[r.p]=(cnt[r.p]||0)+1);
  const pats=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
  const tot=rows.length, TAG=['now','sup'], TXT=['지금 배우는 중','보충'];
  const show=pats.slice(0,8);
  const bars=show.map((p,i)=>{ const pc=Math.round(cnt[p]*100/tot); const tg=i<2?TAG[i]:'rev', tt=i<2?TXT[i]:'복습';
    return `<div class="bar"><span class="pat">${esc(p)}</span><span class="track"><span class="fill" style="width:${pc}%;display:block"></span></span><span class="pct">${pc}% · ${cnt[p]}개<span class="tag ${tg}">${tt}</span></span></div>`; }).join('')+
    (pats.length>8?`<div class="empty">그 밖 ${pats.length-8}가지 모양</div>`:'');
  const sum=`<b>지금 배우는 중</b> ${esc(pats[0])}`+(pats[1]?` · <b>보충</b> ${esc(pats[1])}`:'')+(pats.length>2?` · <b>복습</b> ${pats.slice(2,6).map(esc).join(', ')}${pats.length>6?' …':''}`:'')+
    `<br><span style="font-size:12.5px;color:var(--ink-soft)">${view.range==='recent'?'최근 '+useDays.length+'번 수업':'전체 '+useDays.length+'번 수업'} · 수 ${tot}개</span>`;
  /* 날짜별 흐름: 그날 가장 많이 한 모양 */
  const flow=days.slice(-8).map(d=>{ const dr=log.filter(r=>r.s===view.student&&r.k===view.key&&dayOf(r.t)===d), c={}; dr.forEach(r=>c[r.p]=(c[r.p]||0)+1);
    const ps=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,2).map(p=>`${esc(p)} ${Math.round(c[p]*100/dr.length)}%`).join(' · ');
    return `<tr><td>${d.slice(5).replace('-','/')}</td><td>${ps}</td><td style="text-align:right;color:var(--ink-soft)">${dr.length}개</td></tr>`; }).reverse().join('');
  out.innerHTML=`<div class="sum">${sum}</div><div class="bars">${bars}</div><h3 style="font-size:13px;color:var(--ink-soft);margin:14px 0 2px">날짜별 흐름</h3><table class="flow">${flow}</table>`;
}
$('recSelect').addEventListener('change',e=>{ setRecording(e.target.value); if(recId) view.student=recId; renderDrawer(); });
$('recStop').addEventListener('click',()=>setRecording(''));
function addStudent(){
  const inp=$('newName'), name=inp.value.trim().replace(/\s+/g,' ');
  if(!name) return;
  if(!students.some(s=>s.name===name)) students.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name});
  saveStudents(); inp.value=''; renderDrawer(); inp.focus();
}
$('addName').addEventListener('click',addStudent);
$('newName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addStudent(); } });
$('roster').addEventListener('click',e=>{
  const b=e.target.closest('button[data-del]'); if(!b) return;
  const id=b.dataset.del, n=log.filter(r=>r.s===id).length;
  if(!confirm(`${nameOf(id)} 학생을 명단에서 지울까요?`+(n?`\n이 앱의 기록 ${n}개도 함께 지워져요.`:''))) return;
  students=students.filter(s=>s.id!==id); log=log.filter(r=>r.s!==id); saveStudents(); saveLog();
  if(recId===id) setRecording(''); renderDrawer();
});
$('viewStudent').addEventListener('change',e=>{ view.student=e.target.value; view.key=''; renderDrawer(); });
$('viewTier').addEventListener('change',e=>{ view.key=e.target.value; renderView(); });
document.querySelectorAll('.seg[data-range]').forEach(b=>b.addEventListener('click',()=>{ view.range=b.dataset.range; renderDrawer(); }));
/* 내보내기: 엑셀에서 바로 열리는 CSV (한글 깨짐 방지 BOM) */
const csvCell=v=>{ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
$('exportBtn').addEventListener('click',()=>{
  const head=['이름','날짜','시각','자리','모양','수'];
  const lines=log.map(r=>{ const d=new Date(r.t); return [nameOf(r.s)||'(지운 학생)',dayOf(r.t),String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'),keyLabel(r.k),r.p,r.n].map(csvCell).join(','); });
  const blob=new Blob(['﻿'+[head.join(','),...lines].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='숫자익히기_기록_'+dayOf(Date.now())+'.csv';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
});
$('importBtn').addEventListener('click',()=>{ leaveFull(); $('importFile').click(); });
function parseCSV(t){ const rows=[]; let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ r.push(c); c=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; r.push(c); rows.push(r); r=[]; c=''; } else c+=ch; }
  if(c||r.length){ r.push(c); rows.push(r); } return rows; }
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rows=parseCSV((await f.text()).replace(/^﻿/,'')); let added=0;
  const dk=(s,t,p,n)=>s+'|'+Math.floor(t/1000)+'|'+p+'|'+n; const seen=new Set(log.map(r=>dk(r.s,r.t,r.p,r.n)));
  rows.slice(1).forEach(c=>{
    if(c.length<6||!c[0]) return;
    const [name,day,time,place,pat,num]=c, t=new Date(day+'T'+time).getTime(); if(isNaN(t)) return;
    const k=place==='큰 수'?'b':(()=>{ const i=TIERS.findIndex(x=>x.label===place); return i<0?null:'t'+i; })(); if(!k) return;
    let s=students.find(x=>x.name===name); if(!s){ s={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name}; students.push(s); }
    const key=dk(s.id,t,pat,+num); if(seen.has(key)) return; seen.add(key);
    log.push({s:s.id,t,k,p:pat,n:+num}); added++;
  });
  log.sort((a,b)=>a.t-b.t); saveStudents(); saveLog(); renderDrawer(); alert(`기록 ${added}개를 불러왔어요.`);
});
$('wipeBtn').addEventListener('click',()=>{
  if(!log.length) return;
  if(!confirm(`이 기기의 숫자 익히기 기록 ${log.length}개를 모두 지울까요?\n(학생 명단은 남아요. 먼저 내보내기로 저장해 두세요.)`)) return;
  log=[]; saveLog(); updateRec(); renderDrawer();
});

/* ================= 관리 버튼 (한 번 누르면 열고 닫음): 학생 기록만 ================= */
$('adminBtn').addEventListener('click',e=>{ e.stopPropagation(); unlockAudio(); setAdmin(!S.admin); });
function setAdmin(on){
  S.admin=on; document.body.classList.toggle('admin',on);
  $('adminBtn').setAttribute('aria-label',on?'관리 닫기':'관리');
  $('abLabel').textContent=on?'심':'charum';
  if(on){ loadRec(); renderDrawer(); leaveFull(); }
  else{ $('newName').blur(); if(document.body.classList.contains('playing')) goFull(); }
}

/* ================= 사용법: 말풍선 둘러보기 ================= */
const PICK_STEPS=[
  {el:'#pickGrid', t:'배울 자리 고르기', x:'가장 높은 자리를 고르면 연습 화면으로 가요. "큰 수"는 천부터 천억까지 섞여 나와요.'},
  {el:'#voiceRow', t:'목소리', x:'"기기"는 바로 쓸 수 있어요. "Google"은 더 자연스럽고 Cloud 키가 필요해요. 한 번 고르면 기억해요.'},
  {el:'#adminBtn', t:'학생 기록', x:'이 작은 단추를 누르면 학생을 넣고 고를 수 있어요. 고른 학생의 학습이 기록되고, 기록을 볼 수도 있어요.'}
];
const PLAY_STEPS=[
  {el:'#stage', t:'수 만들기', x:'화면을 누르면 새 수가 나오고 읽어 줘요. 스페이스바를 눌러도 돼요.'},
  {el:'.pv-label:not(.spacer)', t:'자리 이름', x:'자리 이름을 누르면 그 이름만 감추거나 다시 보여요.'},
  {el:'#chipRow', t:'숫자를 넣을 자리', x:'켠 자리에는 1~9, 끈 자리에는 0이 나와요. 예) 백의 자리에서 십을 끄면 304처럼 나와요.', need:()=>S.mode==='tier'&&S.top>0},
  {el:'#waitBtn', t:'읽어 주는 때', x:'바로 → 3초 뒤 → 5초 뒤. 학생이 먼저 읽어 볼 시간을 준 뒤 읽어 줘요.'},
  {el:'#labelBtn', t:'자리 이름 모두', x:'자리 이름을 한꺼번에 감추거나 보여요.'},
  {el:'#voiceBtn', t:'소리', x:'읽어 주는 소리를 켜고 꺼요.'},
  {el:'#adminBtn', t:'학생 기록', x:'학생을 고르면 기록이 시작되고, 왼쪽 위에 빨간 점과 "기록 중"이 보여요. 설정하고 가운데 수를 누르면 바로 학생 화면으로 돌아와요.'},
  {el:'#backBtn', t:'처음 화면', x:'처음 화면으로 돌아가 자리를 다시 골라요.'}
];
const TOUR={on:false, steps:[], i:0};
function startTour(fromPick){
  hush(); if(S.admin) setAdmin(false); leaveFull();
  let steps=[];
  if(fromPick){ steps=PICK_STEPS.map(s=>({...s})); steps.push({enter:true}); }
  steps=steps.concat(PLAY_STEPS);
  TOUR.on=true; TOUR.steps=steps; TOUR.i=0; $('tour').classList.add('show'); showStep();
}
function showStep(){
  let s=TOUR.steps[TOUR.i];
  if(s&&s.enter){ startTier(2); if(!S.cur) showNumber(); hush(); TOUR.i++; return setTimeout(showStep,80); }
  if(s&&document.body.classList.contains('playing')&&!S.cur){ showNumber(); hush(); }
  if(s&&s.need&&!s.need()){ TOUR.i++; return showStep(); }
  if(!s) return endTour();
  const real=TOUR.steps.filter(x=>!x.enter&&(!x.need||x.need()));
  $('tourTitle').textContent=s.t; $('tourText').textContent=s.x;
  $('tourStep').textContent=(real.indexOf(s)+1)+' / '+real.length;
  $('tourNext').textContent=TOUR.i===TOUR.steps.length-1?'끝':'다음';
  placeTour();
}
function placeTour(){
  const s=TOUR.steps[TOUR.i]; if(!s) return;
  const el=document.querySelector(s.el); if(!el) return;
  const r=el.getBoundingClientRect(), pad=8, hole=$('tourHole'), tip=$('tourTip');
  hole.style.left=(r.left-pad)+'px'; hole.style.top=(r.top-pad)+'px'; hole.style.width=(r.width+pad*2)+'px'; hole.style.height=(r.height+pad*2)+'px';
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  let below=r.bottom+pad+14+th<innerHeight-8 || r.top-pad-14-th<8;
  if(s.el==='#stage'){ below=true; }
  let top=below?r.bottom+pad+14:r.top-pad-14-th;
  if(s.el==='#stage') top=Math.min(innerHeight-th-16, r.top+r.height*0.72);
  let left=Math.min(Math.max(12,r.left+r.width/2-tw/2),innerWidth-tw-12);
  tip.className=below?'below':'above'; tip.style.top=top+'px'; tip.style.left=left+'px';
  tip.style.setProperty('--ax',Math.min(tw-28,Math.max(12,r.left+r.width/2-left-8))+'px');
}
function endTour(){ TOUR.on=false; $('tour').classList.remove('show'); }
$('tourNext').addEventListener('click',()=>{ TOUR.i++; showStep(); });
$('tourEnd').addEventListener('click',endTour);
$('howtoBtn').addEventListener('click',()=>startTour(true));
$('helpBtn').addEventListener('click',()=>startTour(false));

applyTheme(TIER_COLORS[1]); updateRec();
</script>
