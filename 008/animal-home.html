<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동물이 사는 곳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 차름 동물 — 동물이 사는 곳 (008). 과학 영역: 보라 */
:root{
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sci:#6A4C9C; --sci-d:#4E3478; --sci-l:#EEE8F6; --sci-m:#C9BCE0;
  --bg:#F7F4FA; --card:#FFFFFF; --ink:#2B2838; --muted:#6B6777; --line:#E2DCEB;
  --bubble:#EAF3FC; --bubble-b:#BCD6EF; --ok:#3E8E63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.setup{overflow:auto}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== 설정 화면 ===== */
#setupView{min-height:100%;padding:28px 16px 0;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12px 12px, rgba(106,76,156,.07) 2px, transparent 2.5px);background-size:28px 28px}
body:not(.setup) #setupView{display:none}
.wrap{max-width:900px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0;color:var(--sci-d)}
.title .mark{display:flex;flex-direction:column;width:34px;height:34px;border-radius:9px;overflow:hidden;border:2px solid var(--sci-d)}
.title .mark i{flex:1}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,40,100,.04);transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--sci-m)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:var(--sci);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:400;font-size:18px;
  box-shadow:inset 0 0 0 3px var(--sci),inset 0 0 0 5px #fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--sci);border-color:var(--sci);color:#fff}
.chip.add{border-style:dashed;color:var(--sci)}
.lv{flex:1 1 220px;text-align:left;padding:12px 14px;min-height:74px}
.lv b{display:block;font-size:17px;margin-bottom:3px}
.lv span{font-size:13.5px;opacity:.85}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.bd{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bd.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.bd .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.bd .bh em{font-style:normal;font-weight:500;font-size:12px;color:var(--sci-d);background:var(--sci-l);padding:2px 8px;border-radius:8px}
.bd .pl{font-size:13px;color:var(--muted)}
.bd .an{display:flex;flex-wrap:wrap;gap:2px}
.bd .an img{width:34px;height:34px;object-fit:contain}
.bd .done{font-size:12px;color:var(--ok)}
.today{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.today .places{display:flex;gap:10px;flex-wrap:wrap}
.today .pl1{width:120px;text-align:center;font-size:14px;font-weight:700}
.today .pl1 img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:4px}
.today .pl1 .ans{display:flex;justify-content:center;flex-wrap:wrap}
.today .pl1 .ans img{width:34px;height:34px;border:0;object-fit:contain;margin:0}
.steps{font-size:14px;color:var(--muted);line-height:1.7}
.resume{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #EBD9A6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 4px}
details.more .card{margin-top:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.opt>span{min-width:120px;color:var(--muted)}
.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:10px}
.startBar{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(to top,var(--bg) 70%,rgba(247,244,250,0));display:flex;justify-content:center;gap:12px;z-index:5}
#startBtn{min-width:260px;height:62px;border-radius:18px;border:0;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(78,52,120,.25)}
.linkish{background:none;border:0;color:var(--sci-d);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
.newStu{display:flex;gap:8px;margin-top:10px}
.newStu input{flex:1;max-width:260px;height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit}

/* ===== 학생 화면 ===== */
#game{position:fixed;inset:0;background:#FBFAF7;display:none;user-select:none;-webkit-user-select:none}
body:not(.setup) #game{display:block}
body.admin #stage{pointer-events:none}
#prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#prog i{display:block;width:44px;height:8px;border-radius:4px;background:#E6E1EC}
#prog i.d{background:#C9BCE0}#prog i.n{background:var(--sci)}
#prog.bar{width:min(520px,70vw);height:8px;border-radius:4px;background:#E6E1EC;overflow:hidden;gap:0}
#prog.bar b{display:block;height:100%;background:linear-gradient(90deg,#C9BCE0 0 calc(100% - 10px),var(--sci) 0);border-radius:4px;transition:width .4s}
#stage{position:absolute;inset:36px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:0 16px 70px}
.recDot{position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:#D24B3E;opacity:.75;z-index:4}

/* 견본 말풍선 */
.bubble{position:relative;background:var(--bubble);border:2px solid var(--bubble-b);border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:16px solid var(--bubble-b);border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--bubble);border-bottom:0;z-index:1}
.bubble img.a{display:block;object-fit:contain}
/* 보기 카드: 모두 같은 크기·같은 테두리 */
.opts{display:flex;justify-content:center;align-items:flex-start;gap:2.2vw}
.pc{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:8px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s;display:flex;flex-direction:column;align-items:center}
.pc .scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:13px;overflow:hidden;background:#eee}
.pc .scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .lab{font-family:var(--f-display);font-size:clamp(20px,3vw,34px);line-height:1.15;margin-top:6px;color:var(--ink)}
.ac{background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:10px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s}
.ac img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.fadeIn{opacity:0}
.glow{border-color:#E8B84A!important;box-shadow:0 0 0 6px rgba(232,184,74,.35)}
.right{border-color:var(--ok)!important}
.placed{position:absolute;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.fly{position:fixed;z-index:60;pointer-events:none;object-fit:contain;transition:left .8s ease,top .8s ease,width .8s ease,height .8s ease}
.nameTag{font-family:var(--f-display);font-size:clamp(26px,4vw,46px);color:var(--ink);text-align:center}
.showCard{position:relative;border-radius:22px;overflow:hidden;border:3px solid #D8D3CC;background:#eee}
.showCard>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.showCard .lab{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 14px;font-family:var(--f-display);font-size:clamp(20px,2.8vw,32px)}
.tray{display:flex;justify-content:center;align-items:center}
.drag{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.endGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}

/* ===== 관리 메뉴 ===== */
#dock{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:80;display:none;max-width:calc(100vw - 24px)}
body.admin #dock{display:block}
#dockRow{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(40,30,70,.15);scrollbar-width:none}
#dockRow::-webkit-scrollbar{display:none}
#dockRow button{flex:0 0 auto;min-height:44px;padding:6px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;touch-action:pan-x;white-space:nowrap}
#dockRow button.on{background:var(--sci);border-color:var(--sci);color:#fff}
#dockRow button.go{background:var(--sci-d);border-color:var(--sci-d);color:#fff}
#dockRow .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
#dockNote{margin-top:6px;text-align:center;font-size:13px;color:#8A5A12;background:#FFF6E0;border-radius:10px;padding:4px 10px}
#dockNote:empty{display:none}

/* 기록 */
#recView{position:fixed;inset:0;z-index:90;background:rgba(30,24,44,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#recView.on{display:flex}
#recBox{background:#fff;border-radius:18px;max-width:900px;width:100%;padding:20px 22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#recBox h2{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#recBox h3{font-size:16px;margin:18px 0 8px;color:var(--sci-d)}
#recBox table{border-collapse:collapse;width:100%;font-size:14px}
#recBox th,#recBox td{border-bottom:1px solid #EEE;padding:6px 6px;text-align:left}
#recBox th{background:#F7F4FA;font-weight:700}
.bar100{display:inline-block;width:120px;height:9px;border-radius:5px;background:#EEE;vertical-align:middle;overflow:hidden;margin-right:6px}
.bar100 b{display:block;height:100%;background:var(--sci)}
.tip{font-size:13px;color:var(--muted);background:#F7F4FA;border-radius:10px;padding:10px 12px;line-height:1.7}
.sugg{background:#F1FAF4;border:1px solid #CFE7D8;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}

/* 도움말·빠뜨린 곳 */
#spot{position:fixed;z-index:2147480500;border:3px solid #D24B3E;border-radius:14px;pointer-events:none;display:none;box-shadow:0 0 0 4000px rgba(0,0,0,.18)}
#spotTip{position:fixed;z-index:2147480501;max-width:300px;background:#fff;border:1px solid #DDD;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#spotTip b{display:block;margin-bottom:2px}
#spotTip .k{color:var(--muted);font-size:12px;float:right}

/* 교사 버튼 (3초 누르기) — 공통 규격 */
#adminBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:43px;height:43px;border-radius:50%;
  z-index:85;touch-action:none;--p:0;padding:0;opacity:.4;transition:opacity .3s;
  border:1px solid rgba(14,92,170,.55);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(170,245,255,.95), rgba(170,245,255,0) 70%),
    radial-gradient(circle at 50% 40%, #4FC4F5 0%, #1E8BE0 55%, #0D5FB8 100%);
  box-shadow:inset 0 -4px 10px rgba(150,240,255,.55), inset 0 3px 6px rgba(0,40,100,.45), 0 4px 10px rgba(0,60,130,.35), 0 1px 2px rgba(0,30,70,.4)}
#adminBtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  background:linear-gradient(to bottom, rgba(255,255,255,.95), rgba(255,255,255,.35) 60%, rgba(255,255,255,.05));pointer-events:none}
#adminBtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(#22AFBC calc(var(--p)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);opacity:.9}
#adminBtn .ab-label{position:relative;display:block;text-align:center;font-family:var(--f-body);font-weight:700;font-size:8.5px;letter-spacing:.02em;line-height:1;color:#FFFFFF;text-shadow:0 1px 1.5px rgba(0,50,110,.65);pointer-events:none}
body.admin #adminBtn .ab-label{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:0;color:#9FF3F5;text-shadow:0 0 6px rgba(63,207,210,.7),0 1px 1px rgba(0,0,0,.6)}
body.admin #adminBtn{opacity:.6;border-color:rgba(10,20,26,.8);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(110,230,240,.85), rgba(110,230,240,0) 70%),
    radial-gradient(circle at 50% 40%, #3D4F5A 0%, #17242C 60%, #05090C 100%);
  box-shadow:inset 0 -4px 10px rgba(90,220,235,.45), inset 0 3px 6px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4), 0 0 0 3px rgba(63,207,210,.35)}
body.setup #adminBtn{display:none}
@media print{body *{visibility:hidden}#recBox,#recBox *{visibility:visible}#recBox{position:absolute;left:0;top:0;box-shadow:none}#recView{position:static;background:none;padding:0}.noprint{display:none!important}}
@media (max-width:600px){.title h1{font-size:30px}#startBtn{min-width:200px;font-size:24px}}
</style>
</head>
<body class="setup">

<div id="setupView"><div class="wrap">
  <div class="title"><span class="mark" aria-hidden="true"><i style="background:#BFE0F5"></i><i style="background:#9CC46B"></i><i style="background:#9A6A3E"></i></span><h1>동물이 사는 곳</h1></div>
  <p class="sub">동물과 그 동물이 사는 곳을 이어 봐요</p>

  <div class="card" id="c1"><h2><span class="num">1</span>누구와 할까요?</h2>
    <div class="row" id="stuRow"></div>
    <div class="newStu hidden" id="newStu"><input id="newName" maxlength="20" placeholder="학생 이름"><button class="chip sm on" id="newOk">넣기</button><button class="chip sm" id="newNo">그만</button></div>
    <div id="resumeBox"></div>
  </div>

  <div class="card" id="c2"><h2><span class="num">2</span>어디까지 배울까요?</h2>
    <div class="row" id="lvRow"></div>
    <div class="bundles" id="bdList"></div>
  </div>

  <div class="card" id="c3"><h2><span class="num">3</span>오늘 할 것</h2>
    <div class="today" id="today"></div>
  </div>

  <details class="more" id="more"><summary>더 정하기 (단계 · 소리 · 목소리)</summary>
    <div class="card">
      <div class="opt"><span>할 단계</span><div class="row" id="stepRow"></div></div>
      <div class="opt"><span>끝 장면</span><div class="row" id="endRow"></div></div>
      <div class="opt"><span>소리</span><div class="row" id="sndRow"></div></div>
      <div class="opt"><span>목소리</span><div class="row" id="voiceRow"></div></div>
      <div class="opt"><span>기록</span><button class="chip sm" id="recOpen">학생 기록 보기</button><button class="chip sm" id="exOpen">예시 보기 (홍길동)</button></div>
    </div>
  </details>

  <div class="startBar"><button id="startBtn" type="button">시작</button></div>
</div></div>

<div id="game">
  <div id="prog"></div>
  <div id="stage"></div>
</div>

<div id="dock"><div id="dockRow"></div><div id="dockNote"></div></div>
<div id="recView"><div id="recBox"></div></div>
<div id="spot"></div><div id="spotTip"></div>
<button id="adminBtn" type="button" aria-label="교사 모드: 3초 동안 누르기"><span class="ab-label" id="abLabel">charum</span></button>

<script>
/* ================= 자료 =================
   동물 그림: 007에 있는 것은 007/pics, 새로 그린 것은 media/animals (흰 바탕 없이 동물만 — 배경이 사는 곳을 알려 주지 않게)
   장면 그림: media/habitats (동물 없이 장소만). 앱 안의 자료는 GitHub 절대 주소로 */
const GH='https://shim-sung-hyun.github.io/web_app/';
const P007=GH+'007/pics/', PNEW=GH+'media/animals/', HAB=GH+'media/habitats/';
const OLD={'개':'gae','고양이':'goyangi','토끼':'tokki','소':'so','돼지':'dwaeji','말':'mal_dongmul','코끼리':'kokkiri','사자':'saja','호랑이':'horangi','기린':'girin','곰':'gom','사슴':'saseum',
 '물고기':'mulgogi','붕어':'bungeo','조개':'jogae','새우':'saeu','달팽이':'dalpaengi','거미':'geomi','참새':'chamsae','까치':'kkachi','독수리':'doksuri','나비':'nabi','잠자리':'jamjari',
 '다람쥐':'daramjwi','여우':'yeou','원숭이':'wonsungi','낙타':'nakta','펭귄':'penggwin','하마':'hama','개구리':'gaeguri','악어':'akeo'};
const NEW={'고래':'gorae','상어':'sangeo','문어':'muneo','오징어':'ojingeo','해파리':'haepari','불가사리':'bulgasari','바다표범':'badapyobeom','북극곰':'bukgeukgom',
 '두더지':'dudeoji','지렁이':'jireongi','땅강아지':'ttanggangaji','비둘기':'bidulgi','벌':'beol','부엉이':'bueongi','딱따구리':'ttakttaguri','얼룩말':'eollukmal',
 '전갈':'jeongal','사막여우':'sangmagyeou','소금쟁이':'sogeumjaengi','물방개':'mulbanggae','수달':'sudal','우렁이':'ureongi','백로':'baengno','미꾸라지':'mikkuraji'};
const pic=a=>OLD[a]?P007+OLD[a]+'.webp':PNEW+NEW[a]+'.webp';
/* 곳: label 카드 글자 · live 들려줄 말 · find 곳 보고 동물 찾기 말 · y 장면 안에서 동물을 놓는 높이(위~아래) */
const PL={
  land:{label:'땅',scene:'ground',live:'땅에 살아요',find:'땅에 사는 동물을',y:[.55,.86]},
  water:{label:'물',scene:'water',live:'물에 살아요',find:'물에 사는 동물을',y:[.35,.78]},
  ground:{label:'땅 위',scene:'ground',live:'땅 위에 살아요',find:'땅 위에 사는 동물을',y:[.55,.86]},
  underground:{label:'땅속',scene:'underground',live:'땅속에 살아요',find:'땅속에 사는 동물을',y:[.42,.82]},

function cleanF(f,rate){
  const n=f.length, W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }
  const th=Math.max(0.003,mx*0.04), seg=[]; let on=-1;
  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));
  const body=f.slice(st,en), L=body.length, fi=Math.min(L,Math.round(rate*0.008)), fo=Math.min(L,Math.round(rate*0.04));
  for(let k=0;k<fi;k++) body[k]*=k/fi; for(let k=0;k<fo;k++) body[L-1-k]*=k/fo;
  const lead=Math.round(rate*0.06), out=new Float32Array(lead+L); out.set(body,lead); return {data:out,rate};
}

function sha1Bytes(msg){
  const l=msg.length, w=[], H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  const m=new Uint8Array(((l+9+63)>>6)<<6); m.set(msg); m[l]=0x80; const bl=l*8; const dv=new DataView(m.buffer); dv.setUint32(m.length-4,bl>>>0); dv.setUint32(m.length-8,Math.floor(bl/4294967296));
  for(let i=0;i<m.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<80;t++){ const x=w[t-3]^w[t-8]^w[t-14]^w[t-16]; w[t]=(x<<1)|(x>>>31); }
    let [a,b,c,d,e]=H;
    for(let t=0;t<80;t++){ const f=t<20?(b&c)|(~b&d):t<40?b^c^d:t<60?(b&c)|(b&d)|(c&d):b^c^d, k=t<20?0x5A827999:t<40?0x6ED9EBA1:t<60?0x8F1BBCDC:0xCA62C1D6;
      const tmp=(((a<<5)|(a>>>27))+f+e+k+w[t])>>>0; e=d; d=c; c=(b<<30)|(b>>>2); b=a; a=tmp; }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0;
  }
  const out=new Uint8Array(20); const ov=new DataView(out.buffer); H.forEach((h,i)=>ov.setUint32(i*4,h)); return out;
}
async function sha16(t){ const u=new TextEncoder().encode(t); const d=window.crypto&&crypto.subtle?new Uint8Array(await crypto.subtle.digest('SHA-1',u)):sha1Bytes(u); return [...d].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16); }

    rb.innerHTML='<div class="resume">멈춘 곳: '+LV[rs.lv].name+' · 묶음 '+(rs.b+1)+' · '+(PHASES.find(p=>p[0]===rs.ph)||['',''])[1]
      +' <button class="chip sm on" id="rsGo">이어 하기</button><button class="chip sm" id="rsDel">멈춘 곳 지우기</button></div>';
    $('rsGo').onclick=()=>{ S.level=rs.lv; S.bundle=rs.b; saveS(); startLesson(rs); };
    $('rsDel').onclick=()=>{ delete RESUME[S.stu||'_']; saveResume(); renderSetup(); };
  }
  /* ② 수준·묶음 */
  const lr=$('lvRow'); lr.innerHTML='';
  Object.keys(LV).forEach(l=>{ const b=document.createElement('button'); b.className='chip lv'+(S.level==l?' on':'');
    b.innerHTML='<b>'+LV[l].name+'</b><span>'+LV[l].desc+'</span>'; b.onclick=()=>{ if(S.level!=l){ S.level=+l; S.bundle=0; } saveS(); renderSetup(); flash('c3'); }; lr.appendChild(b); });
  const bl=$('bdList'); bl.innerHTML='';
  const done=(DONE[S.stu||'_']||{});
  BUN[S.level].forEach((bd,i)=>{ const b=document.createElement('button'); b.className='bd'+(S.bundle===i?' on':'');
    const key=S.level+'-'+(i+1);
    b.innerHTML='<div class="bh">묶음 '+(i+1)+(HARD.has(key)?' <em>비슷한 곳 구별하기</em>':'')+'</div>'
      +'<div class="pl">'+bd.places.map(p=>PL[p].label).join(' · ')+'</div>'
      +'<div class="an">'+bd.items.map(it=>'<img src="'+pic(it.a)+'" alt="'+esc(it.a)+'" title="'+esc(it.a)+'">').join('')+'</div>'
      +(done[key]?'<div class="done">✓ 마침 '+done[key]+'번</div>':'');
    b.onclick=()=>{ S.bundle=i; saveS(); renderSetup(); flash('c3'); }; bl.appendChild(b); });
  /* ③ 오늘 할 것 */
  const bd=BUN[S.level][S.bundle];
  const steps=PHASES.filter(p=>S.steps[p[0]]).map(p=>p[1]);
  $('today').innerHTML='<div class="places">'+bd.places.map(p=>'<div class="pl1"><img src="'+HAB+PL[p].scene+'.jpg" alt="">'+PL[p].label
      +'<div class="ans">'+bd.items.filter(it=>it.p===p).map(it=>'<img src="'+pic(it.a)+'" alt="'+esc(it.a)+'" title="'+esc(it.a)+'">').join('')+'</div></div>').join('')+'</div>'
    +'<div class="steps">'+LV[S.level].name+' · 묶음 '+(S.bundle+1)+' · 동물 '+bd.items.length+'마리<br>단계: '+(steps.join(' → ')||'(없음)')+(S.steps.sort&&S.endScene?' → 끝 장면':'')
    +'<br>'+(S.stu?'기록: '+esc(nameOf(S.stu)):'연습 — 기록하지 않아요')+'</div>';
  /* 더 정하기 */
  const st=$('stepRow'); st.innerHTML='';
  PHASES.forEach(([k,n])=>{ const b=document.createElement('button'); b.className='chip sm'+(S.steps[k]?' on':''); b.textContent=n;
    b.onclick=()=>{ S.steps[k]=S.steps[k]?0:1; if(!PHASES.some(p=>S.steps[p[0]])) S.steps[k]=1; saveS(); renderSetup(); }; st.appendChild(b); });
  const er=$('endRow'); er.innerHTML='';
  [['보여 주기',1],['보여 주지 않기',0]].forEach(([n,v])=>{ const b=document.createElement('button'); b.className='chip sm'+((S.endScene?1:0)===v?' on':''); b.textContent=n; b.onclick=()=>{ S.endScene=!!v; saveS(); renderSetup(); }; er.appendChild(b); });
  const sn=$('sndRow'); sn.innerHTML='';
  [['켬',1],['끔',0]].forEach(([n,v])=>{ const b=document.createElement('button'); b.className='chip sm'+((S.sound?1:0)===v?' on':''); b.textContent=n; b.onclick=()=>{ S.sound=!!v; saveS(); renderSetup(); }; sn.appendChild(b); });
  renderVoiceRow();
}
function renderVoiceRow(){
  const vr=$('voiceRow'); if(!vr) return; vr.innerHTML='';
  [['내장 목소리','builtin'],['기기 목소리','device']].forEach(([n,v])=>{ const b=document.createElement('button'); b.className='chip sm'+(S.engine===v?' on':''); b.textContent=n; b.onclick=()=>{ S.engine=v; saveS(); renderVoiceRow(); }; vr.appendChild(b); });
  if(VSET&&!BUILTIN_OK&&S.engine==='builtin'){ const s=document.createElement('span'); s.style.cssText='font-size:13px;color:#8A5A12'; s.textContent='내장 목소리를 준비하는 중이라 지금은 기기 목소리로 해요.'; vr.appendChild(s); }
}
function flash(id){ const c=$(id); if(!c) return; c.scrollIntoView({behavior:'smooth',block:'nearest'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),900); }
$('newOk').onclick=()=>{ const n=$('newName').value.trim(); if(!n) return; const s={id:newSid(),name:n}; students.push(s); saveStudents(); S.stu=s.id; saveS(); $('newName').value=''; $('newStu').classList.add('hidden'); renderSetup(); };
$('newNo').onclick=()=>{ $('newStu').classList.add('hidden'); };
$('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') $('newOk').click(); });
$('startBtn').onclick=()=>startLesson(null);
$('recOpen').onclick=()=>openRecords(false);
$('exOpen').onclick=()=>openRecords(true);

/* ================= 수업 진행 =================
   한 묶음: 보기(동물마다 한 번) → 동물 보고 곳 고르기 → 곳 보고 동물 고르기 → 정리하기 → 끝 장면(학습 뒤 보상, 기록 안 함) */
let RUN=null;
function buildRun(lv,b){
  const bd=BUN[lv][b], phases=[];
  PHASES.forEach(([k])=>{ if(!S.steps[k]) return; phases.push({k,items:k==='show'?[...bd.items]:shuffleNoRepeat(bd.items)}); });
  return {lv,b,bd,phases,pi:0,ii:0,g:Date.now(),placed:{},token:0};
}
function shuffleNoRepeat(items){ /* 같은 곳이 세 번 이어 나오지 않게 섞음 */
  for(let t=0;t<30;t++){ const s=shuffle(items); let ok=true; for(let i=2;i<s.length;i++) if(s[i].p===s[i-1].p&&s[i].p===s[i-2].p) ok=false; if(ok) return s; }
  return shuffle(items);
}
function startLesson(rs){
  unlockAudio(); chooseEngine();
  RUN=buildRun(S.level,S.bundle);
  if(rs){ const pi=RUN.phases.findIndex(p=>p.k===rs.ph); if(pi>=0){ RUN.pi=pi; RUN.ii=Math.min(rs.ii||0,RUN.phases[pi].items.length-1); } }
  document.body.classList.remove('setup'); goFull();
  setTimeout(()=>runStep(),350);   /* 전체 화면으로 다 커진 뒤 그림 */
}
function totalItems(){ return RUN.phases.reduce((n,p)=>n+p.items.length,0); }
function doneItems(){ let n=0; for(let i=0;i<RUN.pi;i++) n+=RUN.phases[i].items.length; return n+RUN.ii; }
function renderProg(){
  const pr=$('prog'); const T=totalItems(), D=doneItems(); pr.innerHTML='';
  if(!RUN||RUN.ending){ pr.className=''; return; }
  if(T>10){ pr.className='bar'; pr.innerHTML='<b style="width:'+Math.max(4,Math.round((D+1)/T*100))+'%"></b>'; return; }
  pr.className=''; for(let i=0;i<T;i++){ const c=document.createElement('i'); if(i<D) c.className='d'; else if(i===D) c.className='n'; pr.appendChild(c); }
}
function saveSpot(){ if(!RUN) return; const p=RUN.phases[RUN.pi]; if(!p) return; RESUME[S.stu||'_']={lv:RUN.lv,b:RUN.b,ph:p.k,ii:RUN.ii,t:Date.now()}; saveResume(); }
window.addEventListener('pagehide',saveSpot);
function clearStage(){ const st=$('stage'); st.innerHTML=''; document.querySelectorAll('.fly,.drag').forEach(x=>x.remove());
  if(S.stu&&!document.body.classList.contains('setup')){ const d=document.createElement('div'); d.className='recDot'; d.title='기록 중'; st.appendChild(d); } }
/* 화면 크기: 메뉴·단추 사이 빈 곳 */
function area(){ const st=$('stage'); const r=st.getBoundingClientRect(); return {w:r.width-32,h:r.height-70}; }
function nextItem(){
  if(!RUN) return;
  RUN.ii++;
  if(RUN.ii>=RUN.phases[RUN.pi].items.length){ RUN.pi++; RUN.ii=0; }
  if(RUN.pi>=RUN.phases.length){ finishBundle(); return; }
  saveSpot(); runStep();
}
function runStep(){
  if(!RUN) return;
  RUN.token++; clearTimers(); stopVoice(); clearStage(); renderProg(); saveSpot();
  const ph=RUN.phases[RUN.pi], it=ph.items[RUN.ii];
  ({show:stepShow,a2p:stepA2P,p2a:stepP2A,sort:stepSort})[ph.k](it,RUN.token);
}
let TIMERS=[]; function later(fn,ms){ TIMERS.push(setTimeout(fn,ms)); } function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }
const alive=tok=>RUN&&RUN.token===tok&&!S.admin;

/* 세로 화면(태블릿 세로·휴대폰)에서는 곳 카드 3~4개를 두 줄로 */
const portrait=()=>{ const A=area(); return A.w<A.h*1.05; };
function placeGrid(n,W,H,gap){
  const cols=(portrait()&&n>2)?2:n, rows=Math.ceil(n/cols);
  const cw=Math.min((W-gap*(cols-1))/cols-2, ((H-gap*(rows-1))/rows-62)*4/3, 440);
  const row=document.createElement('div'); row.className='opts'; row.style.columnGap=gap+'px';
  if(cols<n){ row.style.flexWrap='wrap'; row.style.maxWidth=(cw*cols+gap*(cols-1)+2)+'px'; row.style.rowGap=gap+'px'; }
  return {row,cw};
}
/* 장면 카드(곳) */
function placeCard(p,w,cls){
  const c=document.createElement('div'); c.className=cls||'pc'; c.dataset.p=p; c.style.width=w+'px';
  c.innerHTML='<div class="scene"><img class="bg" src="'+HAB+PL[p].scene+'.jpg" alt="" draggable="false"></div><div class="lab">'+PL[p].label+'</div>';
  return c;
}
/* 장면 안에 동물 놓기(자리는 곳마다 정한 높이 안에서 고르게) */
function layoutPlaced(sceneEl,p,list){
  sceneEl.querySelectorAll('.placed').forEach(x=>x.remove());
  const n=list.length; if(!n) return; const W=sceneEl.clientWidth, H=sceneEl.clientHeight; const [y0,y1]=PL[p].y;
  const size=Math.min(H*(n>2?0.36:0.44),W/(Math.min(n,3)+0.6));
  list.forEach((a,i)=>{ const col=n<=3?i:i%3, rows=n<=3?1:2, row=n<=3?0:Math.floor(i/3), per=n<=3?n:3;
    const x=W*(col+1)/(per+1), y=H*(rows===1?(y0+y1)/2:(y0+(y1-y0)*(row?0.85:0.25)));
    const im=document.createElement('img'); im.className='placed'; im.src=pic(a); im.alt=a; im.style.width=im.style.height=size+'px'; im.style.left=x+'px'; im.style.top=y+'px'; sceneEl.appendChild(im); });
}
/* 동물이 한 번 천천히 날아가 들어감 */
function flyTo(fromEl,toEl,a,size){ return new Promise(res=>{
  const f=fromEl.getBoundingClientRect(), t=toEl.getBoundingClientRect();
  const im=document.createElement('img'); im.className='fly'; im.src=pic(a);
  Object.assign(im.style,{left:f.left+'px',top:f.top+'px',width:f.width+'px',height:f.height+'px'}); document.body.appendChild(im);
  fromEl.style.visibility='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ Object.assign(im.style,{left:(t.left+t.width/2-size/2)+'px',top:(t.top+t.height/2-size/2)+'px',width:size+'px',height:size+'px'}); }));
  setTimeout(()=>{ im.remove(); res(); },850);
}); }

/* ---- 1. 보기: 곳 장면 + 동물이 들어가며 "○○는 ○○에 살아요." ---- */
async function stepShow(it,tok){
  const st=$('stage'), A=area();
  const h=Math.min(A.h*0.78,(A.w*(portrait()?0.94:0.7))*3/4), w=h*4/3;
  const card=document.createElement('div'); card.className='showCard'; card.style.width=w+'px'; card.style.height=h+'px';
  card.innerHTML='<img class="bg" src="'+HAB+PL[it.p].scene+'.jpg" alt=""><div class="lab">'+PL[it.p].label+'</div>';
  const tag=document.createElement('div'); tag.className='nameTag'; tag.textContent=it.a; tag.style.opacity=0; tag.style.transition='opacity .6s';
  st.appendChild(card); st.appendChild(tag);
  const sz=h*0.42;
  const src=document.createElement('img'); src.src=pic(it.a); src.className='fly';
  const r=card.getBoundingClientRect(); const [y0,y1]=PL[it.p].y;
  Object.assign(src.style,{left:(r.right-sz*0.2)+'px',top:(r.top+h*(y0+y1)/2-sz/2)+'px',width:sz+'px',height:sz+'px',opacity:0,transition:'left 1.4s ease,opacity .6s'});
  document.body.appendChild(src);
  await wait(500); if(!alive(tok)) return src.remove();
  src.style.opacity=1; src.style.left=(r.left+w/2-sz/2)+'px';
  await wait(1450); if(!alive(tok)) return src.remove();
  src.remove(); layoutPlaced(card,it.p,[it.a]); tag.style.opacity=1;
  await speak(liveLine(it.a,it.p)); if(!alive(tok)) return;
  await wait(1300); if(!alive(tok)) return;
  nextItem();
}

/* 고르기 공통: 8초 뒤 안내 다시 → 16초 뒤 정답 빛남. 틀리면 정답 빛남(도움으로 기록). 고르기 전에는 보기 이름을 말하지 않음 */
function choiceRound(tok,{say,cards,isRight,onRight,rec}){
  let wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; cards.filter(isRight).forEach(c=>c.classList.add('glow')); };
  /* 견본 먼저 → 약 1초 뒤 보기가 서서히(그 전엔 눌리지 않음) */
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(say).then(()=>{ if(!alive(tok)) return;
    later(()=>{ if(alive(tok)&&!over) speak(say); },8000);
    later(()=>{ if(alive(tok)&&!over) glow(); },16000);
  });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)) return;
    if(isRight(c)){ over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); chime();
      rec(wrong,helped||!!wrong); onRight(c); }
    else if(!wrong){ wrong=c; glow(); }
  }));
}
function logRow(ph,it,wrongId,help){
  if(!S.stu) return;
  LOG.push({s:S.stu,t:Date.now(),g:RUN.g,lv:RUN.lv,b:RUN.b+1,ph,a:it.a,p:it.p,res:help?'help':'first',w:wrongId||''}); saveLog();
}

/* ---- 2. 동물 보고 곳 고르기: 견본 = 동물(말풍선), 보기 = 곳 장면 2~4개 ---- */
function stepA2P(it,tok){
  const st=$('stage'), A=area(), places=shuffle(RUN.bd.places), n=places.length;
  const sh=Math.min(A.h*0.30,220);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML='<img class="a" src="'+pic(it.a)+'" alt="'+esc(it.a)+'" style="width:'+sh+'px;height:'+sh+'px">';
  const gap=Math.max(14,A.w*0.022);
  const {row,cw}=placeGrid(n,A.w,A.h-sh-40,gap);
  places.forEach(p=>{ const c=placeCard(p,cw); c.classList.add('fadeIn'); row.appendChild(c); });
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children], img=bub.querySelector('img');
  choiceRound(tok,{say:askPlace(it.a),cards,isRight:c=>c.dataset.p===it.p,
    rec:(w,h)=>logRow('a2p',it,w&&w.dataset.p,h),
    onRight:async c=>{ const sc=c.querySelector('.scene'); await flyTo(img,sc,it.a,sc.clientHeight*0.5); if(!alive(tok)) return;
      layoutPlaced(sc,it.p,[it.a]); await speak(liveLine(it.a,it.p)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});
}

/* ---- 3. 곳 보고 동물 고르기: 견본 = 곳 장면(말풍선), 보기 = 동물 2~3마리(정답은 하나) ---- */
function stepP2A(it,tok){
  const st=$('stage'), A=area();
  const k=LV[RUN.lv].opts-1;
  let pool=RUN.bd.items.filter(x=>x.p!==it.p&&!PAIRS.some(pr=>pr.includes(x.a)&&pr.includes(it.a)));
  /* 같은 곳 동물이 겹치지 않게 곳이 다른 것부터 고름 */
  const picks=[]; shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.some(y=>y.p===x.p)) picks.push(x); });
  shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.includes(x)) picks.push(x); });
  const opts=shuffle([it,...picks]);
  const bh=portrait()?Math.min(A.h*0.34,(A.w*0.8)*3/4,380):Math.min(A.h*0.36,260), bw=bh*4/3;
  const bub=document.createElement('div'); bub.className='bubble';
  bub.innerHTML='<div class="showCard" style="width:'+bw+'px;height:'+bh+'px;border-width:0"><img class="bg" src="'+HAB+PL[it.p].scene+'.jpg" alt=""><div class="lab">'+PL[it.p].label+'</div></div>';
  const row=document.createElement('div'); row.className='opts';
  const n=opts.length, gap=Math.max(16,A.w*0.03);
  const cs=Math.min((A.w-gap*(n-1))/n, A.h-bh-110, 260);
  opts.forEach(x=>{ const c=document.createElement('div'); c.className='ac fadeIn'; c.dataset.a=x.a; c.style.width=c.style.height=cs+'px'; c.innerHTML='<img src="'+pic(x.a)+'" alt="'+esc(x.a)+'" draggable="false">'; row.appendChild(c); });
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children], scene=bub.querySelector('.showCard');
  choiceRound(tok,{say:askAnimal(it.p),cards,isRight:c=>c.dataset.a===it.a,
    rec:(w,h)=>logRow('p2a',it,w&&w.dataset.a,h),
    onRight:async c=>{ cards.forEach(x=>{ if(x!==c) x.style.opacity=.25; }); await flyTo(c.querySelector('img'),scene,it.a,bh*0.5); if(!alive(tok)) return;
      layoutPlaced(scene,it.p,[it.a]); await speak(liveLine(it.a,it.p)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});
}

/* ---- 4. 정리하기: 곳 카드를 모두 펼치고, 동물을 하나씩 사는 곳에 넣음(끌거나, 곳을 누름). 틀리면 반응 없음 ---- */
function stepSort(it,tok){
  const st=$('stage'), A=area(), places=RUN.bd.places, n=places.length;   /* 정리하기는 곳 자리를 늘 같게(예측 가능) */
  const gap=Math.max(14,A.w*0.02);
  const animalSz=Math.min(A.h*0.26,190);
  const {row,cw}=placeGrid(n,A.w,A.h-animalSz-40,gap);
  places.forEach(p=>{ const c=placeCard(p,cw); row.appendChild(c); });
  const tray=document.createElement('div'); tray.className='tray';
  const ac=document.createElement('div'); ac.className='ac'; ac.style.width=ac.style.height=animalSz+'px'; ac.innerHTML='<img src="'+pic(it.a)+'" alt="'+esc(it.a)+'" draggable="false">';
  tray.appendChild(ac); st.appendChild(row); st.appendChild(tray);
  const cards=[...row.children];
  requestAnimationFrame(()=>cards.forEach(c=>layoutPlaced(c.querySelector('.scene'),c.dataset.p,RUN.placed[c.dataset.p]||[])));
  let wrong=null, helped=false, over=false;
  const sayName=()=>speak(nameLine(it.a));
  sayName().then(()=>{ if(!alive(tok)) return;
    const again=()=>{ later(()=>{ if(alive(tok)&&!over){ if(drag||pdown) return again(); sayName().then(again); } },3000); }; again();   /* 놀이 신호: 맞힐 때까지 말이 끝나고 3초마다(손가락이 닿아 있으면 기다림) */
    later(()=>{ if(alive(tok)&&!over){ helped=true; cards.filter(c=>c.dataset.p===it.p).forEach(c=>c.classList.add('glow')); } },16000);
  });
  const tryPlace=async c=>{
    if(over||!alive(tok)) return;
    if(c.dataset.p!==it.p){ if(!wrong) wrong=c.dataset.p; return; }   /* 놀이: 틀리면 반응 없음(먼저 누른 곳만 기록) */
    over=true; clearTimers(); c.classList.remove('glow'); chime(); logRow('sort',it,wrong,helped||!!wrong);
    const sc=c.querySelector('.scene'); await flyTo(ac.querySelector('img'),sc,it.a,sc.clientHeight*0.4); if(!alive(tok)) return;
    (RUN.placed[it.p]=RUN.placed[it.p]||[]).push(it.a); layoutPlaced(sc,it.p,RUN.placed[it.p]);
    await speak(liveLine(it.a,it.p)); if(!alive(tok)) return; await wait(700); if(alive(tok)) nextItem();
  };
  cards.forEach(c=>c.addEventListener('pointerdown',e=>{ if(!drag) tryPlace(c); }));
  /* 끌기 */
  let drag=null;
  ac.addEventListener('pointerdown',e=>{ if(over) return; e.preventDefault(); try{ ac.setPointerCapture(e.pointerId); }catch(_){}
    drag={x:e.clientX,y:e.clientY,on:false,g:null}; });
  ac.addEventListener('pointermove',e=>{ if(!drag) return;
    if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){ drag.on=true; const g=document.createElement('img'); g.className='drag'; g.src=pic(it.a); g.style.width=g.style.height=animalSz*0.8+'px'; document.body.appendChild(g); drag.g=g; ac.style.opacity=.3; }
    if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px'; } });
  const endDrag=e=>{ if(!drag) return; const d=drag; drag=null; if(d.g) d.g.remove(); ac.style.opacity=1;
    if(d.on){ const el=document.elementFromPoint(e.clientX,e.clientY); const c=el&&el.closest('.pc'); if(c) tryPlace(c); } };

}

async function finishBundle(){
  const key=RUN.lv+'-'+(RUN.b+1), who=S.stu||'_';
  DONE[who]=DONE[who]||{}; DONE[who][key]=(DONE[who][key]||0)+1; store.set('done',JSON.stringify(DONE));
  delete RESUME[who]; saveResume();
  RUN.ending=true; RUN.token++; const tok=RUN.token; clearTimers(); clearStage(); renderProg();
  if(!S.endScene){ await speak(END_LINE); return; }
  const st=$('stage'), A=area(), places=RUN.bd.places, n=places.length;
  const cols=n<=2?n:2, rows=Math.ceil(n/cols), gap=16;
  const cw=Math.min((A.w-gap*(cols-1))/cols, ((A.h-gap*(rows-1))/rows-48)*4/3, 620);
  const g=document.createElement('div'); g.className='endGrid'; g.style.maxWidth=(cw*cols+gap*cols)+'px';
  places.forEach(p=>{ const c=placeCard(p,cw); c.style.cursor='default'; g.appendChild(c); }); st.appendChild(g);
  requestAnimationFrame(()=>{ [...g.children].forEach(c=>{ const p=c.dataset.p, sc=c.querySelector('.scene');
    layoutPlaced(sc,p,RUN.bd.items.filter(x=>x.p===p).map(x=>x.a));
    sc.querySelectorAll('.placed').forEach(im=>{ im.style.pointerEvents='auto'; im.style.cursor='pointer'; tapper(im,()=>{ if(alive(tok)) speak(liveLine(im.alt,p)); }); }); }); });
  speak(END_LINE);
}

const PH_NAME={a2p:'동물 보고 곳',p2a:'곳 보고 동물',sort:'정리하기'};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const barH=v=>'<span class="bar100"><b style="width:'+v+'%"></b></span>'+v+'%';
const dayOf=t=>{ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const weekOf=t=>{ const d=new Date(t); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return dayOf(m); };
function plName(id){ return PL[id]?PL[id].label:id; }
function exampleLog(){ /* 가상의 학생 홍길동의 한 달(이 기기 기록에 넣지 않음) */
  const rows=[], start=Date.now()-28*864e5; let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let d=0;d<28;d+=2){ const lv=d<12?1:2, b=(d/2)%BUN[lv].length, bd=BUN[lv][b], g=start+d*864e5+9*36e5;
    ['a2p','p2a','sort'].forEach((ph,k)=>bd.items.forEach((it,i)=>{ const skill=Math.min(.95,(lv===1?.55:.4)+d*.02+(it.p==='underground'?-.15:0));
      const ok=rnd()<skill; const others=bd.places.filter(p=>p!==it.p);
      rows.push({s:'ex',t:g+(k*10+i)*40e3,g,lv,b:b+1,ph,a:it.a,p:it.p,res:ok?'first':'help',w:ok?'':(ph==='p2a'?bd.items.find(x=>x.p!==it.p).a:others[Math.floor(rnd()*others.length)])}); })); }
  return rows;
}
let REC_SEL='';
function openRecords(example){
  $('recView').classList.add('on');
  REC_SEL=example?'ex':(REC_SEL&&REC_SEL!=='ex'?REC_SEL:(S.stu||(students[0]||{}).id||''));

function renderRecords(){
  const ex=REC_SEL==='ex', rows=ex?exampleLog():LOG.filter(r=>r.s===REC_SEL);
  const who=ex?'홍길동 (예시)':nameOf(REC_SEL);

  h+='<div class="row noprint" style="margin-bottom:8px">'+students.map(s=>'<button class="chip sm'+(REC_SEL===s.id?' on':'')+'" data-s="'+s.id+'">'+esc(s.name)+'</button>').join('')
    +'<button class="chip sm'+(ex?' on':'')+'" data-s="ex">예시 (홍길동)</button></div>';
  if(!rows.length){ h+='<p class="tip">아직 기록이 없습니다. 설정 화면 ①에서 학생을 고르고 수업하면 문제마다 기록됩니다(연습은 기록하지 않음). 기록은 이 기기에만 있습니다.</p>'; }
  else{
    /* 한 장 요약 */
    const half=Math.floor(rows.length/2), first=rows.slice(0,half), last=rows.slice(half);
    const ok=r=>r.res==='first';
    h+='<h3>단계별 바로 맞힌 비율 (처음 절반 → 최근 절반)</h3><table><tr><th>수준</th><th>단계</th><th>문제 수</th><th>처음</th><th>최근</th></tr>';
    [1,2,3].forEach(lv=>['a2p','p2a','sort'].forEach(ph=>{ const all=rows.filter(r=>r.lv===lv&&r.ph===ph); if(!all.length) return;
      const m=Math.floor(all.length/2), a=all.slice(0,m||all.length), b=all.slice(m);
      h+='<tr><td>'+LV[lv].name+'</td><td>'+PH_NAME[ph]+'</td><td>'+all.length+'</td><td>'+barH(pct(a.filter(ok).length,a.length))+'</td><td>'+barH(pct(b.filter(ok).length,b.length))+'</td></tr>'; }));
    h+='</table>';
    /* 주별 흐름 */
    const wk={}; rows.forEach(r=>{ const w=weekOf(r.t); (wk[w]=wk[w]||[]).push(r); });
    h+='<h3>주별 흐름</h3><table><tr><th>주(월요일)</th><th>문제 수</th><th>바로 맞힘</th></tr>'+Object.keys(wk).sort().map(w=>'<tr><td>'+w+'</td><td>'+wk[w].length+'</td><td>'+barH(pct(wk[w].filter(ok).length,wk[w].length))+'</td></tr>').join('')+'</table>';
    /* 도움이 더 필요한 동물 */
    const byA={}; rows.forEach(r=>{ const k=r.a+'|'+r.p; (byA[k]=byA[k]||[]).push(r); });
    const hard=Object.entries(byA).filter(([k,v])=>v.length>=3&&pct(v.filter(ok).length,v.length)<60).sort((a,b)=>pct(a[1].filter(ok).length,a[1].length)-pct(b[1].filter(ok).length,b[1].length));
    h+='<h3>도움이 더 필요한 동물 (3번 이상, 바로 맞힘 60% 미만)</h3>'+(hard.length?'<table><tr><th>동물</th><th>사는 곳</th><th>문제 수</th><th>바로 맞힘</th></tr>'+hard.map(([k,v])=>{ const [a,p]=k.split('|'); return '<tr><td>'+esc(a)+'</td><td>'+plName(p)+'</td><td>'+v.length+'</td><td>'+barH(pct(v.filter(ok).length,v.length))+'</td></tr>'; }).join('')+'</table>':'<p class="tip">없습니다.</p>');

    const conf={}; rows.filter(r=>r.w&&r.ph!=='p2a').forEach(r=>{ const k=plName(r.p)+' → '+plName(r.w); conf[k]=(conf[k]||0)+1; });

    /* 다음에 해 볼 것(수준 알림: 5번 이상 + 최근 3번 수업 80% 이상 올리기 / 45% 이하 낮추기 — 단추를 눌러야 바뀜) */

    else if(sk.length>=5&&rate<=45&&LV[lvNow-1]){ sug=LV[lvNow].name+'의 최근 3번 수업에서 바로 맞힌 비율이 '+rate+'%입니다. '+LV[lvNow-1].name+'로 돌아가 다지는 것도 좋습니다.'; btn='<button class="chip sm noprint" id="lvSet" data-l="'+(lvNow-1)+'">'+LV[lvNow-1].name+'로 바꾸기</button>'; }
    if(hard.length) sug+=' 도움이 더 필요한 동물('+hard.slice(0,3).map(x=>x[0].split('|')[0]).join(', ')+')이 든 묶음을 다시 해 봅니다.';
    h+='<h3>다음에 해 볼 것</h3><div class="sugg">'+sug+' '+(ex?'':btn)+'</div>';
    /* 자세한 표 */
    h+='<details style="margin-top:14px"><summary style="cursor:pointer">자세한 기록 ('+rows.length+'줄)</summary><table><tr><th>시각</th><th>수준·묶음</th><th>단계</th><th>동물</th><th>사는 곳</th><th>결과</th><th>먼저 누른 것</th></tr>'
      +rows.slice().reverse().slice(0,400).map(r=>'<tr><td>'+dayOf(r.t)+' '+new Date(r.t).toTimeString().slice(0,5)+'</td><td>'+r.lv+'-'+r.b+'</td><td>'+PH_NAME[r.ph]+'</td><td>'+esc(r.a)+'</td><td>'+plName(r.p)+'</td><td>'+(r.res==='first'?'바로':'도움 받아')+'</td><td>'+esc(r.ph==='p2a'?r.w:plName(r.w))+'</td></tr>').join('')+'</table></details>';
  }
  h+='<p class="tip" style="margin-top:14px">기록 읽는 법: "바로"는 처음 누른 것이 맞은 것, "도움 받아"는 틀린 뒤나 정답이 빛난 뒤에 맞힌 것입니다. 기록은 판단의 근거 가운데 하나이고, 학생끼리 비교하지 않습니다. 기록은 이 기기 브라우저에만 있습니다.</p>';
  h+='<div class="row noprint" style="margin-top:12px"><button class="chip sm" id="recCsv">CSV 내보내기</button><button class="chip sm" id="recPrint">출력 (A4)</button></div>';
  $('recBox').innerHTML=h;
  $('recX').onclick=()=>$('recView').classList.remove('on');
  $('recBox').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ REC_SEL=b.dataset.s; renderRecords(); });
  const ls_=$('lvSet'); if(ls_) ls_.onclick=()=>{ S.level=+ls_.dataset.l; S.bundle=0; saveS(); renderSetup(); ls_.textContent='바꿨습니다(설정 화면 ②)'; ls_.disabled=true; };
  $('recCsv').onclick=()=>{ const head=['학생','시각','수준','묶음','단계','동물','사는 곳','결과','먼저 누른 것'];
    const lines=[head].concat(rows.map(r=>[ex?'홍길동(예시)':nameOf(r.s),dayOf(r.t)+' '+new Date(r.t).toTimeString().slice(0,8),r.lv,r.b,PH_NAME[r.ph],r.a,plName(r.p),r.res==='first'?'바로':'도움 받아',r.ph==='p2a'?r.w:plName(r.w)]));
    const csv='﻿'+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='동물이사는곳_기록_'+(who||'학생')+'.csv'; a.click(); };
  $('recPrint').onclick=()=>window.print();
}

  const loop = () => {
    const p = prog();
    if (down && p > 0.01 && p < 1) {
      const r = btn.getBoundingClientRect(), S = 40;
      dot.style.left = Math.max(4, Math.min(innerWidth - S - 4, r.left + r.width / 2 - S / 2)) + 'px';
      dot.style.top = Math.max(4, r.top - S - 34) + 'px';
      btn.style.opacity = '.75';
      if (!useDot) return void (raf = requestAnimationFrame(loop));
      dot.style.opacity = (0.9 * Math.sin(Math.PI * ((p * 3) % 1))).toFixed(3);
    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);
  const up = () => { down = false; cancelAnimationFrame(raf); hide(); };
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, up, true));
})();
</script>
<script id="adminGate">
/* 관리 메뉴 열기 2단계: 관리 버튼을 3초 누른 뒤, 왼쪽 위에 3초 동안 나타나는 작은 점을 눌러야 열림 */
window.AdminGate = (function () {
  const st = document.createElement('style');
  st.textContent = '#agDot{position:fixed;left:18px;top:18px;width:62px;height:62px;border-radius:50%;z-index:2147483600;display:none;cursor:pointer;touch-action:none;'
    + 'background:radial-gradient(circle at 50% 38%,rgba(210,252,253,.9),rgba(120,225,232,.55) 60%,rgba(70,190,205,.4));border:2px solid rgba(34,175,188,.75);box-shadow:0 0 10px rgba(120,225,232,.6)}'
    + '#agDot svg{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}'
    + '#agDot circle{fill:none;stroke:#22AFBC;stroke-width:4;stroke-linecap:round}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.id = 'agDot'; dot.setAttribute('aria-label', '관리 열기');
  dot.innerHTML = '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="34"/></svg>';
  document.body.appendChild(dot);
  const ring = dot.querySelector('circle'), L = 2 * Math.PI * 34;
  ring.style.strokeDasharray = L;
  let cb = null, t0 = 0, raf = 0, WAIT = 3000;
  const hide = () => { dot.style.display = 'none'; cancelAnimationFrame(raf); cb = null; };
  const tick = () => { const p = (performance.now() - t0) / WAIT; if (p >= 1 || !cb) return hide(); ring.style.strokeDashoffset = L * p; raf = requestAnimationFrame(tick); };
  let armed = false;
  dot.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!cb) return; armed = true; cancelAnimationFrame(raf); try { dot.setPointerCapture(e.pointerId); } catch (x) {} });
  const done = e => { e.preventDefault(); e.stopPropagation(); if (!armed) return; armed = false; const f = cb; cb = null; setTimeout(() => { dot.style.display = 'none'; }, 60); if (f) f(); };
  dot.addEventListener('pointerup', done); dot.addEventListener('pointercancel', done);
  dot.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  return { ask(fn) { cb = fn; t0 = performance.now(); ring.style.strokeDashoffset = 0; dot.style.display = 'block'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, cancel: hide };
})();
</script>
<script id="reportLink">
/* 오류·의견 알리기: 선생님 화면(설정·관리 메뉴)에서만 왼쪽 아래에 작게. 차름 게시판 이 앱 글의 댓글 칸이 새 탭으로 열림 */
(function(){
  var URL='https://www.charum.org/webapp/59860#write';
  var css=document.createElement('style');
  css.textContent='#reportBtn{position:fixed;left:12px;bottom:12px;z-index:2147480000;display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid #6A4C9C55;color:#6A4C9C;font:600 13px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}#reportBtn:hover{background:#fff;border-color:#6A4C9C}#reportBtn.on{display:inline-flex}@media print{#reportBtn{display:none!important}}';
  document.head.appendChild(css);
  function make(){ if(document.getElementById('reportBtn')) return;
    var a=document.createElement('a'); a.id='reportBtn'; a.href=URL; a.target='_blank'; a.rel='noopener'; a.title='이 앱의 오류나 의견을 게시판 댓글로 남겨요';
    a.innerHTML='<span aria-hidden="true">💬</span>오류·의견 알리기'; document.body.appendChild(a); }
  function show(){ try{ return document.body.classList.contains('setup')||document.body.classList.contains('admin'); }catch(e){ return false; } }
  function tick(){ make(); var a=document.getElementById('reportBtn'); if(a) a.classList.toggle('on',!!show()); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,700);
})();
</script>
<script id="endLesson">
/* 수업 끝내기: 관리 메뉴를 열면 전체 화면에서 나오고(잠깐 나가기), 관리 메뉴에 있는 동안 왼쪽 아래 "⏻ 수업 끝내기"(두 번 눌러야)로 앱을 아예 끝냄 */
(function(){
  var BOARD='https://www.charum.org/webapp/59860';
  var ctxs=[]; ['AudioContext','webkitAudioContext'].forEach(function(n){ var C=window[n]; if(!C||C.__endWrap) return;
    var W=function(){ var c=new (Function.prototype.bind.apply(C,[null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    W.prototype=C.prototype; W.__endWrap=true; try{ window[n]=W; }catch(e){} });
  var css=document.createElement('style');
  css.textContent='#endBtn{position:fixed;left:12px;bottom:52px;z-index:2147480001;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
   +'#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
   +'#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
   +'#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin(){ try{ return document.body.classList.contains('admin'); }catch(e){ return false; } }
  function exitFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
  function hush(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio,video').forEach(function(m){ try{ m.pause(); }catch(e){} }); ctxs.forEach(function(c){ try{ c.suspend(); }catch(e){} }); }
  function end(){
    hush(); try{ window.dispatchEvent(new Event('pagehide')); }catch(e){} exitFull();
    var cv=document.createElement('div'); cv.id='endCover';
    cv.innerHTML='<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="'+BOARD+'">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick=function(){ location.reload(); };
    ['pointerdown','click','touchstart','keydown'].forEach(function(t){ cv.addEventListener(t,function(e){ e.stopPropagation(); },true); });
    setTimeout(function(){ try{ window.close(); }catch(e){} },150);
    setInterval(hush,1000);
  }
  var was=false, sureT=0;
  function tick(){
    var b=document.getElementById('endBtn');
    if(!b){ b=document.createElement('button'); b.id='endBtn'; b.type='button'; b.title='앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML='<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
        if(!b.classList.contains('sure')){ b.classList.add('sure'); b.querySelector('.t').textContent='한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT=setTimeout(function(){ b.classList.remove('sure'); b.querySelector('.t').textContent='수업 끝내기'; },3000); return; }
        end(); });
      ['click','pointerup'].forEach(function(t){ b.addEventListener(t,function(e){ e.stopPropagation(); }); });
      document.body.appendChild(b); }
    var a=admin();
    b.classList.toggle('on',a);
    if(a&&!was) exitFull();
    was=a;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,400);
})();
</script>
