<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[차름 과학] 동물원 1편 · 동물이 사는 곳 (베타)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 차름 동물 — 동물이 사는 곳 (008). 과학 영역: 보라 */
:root{
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sci:#6A4C9C; --sci-d:#4E3478; --sci-l:#EEE8F6; --sci-m:#C9BCE0;
  --bg:#F7F4FA; --card:#FFFFFF; --ink:#2B2838; --muted:#6B6777; --line:#E2DCEB;
  --bubble:#EAF3FC; --bubble-b:#BCD6EF; --ok:#3E8E63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.setup{overflow:auto}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== 설정 화면 ===== */
#setupView{min-height:100%;padding:28px 16px 0;
  background-color:var(--bg);
  background-image:radial-gradient(circle at 12px 12px, rgba(106,76,156,.07) 2px, transparent 2.5px);background-size:28px 28px}
body:not(.setup) #setupView{display:none}
.wrap{max-width:900px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:var(--sci-d);line-height:1.1}
.title h1 small{display:block;font-size:24px;color:var(--sci);margin-top:4px;letter-spacing:.01em}
.title h1 small.kick{font-size:20px;margin:0 0 4px}
.title .mark{width:40px;height:40px}
.title .mark{display:flex;flex-direction:column;width:34px;height:34px;border-radius:9px;overflow:hidden;border:2px solid var(--sci-d)}
.title .mark i{flex:1}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,40,100,.04);transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--sci-m)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:var(--sci);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:400;font-size:18px;
  box-shadow:inset 0 0 0 3px var(--sci),inset 0 0 0 5px #fff}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--sci);border-color:var(--sci);color:#fff}
.chip.add{border-style:dashed;color:var(--sci)}
.lv{flex:1 1 220px;text-align:left;padding:12px 14px;min-height:74px}
.lv b{display:block;font-size:17px;margin-bottom:3px}
.lv span{font-size:13.5px;opacity:.85}
.mode{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.mode .chip{min-width:110px}
.pickNote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.perRow{align-items:center;gap:6px;margin-top:10px} .perLab{font-size:14px;color:var(--muted);margin-right:4px}
.pickWarn{font-size:14px;color:#9A3328;margin:8px 0 0;font-weight:700}
.bd .ord{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--sci);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:6px}
.plc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.plc button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;text-align:center;font-weight:700;font-size:16px}
.plc button img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}
.plc button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.plc button.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.agrp{margin-top:12px}
.agrp h4{margin:0 0 6px;font-size:15px;color:var(--sci-d);display:flex;align-items:center;gap:8px}
.agrp h4 img{width:44px;height:33px;object-fit:cover;border-radius:6px}
.agrp .row{gap:6px}
.achip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:3px 10px 3px 4px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;font-family:inherit}
.achip img{width:36px;height:36px;object-fit:contain}
.achip.on{border-color:var(--sci);background:var(--sci);color:#fff}
.achip:disabled{opacity:.35;cursor:default}
.today .plan{flex:1 1 100%}
.today .plan h4{margin:0 0 6px;font-size:15px;color:var(--sci-d)}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.bd{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bd.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.bd .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.bd .bh em{font-style:normal;font-weight:500;font-size:12px;color:var(--sci-d);background:var(--sci-l);padding:2px 8px;border-radius:8px}
.bd .pl{font-size:13px;color:var(--muted)}
.bd .an{display:flex;flex-wrap:wrap;gap:2px}
.bd .an img{width:34px;height:34px;object-fit:contain}
.bd .done{font-size:12px;color:var(--ok)}
.today{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.today .places{display:flex;gap:10px;flex-wrap:wrap}
.today .pl1{width:120px;text-align:center;font-size:14px;font-weight:700}
.today .pl1 img{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:4px}
.today .pl1 .ans{display:flex;justify-content:center;flex-wrap:wrap}
.today .pl1 .ans img{width:34px;height:34px;border:0;object-fit:contain;margin:0}
.steps{font-size:14px;color:var(--muted);line-height:1.7}
.resume{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #EBD9A6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 4px}
details.more .card{margin-top:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.opt>span{min-width:120px;color:var(--muted)}
.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:10px}
.startBar{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(to top,var(--bg) 70%,rgba(247,244,250,0));display:flex;justify-content:center;gap:12px;z-index:5}
#startBtn{min-width:260px;height:62px;border-radius:18px;border:0;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(78,52,120,.25)}
.linkish{background:none;border:0;color:var(--sci-d);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}
#rosterBox{--rs-line:var(--line)}
#rosterBox input{height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit}

/* ===== 학생 화면 ===== */
#game{position:fixed;inset:0;background:#FBFAF7;display:none;user-select:none;-webkit-user-select:none}
body:not(.setup) #game{display:block}
body.admin #stage{pointer-events:none}
#prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#prog i{display:block;width:44px;height:8px;border-radius:4px;background:#E6E1EC}
#prog i.d{background:#C9BCE0}#prog i.n{background:var(--sci)}
#prog.bar{width:min(520px,70vw);height:8px;border-radius:4px;background:#E6E1EC;overflow:hidden;gap:0}
#prog.bar b{display:block;height:100%;background:linear-gradient(90deg,#C9BCE0 0 calc(100% - 10px),var(--sci) 0);border-radius:4px;transition:width .4s}
#stage{position:absolute;inset:36px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:20px 16px 8px}   /* 그림·글은 빈 곳의 위아래 가운데(조금 아래로, 뜬 느낌 없게) */
.recDot{position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:#D24B3E;opacity:.75;z-index:4}

/* 견본 말풍선 */
.bubble{position:relative;background:var(--bubble);border:2px solid var(--bubble-b);border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:16px solid var(--bubble-b);border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--bubble);border-bottom:0;z-index:1}
.bubble img.a{display:block;object-fit:contain}
/* 보기 카드: 모두 같은 크기·같은 테두리 */
.opts{display:flex;justify-content:center;align-items:flex-start;gap:2.2vw}
.pc{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:8px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s;display:flex;flex-direction:column;align-items:center}
.pc .scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:13px;overflow:hidden;background:#eee}
.pc .scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .lab{font-family:var(--f-display);font-size:clamp(20px,3vw,34px);line-height:1.15;margin-top:6px;color:var(--ink)}
.ac{background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:10px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s}
.ac img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.fadeIn{opacity:0}
.glow{border-color:#E8B84A!important;box-shadow:0 0 0 6px rgba(232,184,74,.35)}
.right{border-color:var(--ok)!important}
.placed{position:absolute;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
/* 숨은 동물 찾기 장면의 동물은 그림자 필터 없이(2026-11-03): 아이패드 사파리에서 filter와 transform(옮김·좌우 뒤집기)이 함께 있으면
   그림이 제 상자 밖 일부가 반듯하게 잘려 보였음(고래 머리가 세로로 잘림). 숨은 동물에는 그림자가 필요 없음 */
.hideCard img.placed{filter:none;will-change:transform}
.fly{position:fixed;z-index:60;pointer-events:none;object-fit:contain;transition:left .8s ease,top .8s ease,width .8s ease,height .8s ease}
.nameTag{font-family:var(--f-display);font-size:clamp(26px,4vw,46px);color:var(--ink);text-align:center}
.showCard{position:relative;border-radius:22px;overflow:hidden;border:3px solid #D8D3CC;background:#eee}
.showCard>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.showCard .lab{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 14px;font-family:var(--f-display);font-size:clamp(20px,2.8vw,32px)}
.tray{display:flex;justify-content:center;align-items:center}
.drag{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.endGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}

/* 놀이 첫 화면 */
.gTitle{font-family:var(--f-display);font-size:clamp(40px,8vw,96px);color:var(--sci-d);text-align:center;line-height:1.1;cursor:pointer;touch-action:none}
.gPics{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gPics img{width:clamp(90px,14vw,180px);aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.introBox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vh;height:100%;width:100%}
.stepRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:clamp(13px,1.5vw,16px);color:#9A94A6}
.stepRow span{padding:5px 12px;border-radius:999px;background:#F1EDF6;white-space:nowrap}
.stepRow span.done{color:#7C7489;background:#ECE7F3}
.stepRow span.now{background:var(--sci);color:#fff;font-weight:700}
.stepRow i{width:14px;height:2px;background:#DDD6E8;border-radius:2px}
.gPics.fig{align-items:center}
.gPics img.an{width:clamp(70px,10vw,130px);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gArrow{font-size:clamp(28px,4vw,48px);color:var(--sci-m);padding:0 6px;align-self:center}
.gGo{min-width:220px;height:80px;border:0;border-radius:22px;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:38px;cursor:pointer;touch-action:none;box-shadow:0 4px 12px rgba(78,52,120,.25)}
/* 도감 */
/* 스페셜 */
#spRankView{position:fixed;inset:0;z-index:90;background:rgba(30,24,44,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#spRankView.on{display:flex}
#spRankCard{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:18px 20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#spRankCard h2{margin:0 0 12px;font-size:21px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#spRankCard h4{margin:18px 0 6px;font-size:15px;color:var(--muted);font-weight:500}
.spRankBox{margin-top:12px}
.spRankBox table,#spRankCard table{width:100%;border-collapse:collapse;font-size:16px}
.spRankBox td,#spRankCard td{padding:6px 8px;border-bottom:1px solid #EEE9F3}
.spRankBox td.r,#spRankCard td.r{width:36px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.spRankBox td.t,#spRankCard td.t{text-align:right;font-variant-numeric:tabular-nums}
.spRankBox tr.me td{background:var(--sci-l);font-weight:700}
.spRankBox td.gap{text-align:center;color:var(--muted)}
.spRankBox .note,#spRankCard .note{font-size:13px;color:var(--muted);margin:8px 0 0}
.spNick{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
.spNick input{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;width:9em;margin:0 4px}
.spSide{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.spSide.l{left:12px} .spSide.r{right:12px}
.spSide.t,.spSide.b{left:8px;right:8px;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px}
.spSide.t{top:30px;bottom:auto} .spSide.b{bottom:8px;top:auto}
.spSide.t .spW,.spSide.b .spW{min-height:40px;padding:5px 10px;gap:4px}
.spSide.t .spW img,.spSide.b .spW img{width:28px;height:28px}
.spW{position:relative;font-family:var(--f-display);font-size:inherit;white-space:nowrap;line-height:1.15;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:52px;transition:background .3s,border-color .3s,color .3s}
.spW img{width:40px;height:40px;object-fit:contain;opacity:0;transition:opacity .4s}
.spW.now{border-color:var(--sci);background:var(--sci-l)}
.spW.done{color:#A39CAE;background:#F6F4F8;border-color:#ECE8F1}
.spW.done img{opacity:1}
.spW.done::after{content:'✓';position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:#5E9E6E;color:#fff;font:700 13px/22px var(--f-body);text-align:center}
.spClock{position:absolute;top:2px;left:50%;transform:translateX(-50%);font:600 15px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.85);padding:5px 12px;border-radius:999px;z-index:6}
.spDone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6000;background:#fff;border-radius:20px;box-shadow:0 12px 36px rgba(30,24,44,.25);padding:22px 26px 20px;width:min(440px,92vw);text-align:center}
.spDone h3{margin:0;font-size:18px;font-weight:600}
.spDone .big{font-family:var(--f-display);font-size:46px;margin:8px 0 2px;color:var(--sci-d)}
.spDone .sub{font-size:14px;color:var(--muted)}
.spDone .row{justify-content:center;margin-top:16px}
.spDone .spRankBox{text-align:left;max-height:40vh;overflow:auto}
#dexView{position:fixed;inset:0;z-index:90;background:rgba(30,24,44,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#dexView.on{display:flex}
#dexBox{background:#fff;border-radius:18px;max-width:1100px;width:100%;padding:18px 20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#dexBox h2{margin:0 0 10px;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px}
.dexCard{border:1.5px solid var(--line);border-radius:14px;padding:6px;background:#fff}
.dexCard .scene{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.dexCard .scene>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dexCard .scene img.d{position:absolute;transform:translate(-50%,-50%);object-fit:contain;cursor:pointer;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.dexCard .cap{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0;font-family:var(--f-display);font-size:22px}
.dexCard .cap span{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.dexNew{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:15px;color:var(--sci-d);background:rgba(255,255,255,.9);border:1px solid var(--sci-m);border-radius:999px;padding:5px 14px;z-index:3}

/* ===== 관리 메뉴 ===== */
.dock{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:none;max-width:calc(100vw - 24px);
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(40,30,70,.15)}
body.admin .dock{display:block}
#dockTop{top:10px} #dockBot{bottom:12px;max-width:calc(100vw - 2*200px)}
@media (max-width:900px){ #dockBot{bottom:104px;max-width:calc(100vw - 24px)} }
.dock .rowx{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:7px 10px;scrollbar-width:none}
.dock .rowx::-webkit-scrollbar{display:none}
.dock .g{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding:0 8px;border-left:1px solid var(--line)}
.dock .g:first-child{border-left:0;padding-left:0}
.dock .lbl{font-size:12px;color:var(--muted);margin-right:2px;white-space:nowrap}
.dock button{flex:0 0 auto;min-height:42px;padding:5px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;touch-action:pan-x;white-space:nowrap}
.dock button.on{background:var(--sci);border-color:var(--sci);color:#fff}
.dock button.now{box-shadow:inset 0 -3px 0 var(--sci)}
.dock button.go{background:var(--sci-d);border-color:var(--sci-d);color:#fff;font-weight:700}
.dock button:disabled{opacity:.35;cursor:default}
#dockNote{margin:0 10px 7px;text-align:center;font-size:13px;color:#8A5A12;background:#FFF6E0;border-radius:10px;padding:4px 10px}
#dockNote:empty{display:none}

/* 기록 */

<script id="roster">
/* 차름 공통 모듈: 학생 명단(roster) — 원본은 common/roster.js. 앱 안의 <script id="roster">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   명단은 같은 기기의 모든 차름 앱이 함께 쓴다(webapp.students). 뺀 학생은 webapp.students.out에 뺀 날과 함께 옮긴다.
   뺀 학생의 기록은 KEEP_DAYS(6개월) 동안 남겨 두고, 그동안 같은 이름으로 다시 넣으면 같은 학생으로 되살아나 기록이 이어진다.
   6개월이 지나면 앱마다 Roster.purge(기록)로 그 학생의 줄을 지운다. 빼낸 표시는 다른 앱도 지울 수 있게 3년 동안 남긴다.

   쓰는 법(앱):
     Roster.list()            지금 명단 [{id,name}]
     Roster.nameOf(id)        이름(뺀 학생도)
     Roster.has(id)           지금 명단에 있는지
     Roster.add(이름)         넣은(또는 되살린) 학생을 돌려줌
     Roster.remove(id)        명단에서 뺌(기록은 앱이 6개월 보관)
     Roster.kept()            기록을 보관 중인 뺀 학생 [{id,name,at,until}]
     Roster.purge(log, row=>row.s)   보관 기간이 지난 학생의 줄을 뺀 새 배열
     Roster.mount(칸, {btn, on, input, onChange})   넣기·빼기 화면을 칸 안에 그림
       btn·on·input: 그 앱의 단추·눌림·입력 칸 class(얼굴은 앱마다). onChange({type:'add'|'remove'|'restore', id})
*/
(function () {
  'use strict';
  var KEY = 'webapp.students', OUT = 'webapp.students.out', DAY = 864e5, KEEP_DAYS = 183, MARK_DAYS = 1100;
  function get(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return Array.isArray(v) ? v : d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function clean(n) { return String(n || '').trim().replace(/\s+/g, ' ').slice(0, 20); }
  function newId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function list() { return get(KEY, []).filter(function (s) { return s && s.id && s.name; }); }
  function outs() {
    var now = Date.now(), all = get(OUT, []), live = all.filter(function (o) { return o && o.id && now - (o.at || 0) < MARK_DAYS * DAY; });
    if (live.length !== all.length) put(OUT, live);
    return live;
  }
  function kept() {
    var now = Date.now(), ids = {};
    list().forEach(function (s) { ids[s.id] = 1; });
    return outs().filter(function (o) { return !ids[o.id] && now - o.at < KEEP_DAYS * DAY; })
      .map(function (o) { return { id: o.id, name: o.name, at: o.at, until: o.at + KEEP_DAYS * DAY }; });
  }
  function nameOf(id) {
    var s = list().filter(function (x) { return x.id === id; })[0] || outs().filter(function (x) { return x.id === id; })[0];
    return s ? s.name : '';
  }
  function has(id) { return list().some(function (s) { return s.id === id; }); }
  function add(name) {
    var n = clean(name); if (!n) return null;
    var L = list(), same = L.filter(function (s) { return s.name === n; })[0];
    if (same) return same;
    var back = kept().filter(function (o) { return o.name === n; }).sort(function (a, b) { return b.at - a.at; })[0];
    var st = back ? { id: back.id, name: n } : { id: newId(), name: n };
    L.push(st); put(KEY, L);
    if (back) put(OUT, outs().filter(function (o) { return o.id !== back.id; }));
    return st;
  }
  function remove(id) {
    var L = list(), st = L.filter(function (s) { return s.id === id; })[0]; if (!st) return;
    put(KEY, L.filter(function (s) { return s.id !== id; }));
    put(OUT, outs().filter(function (o) { return o.id !== id; }).concat([{ id: st.id, name: st.name, at: Date.now() }]));
  }
  function purge(log, idOf) {
    if (!Array.isArray(log)) return log;
    var now = Date.now(), gone = {};
    outs().forEach(function (o) { if (now - o.at >= KEEP_DAYS * DAY) gone[o.id] = 1; });
    list().forEach(function (s) { delete gone[s.id]; });
    return log.filter(function (r) { return !gone[idOf ? idOf(r) : r.s]; });
  }
  function md(t) { var d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }

  /* 기본 꼴: 자리·간격만. 색·글꼴·둥글기는 앱의 단추 class와 CSS 변수(--rs-line, --rs-soft)로 앱마다 */
  var CSS = ':where(.rs){display:grid;gap:10px;margin-top:10px}'
    + ':where(.rs-add){display:flex;gap:8px;flex-wrap:wrap}'
    + ':where(.rs-add input){flex:1;min-width:140px;max-width:260px}'
    + ':where(.rs-names){display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none}'
    + ':where(.rs-names li){display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;border:1.5px solid var(--rs-line,#d6d2cb);border-radius:999px;min-height:40px}'
    + ':where(.rs-x){border:0;background:none;font:inherit;font-size:20px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer;color:inherit;opacity:.55}'
    + ':where(.rs-x:hover,.rs-x:focus-visible){opacity:1;background:var(--rs-soft,rgba(0,0,0,.06))}'
    + ':where(.rs-none,.rs-out){font-size:14px;opacity:.8;margin:0}'
    + ':where(.rs-out summary){cursor:pointer}'
    + ':where(.rs-out ul){margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}'
    + ':where(.rs-out li){display:flex;align-items:center;gap:10px;flex-wrap:wrap}';
  function style() {
    if (document.getElementById('rsStyle')) return;
    var s = document.createElement('style'); s.id = 'rsStyle'; s.textContent = CSS;
    (document.head || document.documentElement).insertBefore(s, (document.head || document.documentElement).firstChild);
  }

  function mount(box, opt) {
    opt = opt || {}; style();
    var btn = opt.btn || '', on = opt.on || '', inp = opt.input || '', tell = opt.onChange || function () {};
    function draw() {
      var L = list(), K = kept(), h = '<div class="rs">';
      h += '<div class="rs-add"><input class="' + inp + '" maxlength="20" placeholder="학생 이름" aria-label="넣을 학생 이름" autocomplete="off">'
        + '<button type="button" class="' + btn + ' ' + on + '" data-rs="add">넣기</button></div>';
      h += L.length ? '<ul class="rs-names">' + L.map(function (s) {
        return '<li><span>' + esc(s.name) + '</span><button type="button" class="rs-x" data-rs="del" data-id="' + esc(s.id) + '" aria-label="' + esc(s.name) + ' 빼기">×</button></li>';
      }).join('') + '</ul>' : '<p class="rs-none">아직 넣은 학생이 없어요.</p>';
      if (K.length) h += '<details class="rs-out"><summary>뺀 학생 ' + K.length + '명 — 기록은 보관 중</summary><ul>' + K.map(function (o) {
        return '<li><span>' + esc(o.name) + ' · ' + md(o.until) + '까지 보관</span><button type="button" class="' + btn + '" data-rs="back" data-id="' + esc(o.id) + '">다시 넣기</button></li>';
      }).join('') + '</ul></details>';
      box.innerHTML = h + '</div>';
      var input = box.querySelector('input');
      function doAdd() { var st = add(input.value); if (!st) { input.focus(); return; } draw(); tell({ type: 'add', id: st.id }); }
      box.querySelector('[data-rs=add]').onclick = doAdd;
      input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
      Array.prototype.forEach.call(box.querySelectorAll('[data-rs=del]'), function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-id'), n = nameOf(id);
          if (!confirm(n + ' 학생을 명단에서 뺄까요?\n\n이 기기의 다른 차름 앱 명단에서도 함께 빠져요.\n기록은 6개월 동안 남아 있다가, 그동안 다시 넣지 않으면 지워져요.')) return;
          remove(id); draw(); tell({ type: 'remove', id: id });
        };
      });
      Array.prototype.forEach.call(box.querySelectorAll('[data-rs=back]'), function (b) {
        b.onclick = function () { var st = add(nameOf(b.getAttribute('data-id'))); draw(); if (st) tell({ type: 'restore', id: st.id }); };
      });
    }
    draw();
    return { refresh: draw, focus: function () { var i = box.querySelector('input'); if (i) i.focus(); } };
  }

  window.Roster = { list: list, nameOf: nameOf, has: has, add: add, remove: remove, kept: kept, purge: purge, mount: mount, KEEP_DAYS: KEEP_DAYS };
})();
</script>
<script id="stagekit">
/* 무대(stage) 공통 모듈 stagekit — 원본은 common/stagekit.js 한 곳. 앱 안의 이 칸은 손으로 고치지 말고 python3 tools/sync-modules.py
   빈 배경 위에 요소를 '밑동이 아래인 것이 앞'으로 쌓는다(만화영화 셀·포토샵 레이어처럼).
   자료: media/stage/<갈래>/<장소>/ (bg.jpg · items/ · skirt/ 밑동 덮개 · front/ 앞가림 띠 · far/ 먼 띠 · stage.json), 차림표 media/stage/index.json
   장면의 규칙은 stage.json 이 가짐(2026-11-04 다시 짬):
     beds  자리 — {이름:{y:[위,아래], x:[[왼,오른]…], persp:원근 여부, skirt:[그 자리에 까는 덮개]}}  예) 땅·물속 바닥·물낯·물가 둑·흙 속·하늘
     items 요소 — {이름:{real:[m,m], bed:놓일 자리, role:'big'|'frame', base·foot(그림의 실제 밑동 — tools/stage-meta.py가 잼)}}
   → 요소는 제 자리에만 놓이고(물풀이 공중에 뜨거나 땅 요소가 물에 서지 않음), 밑동이 그 자리의 땅·바닥·물낯에 정확히 닿음.
   쓰는 법
     const pl = await Stage.load('nature/desert');
     const lay = Stage.compose(pl, {seed: 7});          // 무작위(같은 seed면 같은 장면) · {fixed:[{id,x,y,r,flip}]} · {avoid:[[x0,y0,x1,y1]…], min:0}
     Stage.add(pl, lay, {src, real, x, y, w, h, bed});   // 동물도 같은 규칙으로(real이면 그 깊이의 원근 크기)
     Stage.render(div, pl, lay, {shadow:.28, haze:.3});  // look: layer·bg·zOf·farZ·frontZ·front·skirt·showBeds
   좌표 x·y는 장면 대비 0~1, y는 밑동(땅에 닿는 곳). 모듈은 동작만, 얼굴(그림자 세기·흐림)은 앱이 넘겨 줌. */
(function (G) {
  const BASE = 'https://shim-sung-hyun.github.io/web_app/media/stage/';
  const rnd = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const img = src => new Promise(ok => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  async function load(id, opt = {}) {
    const base = opt.base || BASE, dir = base + id + '/';
    const cfg = await fetch(dir + 'stage.json', {cache: 'no-cache'}).then(r => r.json());
    const pl = Object.assign({id, dir, horizon: .35, groundTop: .36, unit: .22}, cfg);
    if (!pl.beds) pl.beds = {ground: {y: [pl.groundTop, 1], persp: true, skirt: pl.skirt || []}};
    const bed0 = Object.keys(pl.beds)[0];
    const jobs = [img(dir + (opt.bg || 'bg') + '.jpg').then(i => pl.bgImg = i)];
    for (const [k, it] of Object.entries(pl.items || {})) {
      it.id = k; it.bed = pl.beds[it.bed] ? it.bed : bed0; it.src = (it.from ? base + it.from + '/' : dir) + 'items/' + k + '.webp';

  /* 그 자리에서 1m가 장면 높이의 몇 몫인가. 원근 자리(땅·바닥)는 지평선에서 내려온 만큼에 비례, 아니면(물낯·흙 속·하늘) 어디서나 같음 */
  const perM = (pl, y, bed) => {

      for (let i = out.length - 1; i >= 0; i--) if (hit(out[i])) out.splice(i, 1);

      return compose(pl, Object.assign({}, opt, {seed: (opt.seed ?? Math.floor(R() * 1e9)) + 1, _t: (opt._t || 0) + 1}));

  }

  function add(pl, lay, a) {

    const p = a.real ? place(pl, it, a.x, a.y, .5, a.flip, {actor: true, el: a.el})
      : {id: it.id, src: a.src, bed: it.bed, x: a.x, y: a.y, w: a.sw, h: a.sh, base: a.base ?? 1, flip: !!a.flip, foot: a.foot || [.2, .8], skirt: null, actor: true, el: a.el};
    lay.push(p); return p;
  }

    const mk = (tag, css) => { const e = document.createElement(tag); e.style.cssText = 'position:absolute;pointer-events:none;' + css; box.appendChild(e); return e; };
    const fog = far => `saturate(${1 - .4 * hz * far}) brightness(${1 + .12 * hz * far}) contrast(${1 - .25 * hz * far})`;
    if (pl.bgImg && look.bg !== false) { const b = mk('img', 'left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0'); b.src = pl.bgImg.src; b.alt = ''; }
    for (const f of pl.far || []) if (f.img) {   // 먼 띠: 밑동이 지평선에, 모든 요소 뒤
      const h = f.h || .08, y = f.y ?? pl.horizon + .01, e = mk('img', `left:-1%;width:102%;top:${(y - h * (f.base || 1)) * 100}%;height:${h * 100}%;z-index:${look.farZ ?? 2};object-fit:fill;filter:${fog(1)}`); e.src = f.srcUrl; e.alt = '';
    }
    if (look.showBeds) Object.entries(pl.beds).forEach(([k, b]) => (b.x || [[0, 1]]).forEach(r => {
      const e = mk('div', `left:${r[0] * 100}%;width:${(r[1] - r[0]) * 100}%;top:${b.y[0] * 100}%;height:${Math.max(.004, b.y[1] - b.y[0]) * 100}%;z-index:8000;outline:2px dashed rgba(200,40,40,.8);background:rgba(255,255,255,.08);font:12px sans-serif;color:#a00`); e.textContent = b.name || k; }));
    const order = lay.slice().sort((a, b) => a.y - b.y);
    order.forEach((o, i) => {

      const B = pl.beds[o.bed] || {}, far = B.persp === false ? 0 : clamp(1 - (o.y - pl.horizon) / (1 - pl.horizon), 0, 1);
      const top = o.y - o.h * o.base, left = o.x - o.w / 2, fx = f => o.x + (o.flip ? -1 : 1) * o.w * (f - .5);
      const footL = Math.min(fx(o.foot[0]), fx(o.foot[1])), footR = Math.max(fx(o.foot[0]), fx(o.foot[1]));

        mk('div', `left:${((footL + footR) / 2 - fw / 2) * 100}%;top:${(o.y - fh * .55) * 100}%;width:${fw * 100}%;height:${fh * 100}%;z-index:${z - 1};border-radius:50%;background:radial-gradient(closest-side,rgba(40,28,14,${sh}),rgba(40,28,14,0))`);

      e.style.cssText += `;position:absolute;left:${left * 100}%;top:${top * 100}%;width:${o.w * 100}%;height:${o.h * 100}%;z-index:${z};transform:${o.flip ? 'scaleX(-1)' : 'none'};` + (o.actor ? '' : `filter:${fog(far)};pointer-events:none;`);

        const offset = o.skirtOffset || [0, 0];
        const cx = left - sw * m.foot[0] + sw / 2 + offset[0];
        const cy = o.y + o.h * .004 + offset[1];
        const k = mk('img', `left:${(cx - sw / 2) * 100}%;top:${(cy - shh * m.base) * 100}%;width:${sw * 100}%;height:${shh * 100}%;z-index:${z + 1};filter:${fog(far)}`); k.src = si.src; k.alt = ''; o.skirtAt = [cx, cy - shh * m.base * .45];   // 덮개 가운데(앱이 표시할 때)

let fsAskAt=0, fsChangeAt=0;

function fsBusy(){ const now=performance.now(); return (fsAskAt>fsChangeAt&&now-fsAskAt<1500)||(fsChangeAt>0&&now-fsChangeAt<600); }
function afterFull(fn){ const t0=performance.now(); const chk=()=>{ if(performance.now()-t0>2000||!fsBusy()) fn(); else setTimeout(chk,100); }; chk(); }

let hiddenSay=null, curSay=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(curSay&&curSay.id===speakSeq&&!hiddenSay){ hiddenSay=[curSay.text,curSay.resolve]; curSay.held=true; } curSay=null; stopVoice(); speakSeq++; }
  else if(hiddenSay){ const h=hiddenSay; hiddenSay=null; setTimeout(()=>{ if(!document.hidden) speak(h[0]).then(h[1]); else hiddenSay=h; },350); } });
/* speak: 말이 끝나면 풀리는 Promise. 소리를 끄면 글 길이만큼 기다림 */
function speak(text){ return new Promise(resolve=>{
  if(document.hidden){ hiddenSay=[text,resolve]; return; }
  if(fsBusy()){ const s0=speakSeq; afterFull(()=>{ if(speakSeq===s0) speak(text).then(resolve); else resolve(false); }); return; }
  lastSay=text; stopVoice();
  const tries=(speak.retry&&speak.retry.text===text)?speak.retry.n:0; speak.retry=null;
  const id=++speakSeq, me={id,text,resolve}; curSay=me;
  let fired=false; const done=why=>{ if(fired) return; fired=true; if(me.held) return;
    /* 도중에 끊겼으면 잠깐 뒤 그 말을 처음부터 다시(두 번까지) */
    if(why==='cut'&&tries<2&&id===speakSeq){ setTimeout(()=>{ if(me.held) return; if(id!==speakSeq){ resolve(false); return; } speak.retry={text,n:tries+1}; speak(text).then(resolve); },400); return; }
    if(curSay===me) curSay=null; resolve(id===speakSeq); };

  if(!S.sound||!text){ setTimeout(done,Math.max(900,(text||'').length*120)); return; }

function chime(){ if(!S.sound) return; try{ const c=getCtx(); if(!c) return; const t=c.currentTime;
  [[660,0],[880,0.12]].forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.16,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.35); o.connect(g); g.connect(c.destination); o.start(t+d); o.stop(t+d+0.4); }); }catch(e){} }

  g.gain.setValueAtTime(0.09,t); src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); }catch(e){} }

function answerSlot(key,n){

  let ok=[...Array(n).keys()];

  if(n===2&&H.length>=2&&H[H.length-1]===H[H.length-2]) ok=ok.filter(i=>i!==H[H.length-1]);
  const m=Math.min(...ok.map(i=>cnt[i])), pick=shuffle(ok.filter(i=>cnt[i]<=m+(n===2?1:0)))[0];

}
const putAt=(arr,x,i)=>{ const r=shuffle(arr.filter(y=>y!==x)); r.splice(i,0,x); return r; };

   모든 배치(곳 4개면 24가지) 중에서 — 정답 자리가 바로 앞과 같으면(보기 둘이면 세 번째부터) 크게 깎고, 곳마다 바로 앞과 같은 자리에 있으면 깎고

function perms(a){ return a.length<=1?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r])); }
function arrangePlaces(places,ans){
  const M=(RUN.lay=RUN.lay||{hist:[],slots:[]}), n=places.length, H=M.hist, S0=M.slots, prev=H[H.length-1], prev2=H[H.length-2];
  const cnt=Array.from({length:n},(_,i)=>S0.filter(x=>x===i).length);
  let best=null, bs=Infinity;
  shuffle(perms(places)).forEach(L=>{ const k=L.indexOf(ans); let sc=n===2?Math.random()*3:cnt[k]*2;   /* 보기 둘이면 규칙(가가나나)이 보이지 않게 무작위 + 세 번 이어지지만 않게 */
    if(n>=3&&S0.length&&k===S0[S0.length-1]) sc+=100;
    if(n===2&&S0.length>=2&&k===S0[S0.length-1]&&k===S0[S0.length-2]) sc+=200;   /* 정답 자리가 세 번 이어지는 것을 배치보다 먼저 막음 */
    if(prev){ const same=L.filter((p,i)=>prev[i]===p).length; sc+=n>=3?same*12:0;
      if(n===2&&prev2&&L.join()===prev.join()&&prev.join()===prev2.join()) sc+=6; }   /* 보기 둘: 같은 배치 세 번은 되도록 피함(정답 자리보다는 약하게) */
    if(sc<bs){ bs=sc; best=L; } });

}

/* t = 그려진 동물의 가장 긴 쪽(px) → 그림 칸 크기 */
function boxOf(a,p,t){ const b=BB[a]||[.9,.9]; return t/Math.max(b[0],b[1]); }
/* 장면 안에 동물 놓기. 가장 큰 동물(ref 전체에서)은 장면을 크게 채우고, 나머지는 실제 크기 비율로 작게(같은 거리에 선 것처럼).
   한 줄(5마리부터 두 줄, 뒷줄은 조금 위). 땅에 서는 동물은 발이 같은 높이, 물·하늘 동물은 가운데 높이를 맞춤.
   ref: 크기를 견줄 동물들(한 화면에 함께 나오는 동물 전체). 없으면 이 장면의 동물끼리 */
function layoutPlaced(sceneEl,p,list,ref){
  sceneEl.querySelectorAll('.placed').forEach(x=>x.remove());
  /* 크기 기준 R(2026-11-03): 이 곳에 이번 묶음에서 들어올 동물(ref 가운데 이 곳 것). 예전엔 묶음 전체(고래 포함)를 기준으로 해
     땅의 소·개가 둘 다 가장 작은 비율(0.26)에 걸려 같은 크기로 보였음. 정리하기에서 동물이 하나씩 늘어도 크기가 바뀌지 않게 '들어올 동물 전체'로 */
  const n=list.length; if(!n) return; const W=sceneEl.clientWidth, H=sceneEl.clientHeight; const [y0,y1]=PL[p].y;
  const R=(()=>{ if(!ref||!ref.length) return list; const own=(RUN&&RUN.bd?RUN.bd.items:[]).filter(x=>x.p===p&&ref.includes(x.a)).map(x=>x.a); const r=[...new Set(own.concat(list))]; return r.length?r:list; })();
  const rows=n<=4?[list]:[list.slice(0,Math.ceil(n/2)),list.slice(Math.ceil(n/2))];
  rows.forEach((row,ri)=>{
    const back=rows.length>1&&ri===0, big=H*absFrac(bigOf(R))*(rows.length>1?.62:n<=2?1:.85)*(back?.85:1);
    let ts=row.map(a=>big*relSize(R,a)), ws=row.map((a,i)=>{ const b=BB[a]||[.9,.9]; return ts[i]/Math.max(b[0],b[1])*b[0]; });
    const sum=ws.reduce((x,y)=>x+y,0), room=W*.9-(row.length-1)*W*.03; if(sum>room){ const k=room/sum; ts=ts.map(t=>t*k); ws=ws.map(w=>w*k); }
    const gap=(W-ws.reduce((x,y)=>x+y,0))/(row.length+1); let cx=gap;
    const baseY=H*(rows.length===1?(standsOn(p)?y1-(y1-y0)*.12:(y0+y1)/2):(back?y0+(y1-y0)*.3:y1-(y1-y0)*.02));
    row.forEach((a,i)=>{ const b=BB[a]||[.9,.9], z=boxOf(a,p,ts[i]), x=cx+ws[i]/2; cx+=ws[i]+gap;
      let y=standsOn(p)?baseY-z*b[1]/2:baseY; y=Math.max(z*b[1]/2+2,Math.min(H-z*b[1]/2-2,y));
      const im=document.createElement('img'); im.className='placed'; im.src=pic(a); im.alt=a; im.style.width=im.style.height=z+'px'; im.style.left=x+'px'; im.style.top=y+'px';
      if(back) im.style.zIndex=1; sceneEl.appendChild(im); }); });
}
/* 맞히면: 누른 동물은 바로 사라지고, 장면 안에서 멀리서 작게 → 앞으로 크게, 사는 곳에 맞는 몸짓으로 한 번(약 1초) */
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function enter(im,p){ return new Promise(res=>{
  if(!im||!im.animate){ res(); return; }
  const sc=im.parentElement, W=sc.clientWidth, H=sc.clientHeight, x=parseFloat(im.style.left), y=parseFloat(im.style.top), s=parseFloat(im.style.width);
  const side=x<W/2?-1:1, T=(dx,dy,k)=>'translate(-50%,-50%) translate('+dx+'px,'+dy+'px) scale('+k+')';
  let kf;
  if(REDUCE) kf=[{opacity:0,transform:T(0,0,1)},{opacity:1,transform:T(0,0,1)}];
  else switch(MOVE[p]){
    case 'swim': { const dx=side*(W*0.55); kf=[{opacity:0,transform:T(dx,0,.6)},{opacity:1,offset:.2,transform:T(dx*.75,-H*.03,.7)},{transform:T(dx*.45,H*.03,.8)},{transform:T(dx*.18,-H*.02,.92)},{opacity:1,transform:T(0,0,1)}]; break; }
    case 'fly': { const dx=side*(W*0.4), dy=-(y+s*0.2); kf=[{opacity:0,transform:T(dx,dy,.5)},{opacity:1,offset:.25,transform:T(dx*.7,dy*.65,.65)},{transform:T(dx*.3,dy*.25,.85)},{opacity:1,transform:T(0,0,1)}]; break; }
    case 'dig': kf=[{opacity:0,transform:T(0,H*.28,.85)},{opacity:1,offset:.35,transform:T(0,H*.16,.92)},{transform:T(0,-H*.02,1.02)},{opacity:1,transform:T(0,0,1)}]; break;
    case 'slide': { const dx=side*(W*0.5); kf=[{opacity:0,transform:T(dx,0,.75)},{opacity:1,offset:.3,transform:T(dx*.6,0,.85)},{opacity:1,transform:T(0,0,1)}]; break; }
    default: { const dy=-(y-H*0.36); kf=[{opacity:0,transform:T(0,dy,.35)},{opacity:1,offset:.25,transform:T(0,dy*.7,.5)},{transform:T(0,dy*.45-H*.015,.68)},{transform:T(0,dy*.22,.84)},{transform:T(0,-H*.01,.97)},{opacity:1,transform:T(0,0,1)}]; }   /* 걷기: 뒤(먼 곳)에서 앞으로 */
  }
  const an=im.animate(kf,{duration:REDUCE?400:1050,easing:'ease-out'}); an.onfinish=an.oncancel=()=>res();
}); }
const lastPlaced=sc=>{ const l=sc.querySelectorAll('.placed'); return l[l.length-1]; };
/* ---- 1. 보기: 곳 장면 + 동물이 들어가며 "○○는 ○○에 살아요." ---- */
async function stepShow(it,tok){

    tag.textContent=PL[it.p].label;

/* 고르기 공통: 8초 뒤 안내 다시 → 16초 뒤 정답 빛남. 틀리면 정답 빛남(도움으로 기록). 고르기 전에는 보기 이름을 말하지 않음 */
function choiceRound(tok,{say,cards,isRight,onRight,rec}){
  let wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; cards.filter(isRight).forEach(c=>c.classList.add('glow')); };
  /* 견본 먼저 → 약 1초 뒤 보기가 서서히(그 전엔 눌리지 않음) */
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(say).then(()=>{ if(!alive(tok)) return;
    later(()=>{ if(alive(tok)&&!over) speak(say); },8000);
    later(()=>{ if(alive(tok)&&!over) glow(); },16000);
  });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)) return;
    if(isRight(c)){ over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); chime();
      rec(wrong,helped||!!wrong); onRight(c); }
    else if(!wrong){ wrong=c; glow(); }
  }));
}
function logRow(ph,it,wrongId,help){
  if(!S.stu) return;
  LOG.push({s:S.stu,t:Date.now(),g:RUN.g,lv:RUN.lv,b:RUN.b>=0?RUN.b+1:RUN.bd.label,ph,a:it.a,p:it.p,res:help?'help':'first',w:wrongId||''}); saveLog();
}

/* ---- 3. 곳 보고 동물 고르기: 견본 = 곳 장면(말풍선), 보기 = 동물 2~3마리(정답은 하나) ---- */

  /* 정리하기 첫 말(2026-11-03 선생님): 이름만 부르면 무엇을 하라는지 알기 어려워, 두 질문 중 하나를 무작위로 —
     "고양이가 사는 곳을 찾아 눌러요." · "고양이는 어디에 살까요?"(소리가 있을 때만). 다시 부를 때는 이름만(같은 긴 말 되풀이는 재촉처럼 들림) */

    if(S.engineNow!=='builtin'||(VSET&&VSET.has(await sha16(w)))) q.push(w);

    const again=()=>{ later(()=>{ if(alive(tok)&&!over){ if(drag||pdown) return again(); sayName().then(again); } },3000); }; again();   /* 놀이 신호: 맞힐 때까지 말이 끝나고 3초마다(손가락이 닿아 있으면 기다림) */

const DEV=(()=>{ let d=store.get('dev'); if(!/^[a-z0-9]{12}$/.test(d||'')){ d=Array.from({length:12},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join(''); store.set('dev',d); } return d; })();
const NICK_OK=/^[가-힣a-zA-Z0-9 ]{1,8}$/;
const NICK_BAD=['시발','씨발','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','개새','새끼','좆','존나','지랄','미친','fuck','shit','bitch','sex','섹스','장애','애자','등신','찐따'];   /* 서버(seek-rank.php)와 같은 목록 */
const spWho=()=>S.stu||'_';
const spTime=ms=>{ const s=Math.round(ms/1000); return s<60?s+'초':Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'; };
let SP_LAST='';
function startSpecial(p){ unlockAudio(); const ps=spPlaces(); if(!ps.length) return;
  if(!p||!ps.includes(p)){ const q=ps.length>1?ps.filter(x=>x!==SP_LAST):ps; p=pick1(q); } SP_LAST=p;
  RUN={special:true,p,lv:3,bd:{places:[p],items:[],label:'스페셜 · '+PL[p].label},plan:[],idx:0,phases:[],pi:0,ii:0,token:(TOKBASE+=1e5),ending:true,gameDone:false,placed:{}};
  document.body.classList.remove('setup'); goFull(); setTimeout(()=>{ if(RUN&&RUN.special) runSpecial(); },350); }
/* 이 놀이에서 할 말이 내장 목소리에 다 있으면 내장, 아니면 이 판은 기기 목소리(섞지 않음) */
async function spEngine(names){ await voiceReady; const hs=await Promise.all(names.map(a=>sha16(nameLine(a))).concat([sha16('다 찾았어요.')]));
  S.engineNow=(S.engine==='builtin'&&hs.every(h=>VSET.has(h)))?'builtin':'device'; }
/* 스페셜 이름 칸 자리(2026-11-03): 가로 화면은 장면 좌우, 세로 화면(휴대폰 등)은 장면 위아래 — 세로에서 좌우에 두면 장면이 폭 80점쯤으로 작아짐.
   화면을 돌리면 이름 칸 자리를 바꾸고 장면은 늘이거나 줄여 맞춤(fitCard) — 찾던 것·시계는 그대로 */
const spTB=()=>{ const A=area(); return A.w<A.h*1.15; };
function spSideStyle(d,tb){ const pw=+d.dataset.pw, fs=+d.dataset.fs, top=d.classList.contains('l')||d.classList.contains('t');
  d.classList.remove('l','r','t','b'); d.classList.add(tb?(top?'t':'b'):(top?'l':'r'));
  d.style.width=tb?'':pw+'px'; d.style.fontSize=(tb?Math.min(fs,20):fs)+'px'; }
async function runSpecial(){
  if(!RUN||!RUN.special) return;
  RUN.token++; const tok=RUN.token; clearTimers(); stopVoice(); clearStage(); renderProg();
  await gameReady; if(!alive(tok)) return;
  const p=RUN.p, names=shuffle(spPool(p)).slice(0,SP_MAX); await spEngine(names); if(!alive(tok)) return;
  const st=$('stage'), A=area(), half=Math.ceil(names.length/2);
  const pw=Math.max(124,Math.min(210,A.w*.15)), fs=Math.max(16,Math.min(30,(pw-74)/Math.max(...names.map(x=>x.length))));   /* 가장 긴 이름이 한 줄에 */
  const tb=spTB(), mk=(side,list)=>{ const d=document.createElement('div'); d.className='spSide '+side; d.dataset.pw=pw; d.dataset.fs=fs; st.appendChild(d); spSideStyle(d,tb);
    list.forEach(a=>{ const w=document.createElement('div'); w.className='spW'; w.dataset.a=a; w.innerHTML='<span class="t">'+esc(a)+'</span><img alt="" src="'+pic(a)+'">'; d.appendChild(w); }); };
  const clock=document.createElement('div'); clock.className='spClock'; clock.textContent='0:00';
  const W=a=>st.querySelector('.spW[data-a="'+a+'"]');
  let t0=0, nf=0;
  let iv=0; const tick=()=>{ if(!alive(tok)||!t0||!clock.isConnected){ clearInterval(iv); return; } const s=Math.floor((Date.now()-t0)/1000); clock.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };   /* 찾을 때마다 clearTimers가 돌아 later는 못 씀 */
  const nRows=Math.ceil(half/Math.max(1,Math.floor((A.w-24)/118)));   /* 세로 화면: 위·아래 줄 수 */
  await playHide(p,4,names,tok,{special:true,wmax:tb?A.w*.96:A.w-2*pw-28,hmax:tb?A.h-2*nRows*50-30:0,
    onReady:()=>{ mk(tb?'t':'l',names.slice(0,half)); mk(tb?'b':'r',names.slice(half)); st.appendChild(clock); t0=Date.now(); tick(); iv=setInterval(tick,500); },
    onCall:a=>{ st.querySelectorAll('.spW.now').forEach(x=>x.classList.remove('now')); const w=W(a); if(!w) return; w.classList.add('now');
      if(w.animate) w.animate([{transform:'scale(1)'},{transform:'scale(1.16)',offset:.4},{transform:'scale(1)'}],{duration:800,easing:'ease-in-out'}); },
    onFound:a=>{ const w=W(a); if(w){ w.classList.remove('now'); w.classList.add('done'); } nf++; }});
  if(!alive(tok)||!t0) return;
  clearInterval(iv); const ms=Date.now()-t0; clock.textContent=spTime(ms);
  const k=spWho(), key=spKey(p), prev=SPREC.filter(r=>r.k===k&&r.key===key).reduce((m,r)=>Math.min(m,r.ms),Infinity);
  const rec={k,key,p,n:names.length,ms,t:Date.now(),nick:NICK[k]||'',up:0}; SPREC.push(rec); saveSpRec();
  await wait(500); if(!alive(tok)) return; speak('다 찾았어요.');
  spResult(tok,rec,prev);
}
function spResult(tok,rec,prev){
  const st=$('stage'), d=document.createElement('div'); d.className='spDone';
  const best=rec.ms<prev;
  d.innerHTML='<h3>'+esc(PL[rec.p].label)+' · '+rec.n+'마리를 다 찾았어요</h3><div class="big">'+spTime(rec.ms)+'</div>'
    +'<div class="sub">'+(prev===Infinity?'첫 기록이에요':best?'이 기기 최고 기록!':'이 기기 최고 '+spTime(prev))+'</div>'
    +'<div class="spRankBox" id="spRankNow"><p class="note">'+(rec.nick?'순위표를 불러오는 중이에요…':'별명을 정하면 모든 학교 순위표에 올라가요(설정 화면 스페셜에서).')+'</p></div>'
    +'<div class="row"><button class="chip on" id="spAgain">다른 곳에서 또</button><button class="chip" id="spSame">같은 곳 다시</button><button class="chip" id="spHome">그만하기</button></div>';
  st.appendChild(d);
  $('spAgain').onclick=()=>startSpecial(); $('spSame').onclick=()=>startSpecial(rec.p);
  $('spHome').onclick=()=>{ RUN=null; clearTimers(); stopVoice(); clearStage(); document.body.classList.add('setup'); renderSetup(); window.scrollTo(0,0); };
  if(rec.nick) spPush().then(()=>spLoad(rec.p,$('spRankNow'),rec.key));
}
let spPushing=false;
async function spPush(){ if(spPushing) return; spPushing=true;
  try{ for(const r of SPREC.filter(x=>!x.up&&x.nick)){
    const res=await fetch(SP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act:'add',lv:r.key,ms:Math.round(r.ms),nick:r.nick,dev:DEV})}).then(x=>x.json()).catch(()=>null);
    if(!res) break; r.up=res.ok?1:2; saveSpRec(); } }finally{ spPushing=false; } }
async function spLoad(p,box,key){ if(!box) return; key=key||spKey(p);
  const res=await fetch(SP_URL+'?lv='+encodeURIComponent(key)+'&dev='+DEV).then(x=>x.json()).catch(()=>null);
  if(!box.isConnected) return;
  if(!res||!Array.isArray(res.top)){ box.innerHTML='<p class="note">지금은 순위표를 불러오지 못했어요. 기록은 이 기기에 남아 있다가 다음에 보내져요.</p>'; return; }
  const row=r=>'<tr class="'+(r.me?'me':'')+'"><td class="r">'+r.r+'</td><td>'+esc(r.n)+'</td><td class="t">'+spTime(r.ms)+'</td></tr>';
  const out=(res.mine||[]).filter(m=>m.r>res.top.length).slice(0,3).map(row).join('');
  box.innerHTML=res.top.length?'<table>'+res.top.map(row).join('')+(out?'<tr><td colspan="3" class="gap">…</td></tr>'+out:'')+'</table><p class="note">모든 학교 · '+esc(PL[p].label)+' '+key.split('-')[1]+'마리 · 별명마다 가장 빠른 기록 · '+res.total+'명</p>'
    :'<p class="note">아직 올라온 기록이 없어요. 첫 기록의 주인공이 되어 보세요!</p>'; }
/* 설정 화면의 스페셜 칸 */
function renderSpecial(){
  const box=$('spBox'); if(!box) return; const ps=spPlaces(), k=spWho();
  box.innerHTML='<div class="row"><button class="chip on" id="spGo"'+(ps.length?'':' disabled')+'>★ 스페셜 시작 (아무 곳이나)</button><button class="chip sm" id="spRk">🏆 순위 보기</button></div>'
    +'<p class="pickNote">나오는 곳: '+ps.map(p=>PL[p].label+' '+spCount(p)+'마리').join(' · ')+'</p>'
    +'<div class="spNick"><b>순위표 별명</b> <small>— '+(k==='_'?'연습':esc(nameOf(k)))+'</small> <input id="spNickIn" maxlength="8" placeholder="예: 번개손" value="'+esc(NICK[k]||'')+'" autocomplete="off"><button class="chip sm" id="spNickOk">저장</button><button class="chip sm" id="spNickDel">지우기</button> <span id="spNickMsg" class="pickNote"></span>'
    +'<p class="pickNote">별명을 정하면 기록이 모든 학교 순위표에 올라가요. 보내는 것은 별명·곳·시간뿐이고 학생 이름·학교는 보내지 않아요. 실명이나 학교를 알 수 있는 별명은 쓰지 않아요.</p></div>';
  $('spGo').onclick=()=>startSpecial();
  $('spRk').onclick=()=>openSpRank(ps[0]);
  $('spNickOk').onclick=()=>{ const v=$('spNickIn').value.trim().replace(/\s+/g,' '), low=v.replace(/ /g,'').toLowerCase();
    if(!NICK_OK.test(v)){ $('spNickMsg').textContent='한글·영문·숫자로 8자까지 써 주세요.'; return; }
    if(NICK_BAD.some(w=>low.includes(w))){ $('spNickMsg').textContent='다른 별명을 써 주세요.'; return; }
    if(students.some(x=>x.name&&x.name.length>=2&&low.includes(x.name.replace(/ /g,'').toLowerCase()))){ $('spNickMsg').textContent='실명이 들어 있어요. 별명으로 써 주세요.'; return; }
    NICK[k]=v; saveNick(); SPREC.forEach(r=>{ if(r.k===k&&!r.nick){ r.nick=v; r.up=0; } }); saveSpRec(); $('spNickMsg').textContent='저장했어요.'; };
  $('spNickDel').onclick=()=>{ delete NICK[k]; saveNick(); $('spNickIn').value=''; $('spNickMsg').textContent='지웠어요. 앞으로는 이 기기에만 남아요.'; };
}
function openSpRank(p){ const v=$('spRankView'), ps=spPlaces(); if(!ps.length) return; p=ps.includes(p)?p:ps[0];
  const k=spWho(), mine=SPREC.filter(r=>r.k===k&&r.key===spKey(p)).sort((a,b)=>a.ms-b.ms).slice(0,5);
  $('spRankCard').innerHTML='<h2><span>🏆 스페셜 순위</span><button class="chip sm" id="spRkX">닫기</button></h2>'

    +'<div class="spRankBox" id="spRankAll"><p class="note">불러오는 중이에요…</p></div>'
    +'<h4>'+(k==='_'?'연습':esc(nameOf(k)))+' · 이 기기</h4>'+(mine.length?'<table>'+mine.map((r,i)=>'<tr><td class="r">'+(i+1)+'</td><td>'+new Date(r.t).toLocaleDateString('ko-KR')+'</td><td class="t">'+spTime(r.ms)+'</td></tr>').join('')+'</table>':'<p class="note">아직 기록이 없어요.</p>');
  v.classList.add('on');
  $('spRkX').onclick=()=>v.classList.remove('on');
  $('spRankCard').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openSpRank(b.dataset.p));

let DEX_SEL='';
function dexGroups(){ const G={}; Object.keys(BUN).forEach(l=>BUN[l].forEach(b=>b.items.forEach(({a,p})=>{ const g=DEXG(p); (G[g]=G[g]||new Set()).add(a); }))); return G; }
function openDex(){ DEX_SEL=S.stu||'_'; $('dexView').classList.add('on'); renderDex(); }
function renderDex(){
  const who=DEX_SEL, dx=DEX[who]||{}, G=dexGroups(), have={};
  Object.keys(dx).forEach(k=>{ const [p,a]=k.split('|'); const g=DEXG(p); have[g]=have[g]||[]; if(!have[g].some(x=>x.a===a)) have[g].push({a,p}); });
  const total=new Set(Object.keys(dx).map(k=>k.split('|')[1])).size;
  let h='<h2><span>🐾 동물 도감 — '+(who==='_'?'연습':esc(nameOf(who)))+' <small style="font-size:14px;color:var(--muted);font-weight:500">'+total+'마리</small></span><button class="chip sm" id="dexX">닫기</button></h2>'
    +'<div class="row">'+[['_','연습']].concat(students.map(s=>[s.id,s.name])).map(([id,n])=>'<button class="chip sm'+(DEX_SEL===id?' on':'')+'" data-w="'+id+'">'+esc(n)+'</button>').join('')+'</div>'
    +'<p class="tip" style="margin-top:10px">묶음을 마칠 때마다 그 묶음의 동물이 사는 곳에 들어옵니다. 동물을 누르면 그 문장을 들려줍니다. 이 기기에만 저장됩니다.</p><div class="dexGrid">';
  Object.keys(PL).filter(p=>G[p]).forEach(p=>{ h+='<div class="dexCard" data-p="'+p+'"><div class="scene"><img class="bg" src="'+HAB+PL[p].scene+'.jpg" alt=""></div><div class="cap">'+PL[p].label+'<span>'+((have[p]||[]).length)+' / '+G[p].size+'</span></div></div>'; });
  h+='</div>';
  $('dexBox').innerHTML=h;
  $('dexX').onclick=()=>$('dexView').classList.remove('on');
  $('dexBox').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ DEX_SEL=b.dataset.w; renderDex(); });
  requestAnimationFrame(()=>$('dexBox').querySelectorAll('.dexCard').forEach(c=>{ const p=c.dataset.p, sc=c.querySelector('.scene'), L=have[p]||[]; if(!L.length) return;
    const W=sc.clientWidth, H=sc.clientHeight, n=L.length, cols=Math.min(n,Math.ceil(Math.sqrt(n*1.8))), rows=Math.ceil(n/cols);
    const z=Math.min(W/(cols+0.3), H*0.62/rows); const [y0,y1]=PL[p].y;
    L.forEach((it,i)=>{ const r=Math.floor(i/cols), k=i%cols, inRow=Math.min(cols,n-r*cols);
      const q=relSize(L.map(x=>x.a),it.a)*Math.min(1,absFrac(bigOf(L.map(x=>x.a)))/.74), zz=boxOf(it.a,it.p,z*q), cy=H*(rows===1?(y0+y1)/2:(Math.min(y0,.32)+(Math.max(y1,.82)-Math.min(y0,.32))*(r+.5)/rows));
      const im=document.createElement('img'); im.className='d'; im.src=pic(it.a); im.alt=it.a; im.style.width=im.style.height=zz+'px';
      im.style.left=(W*(k+1)/(inRow+1))+'px'; im.style.top=(standsOn(p)?cy+(z-zz)/2:cy)+'px';
      tapper(im,()=>{ unlockAudio(); speak(liveLine(it.a,it.p)); }); sc.appendChild(im); }); }));
}

/* ================= 활동지 (A4 가로 2쪽: 사는 곳 장면 + 오려 붙일 동물) ================= */
function sheetHTML(lv,plan){
  let body=''; plan.forEach(bd=>{ body+=sheetPages(lv,bd); });
  return sheetHead()+body+'<div class="noprint closeBar"><button onclick="window.close()">닫고 돌아가기</button></div>'
    +'</body></html>';
}
function sheetPages(lv,bd){
  const lab=LV[lv].name+' · '+esc(bd.label);
  /* 사는 곳마다 A4 한 장을 꽉 채운 장면(동물을 오려 붙일 수 있게) */
  let h=bd.places.map(p=>'<div class="pg"><div class="hd"><b>[차름 과학] 동물원 1편 · 동물이 사는 곳</b><span>'+lab+' · 이름 ________________</span></div>'
   +'<div class="one"><div class="pl"><img src="'+HAB+PL[p].scene+'.jpg"><span>'+PL[p].label+'</span></div></div></div>').join('');
  const it=shuffle(bd.items); for(let i=0;i<it.length;i+=8)
    h+='<div class="pg"><div class="hd"><b>오려서 사는 곳에 붙여요</b><span>'+lab+'</span></div><div class="cut">'+it.slice(i,i+8).map(x=>'<div class="ac"><img src="'+pic(x.a)+'"><div>'+esc(x.a)+'</div></div>').join('')+'</div><div class="note">점선을 따라 오려 앞 장의 사는 곳에 붙입니다. 이름 없이 하려면 이름 부분을 잘라 냅니다.</div></div>';

}

function printSheet(lv,plan){
  const w=window.open('','_blank'); if(!w){ alert('새 창이 막혀 있어 활동지를 열지 못했습니다. 이 사이트의 팝업을 허용해 주십시오.'); return; }
  w.document.open(); w.document.write(sheetHTML(lv,plan)); w.document.close();
  /* 활동지 창(2026-11-02): 그림이 다 오면 인쇄 창을 열고, 저장·인쇄·취소로 인쇄 창이 닫히면 활동지 창도 닫고 앱으로 돌아옴.
     인쇄와 닫기는 이 앱 창이 맡음(새 창 안의 시계는 기기에 따라 멈춰 있기도 함). 인쇄 창이 곧바로 닫히는 기기(일부 태블릿)를 위해
     1초 안에 온 afterprint는 건너뜀 → 그때는 활동지 창의 '닫고 돌아가기' 단추 */
  let shut=false; const fin=()=>{ if(shut) return; shut=true; try{ w.close(); }catch(e){} try{ window.focus(); }catch(e){} };
  const ims=[...w.document.images].map(im=>im.complete?0:new Promise(r=>{ im.addEventListener('load',r); im.addEventListener('error',r); }));
  Promise.race([Promise.all(ims),wait(8000)]).then(()=>wait(300)).then(()=>{ if(w.closed) return;
    const t0=Date.now(); w.addEventListener('afterprint',()=>{ if(Date.now()-t0>=1000) setTimeout(fin,100); });
    try{ w.focus(); w.print(); }catch(e){ return; }
    if(Date.now()-t0>=300) setTimeout(fin,100); });   /* print()가 인쇄 창이 닫힐 때까지 멈춰 있던 기기(데스크톱 크롬 등) */
}

const PH_NAME={a2p:'사는 곳 찾기',p2a:'동물 찾기',sort:'정리하기'};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const barH=v=>'<span class="bar100"><b style="width:'+v+'%"></b></span>'+v+'%';
const dayOf=t=>{ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const weekOf=t=>{ const d=new Date(t); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); return dayOf(m); };
function plName(id){ return PL[id]?PL[id].label:id; }
function exampleLog(){ /* 가상의 학생 홍길동의 한 달(이 기기 기록에 넣지 않음) */
  const rows=[], start=Date.now()-28*864e5; let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let d=0;d<28;d+=2){ const lv=d<12?1:2, b=(d/2)%BUN[lv].length, bd=BUN[lv][b], g=start+d*864e5+9*36e5;
    ['a2p','p2a','sort'].forEach((ph,k)=>bd.items.forEach((it,i)=>{ const skill=Math.min(.95,(lv===1?.55:.4)+d*.02+(it.p==='underground'?-.15:0));
      const ok=rnd()<skill; const others=bd.places.filter(p=>p!==it.p);
      rows.push({s:'ex',t:g+(k*10+i)*40e3,g,lv,b:b+1,ph,a:it.a,p:it.p,res:ok?'first':'help',w:ok?'':(ph==='p2a'?bd.items.find(x=>x.p!==it.p).a:others[Math.floor(rnd()*others.length)])}); })); }
  return rows;
}

  h+='<p class="tip" style="margin-top:14px">기록 읽는 법: "바로"는 처음 누른 것이 맞은 것, "도움 받아"는 틀린 뒤나 정답이 빛난 뒤에 맞힌 것입니다. 기록은 판단의 근거 가운데 하나이고, 학생끼리 비교하지 않습니다. 기록은 이 기기 브라우저에만 있습니다.</p>';
  h+='<div class="row noprint" style="margin-top:12px"><button class="chip sm" id="recCsv">CSV 내보내기</button><button class="chip sm" id="recPrint">출력 (A4)</button></div>';
  $('recBox').innerHTML=h;
  $('recX').onclick=()=>$('recView').classList.remove('on');
  $('recBox').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ REC_SEL=b.dataset.s; renderRecords(); });
  const ls_=$('lvSet'); if(ls_) ls_.onclick=()=>{ S.level=+ls_.dataset.l; S.bundle=0; saveS(); renderSetup(); ls_.textContent='바꿨습니다(설정 화면 ②)'; ls_.disabled=true; };
  $('recCsv').onclick=()=>{ const head=['학생','시각','수준','묶음','단계','동물','사는 곳','결과','먼저 누른 것'];
    const lines=[head].concat(rows.map(r=>[ex?'홍길동(예시)':nameOf(r.s),dayOf(r.t)+' '+new Date(r.t).toTimeString().slice(0,8),r.lv,r.b,PH_NAME[r.ph],r.a,plName(r.p),r.res==='first'?'바로':'도움 받아',r.ph==='p2a'?r.w:plName(r.w)]));
    const csv='﻿'+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='동물이사는곳_기록_'+(who||'학생')+'.csv'; a.click(); };
  $('recPrint').onclick=()=>window.print();
}
$('recView').addEventListener('pointerdown',e=>{ if(e.target.id==='recView') $('recView').classList.remove('on'); });
document.addEventListener('pointerdown',e=>{ if(helpI>=0&&!e.target.closest('#spotTip')){ hideSpot(); helpI=-1; } },true);

/* Esc 등으로 전체 화면에서 나왔으면, 학생이 다음에 화면을 누를 때 다시 전체 화면으로(나올 때마다 한 번만 시도 — 기기가 막아도 멈추지 않게).
   그 누름은 평소처럼 쓰고, 커져도 화면을 다시 그리지 않음(하던 것 그대로) */
let fullTapAt=0, wantFull=false;
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{ if(!isFull()&&!S.admin&&!document.body.classList.contains('setup')) wantFull=true; }));
document.addEventListener('pointerdown',e=>{
  if(!wantFull||document.body.classList.contains('setup')||S.admin||!RUN||isFull()) return;
  if(e.target.closest('.dock,#adminBtn,#agDot,#endBtn,#reportBtn,#endCover,#recView,#dexView,#spotTip')) return;
  wantFull=false; fullTapAt=performance.now(); goFull();
},true);
/* 화면 크기가 바뀌면(휴대폰을 돌리는 등) 다시 그림. 단 숨은 동물 찾기·스페셜을 하는 중이면 다시 그리지 않고 장면만 새 크기에 맞춤(2026-11-03) —
   다시 그리면 놀이가 처음부터 되고, 스페셜은 수업 놀이로 잘못 다시 불려 동물 0마리로 '다 찾았어요'와 빈 배경만 남았음 */
function fitCard(){ const c=document.querySelector('#stage .showCard'); if(!c) return false; const w0=parseFloat(c.style.width), h0=parseFloat(c.style.height); if(!w0||!h0) return false;
  const A=area(), sd=[...document.querySelectorAll('#stage .spSide')], tb=sd.length&&spTB(); sd.forEach(d=>spSideStyle(d,tb));
  const rw=tb?0:sd.reduce((n,e)=>n+e.offsetWidth,0)+(sd.length?28:0), rh=tb?sd.reduce((n,e)=>n+e.offsetHeight,0)+24:0;
  const k=Math.max(.2,Math.min((A.w*0.94-rw)/w0,(A.h*0.9-rh)/h0)); c.style.transformOrigin='50% 50%'; c.style.transform=Math.abs(k-1)<.01?'':'scale('+k.toFixed(3)+')'; return true; }
window.addEventListener('resize',()=>{ if(performance.now()-fullTapAt<1500) return; if(RUN&&!document.body.classList.contains('setup')&&!S.admin){ clearTimeout(window.__rz); window.__rz=setTimeout(()=>{
  if(RUN.special){ if(!fitCard()&&!document.querySelector('#stage .spDone')) runSpecial(); return; }
  if(RUN.ending&&!RUN.gameDone&&fitCard()) return;
  if(RUN.ending) startEnd(); else runStep(); },300); } });
renderSetup();
</script>
<script id="holdBubble">
/* 관리 버튼을 3초 누르는 동안: (휴대폰·태블릿을 손가락으로 누를 때만) 버튼 조금 위에 투명한 아쿠아 원이 세 번. 전자칠판·PC는 버튼 둘레 고리만 */
(function(){
  const btn = document.querySelector('#adminBtn, #aqua'); if (!btn) return;
  const st = document.createElement('style');
  st.textContent = '.hb-dot{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:2147483000;opacity:0;'
    + 'background:radial-gradient(circle at 50% 40%,rgba(200,250,252,.75),rgba(120,225,232,.35) 60%,rgba(80,200,210,.2));'
    + 'border:1.5px solid rgba(70,185,200,.55);box-shadow:0 0 10px rgba(130,230,238,.55)}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.className = 'hb-dot'; document.body.appendChild(dot);
  let down = false, raf = 0, useDot = false;
  const mobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const prog = () => { const v = getComputedStyle(btn).getPropertyValue('--p').trim(); const n = parseFloat(v) || 0; return /%$/.test(v) ? n / 100 : n; };
  const hide = () => { dot.style.opacity = 0; btn.style.opacity = ''; };
  const loop = () => {
    const p = prog();
    if (down && p > 0.01 && p < 1) {
      const r = btn.getBoundingClientRect(), S = 40;
      dot.style.left = Math.max(4, Math.min(innerWidth - S - 4, r.left + r.width / 2 - S / 2)) + 'px';
      dot.style.top = Math.max(4, r.top - S - 34) + 'px';
      btn.style.opacity = '.75';
      if (!useDot) return void (raf = requestAnimationFrame(loop));
      dot.style.opacity = (0.9 * Math.sin(Math.PI * ((p * 3) % 1))).toFixed(3);
    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);
  const up = () => { down = false; cancelAnimationFrame(raf); hide(); };
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, up, true));
})();
</script>
<script id="adminGate">
/* 관리 메뉴 열기 2단계: 관리 버튼을 3초 누른 뒤, 왼쪽 위에 3초 동안 나타나는 작은 점을 눌러야 열림 */
window.AdminGate = (function () {
  const st = document.createElement('style');
  st.textContent = '#agDot{position:fixed;left:18px;top:18px;width:62px;height:62px;border-radius:50%;z-index:2147483600;display:none;cursor:pointer;touch-action:none;'
    + 'background:radial-gradient(circle at 50% 38%,rgba(210,252,253,.9),rgba(120,225,232,.55) 60%,rgba(70,190,205,.4));border:2px solid rgba(34,175,188,.75);box-shadow:0 0 10px rgba(120,225,232,.6)}'
    + '#agDot svg{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}'
    + '#agDot circle{fill:none;stroke:#22AFBC;stroke-width:4;stroke-linecap:round}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.id = 'agDot'; dot.setAttribute('aria-label', '관리 열기');
  dot.innerHTML = '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="34"/></svg>';
  document.body.appendChild(dot);
  const ring = dot.querySelector('circle'), L = 2 * Math.PI * 34;
  ring.style.strokeDasharray = L;
  let cb = null, t0 = 0, raf = 0, WAIT = 3000;
  const hide = () => { dot.style.display = 'none'; cancelAnimationFrame(raf); cb = null; };
  const tick = () => { const p = (performance.now() - t0) / WAIT; if (p >= 1 || !cb) return hide(); ring.style.strokeDashoffset = L * p; raf = requestAnimationFrame(tick); };
  let armed = false;
  dot.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!cb) return; armed = true; cancelAnimationFrame(raf); try { dot.setPointerCapture(e.pointerId); } catch (x) {} });
  const done = e => { e.preventDefault(); e.stopPropagation(); if (!armed) return; armed = false; const f = cb; cb = null; setTimeout(() => { dot.style.display = 'none'; }, 60); if (f) f(); };
  dot.addEventListener('pointerup', done); dot.addEventListener('pointercancel', done);
  dot.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  return { ask(fn) { cb = fn; t0 = performance.now(); ring.style.strokeDashoffset = 0; dot.style.display = 'block'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, cancel: hide };
})();
</script>
<script id="reportLink">
/* 오류·의견 알리기(10-26 휴대폰처럼 좁으면 💬 동그라미만): 선생님 화면(설정·관리 메뉴)에서만 왼쪽 아래에 작게. 차름 게시판 이 앱 글의 댓글 칸이 새 탭으로 열림 */

    a.setAttribute('aria-label','오류·의견 알리기'); a.innerHTML='<span aria-hidden="true">💬</span><span class="rbTxt">오류·의견 알리기</span>'; document.body.appendChild(a); }

<script id="endLesson">
/* 수업 끝내기: 관리 메뉴를 열면 전체 화면에서 나오고(잠깐 나가기), 관리 메뉴에 있는 동안 왼쪽 아래 "⏻ 수업 끝내기"(두 번 눌러야)로 앱을 아예 끝냄 */
(function(){
  var BOARD='https://www.charum.org/webapp/59860';
  var ctxs=[]; ['AudioContext','webkitAudioContext'].forEach(function(n){ var C=window[n]; if(!C||C.__endWrap) return;
    var W=function(){ var c=new (Function.prototype.bind.apply(C,[null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    W.prototype=C.prototype; W.__endWrap=true; try{ window[n]=W; }catch(e){} });
  var css=document.createElement('style');
  css.textContent='#endBtn{position:fixed;left:12px;bottom:52px;z-index:2147480001;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
   +'#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
   +'#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
   +'#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin(){ try{ return document.body.classList.contains('admin'); }catch(e){ return false; } }
  function exitFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
  function hush(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio,video').forEach(function(m){ try{ m.pause(); }catch(e){} }); ctxs.forEach(function(c){ try{ c.suspend(); }catch(e){} }); }
  function end(){
    hush(); try{ window.dispatchEvent(new Event('pagehide')); }catch(e){} exitFull();
    var cv=document.createElement('div'); cv.id='endCover';
    cv.innerHTML='<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="'+BOARD+'">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick=function(){ location.reload(); };
    ['pointerdown','click','touchstart','keydown'].forEach(function(t){ cv.addEventListener(t,function(e){ e.stopPropagation(); });   /* 단추가 받은 뒤 막음(잡는 단계에서 막으면 "다시 시작"까지 막힘, 2026-10-26) */ });
    setTimeout(function(){ try{ window.close(); }catch(e){} },150);
    setInterval(hush,1000);
  }
  var was=false, sureT=0;
  function tick(){
    var b=document.getElementById('endBtn');
    if(!b){ b=document.createElement('button'); b.id='endBtn'; b.type='button'; b.title='앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML='<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
        if(!b.classList.contains('sure')){ b.classList.add('sure'); b.querySelector('.t').textContent='한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT=setTimeout(function(){ b.classList.remove('sure'); b.querySelector('.t').textContent='수업 끝내기'; },3000); return; }
        end(); });
      ['click','pointerup'].forEach(function(t){ b.addEventListener(t,function(e){ e.stopPropagation(); }); });
      document.body.appendChild(b); }
    var a=admin();
    b.classList.toggle('on',a);
    if(a&&!was) exitFull();
    was=a;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,400);
})();
</script>
<script id="printFit">
/* 차름 공통: 출력 — 전체 화면이면 먼저 나간 뒤 인쇄(전체 화면에서 바로 인쇄하면 미리보기가 왼쪽 위에 작게 붙음),
   PrintFit.page(방향, 여백mm, 덧붙일 인쇄 CSS) 로 이번 한 번의 종이 방향을 정함(인쇄가 끝나면 원래대로) */
(function(){
  var P=window.print.bind(window);
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  window.print=function(){
    if(!fsEl()){ P(); return; }
    var done=false; function go(){ if(done) return; done=true; setTimeout(P,300); }
    document.addEventListener('fullscreenchange',go,{once:true});
    document.addEventListener('webkitfullscreenchange',go,{once:true});
    try{ var ex=document.exitFullscreen||document.webkitExitFullscreen; var r=ex&&ex.call(document); if(r&&r.catch) r.catch(go); }catch(e){ go(); }
    setTimeout(go,1200);
  };
  function st(){ var s=document.getElementById('printPage'); if(!s){ s=document.createElement('style'); s.id='printPage'; document.head.appendChild(s); } return s; }
  window.PrintFit={
    orient:function(w,h){ return w>h*1.02?'landscape':'portrait'; },
    /* 종이 안쪽 크기(mm): 이 높이에 맞춰 그림을 꽉 채움 */
    inner:function(o,m){ return o==='landscape'?{w:297-2*m,h:210-2*m}:{w:210-2*m,h:297-2*m}; },
    page:function(o,m,css){ st().textContent='@media print{@page{size:A4 '+o+';margin:'+m+'mm}'+(css||'')+'}'; }
  };
  window.addEventListener('afterprint',function(){ var s=document.getElementById('printPage'); if(s) s.textContent=''; });
})();
</script>
