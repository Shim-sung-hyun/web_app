}

/* ---- 문질러 찾기(보상 놀이): 물질 결로 덮인 판을 손으로 문지르면 그 물질로 만든 물체가 나타남. 진 것·시간 재기 없음 ---- */
/* ================= 사진 수업(2026-11-21 선생님): 자료실 사진 · 자동 / 골라서 / 사진 받기 =================
   사진 한 장 = 한 덩이. 살펴보기(물체 하나만 밝게) → 물체 찾기(사진에서 바로 누름) → 물질 고르기 → 같은 물질 찾기 → 정리하기(사진 조각) → 놀이 */
function sceneEl(sc,maxW,maxH){ const k=Math.min(maxW/sc.w,maxH/sc.h), w=sc.w*k, h=sc.h*k;
  const d=document.createElement('div'); d.className='scene'; d.style.width=w+'px'; d.style.height=h+'px';
  d.innerHTML='<img src="'+sc.src+'" alt="" draggable="false">';
  const at=(el,b)=>{ el.style.left=b[0]/1000*w+'px'; el.style.top=b[1]/1000*h+'px'; el.style.width=(b[2]-b[0])/1000*w+'px'; el.style.height=(b[3]-b[1])/1000*h+'px'; return el; };
  return {d,w,h,at}; }
function spot(V,box){ let s=V.d.querySelector('.spot'); if(!s){ s=document.createElement('div'); s.className='spot'; V.d.appendChild(s); } V.at(s,box); return s; }
/* 누를 자리: 작은 물체가 큰 물체(문 안의 손잡이) 위에 오게 */
function frame(V,it,cls){ const f=document.createElement('div'); f.className='fr'+(cls?' '+cls:''); V.at(f,it.box); f.dataset.a=it.a; f.dataset.m=it.m;
  const b=it.box; f.style.zIndex=String(10+Math.round(1e6/Math.max(400,(b[2]-b[0])*(b[3]-b[1])))); V.d.appendChild(f); return f; }
const phOf=it=>{ const sc=SC[it.sc]; return {w:sc.w,h:sc.h,src:sc.src,box:[it.box[0]*sc.w/1000,it.box[1]*sc.h/1000,it.box[2]*sc.w/1000,it.box[3]*sc.h/1000]}; };

/* ---- 사진 1. 살펴보기: 사진 전체 → 물체만 밝게 "문이에요." → 한 가지 물질이면 물질 카드 "나무로 만들었어요."
   여러 물질이면 부분을 하나씩 밝히며 "손잡이는 쇠로 만들었어요."(카드가 하나씩 쌓임, 안 보이는 부분은 물체를 밝힌 채 말로만) → "문은 나무, 쇠, 유리로 만들었어요." ---- */
async function stepPShow(o,tok){
  const P0=o.parts.filter(p=>p.box), VMS=[...new Set(P0.map(p=>p.m))];   /* 속(안 보이는 물질)은 '속 보기' 단계에서 */
  o=Object.assign({},o,{parts:P0,ms:VMS});
  const st=$('stage'), A=area(), por=portrait(), sc=SC[o.sc], multi=VMS.length>1, n=VMS.length;
  const ms=por?Math.min(A.w*0.9/Math.max(1,n)-14,170):Math.min((A.h-120)/Math.max(1,n)-16,A.w*0.2,multi?190:250);
  const V=sceneEl(sc,por?A.w:A.w-ms-80,por?A.h-ms-130:A.h-80);
  const pair=document.createElement('div'); pair.className='pair'; pair.style.flexDirection=por?'column':'row'; pair.style.gap=por?'12px':'28px';
  const L=document.createElement('div'), R=document.createElement('div'); R.className='matCol'; R.style.flexDirection=por?'row':'column';
  L.appendChild(V.d); const tag=document.createElement('div'); tag.className='nameTag'; tag.textContent=nm(o.a); tag.style.opacity=0; tag.style.transition='opacity .6s'; L.appendChild(tag);
  pair.appendChild(L); pair.appendChild(R); st.appendChild(pair);
  const addCard=(m,hid)=>{ const w=document.createElement('div'); w.className='slideIn'; const mc=matCard(m,ms); mc.style.cursor='default'; if(hid){ const t=document.createElement('span'); t.className='hidTag'; t.textContent='안쪽'; mc.appendChild(t); } w.appendChild(mc); R.appendChild(w); requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on'))); return mc; };
  await wait(800); if(!alive(tok)) return; spot(V,o.box);
  await wait(700); if(!alive(tok)) return; tag.style.opacity=1;
  await speak(isLine(o.a)); if(!alive(tok)) return; await wait(500); if(!alive(tok)) return;
  if(!multi&&P0.length>1){ o.parts=[P0[0]]; }
  if(!multi){ const mc=addCard(o.ms[0]); await wait(700); if(!alive(tok)) return; await speak(madeLine(o.ms[0])); if(!alive(tok)) return;
    await showFlat(mc,o.ms[0],tok); if(!alive(tok)) return; await wait(1400); if(alive(tok)) nextItem(); return; }
  const shown=new Set();
  for(const pt of o.parts){
    spot(V,pt.box||o.box); tag.textContent=nm(o.a)+' · '+nm(pt.a); await wait(650); if(!alive(tok)) return;
    if(!shown.has(pt.m)){ shown.add(pt.m); addCard(pt.m,!pt.box); await wait(450); if(!alive(tok)) return; }
    await speak(fullLine(pt.a,pt.m)); if(!alive(tok)) return; await wait(600); if(!alive(tok)) return; }

}
/* ---- 사진 2. 물체 찾기: 이름 → 사진에서 그 물체를 누름. 수준 1 = 테두리 2곳, 2 = 4곳까지, 3 = 테두리 없이 ---- */
function stepPObj(it,tok){
  const st=$('stage'), A=area(), sc=SC[it.sc], lv=RUN.lv, fs=Math.min(A.h*0.1,70);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML='<div class="word" style="font-size:'+fs+'px">'+esc(nm(it.a))+'</div>';
  const V=sceneEl(sc,A.w,A.h-fs-90); V.d.style.marginTop='22px';
  /* 테두리는 처음엔 안 보임(모든 수준, 2026-11-23 선생님) — 사진 전체에서 스스로 찾고, 틀리면(또는 16초 지나면) 찾을 물체에만 노란 테두리(choiceRound의 glow) */
  const cand=[it,...shuffle(RUN.bd.objs.filter(x=>x.a!==it.a))];

/* ---- 사진 3. 물질 고르기: 부분 하나만 밝게 → 물질 카드(답 하나), 기록은 물질 고르기로 ---- */
function stepPMat(it,tok){ stepPhoto(Object.assign({},it,{ph:phOf(it)}),tok,'mat'); }
/* ---- 사진 4. 모두 찾기(여러 물질 물체): 물체를 밝히고 "문은 무엇으로 만들었어요?" → 맞는 물질 카드를 모두 누름.
   찾을 수만큼 빈 칸(○○○)을 보여 주어 몇 개인지 눈으로 알게. '다 했어요' 단추 없이 다 찾으면 끝. 틀리면 남은 답이 빛남(도움) ---- */
function stepAll(o,tok){
  const st=$('stage'), A=area(), sc=SC[o.sc], n=o.ms.length;
  const pool=shuffle([...new Set([...RUN.bd.mats,...ALLMAT])].filter(m=>!o.ms.includes(m))).slice(0,Math.max(1,Math.min(5-n,2)));
  const opts=shuffle([...o.ms,...pool]), k=opts.length, gap=Math.max(14,A.w*0.02);
  const cs=Math.min(optSize(k,A.w,A.h*0.3,gap,true),190), V=sceneEl(sc,A.w*0.9,A.h-cs-150);
  const slots=document.createElement('div'); slots.className='slots'; for(let i=0;i<n;i++){ const d=document.createElement('i'); slots.appendChild(d); }
  const row=optRow(k,cs,gap); opts.forEach(m=>row.appendChild(matCard(m,cs,'fadeIn')));
  st.appendChild(V.d); st.appendChild(slots); st.appendChild(row); spot(V,o.box);
  const cards=[...row.children], rights=cards.filter(c=>o.ms.includes(c.dataset.m)); let left=n, wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; rights.filter(c=>!c.classList.contains('right')).forEach(c=>c.classList.add('glow')); };
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(askMat(o.a)).then(()=>{ if(!alive(tok)) return; later(()=>{ if(alive(tok)&&!over) speak(askMat(o.a)); },8000); later(()=>{ if(alive(tok)&&!over) glow(); },16000); });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)||c.classList.contains('right')) return;
    if(!o.ms.includes(c.dataset.m)){ if(!wrong){ wrong=c.dataset.m; glow(); } return; }
    c.classList.remove('glow'); c.classList.add('right'); chime();
    const sl=slots.children[n-left]; sl.style.backgroundImage=texOf(c.dataset.m).replace(/"/g,"'"); sl.classList.add('on'); left--;
    if(left) return;
    over=true; clearTimers(); logRow('all',{a:o.a,m:o.ms.join('+')},wrong,helped||!!wrong);
    (async()=>{ cards.forEach(x=>{ if(!x.classList.contains('right')) x.style.opacity=.25; }); await wait(400); if(!alive(tok)) return;
      await speak(allLine(o.a,o.ms)); if(!alive(tok)) return; await wait(1000); if(alive(tok)) nextItem(); })();
  }));
}

/* ---- 속 보기(수준 3, 2026-11-21 선생님 — 수준 4는 2026-11-22에 없애고 수준 3으로): 겉 물질을 다시 말함 → "속을 볼까요?" → 학생이 '열어 보기'를 누름 → 반쯤 열린 그림(한 그림에 겉과 속)
   → "정수기 안에는 무엇이 있을까요?" → 물질 고르기 → "안쪽은 쇠로 만들었어요." → "정수기는 플라스틱, 쇠로 만들었어요."
   그림이 있으면 그림을 보고 미루어 고름. 그림이 아직 없으면 먼저 말과 카드로 알려 준 뒤 고름(틀리지 않게) ---- */
async function stepIn(o,tok){
  const st=$('stage'), A=area(), sc=SC[o.sc], vis=o.parts.filter(p=>p.box), vms=[...new Set(vis.map(p=>p.m))], hp=o.parts.find(p=>!p.box&&!vms.includes(p.m))||o.parts.find(p=>!p.box), src=insideSrc(o.a);
  const opts=matOptions({m:hp.m}), n=opts.length, gap=Math.max(16,A.w*0.03), cs=Math.min(optSize(n,A.w,A.h*0.3,gap,true),180), topH=A.h-cs-130;
  const top=document.createElement('div'); top.className='inRow';
  const V=sceneEl(sc,A.w*0.5,topH); const pan=document.createElement('div'); pan.className='inPan'; pan.style.width=pan.style.height=Math.min(topH,A.w*0.4)+'px';
  pan.innerHTML=src?'<img src="'+src+'" alt="" draggable="false">':'<div class="inCap">속</div>';
  top.appendChild(V.d); top.appendChild(pan);
  const go=document.createElement('button'); go.type='button'; go.className='gGo inGo'; go.textContent='열어 보기';
  const row=optRow(n,cs,gap); row.style.marginTop='16px'; opts.forEach(m=>row.appendChild(matCard(m,cs,'fadeIn')));
  st.appendChild(top); st.appendChild(go); st.appendChild(row); spot(V,o.box);
  let opened=false; const tapped=new Promise(res=>tapper(go,()=>{ if(opened||!alive(tok)) return; opened=true; unlockAudio(); stopVoice(); res(); }));   /* 말하는 중에 눌러도 열림 */
  (async()=>{ await wait(600); if(!alive(tok)||opened) return;
    await speak(vms.length>1?allLine(o.a,vms):fullLine(o.a,vms[0])); if(!alive(tok)||opened) return;
    await speak(INSIDE_ASK); if(!alive(tok)||opened) return;
    later(()=>{ if(alive(tok)&&!opened) speak(INSIDE_ASK); },8000); later(()=>{ if(alive(tok)&&!opened) go.classList.add('glow'); },16000); })();
  await tapped; if(!alive(tok)) return;
  clearTimers(); go.style.visibility='hidden'; pan.classList.add('open'); await wait(900); if(!alive(tok)) return;
  if(!src){ const mc=matCard(hp.m,Math.min(parseFloat(pan.style.width)*0.7,220)); mc.style.cursor='default'; pan.innerHTML='<div class="cap">'+esc(nm(o.a))+' '+(hp.a.endsWith('안쪽')?'안쪽':esc(hp.a))+'</div>'; pan.style.flexDirection='column'; pan.style.gap='8px'; pan.appendChild(mc);
    await speak(fullLine(hp.a,hp.m)); if(!alive(tok)) return; await wait(500); if(!alive(tok)) return; }

    rec:(w,h)=>logRow('in',{a:o.a,m:hp.m},w&&w.dataset.m,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(hp.a,hp.m)); if(!alive(tok)) return; await wait(400); if(!alive(tok)) return;
      await speak(allLine(o.a,o.ms)); if(!alive(tok)) return; await wait(1100); if(alive(tok)) nextItem(); }});
}

/* ---- 같은 물질 찾기(그림·사진 모두): 물질 카드 → "나무로 만든 것을 모두 찾아요." → 다 찾으면 "모두 나무로 만들었어요." ---- */
function stepSame(q,tok){
  const st=$('stage'), A=area(), bd=RUN.bd, m=q.m, P=!!bd.photo, mcS=Math.min(A.h*0.22,150);
  const bub=document.createElement('div'); bub.className='bubble'; const mc=matCard(m,mcS); mc.style.cursor='default'; mc.style.border='0'; bub.appendChild(mc);
  let cards, holder;
  if(P){ const V=sceneEl(SC[bd.sid],A.w,A.h-mcS-120); V.d.style.marginTop='22px'; cards=bd.items.map(x=>{ const f=frame(V,x,RUN.lv>=3?'ghost':''); f.style.opacity=0; return f; }); holder=V.d; }
  else { const mine=bd.items.filter(x=>x.m===m), rest=shuffle(bd.items.filter(x=>x.m!==m)).slice(0,Math.max(2,6-mine.length)), its=shuffle([...mine,...rest]);
    const n=its.length, gap=Math.max(14,A.w*0.025), cols=portrait()?2:(n>4?3:n), rows=Math.ceil(n/cols), hAv=A.h-mcS-120;
    const cs=Math.max(70,Math.min((A.w-gap*(cols-1))/cols-8,(hAv-gap*(rows-1))/rows,230));
    const row=document.createElement('div'); row.className='opts'; row.style.cssText='margin-top:22px;flex-wrap:wrap;column-gap:'+gap+'px;row-gap:'+gap+'px;max-width:'+(cs*cols+gap*(cols-1)+8)+'px';
    its.forEach(x=>{ const c=objCard(x,cs,'fadeIn'); c.dataset.m=x.m; row.appendChild(c); }); cards=[...row.children]; holder=row; }
  st.appendChild(bub); st.appendChild(holder);
  const rights=cards.filter(c=>c.dataset.m===m); let left=rights.length, wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; rights.filter(c=>!c.classList.contains('right')).forEach(c=>c.classList.add('glow')); };
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(sameAsk(m)).then(()=>{ if(!alive(tok)) return; later(()=>{ if(alive(tok)&&!over) speak(sameAsk(m)); },8000); later(()=>{ if(alive(tok)&&!over) glow(); },16000); });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)||c.classList.contains('right')) return;
    if(c.dataset.m!==m){ if(!wrong){ wrong=c.dataset.a; glow(); } return; }
    c.classList.remove('glow'); c.classList.add('right'); chime(); left--;
    if(left) return;
    over=true; clearTimers(); logRow('same',{a:rights.map(x=>x.dataset.a).join(','),m},wrong,helped||!!wrong);
    (async()=>{ cards.forEach(x=>{ if(!x.classList.contains('right')) x.style.opacity=P?0:.25; }); await wait(400); if(!alive(tok)) return;
      await speak(sameDone(m)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); })();
  }));
}

/* ================= 놀이 2. 두드려 보기: 물체를 두드리면 그 물질 소리(나무 똑 · 유리 띵 · 종이 바스락). 소리는 작고 부드럽게 — 소리에 예민한 학생 ================= */
function matSound(m){ if(!S.sound) return; const c=getCtx(); if(!c) return; if(c.state==='suspended') c.resume();
  const t=c.currentTime+0.01, out=c.createGain(); out.gain.value=0.55; out.connect(c.destination);
  const tone=(f,d,g,type,bend)=>{ const o=c.createOscillator(), e=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(bend) o.frequency.exponentialRampToValueAtTime(bend,t+d);
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+0.006); e.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(e); e.connect(out); o.start(t); o.stop(t+d+0.05); };
  const noise=(d,g,ft,f,q,at)=>{ const n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=Math.random()*2-1;
    const sN=c.createBufferSource(); sN.buffer=b; const fl=c.createBiquadFilter(); fl.type=ft; fl.frequency.value=f; fl.Q.value=q||1; const e=c.createGain();
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+(at||0.004)); e.gain.exponentialRampToValueAtTime(0.0006,t+d); sN.connect(fl); fl.connect(e); e.connect(out); sN.start(t); sN.stop(t+d+0.02); };
  ({wood:()=>{ tone(430,0.13,0.32,'sine',300); noise(0.05,0.22,'bandpass',950,2.2); },
    metal:()=>{ tone(880,0.9,0.06); tone(1333,0.7,0.035); tone(2210,0.45,0.02); noise(0.02,0.08,'highpass',4000); },
    glass:()=>{ tone(2093,0.5,0.07); tone(3140,0.32,0.035); },
    ceramic:()=>{ tone(1480,0.2,0.11); tone(2620,0.13,0.05); noise(0.03,0.08,'highpass',3200); },
    plastic:()=>{ tone(720,0.08,0.22,'triangle',520); noise(0.04,0.12,'bandpass',1900,1.6); },
    paper:()=>{ noise(0.32,0.2,'bandpass',3600,0.6,0.05); },
    cloth:()=>{ noise(0.2,0.3,'lowpass',480,0.7,0.02); },
    rubber:()=>{ tone(190,0.24,0.32,'sine',125); },
    stone:()=>{ tone(150,0.11,0.32,'sine',105); noise(0.09,0.26,'lowpass',650,1); }})[m]?.(); }
function playTap(tok){
  const st=$('stage'), A=area(), bd=RUN.bd; let cards;
  if(bd.photo){ const V=sceneEl(SC[bd.sid],A.w,A.h-10); st.appendChild(V.d); cards=bd.items.map(x=>frame(V,x,'soft')); }
  else { const its=bd.items.slice(0,8), n=its.length, gap=Math.max(14,A.w*0.02), cols=portrait()?2:Math.min(n,4), rows=Math.ceil(n/cols);
    const cs=Math.min((A.w-gap*(cols-1))/cols-8,(A.h-gap*(rows-1))/rows-8,240), g=document.createElement('div'); g.className='scr'; g.style.gridTemplateColumns='repeat('+cols+','+cs+'px)'; g.style.gap=gap+'px';
    its.forEach(x=>{ const c=objCard(x,cs); c.dataset.m=x.m; g.appendChild(c); }); st.appendChild(g); cards=[...g.children]; }
  const hit=new Set(); let finished=false;
  const finish=ms=>{ if(finished) return; finished=true; later(()=>{ if(!alive(tok)) return; RUN.gameDone=true; startEnd(); },ms); };
  cards.forEach((c,i)=>tapper(c,()=>{ if(!alive(tok)) return; matSound(c.dataset.m);
    c.classList.remove('wig'); void c.offsetWidth; c.classList.add('wig');
    let b=c.querySelector('.badge'); if(!b){ b=document.createElement('span'); b.className='badge'; c.appendChild(b); } b.textContent=MAT[c.dataset.m].label; b.classList.add('on');
    clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('on'),1400);
    hit.add(i); if(hit.size===cards.length) finish(5000); }));
  speak(TAP_LINE);
  later(()=>{ if(alive(tok)) finish(0); },60000);   /* 1분이 지나면 끝 장면으로 */
}

/* ================= 놀이 3. 물질 공장: 물질 카드를 기계에 넣으면 덜컹덜컹 → 그 물질로 만든 물건이 하나씩 나옴. 지는 것 없음 ================= */
const MACH_SVG='<svg viewBox="0 0 230 200" aria-hidden="true"><g stroke="#5E4E3C" stroke-width="3" stroke-linejoin="round">'

function parseGem(arr){ const bx=b=>{ if(!Array.isArray(b)||b.length!==4) return null; const [y0,x0,y1,x1]=b.map(v=>Math.max(0,Math.min(1000,Math.round(+v||0)))); return x1-x0<12||y1-y0<12?null:[x0,y0,x1,y1]; };
  const clean=a=>{ a=String(a||'').trim().slice(0,12); Object.values(MAT).forEach(v=>{ if(a.startsWith(v.label+' ')) a=a.slice(v.label.length+1); }); return a; };
  const out=[];
  (Array.isArray(arr)?arr:[]).forEach(x=>{ const box=bx(x&&x.box_2d); if(!box) return; const a=clean(x.name); const seen=new Set(), parts=[];
    (Array.isArray(x.parts)?x.parts:[]).forEach(p=>{ if(!MAT[p.material]||seen.has(p.material)) return; seen.add(p.material); const pb=p.hidden?null:bx(p.box_2d); parts.push([clean(p.name)||a,p.material,pb||(p.hidden?null:box)]); });
    out.push([a,parts,box]); });

function playRub(tok){
  const st=$('stage'), A=area(), mats=RUN.bd.mats, n=mats.length, gap=Math.max(14,A.w*0.02);
  const cols=portrait()?Math.min(n,2):n, rows=Math.ceil(n/cols);
  const s=Math.min((A.w-gap*(cols-1))/cols-6,(A.h-gap*(rows-1))/rows-6,360);
  const g=document.createElement('div'); g.className='scr'; g.style.gridTemplateColumns='repeat('+cols+','+s+'px)'; g.style.gap=gap+'px'; st.appendChild(g);
  let left=n, finished=false;
  const finish=()=>{ if(finished) return; finished=true; later(()=>{ if(!alive(tok)) return; RUN.gameDone=true; startEnd(); },2200); };
  mats.forEach(m=>{
    const p=document.createElement('div'); p.className='sp'; p.style.width=p.style.height=s+'px';
    const objs=RUN.bd.items.filter(x=>x.m===m), is=objs.length>2?s*0.36:s*0.42;
    p.innerHTML='<div class="under">'+objs.map(x=>thumbHTML(x,is,1)).join('')+'</div><span class="nm">'+MAT[m].label+'</span>';
    const cv=document.createElement('canvas'), dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(s*dpr); cv.height=Math.round(s*dpr); p.appendChild(cv); g.appendChild(p);
    const cx=cv.getContext('2d'), im=new Image();
    im.crossOrigin='anonymous'; im.onload=()=>{ cx.drawImage(im,0,0,cv.width,cv.height); }; im.src=lidTex(m).slice(5,-2);
    cx.fillStyle='#bbb'; cx.fillRect(0,0,cv.width,cv.height);
    let down=false, last=null, open=false;
    const R=s*0.11*dpr;
    const rub=e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*dpr, y=(e.clientY-r.top)*dpr;
      cx.globalCompositeOperation='destination-out'; cx.lineCap='round'; cx.lineWidth=R*2; cx.beginPath();
      if(last){ cx.moveTo(last[0],last[1]); cx.lineTo(x,y); cx.stroke(); } else { cx.arc(x,y,R,0,Math.PI*2); cx.fill(); }
      last=[x,y]; cx.globalCompositeOperation='source-over'; };
    const check=()=>{ if(open) return; try{ const d=cx.getImageData(0,0,cv.width,cv.height).data; let c=0,t=0; const sp=Math.max(1,Math.round(cv.width/48));
        for(let y=0;y<cv.height;y+=sp) for(let x=0;x<cv.width;x+=sp){ t++; if(d[(y*cv.width+x)*4+3]<40) c++; }
        if(c/t>0.5){ open=true; cv.style.opacity=0; chime(); left--; if(!left) finish(); } }catch(_){ open=true; cv.style.opacity=0; left--; if(!left) finish(); } };
    p.addEventListener('pointerdown',e=>{ if(!alive(tok)) return; e.preventDefault(); down=true; last=null; try{ p.setPointerCapture(e.pointerId); }catch(_){} rub(e); });
    p.addEventListener('pointermove',e=>{ if(down&&alive(tok)) rub(e); });
    const up=()=>{ if(!down) return; down=false; last=null; check(); };
    p.addEventListener('pointerup',up); p.addEventListener('pointercancel',up);
  });
  speak(RUB_LINE);
  later(()=>{ if(!alive(tok)||finished) return; g.querySelectorAll('canvas').forEach(c=>c.style.opacity=0); finish(); },60000);   /* 1분이 지나면 남은 판도 저절로 열림 */
}

  const noise=(d,v,f)=>{ const n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), x=b.getChannelData(0); for(let i=0;i<n;i++) x[i]=Math.random()*2-1; const s=c.createBufferSource(); s.buffer=b; const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=f; const e=c.createGain(); e.gain.setValueAtTime(v,t); e.gain.exponentialRampToValueAtTime(0.0006,t+d); s.connect(fl); fl.connect(e); e.connect(g); s.start(t); s.stop(t+d); };

function rvFillCol(c){ const L=RV.L, m=RV.m, pool=RV.pool, old=RV.cols[c]; if(old) old.els.forEach(e=>e.remove());
  const used=new Set(RV.cols.filter(Boolean).flatMap(x=>x.objs.map(o=>o.a+(o.it.sc||''))));
  const right=shuffle(pool.filter(o=>rvHas(o,m))), wrong=shuffle(pool.filter(o=>!rvHas(o,m)));
  const pick=[], take=(L2,n)=>{ for(const o of L2){ if(pick.length>=n) break; if(!used.has(o.a+(o.it.sc||''))&&!pick.includes(o)) pick.push(o); } for(const o of L2){ if(pick.length>=n) break; if(!pick.includes(o)) pick.push(o); } };
  const nR=L.per>=4?2:1; take(right,nR); take(wrong,L.per); const objs=shuffle(pick.slice(0,L.per));
  const x=rvColX(c), band=RV.H-RV.waterY, s=Math.min(RV.gap*0.62,band/(objs.length)*0.82+20,120), els=[];

function exampleLog(){ /* 가상의 학생 홍길동의 한 달(이 기기 기록에 넣지 않음) */
  const rows=[], start=Date.now()-28*864e5; let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let d=0;d<28;d+=2){ const lv=d<14?1:2, b=(d/2)%BUN[lv].length, bd=BUN[lv][b], g=start+d*864e5+9*36e5;

      rows.push({s:'ex',t:g+(k*10+i)*40e3,g,lv,b:b+1,ph,a:it.a,m:it.m,res:ok?'first':'help',w:ok?'':(ph==='obj'?oo[Math.floor(rnd()*oo.length)].a:others[Math.floor(rnd()*others.length)])}); })); }

  var o = { board: 'https://www.charum.org/webapp', color: '#4E6A80', when: null };
  var css = document.createElement('style');
  css.textContent = '#chCorner{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147480001;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px;pointer-events:none}'
    + '#chCorner>*{pointer-events:auto}'
    + '#reportBtn{display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.92);border:1px solid var(--rb-c55);color:var(--rb-c);font:600 13px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}'
    + '#reportBtn:hover{background:#fff;border-color:var(--rb-c)}#reportBtn.on{display:inline-flex}'
    + '@media (max-width:600px){#reportBtn{width:40px;height:40px;padding:0;justify-content:center;font-size:18px}#reportBtn .rbTxt{display:none}}'
    + '@media print{#chCorner{display:none!important}}';
  document.head.appendChild(css);
  function corner() {
    var c = document.getElementById('chCorner');
    if (!c) { c = document.createElement('div'); c.id = 'chCorner'; document.body.appendChild(c); }
    return c;
  }
  function url() { return o.board + (/\/\d+$/.test(o.board) ? '#write' : ''); }
  function make() {
    var a = document.getElementById('reportBtn'); if (a) return a;
    a = document.createElement('a'); a.id = 'reportBtn'; a.target = '_blank'; a.rel = 'noopener'; a.title = '이 앱의 오류나 의견을 게시판 댓글로 남겨요';
    a.setAttribute('aria-label', '오류·의견 알리기'); a.innerHTML = '<span aria-hidden="true">💬</span><span class="rbTxt">오류·의견 알리기</span>';
    var c = corner(); c.insertBefore(a, c.firstChild);   /* column-reverse: 첫 자식이 맨 아래 */
    return a;
  }
  function show() {
    try { if (o.when) return !!o.when(); var c = document.body.classList; return c.contains('setup') || c.contains('admin'); } catch (e) { return false; }
  }
  function tick() {
    if (!document.body) return;
    var a = make(); a.href = url();
    a.style.setProperty('--rb-c', o.color); a.style.setProperty('--rb-c55', o.color + '55');
    a.classList.toggle('on', show());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick); else tick();
  setInterval(tick, 700);
  return {
    set: function (x) { for (var k in x) o[k] = x[k]; tick(); },
    corner: corner
  };
})();
</script>
<script id="endLesson">
/* 차름 공통 모듈: 수업 끝내기(endLesson) — 원본은 common/endLesson.js. 앱 안의 <script id="endLesson">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   전자칠판엔 Esc가 없음 → 관리 메뉴를 열면 전체 화면에서 나오고(잠깐 나가기),
   관리 메뉴에 있는 동안 왼쪽 아래 "⏻ 수업 끝내기"(두 번 눌러야)로 앱을 아예 끝냄: 소리 멈춤 → 저장 신호 → 전체 화면 나감 → 탭 닫기 → 안 닫히면 "수업을 마쳤어요".
   오류·의견 알리기(reportLink)와 같은 왼쪽 아래 묶음(#chCorner)에서 그 위에 놓여 서로 겹치지 않음.
   앱이 넘겨 줌: EndLesson.set({ board: 'https://www.charum.org/webapp/59784', when: () => 참/거짓 })
     board  "차름 게시판으로" 주소     when  관리 메뉴가 열려 있는지(없으면 body에 admin이 붙었을 때)   2026-10-22 처음, 2026-11-25 모듈로 */
window.EndLesson = (function () {
  var o = { board: 'https://www.charum.org/webapp', when: null };
  var ctxs = []; ['AudioContext', 'webkitAudioContext'].forEach(function (n) {
    var C = window[n]; if (!C || C.__endWrap) return;
    var W = function () { var c = new (Function.prototype.bind.apply(C, [null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    W.prototype = C.prototype; W.__endWrap = true; try { window[n] = W; } catch (e) {}
  });
  var css = document.createElement('style');
  css.textContent = '#endBtn{display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
    + '#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
    + '#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
    + '#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin() { try { return o.when ? !!o.when() : document.body.classList.contains('admin'); } catch (e) { return false; } }
  function exitFull() { try { if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); else if (document.webkitFullscreenElement) document.webkitExitFullscreen(); } catch (e) {} }
  function hush() { try { speechSynthesis.cancel(); } catch (e) {} document.querySelectorAll('audio,video').forEach(function (m) { try { m.pause(); } catch (e) {} }); ctxs.forEach(function (c) { try { c.suspend(); } catch (e) {} }); }
  function end() {
    hush(); try { window.dispatchEvent(new Event('pagehide')); } catch (e) {} exitFull();
    var cv = document.createElement('div'); cv.id = 'endCover';
    cv.innerHTML = '<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="' + o.board + '">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick = function () { location.reload(); };
    ['pointerdown', 'click', 'touchstart', 'keydown'].forEach(function (t) { cv.addEventListener(t, function (e) { e.stopPropagation(); });   /* 단추가 받은 뒤 막음(잡는 단계에서 막으면 "다시 시작"까지 막힘, 2026-10-26) */ });
    setTimeout(function () { try { window.close(); } catch (e) {} }, 150);
    setInterval(hush, 1000);   /* 늦게 시작한 소리도 멈춤 */
  }
  function corner() {
    if (window.ReportLink) return window.ReportLink.corner();
    var c = document.getElementById('chCorner');
    if (!c) { c = document.createElement('div'); c.id = 'chCorner'; c.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147480001;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px'; document.body.appendChild(c); }
    return c;
  }
  var was = false, sureT = 0;
  function tick() {
    if (!document.body) return;
    var b = document.getElementById('endBtn');
    if (!b) {
      b = document.createElement('button'); b.id = 'endBtn'; b.type = 'button'; b.title = '앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML = '<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (!b.classList.contains('sure')) {
          b.classList.add('sure'); b.querySelector('.t').textContent = '한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT = setTimeout(function () { b.classList.remove('sure'); b.querySelector('.t').textContent = '수업 끝내기'; }, 3000); return;
        }
        end();
      });
      ['click', 'pointerup'].forEach(function (t) { b.addEventListener(t, function (e) { e.stopPropagation(); }); });
      corner().appendChild(b);
    }
    var a = admin();
    b.classList.toggle('on', a);
    if (a && !was) exitFull();   /* 관리 메뉴를 열면 전체 화면에서 나옴(잠깐 나가기) */
    was = a;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tick); else tick();
  setInterval(tick, 400);
  return { set: function (x) { for (var k in x) o[k] = x[k]; tick(); } };
})();
</script>

<script id="printFit">
/* 차름 공통 모듈: 출력(printFit) — 원본은 common/printFit.js. 앱 안의 <script id="printFit">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   전체 화면이면 먼저 나간 뒤 인쇄(전체 화면에서 바로 인쇄하면 미리보기가 왼쪽 위에 작게 붙음),
   PrintFit.page(방향, 여백mm, 덧붙일 인쇄 CSS) 로 이번 한 번의 종이 방향을 정함(인쇄가 끝나면 원래대로) */
(function(){
  var P=window.print.bind(window);
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  window.print=function(){
    if(!fsEl()){ P(); return; }
    var done=false; function go(){ if(done) return; done=true; setTimeout(P,300); }
    document.addEventListener('fullscreenchange',go,{once:true});
    document.addEventListener('webkitfullscreenchange',go,{once:true});
    try{ var ex=document.exitFullscreen||document.webkitExitFullscreen; var r=ex&&ex.call(document); if(r&&r.catch) r.catch(go); }catch(e){ go(); }
    setTimeout(go,1200);
  };
  function st(){ var s=document.getElementById('printPage'); if(!s){ s=document.createElement('style'); s.id='printPage'; document.head.appendChild(s); } return s; }
  window.PrintFit={
    orient:function(w,h){ return w>h*1.02?'landscape':'portrait'; },
    /* 종이 안쪽 크기(mm): 이 높이에 맞춰 그림을 꽉 채움 */
    inner:function(o,m){ return o==='landscape'?{w:297-2*m,h:210-2*m}:{w:210-2*m,h:297-2*m}; },
    page:function(o,m,css){ st().textContent='@media print{@page{size:A4 '+o+';margin:'+m+'mm}'+(css||'')+'}'; }
  };
  window.addEventListener('afterprint',function(){ var s=document.getElementById('printPage'); if(s) s.textContent=''; });
})();
</script>
