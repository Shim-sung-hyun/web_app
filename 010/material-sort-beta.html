<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[차름 과학] 무엇으로 만들었을까 (베타)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 차름 과학 — 무엇으로 만들었을까 (010). 과학 영역: 보라. 얼굴: 천 짜임 무늬 바탕 · 물질 결 카드 · 분리수거함 같은 물질 상자 · 문질러 찾기 */
:root{
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sci:#6A4C9C; --sci-d:#4E3478; --sci-l:#EEE8F6; --sci-m:#C9BCE0;
  --bg:#F6F4F8; --card:#FFFFFF; --ink:#2B2838; --muted:#6B6777; --line:#E2DCEB;
  --bubble:#EAF3FC; --bubble-b:#BCD6EF; --ok:#3E8E63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.setup{overflow:auto}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== 설정 화면 ===== */
#setupView{min-height:100%;padding:28px 16px 0;background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(106,76,156,.045) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(106,76,156,.035) 0 1px,transparent 1px 7px)}
body:not(.setup) #setupView{display:none}
.wrap{max-width:900px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:var(--sci-d);line-height:1.1}
.title h1 small.kick{display:block;font-size:20px;color:var(--sci);margin:0 0 4px}
.title .mark{width:38px;height:38px;border-radius:9px;overflow:hidden;border:2px solid var(--sci-d);flex:0 0 auto}
.title .mark svg{display:block;width:100%;height:100%}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,40,100,.04);transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--sci-m)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
.num{width:30px;height:30px;border-radius:8px;background:var(--sci);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:400;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--sci);border-color:var(--sci);color:#fff}
.chip.add{border-style:dashed;color:var(--sci)}
.lv{flex:1 1 220px;text-align:left;padding:12px 14px;min-height:74px}
.lv b{display:block;font-size:17px;margin-bottom:3px}
.lv span{font-size:13.5px;opacity:.85}
.mode{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.mode .chip{min-width:110px}
.pickNote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.pickWarn{font-size:14px;color:#9A3328;margin:8px 0 0;font-weight:700}
.pickWarn:empty{display:none}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.bd{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bd.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.bd .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.bd .ord{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--sci);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:6px}
.bd .ms{display:flex;gap:6px;flex-wrap:wrap}
.bd .an{display:flex;flex-wrap:wrap;gap:2px}
.bd .an img{width:34px;height:34px;object-fit:contain}
.bd .done{font-size:12px;color:var(--ok)}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.tchip i{display:inline-block;width:16px;height:16px;border-radius:4px;background-size:cover;border:1px solid rgba(0,0,0,.15)}
.mpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.mpick button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 6px 8px;cursor:pointer;text-align:center;font-weight:700;font-size:16px}
.mpick button i{display:block;aspect-ratio:3/2;border-radius:10px;background-size:cover;margin-bottom:5px}
.mpick button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.mpick button.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.today{display:flex;flex-direction:column;gap:12px}
.today .plan h4{margin:0 0 6px;font-size:15px;color:var(--sci-d)}
.today .cols{display:flex;gap:10px;flex-wrap:wrap}
.today .col{width:128px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.today .col .lid{height:36px;background-size:cover;display:flex;align-items:center;justify-content:center}
.today .col .lid b{background:rgba(255,255,255,.92);border-radius:8px;padding:1px 10px;font-family:var(--f-display);font-weight:400;font-size:17px}
.today .col .ans{display:flex;flex-wrap:wrap;justify-content:center;padding:4px}
.today .col .ans img{width:38px;height:38px;object-fit:contain}
.steps{font-size:14px;color:var(--muted);line-height:1.7}
.resume{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #EBD9A6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 4px}
details.more .card{margin-top:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.opt>span{min-width:120px;color:var(--muted)}
.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:10px}
.startBar{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(to top,var(--bg) 70%,rgba(246,244,248,0));display:flex;justify-content:center;gap:12px;z-index:5}
#startBtn{min-width:260px;height:62px;border-radius:18px;border:0;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(78,52,120,.25)}
#rosterBox{--rs-line:var(--line)}
#rosterBox input{height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit}

/* ===== 학생 화면 ===== */
#game{position:fixed;inset:0;background:#FBFAF8;display:none;user-select:none;-webkit-user-select:none}
body:not(.setup) #game{display:block}
body.admin #stage{pointer-events:none}
#prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#prog i{display:block;width:44px;height:8px;border-radius:4px;background:#E6E1EC}
#prog i.d{background:#C9BCE0}#prog i.n{background:var(--sci)}
#prog.bar{width:min(520px,70vw);height:8px;border-radius:4px;background:#E6E1EC;overflow:hidden;gap:0}
#prog.bar b{display:block;height:100%;background:linear-gradient(90deg,#C9BCE0 0 calc(100% - 10px),var(--sci) 0);border-radius:4px;transition:width .4s}
#stage{position:absolute;inset:36px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:20px 16px 8px}
.recDot{position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:#D24B3E;opacity:.75;z-index:4}

.bubble{position:relative;background:var(--bubble);border:2px solid var(--bubble-b);border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:16px solid var(--bubble-b);border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--bubble);border-bottom:0;z-index:1}
.bubble img.o{display:block;object-fit:contain}
.bubble .word{font-family:var(--f-display);color:var(--ink);padding:4px 34px;line-height:1.1}
.opts{display:flex;justify-content:center;align-items:flex-start}
/* 보기 카드: 모두 같은 크기·같은 테두리(크기·자리가 답을 알려 주지 않게) */
.oc,.mc{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:8px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s}
.oc img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mc{display:flex;flex-direction:column;align-items:center}
.mc .tex2{position:absolute;inset:0;border-radius:13px;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease}.mc .tex2.on{opacity:1}
.mc .tex{position:relative;width:100%;aspect-ratio:1/1;border-radius:13px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mc .lab{font-family:var(--f-display);font-size:clamp(22px,3vw,36px);line-height:1.15;margin-top:6px;color:var(--ink)}
.fadeIn{opacity:0}
.glow{border-color:#E8B84A!important;box-shadow:0 0 0 6px rgba(232,184,74,.35)}
.right{border-color:var(--ok)!important}
.cap{font-size:clamp(14px,1.6vw,18px);color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:.08em}
.pair{display:flex;align-items:center;justify-content:center}
.pair .link{flex:0 0 auto;height:4px;border-radius:2px;background:var(--sci-m);transform-origin:left center;transform:scaleX(0);transition:transform .7s ease}
.pair .link.on{transform:scaleX(1)}
.nameTag{font-family:var(--f-display);font-size:clamp(24px,3.4vw,42px);color:var(--ink);text-align:center;margin-top:8px}
.slideIn{opacity:0;transform:translateX(24px);transition:opacity .7s ease,transform .7s ease}
.slideIn.on{opacity:1;transform:none}

/* 사진(일반화): 그 물건만 밝게 */
.phWrap{position:relative;overflow:hidden;border-radius:16px;background:#ddd}
.phWrap img{position:absolute;inset:0;width:100%;height:100%;display:block}
.phWrap .hole{position:absolute;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 3000px rgba(20,16,30,.48);transition:box-shadow 1s}
.phWrap.lit .hole{box-shadow:0 0 0 3000px rgba(20,16,30,0)}

/* 물질 상자(정리하기): 분리수거함처럼 위에 결 무늬 뚜껑과 투입구 */
.bins{display:flex;justify-content:center;align-items:flex-end}
.bin{position:relative;cursor:pointer;touch-action:none;border-radius:16px 16px 20px 20px;background:#fff;border:3px solid #D8D3CC;overflow:hidden;transition:border-color .5s,box-shadow .5s;display:flex;flex-direction:column}
.bin .lid{position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;border-bottom:3px solid rgba(0,0,0,.12)}
.bin .lid.pc{background-color:#E9E8E5;background-size:auto 96%;background-repeat:no-repeat;background-position:6% center;justify-content:flex-end;padding-right:9%}
.bin .lid b{font-family:var(--f-display);font-weight:400;background:rgba(255,255,255,.93);border-radius:12px;padding:2px 16px;color:var(--ink);line-height:1.2}
.bin .slot{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:46%;height:9%;min-height:6px;border-radius:99px;background:rgba(30,24,40,.55);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.bin .body{flex:1;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;padding:6px;background:linear-gradient(#FBFAF8,#F1EEF4)}
.bin .body img{object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.bin .body img.new{animation:drop .7s ease-out}
@keyframes drop{from{transform:translateY(-60%) scale(1.3);opacity:0}to{transform:none;opacity:1}}
.tray{display:flex;justify-content:center;align-items:center}
/* 사진 수업 */
.scene{position:relative;border-radius:16px;overflow:hidden;background:#EEE;flex:0 0 auto;box-shadow:0 2px 10px rgba(40,30,60,.12);touch-action:none}
.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.scene .spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(24,18,34,.58);outline:3px solid rgba(255,255,255,.9);transition:all .6s ease;pointer-events:none;z-index:5}
.scene .fr{position:absolute;border:3px dashed rgba(255,255,255,.95);border-radius:12px;box-shadow:0 0 0 2px rgba(0,0,0,.28),inset 0 0 0 2px rgba(0,0,0,.18);cursor:pointer;transition:opacity .6s,border-color .4s,box-shadow .4s}
.scene .fr.ghost{border-color:transparent;box-shadow:none}
.scene .fr.soft{border:2px dashed rgba(255,255,255,.7);box-shadow:none}
.scene .fr.glow{border:4px solid #E8B84A!important;box-shadow:0 0 0 3px rgba(0,0,0,.2),0 0 22px rgba(232,184,74,.9)}
.scene .fr.right{border:4px solid var(--ok)!important;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.crop{display:block;border-radius:10px;pointer-events:none}
.oc .crop{margin:auto}
.bin .body .crop{border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bin .body .crop.new{animation:drop .7s ease-out}
.drag img,.drag .crop{width:100%;height:100%;object-fit:contain}
.pkPh{width:100%;height:100%;object-fit:cover;border-radius:12px;pointer-events:none}
.wig{animation:wig .45s ease}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.03)}60%{transform:rotate(3deg)}}
.badge{position:absolute;left:50%;bottom:6px;transform:translate(-50%,6px);background:rgba(255,255,255,.95);border-radius:10px;padding:1px 12px;font-family:var(--f-display);font-size:clamp(16px,2vw,24px);color:var(--ink);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.badge.on{opacity:1;transform:translate(-50%,0)}
.fac{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;width:100%;height:100%}
.facTop{display:flex;align-items:center;justify-content:center;gap:24px}
.mach svg{width:100%;height:100%;overflow:visible}
.mach.run svg{animation:shake .19s linear infinite}
.mach .gear{transform-origin:84px 114px}
.mach.run .gear{animation:spin .9s linear infinite}
.mach.run .lamp{animation:blink .38s steps(2) infinite}.mach.run .lamp.b{animation-delay:.19s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}
.shelf{display:flex;flex-wrap:wrap;gap:10px;align-content:center;justify-content:center;min-height:120px}
.made{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:16px;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
.made img{object-fit:contain}
.mtag{position:absolute;left:6px;top:4px;font-size:13px;background:var(--sci-l);color:var(--sci-d);border-radius:8px;padding:0 7px}
@keyframes pop{from{transform:translateX(-50px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.facMats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.mc.fly{position:fixed;z-index:80;margin:0;pointer-events:none;transition:transform .6s ease-in,opacity .6s ease-in}
.miniMach{display:inline-block;width:clamp(80px,11vw,140px);aspect-ratio:230/200}
.miniMach svg{width:100%;height:100%}
.gPics .an.crop{width:clamp(64px,9vw,120px)!important;height:clamp(64px,9vw,120px)!important;border:3px solid #fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.12);background-size:cover}
.matCol{display:flex;gap:14px;align-items:center;justify-content:center}
.hidTag{position:absolute;right:8px;top:8px;background:rgba(40,30,60,.75);color:#fff;font-size:13px;border-radius:8px;padding:1px 8px}
.mc{position:relative}
.slots{display:flex;gap:10px;justify-content:center;margin:10px 0 12px}
.slots i{width:34px;height:34px;border-radius:50%;border:3px dashed #BDB4CC;background-size:cover;background-position:center;transition:all .4s}
.slots i.on{border:3px solid var(--ok);transform:scale(1.08)}
.inRow{display:flex;gap:26px;align-items:center;justify-content:center}
.inPan{background:#fff;border:3px solid #D8D3CC;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;transform:scaleX(0);transform-origin:left center;transition:transform .8s cubic-bezier(.3,1.2,.5,1)}
.inPan.open{transform:none}
.inPan img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.inCap{font-family:var(--f-display);font-size:48px;color:var(--sci-m)}
.inGo{margin-top:16px}
.vKeys{flex-basis:100%;font-size:13px;color:#5F5A6B;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.vKeys p{margin:0;line-height:1.6}
.vk{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.vk span{width:4.5em;font-weight:700;color:var(--ink)}.vk em{font-style:normal;color:var(--ok);font-weight:700}
.vk input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #CFC8D8;border-radius:8px;min-width:170px}
.vPrep{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;width:100%}
.vpT{font-family:var(--f-display);font-size:clamp(26px,3.6vw,40px);color:var(--sci-d)}
.vpBar{width:min(420px,80%);height:12px;border-radius:99px;background:var(--sci-l);overflow:hidden}.vpBar b{display:block;height:100%;width:0;background:var(--sci);transition:width .4s}
.vpN{font-size:14px;color:#6F6A78;font-variant-numeric:tabular-nums}
/* 선생님 화면에서는 그림 이름을 정확히(컵 넷: 종이컵·유리컵·도자기컵·쇠컵 — 학생 화면과 말은 '컵') */
.tIt{display:inline-flex;flex-direction:column;align-items:center;gap:1px}.tIt small{font-size:11px;color:#6F6A78;line-height:1.1}
.cupN{font-size:12px;color:#6F6A78;margin-top:2px}
/* 설정 — 사진 */
.subh{font-weight:700;font-size:15px;color:var(--sci-d);margin:14px 0 6px}.card h2+.subh{margin-top:4px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 .chip.lv{width:100%;margin:0;min-width:0}
@media (max-width:760px),(max-aspect-ratio:1/1){ .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} }   /* 세로로 긴 화면은 한 줄에 둘씩 */
.phPlan{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.phPlan>img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line,#ddd)}
.phPlan>div{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:180px}
.phIt{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #E2DDE8;border-radius:10px;padding:3px 10px 3px 3px;font-size:14px}
.phIt .crop,.phIt img{width:46px;height:46px;border-radius:7px;object-fit:contain}
.scPick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.scPick>button,.rcWrap>button{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;border:2px solid #E2DDE8;border-radius:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
.scPick button.on{border-color:var(--sci);background:var(--sci-l)}
.scPick button img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.scPick button b{font-size:14px}
.scPick button .ms{font-size:12px;color:#6F6A78;line-height:1.35}
.scPick button .ms em{font-style:normal;color:#8A5A12}

/* 차름 공통 모듈: 관리 버튼 모양(adminButton) — 원본은 common/adminButton.js. 앱 안의 <script id="adminButton">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   오른쪽 아래 파란 물방울 버튼(닫혀 있으면 "charum", 관리 메뉴가 열리면 검은 바탕에 "심"), 누르는 동안 도는 고리까지 모양을 한곳에(2026-11-25 선생님 —
   007만 옛 모양이라 글자가 넘치던 것 때문). 다른 모듈과 달리 이것은 모양까지 맡는다(모든 앱이 똑같은 버튼이어야 해서).
   누르는 동작은 adminHold 모듈: 3초 누르기 앱은 AdminButton.hold({...}), 한 번 누르는 앱(004·005·006)은 AdminButton.tap(fn).

   AdminButton.put({ z, open, hide })   — 버튼을 놓을 자리(body 안)에서 부름. 버튼(#adminBtn)을 돌려줌.
     z     z-index(없으면 50)
     open  관리 메뉴가 열려 있는지 () => 참/거짓 (없으면 body에 admin이 붙었을 때) — 열리면 검은 바탕·"심"
     hide  버튼을 숨길 때 () => 참/거짓 (없으면 body에 setup이 붙었을 때 — 처음 설정 화면에는 필요 없음)
   AdminButton.hold({isOpen, canOpen, open, close, ms, holding, bubble})  = AdminHold.bind(버튼, …)
   AdminButton.tap(fn)   한 번 누르면 fn(e) — 눌리는 자리는 AdminHold.pad로 화면 구석까지
   AdminButton.sync()    열림·숨김을 바로 다시 봄(앱이 메뉴를 열고 닫은 바로 뒤에 부르면 0.25초 기다리지 않음) */
window.AdminButton = (function () {
  'use strict';
  var o = { z: 50, open: null, hide: null }, btn = null;
  var CSS = '#adminBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:43px;height:43px;border-radius:50%;'
    + 'z-index:var(--ab-z,50);touch-action:none;--p:0;padding:0;margin:0;opacity:.4;transition:opacity .3s;cursor:pointer;display:flex;align-items:center;justify-content:center;'
    + '-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;'
    + 'border:1px solid rgba(14,92,170,.55);'
    + 'background:radial-gradient(ellipse 70% 45% at 50% 88%,rgba(170,245,255,.95),rgba(170,245,255,0) 70%),radial-gradient(circle at 50% 40%,#4FC4F5 0%,#1E8BE0 55%,#0D5FB8 100%);'
    + 'box-shadow:inset 0 -4px 10px rgba(150,240,255,.55),inset 0 3px 6px rgba(0,40,100,.45),0 4px 10px rgba(0,60,130,.35),0 1px 2px rgba(0,30,70,.4)}'
    + '#adminBtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;'
    + 'background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(255,255,255,.35) 60%,rgba(255,255,255,.05));pointer-events:none}'
    + '#adminBtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(#22AFBC calc(var(--p)*360deg),transparent 0);'
    + '-webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);opacity:.9;pointer-events:none}'
    + '#adminBtn .ab-label{position:relative;display:block;text-align:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:700;font-size:8.5px;'
    + 'letter-spacing:.02em;line-height:1;color:#fff;text-shadow:0 1px 1.5px rgba(0,50,110,.65);pointer-events:none;white-space:nowrap}'
    + '#adminBtn.ab-on{opacity:.6;border-color:rgba(10,20,26,.8);'
    + 'background:radial-gradient(ellipse 70% 45% at 50% 88%,rgba(110,230,240,.85),rgba(110,230,240,0) 70%),radial-gradient(circle at 50% 40%,#3D4F5A 0%,#17242C 60%,#05090C 100%);'
    + 'box-shadow:inset 0 -4px 10px rgba(90,220,235,.45),inset 0 3px 6px rgba(0,0,0,.6),0 4px 10px rgba(0,0,0,.4),0 0 0 3px rgba(63,207,210,.35)}'
    + '#adminBtn.ab-on .ab-label{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:17px;letter-spacing:0;color:#9FF3F5;text-shadow:0 0 6px rgba(63,207,210,.7),0 1px 1px rgba(0,0,0,.6)}'
    + '#adminBtn.ab-hide{display:none}'
    + '@media print{#adminBtn{display:none!important}}';
  function isOpen() { try { return o.open ? !!o.open() : document.body.classList.contains('admin'); } catch (e) { return false; } }
  function isHidden() { try { return o.hide ? !!o.hide() : document.body.classList.contains('setup'); } catch (e) { return false; } }
  function sync() {
    if (!btn) return;
    var on = isOpen();
    btn.classList.toggle('ab-on', on);
    btn.classList.toggle('ab-hide', isHidden());
    var t = on ? '심' : 'charum', l = btn.querySelector('.ab-label');
    if (l && l.textContent !== t) l.textContent = t;
  }
  function put(x) {
    for (var k in (x || {})) o[k] = x[k];
    if (!document.getElementById('abStyle')) {
      var st = document.createElement('style'); st.id = 'abStyle'; st.textContent = CSS; document.head.appendChild(st);
    }
    btn = document.getElementById('adminBtn');
    if (!btn) {
      btn = document.createElement('button'); btn.id = 'adminBtn'; btn.type = 'button';
      btn.setAttribute('aria-label', '교사 모드: 3초 동안 누르기');
      btn.innerHTML = '<span class="ab-label" id="abLabel">charum</span>';
      var s = document.currentScript;
      if (s && s.parentNode && s.parentNode !== document.head) s.parentNode.insertBefore(btn, s); else document.body.appendChild(btn);
    }
    btn.style.setProperty('--ab-z', o.z);
    sync(); setInterval(sync, 250);
    return btn;
  }
  function hold(h) {
    var x = {}; for (var k in h) x[k] = h[k];
    var oo = x.open, oc = x.close;
    x.open = function () { var r = oo && oo.apply(this, arguments); sync(); return r; };
    x.close = function () { var r = oc && oc.apply(this, arguments); sync(); return r; };
    window.AdminHold.bind(btn, x);
  }
  function tap(fn) {
    btn.setAttribute('aria-label', '관리');
    window.AdminHold.pad(btn);
    btn.addEventListener('click', function (e) { fn(e); sync(); });
  }
  return { put: put, hold: hold, tap: tap, sync: sync, el: function () { return btn; } };
})();
</script><script>AdminButton.put({z:85});</script>

<script id="roster">
/* 차름 공통 모듈: 학생 명단(roster) — 원본은 common/roster.js. 앱 안의 <script id="roster">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   명단은 같은 기기의 모든 차름 앱이 함께 쓴다(webapp.students). 뺀 학생은 webapp.students.out에 뺀 날과 함께 옮긴다.
   뺀 학생의 기록은 KEEP_DAYS(6개월) 동안 남겨 두고, 그동안 같은 이름으로 다시 넣으면 같은 학생으로 되살아나 기록이 이어진다.
   6개월이 지나면 앱마다 Roster.purge(기록)로 그 학생의 줄을 지운다. 빼낸 표시는 다른 앱도 지울 수 있게 3년 동안 남긴다.

   쓰는 법(앱):
     Roster.list()            지금 명단 [{id,name}]
     Roster.nameOf(id)        이름(뺀 학생도)
     Roster.has(id)           지금 명단에 있는지
     Roster.add(이름)         넣은(또는 되살린) 학생을 돌려줌
     Roster.remove(id)        명단에서 뺌(기록은 앱이 6개월 보관)
     Roster.kept()            기록을 보관 중인 뺀 학생 [{id,name,at,until}]
     Roster.purge(log, row=>row.s)   보관 기간이 지난 학생의 줄을 뺀 새 배열
     Roster.mount(칸, {btn, on, input, onChange})   넣기·빼기 화면을 칸 안에 그림
       btn·on·input: 그 앱의 단추·눌림·입력 칸 class(얼굴은 앱마다). onChange({type:'add'|'remove'|'restore', id})
*/
(function () {
  'use strict';
  var KEY = 'webapp.students', OUT = 'webapp.students.out', DAY = 864e5, KEEP_DAYS = 183, MARK_DAYS = 1100;
  function get(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return Array.isArray(v) ? v : d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function clean(n) { return String(n || '').trim().replace(/\s+/g, ' ').slice(0, 20); }
  function newId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function list() { return get(KEY, []).filter(function (s) { return s && s.id && s.name; }); }
  function outs() {
    var now = Date.now(), all = get(OUT, []), live = all.filter(function (o) { return o && o.id && now - (o.at || 0) < MARK_DAYS * DAY; });
    if (live.length !== all.length) put(OUT, live);
    return live;
  }
  function kept() {
    var now = Date.now(), ids = {};
    list().forEach(function (s) { ids[s.id] = 1; });
    return outs().filter(function (o) { return !ids[o.id] && now - o.at < KEEP_DAYS * DAY; })
      .map(function (o) { return { id: o.id, name: o.name, at: o.at, until: o.at + KEEP_DAYS * DAY }; });
  }
  function nameOf(id) {
    var s = list().filter(function (x) { return x.id === id; })[0] || outs().filter(function (x) { return x.id === id; })[0];
    return s ? s.name : '';
  }
  function has(id) { return list().some(function (s) { return s.id === id; }); }
  function add(name) {
    var n = clean(name); if (!n) return null;
    var L = list(), same = L.filter(function (s) { return s.name === n; })[0];
    if (same) return same;
    var back = kept().filter(function (o) { return o.name === n; }).sort(function (a, b) { return b.at - a.at; })[0];
    var st = back ? { id: back.id, name: n } : { id: newId(), name: n };
    L.push(st); put(KEY, L);
    if (back) put(OUT, outs().filter(function (o) { return o.id !== back.id; }));
    return st;
  }
  function remove(id) {
    var L = list(), st = L.filter(function (s) { return s.id === id; })[0]; if (!st) return;
    put(KEY, L.filter(function (s) { return s.id !== id; }));
    put(OUT, outs().filter(function (o) { return o.id !== id; }).concat([{ id: st.id, name: st.name, at: Date.now() }]));
  }
  function purge(log, idOf) {
    if (!Array.isArray(log)) return log;
    var now = Date.now(), gone = {};
    outs().forEach(function (o) { if (now - o.at >= KEEP_DAYS * DAY) gone[o.id] = 1; });
    list().forEach(function (s) { delete gone[s.id]; });
    return log.filter(function (r) { return !gone[idOf ? idOf(r) : r.s]; });
  }
  function md(t) { var d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }

  /* 기본 꼴: 자리·간격만. 색·글꼴·둥글기는 앱의 단추 class와 CSS 변수(--rs-line, --rs-soft)로 앱마다 */
  var CSS = ':where(.rs){display:grid;gap:10px;margin-top:10px}'
    + ':where(.rs-add){display:flex;gap:8px;flex-wrap:wrap}'
    + ':where(.rs-add input){flex:1;min-width:140px;max-width:260px}'
    + ':where(.rs-names){display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none}'
    + ':where(.rs-names li){display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;border:1.5px solid var(--rs-line,#d6d2cb);border-radius:999px;min-height:40px}'
    + ':where(.rs-x){border:0;background:none;font:inherit;font-size:20px;line-height:1;width:40px;height:40px;border-radius:50%;cursor:pointer;color:inherit;opacity:.55}'
    + ':where(.rs-x:hover,.rs-x:focus-visible){opacity:1;background:var(--rs-soft,rgba(0,0,0,.06))}'
    + ':where(.rs-none,.rs-out){font-size:14px;opacity:.8;margin:0}'
    + ':where(.rs-out summary){cursor:pointer}'
    + ':where(.rs-out ul){margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}'
    + ':where(.rs-out li){display:flex;align-items:center;gap:10px;flex-wrap:wrap}';
  function style() {
    if (document.getElementById('rsStyle')) return;
    var s = document.createElement('style'); s.id = 'rsStyle'; s.textContent = CSS;
    (document.head || document.documentElement).insertBefore(s, (document.head || document.documentElement).firstChild);
  }

  function mount(box, opt) {
    opt = opt || {}; style();
    var btn = opt.btn || '', on = opt.on || '', inp = opt.input || '', tell = opt.onChange || function () {};
    function draw() {
      var L = list(), K = kept(), h = '<div class="rs">';
      h += '<div class="rs-add"><input class="' + inp + '" maxlength="20" placeholder="학생 이름" aria-label="넣을 학생 이름" autocomplete="off">'
        + '<button type="button" class="' + btn + ' ' + on + '" data-rs="add">넣기</button></div>';
      h += L.length ? '<ul class="rs-names">' + L.map(function (s) {
        return '<li><span>' + esc(s.name) + '</span><button type="button" class="rs-x" data-rs="del" data-id="' + esc(s.id) + '" aria-label="' + esc(s.name) + ' 빼기">×</button></li>';
      }).join('') + '</ul>' : '<p class="rs-none">아직 넣은 학생이 없어요.</p>';
      if (K.length) h += '<details class="rs-out"><summary>뺀 학생 ' + K.length + '명 — 기록은 보관 중</summary><ul>' + K.map(function (o) {
        return '<li><span>' + esc(o.name) + ' · ' + md(o.until) + '까지 보관</span><button type="button" class="' + btn + '" data-rs="back" data-id="' + esc(o.id) + '">다시 넣기</button></li>';
      }).join('') + '</ul></details>';
      box.innerHTML = h + '</div>';
      var input = box.querySelector('input');
      function doAdd() { var st = add(input.value); if (!st) { input.focus(); return; } draw(); tell({ type: 'add', id: st.id }); }
      box.querySelector('[data-rs=add]').onclick = doAdd;
      input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } };
      Array.prototype.forEach.call(box.querySelectorAll('[data-rs=del]'), function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-id'), n = nameOf(id);
          if (!confirm(n + ' 학생을 명단에서 뺄까요?\n\n이 기기의 다른 차름 앱 명단에서도 함께 빠져요.\n기록은 6개월 동안 남아 있다가, 그동안 다시 넣지 않으면 지워져요.')) return;
          remove(id); draw(); tell({ type: 'remove', id: id });
        };
      });
      Array.prototype.forEach.call(box.querySelectorAll('[data-rs=back]'), function (b) {
        b.onclick = function () { var st = add(nameOf(b.getAttribute('data-id'))); draw(); if (st) tell({ type: 'restore', id: st.id }); };
      });
    }
    draw();
    return { refresh: draw, focus: function () { var i = box.querySelector('input'); if (i) i.focus(); } };
  }

  window.Roster = { list: list, nameOf: nameOf, has: has, add: add, remove: remove, kept: kept, purge: purge, mount: mount, KEEP_DAYS: KEEP_DAYS };
})();
</script>
<script id="voiceKit">
/* 차름 공통 모듈: 말하기 부품(voiceKit) — 원본은 common/voiceKit.js. 앱 안의 <script id="voiceKit">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   앱마다 똑같이 복사해 쓰던 말하기의 밑바탕을 한곳에(2026-11-25). 무엇을 언제 말할지·소리 고르기·끊긴 말 다시 하기는 앱마다(말하는 차례가 앱마다 달라서).
   VoiceKit.sha16(글)       미리 만든 목소리 파일 이름(문장 조각 SHA-1 앞 16자리 — media/voice/<묶음>/<이름>.mp3). https가 아니어도 됨(sha1Bytes로 셈)
   VoiceKit.splitSay(글)    문장 조각으로 나눔(. ! ? , 뒤에서)
   VoiceKit.pickKoVoice()   기기 한국어 목소리 가운데 가장 나은 것(프리미엄·향상·Google·유나 순)
   VoiceKit.fsAsk()         전체 화면을 청할 때 부름(청하기가 실패하면 fsAsk(0)) — 말 끊김 막기(2026-10-25, 003에서 옮김): 전체 화면으로 바뀌는 동안(기기에 따라 소리가 끊기거나 잠깐 "안 보임")은
   VoiceKit.fsBusy()        말을 시작하지 않음(청한 뒤 1.5초 안에 아직 안 바뀜, 또는 바뀐 지 0.6초 안이면 true)
   VoiceKit.afterFull(fn)   바뀜이 끝나면(늦어도 2초) fn */
window.VoiceKit = (function () {
  'use strict';
function sha1Bytes(msg){
  const l=msg.length, w=[], H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  const m=new Uint8Array(((l+9+63)>>6)<<6); m.set(msg); m[l]=0x80; const bl=l*8; const dv=new DataView(m.buffer); dv.setUint32(m.length-4,bl>>>0); dv.setUint32(m.length-8,Math.floor(bl/4294967296));
  for(let i=0;i<m.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<80;t++){ const x=w[t-3]^w[t-8]^w[t-14]^w[t-16]; w[t]=(x<<1)|(x>>>31); }
    let [a,b,c,d,e]=H;
    for(let t=0;t<80;t++){ const f=t<20?(b&c)|(~b&d):t<40?b^c^d:t<60?(b&c)|(b&d)|(c&d):b^c^d, k=t<20?0x5A827999:t<40?0x6ED9EBA1:t<60?0x8F1BBCDC:0xCA62C1D6;
      const tmp=(((a<<5)|(a>>>27))+f+e+k+w[t])>>>0; e=d; d=c; c=(b<<30)|(b>>>2); b=a; a=tmp; }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0;
  }
  const out=new Uint8Array(20); const ov=new DataView(out.buffer); H.forEach((h,i)=>ov.setUint32(i*4,h)); return out;
}
async function sha16(t){ const u=new TextEncoder().encode(t); const d=window.crypto&&crypto.subtle?new Uint8Array(await crypto.subtle.digest('SHA-1',u)):sha1Bytes(u); return [...d].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16); }
function splitSay(t){ return String(t||'').split(/(?<=[.!?,])\s+/).map(x=>x.trim()).filter(Boolean); }
function pickKoVoice(){ const vs=('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ko')):[];
  if(!vs.length) return null;
  const score=v=>(/premium|프리미엄/i.test(v.name)?4:0)+(/enhanced|향상/i.test(v.name)?3:0)+(/google/i.test(v.name)?2:0)+(/yuna|유나/i.test(v.name)?1:0)+(v.localService?0.5:0);
  return vs.sort((a,b)=>score(b)-score(a))[0]; }
  var fsAskAt = 0, fsChangeAt = 0;
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) { document.addEventListener(ev, function () { fsChangeAt = performance.now(); }); });
  function fsAsk(t) { fsAskAt = t == null ? performance.now() : t; }   /* 청하기가 실패하면 fsAsk(0) */
  function fsBusy() { var now = performance.now(); return (fsAskAt > fsChangeAt && now - fsAskAt < 1500) || (fsChangeAt > 0 && now - fsChangeAt < 600); }
  function afterFull(fn) { var t0 = performance.now(); var chk = function () { if (performance.now() - t0 > 2000 || !fsBusy()) fn(); else setTimeout(chk, 100); }; chk(); }
  return { sha1Bytes: sha1Bytes, sha16: sha16, splitSay: splitSay, pickKoVoice: pickKoVoice, fsAsk: fsAsk, fsBusy: fsBusy, afterFull: afterFull };
})();
</script>
<script id="progBar">
/* 차름 공통 모듈: 진행 표시(progBar) — 원본은 common/progBar.js. 앱 안의 <script id="progBar">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   지침 3절: 학생 화면 맨 위 가운데, 숫자 없이 칸 막대(10칸 넘으면 이어진 막대). 칸·막대를 짜는 일만 여기서, 색·크기·자리는 앱 CSS 그대로(2026-11-25).
   ProgBar.draw(넣을 곳, 모두, 한 것, 고를 것)
     모두 ≤ max(10)이면 칸: <i class="d">(한 것) <i class="n">(지금) <i>(남은 것)
     넘으면 이어진 막대: <b style="width:…%">  — 같은 막대를 다시 그리면 너비만 바꿈(부드럽게 늘어나게)
   고를 것: tag 칸 태그('i')  done 한 칸 class('d')  now 지금 칸 class('n')  wrap 칸을 감쌀 span class('')
            max 칸으로 그릴 최대(10, Infinity면 늘 칸)  bar 막대 틀(HTML, 안쪽 너비 줄 자리에 %W — 없으면 '<b style="width:%W%"></b>')
            pct 막대 너비(없으면 (한 것+next)/모두)  next 지금 칸까지 채움(true/false)  min 막대 최소 너비%(0)
            cellsClass / barClass  칸·막대일 때 넣을 곳에 붙일 class(주지 않으면 그대로) */
window.ProgBar = (function () {
  'use strict';
  function draw(el, n, k, o) {
    o = o || {};
    if (!el) return;
    var max = o.max == null ? 10 : o.max;
    if (n <= max) {
      var tag = o.tag || 'i', dn = o.done == null ? 'd' : o.done, nw = o.now == null ? 'n' : o.now, h = '';
      for (var i = 0; i < n; i++) h += '<' + tag + (i < k ? ' class="' + dn + '"' : i === k ? ' class="' + nw + '"' : '') + '></' + tag + '>';
      el.innerHTML = o.wrap ? '<span class="' + o.wrap + '">' + h + '</span>' : h;
      if (o.cellsClass != null) el.className = o.cellsClass;
      el.removeAttribute('data-pg');
      return 'cells';
    }
    var p = o.pct != null ? o.pct : (k + (o.next ? 1 : 0)) / Math.max(1, n) * 100;
    p = Math.max(o.min || 0, Math.min(100, Math.round(p)));
    var tpl = o.bar || '<b style="width:%W%"></b>';
    if (o.barClass != null) el.className = o.barClass;
    if (el.getAttribute('data-pg') === tpl) {
      var w = el.querySelector('[style*="width"]');
      if (w) { w.style.width = p + '%'; return 'bar'; }
    }
    el.innerHTML = tpl.replace('%W', p);
    el.setAttribute('data-pg', tpl);
    return 'bar';
  }
  return { draw: draw };
})();
</script>
<script id="recordKit">
/* 차름 공통 모듈: 기록 저장·CSV(recordKit) — 원본은 common/recordKit.js. 앱 안의 <script id="recordKit">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   기록은 기기에만(localStorage). 무엇을 한 줄에 적을지·요약 꼴은 앱마다, 저장하고 CSV로 내보내고 불러오는 손놀림만 여기서 한곳에(2026-11-25).
   RecordKit.ls.get(이름) / .set(이름, 글 또는 null=지움)   localStorage를 막아 둔 기기에서도 멈추지 않음(없으면 null)
   RecordKit.json(이름, 없을 때 값) / RecordKit.save(이름, 값)   JSON으로 읽고 쓰기
   RecordKit.csv(머리 칸 배열, 줄 배열)   엑셀에서 바로 열리는 CSV 글(한글 깨짐 막는 BOM, 줄 끝 \r\n, 쉼표·따옴표·줄바꿈이 든 칸만 따옴표)
   RecordKit.download(파일 이름, 글)     CSV 파일로 내려받기
   RecordKit.parse(글)                    CSV 글 → 줄 배열(맨 앞 BOM은 뗌, 칸이 하나뿐인 빈 줄은 뺌) */
window.RecordKit = (function () {
  'use strict';
  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  function json(k, d) { try { var v = JSON.parse(ls.get(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { ls.set(k, v == null ? null : JSON.stringify(v)); }
  function cell(v) { v = String(v == null ? '' : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csv(head, rows) { return '﻿' + [head].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n'); }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function parse(t) {
    t = String(t || '').replace(/^﻿/, '');
    var rows = [], r = [], c = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { r.push(c); c = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); rows.push(r); r = []; c = ''; }
      else c += ch;
    }
    if (c || r.length) { r.push(c); rows.push(r); }
    return rows.filter(function (x) { return x.length > 1 || (x[0] || '').trim() !== ''; });
  }
  return { ls: ls, json: json, save: save, cell: cell, csv: csv, download: download, parse: parse };
})();
</script>
<script id="spot">
/* 차름 공통 모듈: 멈춘 곳(spot) — 원본은 common/spot.js. 앱 안의 <script id="spot">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   학생마다(학생을 고르지 않으면 '_') 하던 자리를 기기에 저장해, 창을 닫아도 그 학생을 고르면 "멈춘 곳: … [이어 하기] [멈춘 곳 지우기]".
   무엇을 저장할지(묶음·단계·차례)는 앱이 정함. 저장 칸 이름은 앱마다 그대로(옮겨도 예전 멈춘 곳이 이어짐) — 2026-11-25 모듈로.
   const SP = Spot.open('animalHome.resume')   localStorage 칸 이름
     SP.all          학생 → 저장한 것(객체, 앱이 바로 고쳐도 됨)      SP.save()     SP.all을 기기에 씀
     SP.get(누구)    SP.set(누구, 저장할 것)    SP.del(누구)          SP.load()     기기에서 다시 읽음(다른 창에서 바뀌었을 때)
   Spot.bar(넣을 곳, '멈춘 곳 뒤에 붙일 글(HTML)', 이어 하기 할 일, 지우기 할 일)
     → <div class="resume">멈춘 곳: … <button class="chip sm on" id="rsGo">이어 하기</button><button class="chip sm" id="rsDel">멈춘 곳 지우기</button></div>
       모양(.resume·.chip)은 앱 CSS 그대로 */
window.Spot = (function () {
  'use strict';
  function read(k) { try { var v = JSON.parse(localStorage.getItem(k) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } }
  function open(key) {
    var sp = {
      all: read(key),
      load: function () { sp.all = read(key); return sp.all; },
      save: function () { try { localStorage.setItem(key, JSON.stringify(sp.all)); } catch (e) {} },
      get: function (who) { return sp.all[who || '_'] || null; },
      set: function (who, o) { sp.all[who || '_'] = o; sp.save(); },
      del: function (who) { delete sp.all[who || '_']; sp.save(); }
    };
    return sp;
  }
  function bar(el, html, go, del) {
    el.innerHTML = '<div class="resume">멈춘 곳: ' + html + ' <button class="chip sm on" id="rsGo" type="button">이어 하기</button><button class="chip sm" id="rsDel" type="button">멈춘 곳 지우기</button></div>';
    el.querySelector('#rsGo').onclick = go;
    el.querySelector('#rsDel').onclick = del;
  }
  return { open: open, bar: bar };
})();
</script>
<script id="aiKey">

    azure: { name: 'Azure 음성', guide: 'azure_guide', f: [{ n: 'key', k: 'webapp.azureKey', ph: 'Azure 음성 키 붙여넣기', secret: true }, { n: 'region', k: 'webapp.azureRegion', ph: '지역 (예: koreacentral)', test: /^[a-z0-9]+$/ }] },
    cloudflare: { name: 'Cloudflare AI', guide: 'cloudflare_guide', f: [{ n: 'account', k: 'webapp.cfAccount', ph: 'Account ID' }, { n: 'token', k: 'webapp.cfToken', ph: 'API Token 붙여넣기', secret: true }] }

  function tail(v) { v = String(v || ''); return v.length > 10 ? esc(v.slice(0, 4)) + '••••••••' + esc(v.slice(-4)) : '••••' + esc(v.slice(-2)); }

  var CSS = '.kbx{font-size:14px;line-height:1.5}.kbx summary{list-style:none;cursor:pointer}.kbx summary::-webkit-details-marker{display:none}'

    function row(u, isDone, first) {

      var ok = true, v = {};

<script id="adminHold">
/* 차름 공통 모듈: 관리 버튼 누르기(adminHold) — 원본은 common/adminHold.js. 앱 안의 <script id="adminHold">는 tools/sync-modules.py가 복사해 넣은 것이라 손으로 고치지 않는다.
   버튼의 모양·색·자리는 앱마다(CSS), 누르는 동작만 여기서 한곳에.

   AdminHold.pad(버튼)
     눌리는 자리를 넓힘: 버튼에서 화면 구석까지, 안쪽으로도 조금(보이는 것은 그대로).
     전자칠판은 화면 가장자리의 터치를 조금 어긋나게 잡아서 작은 버튼(43px)이 "눌러도 반응 없음"이 되곤 함(2026-11-11 선생님).
   AdminHold.bind(버튼, {isOpen, canOpen, open, close, ms, unit, holding, bubble})
     닫혀 있을 때: ms(3초) 동안 누르면 AdminGate.ask(open) — 왼쪽 위 점을 눌러야 열림.
     열려 있을 때: 한 번 누르면 close().
     isOpen()  관리 메뉴가 열려 있는지          canOpen()  지금 열어도 되는지(없으면 늘 됨)
     unit      고리 진행(--p)을 적는 꼴: ''(0~1) 또는 '%'   holding  누르는 동안 버튼에 붙일 class
     bubble    true면 이벤트를 위로 흘려보냄(앱이 화면 전체에서 듣는 것이 있을 때)
     누르는 동안 터치가 아주 잠깐(GRACE) 끊겨도 처음으로 돌아가지 않고 이어짐(칠판이 긴 누름을 잠깐 놓칠 때). */
window.AdminHold = (function () {
  'use strict';
  var GRACE = 250;
  function pad(btn) {
    if (!btn || btn.querySelector('.ah-pad')) return;
    if (!document.getElementById('ahStyle')) {
      var st = document.createElement('style'); st.id = 'ahStyle';
      st.textContent = '.ah-pad{position:absolute;left:-16px;top:-16px;right:-60px;bottom:-60px;border-radius:0;background:transparent}';
      document.head.appendChild(st);
    }
    var p = document.createElement('span'); p.className = 'ah-pad'; p.setAttribute('aria-hidden', 'true'); p.style.pointerEvents = 'auto';
    btn.insertBefore(p, btn.firstChild);
  }
  function bind(btn, o) {
    o = o || {}; pad(btn);
    var MS = o.ms || 3000, unit = o.unit || '', raf = 0, t0 = 0, on = false, lost = 0, justOpened = false, ignoreUntil = 0;
    function setP(p) { btn.style.setProperty('--p', unit === '%' ? (p * 100) + '%' : p); }
    function stop() { on = false; clearTimeout(lost); lost = 0; cancelAnimationFrame(raf); setP(0); if (o.holding) btn.classList.remove(o.holding); }
    function tick() {
      if (!on) return;
      var p = Math.min(1, (performance.now() - t0) / MS); setP(p);
      if (p >= 1) { stop(); justOpened = true; window.AdminGate.ask(o.open); return; }
      raf = requestAnimationFrame(tick);
    }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (!o.bubble) e.stopPropagation();
      if (o.isOpen()) return;                       /* 닫기는 click에서 바로 */
      if (o.canOpen && !o.canOpen()) return;
      try { btn.setPointerCapture(e.pointerId); } catch (x) {}
      if (on && lost) { clearTimeout(lost); lost = 0; return; }   /* 잠깐 끊겼다 다시 닿음 — 이어서 */
      on = true; t0 = performance.now(); if (o.holding) btn.classList.add(o.holding);
      cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
      btn.addEventListener(ev, function () {
        if (justOpened) { justOpened = false; ignoreUntil = performance.now() + 500; }
        if (on && !lost) lost = setTimeout(stop, GRACE);
      });
    });
    btn.addEventListener('click', function (e) {
      if (!o.bubble) e.stopPropagation();
      if (performance.now() < ignoreUntil) return;  /* 3초 눌러 연 직후 손을 뗄 때 생기는 click은 무시 */
      if (o.isOpen()) o.close();
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return { cancel: stop };
  }
  return { pad: pad, bind: bind };
})();
</script>

function cleanF(f,rate){
  const n=f.length, W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }

  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));
  const body=f.slice(st,en), L=body.length, fi=Math.min(L,Math.round(rate*0.008)), fo=Math.min(L,Math.round(rate*0.04));
  for(let k=0;k<fi;k++) body[k]*=k/fi; for(let k=0;k<fo;k++) body[L-1-k]*=k/fo;
  const lead=Math.round(rate*0.06), out=new Float32Array(lead+L); out.set(body,lead); return {data:out,rate};
}

const CLIPS=new Map();
function getClip(text){ const key=S.engineNow+'|'+text;
  if(!CLIPS.has(key)){
    const p=(async()=>{ const ab=await clipBytes(text), c=getCtx(); if(!c) throw new Error('audio');
      const buf=await new Promise((res,rej)=>{ const q=c.decodeAudioData(ab,res,rej); if(q&&q.then) q.then(res,rej); });
      return cleanF(buf.getChannelData(0).slice(0),buf.sampleRate); })();
    p.catch(()=>CLIPS.delete(key)); CLIPS.set(key,p);
  }
  return CLIPS.get(key);
}

function deviceSay(text,id,done){

  setTimeout(()=>{ if(id!==speakSeq) return;
    try{ if(!koVoice) koVoice=pickKoVoice(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.78; u.volume=0.7; if(koVoice) u.voice=koVoice;

let hiddenSay=null, curSay=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(curSay&&curSay.id===speakSeq&&!hiddenSay){ hiddenSay=[curSay.text,curSay.resolve]; curSay.held=true; } curSay=null; stopVoice(); speakSeq++; }
  else if(hiddenSay){ const h=hiddenSay; hiddenSay=null; setTimeout(()=>{ if(!document.hidden) speak(h[0]).then(h[1]); else hiddenSay=h; },350); } });
function speak(text){ return new Promise(resolve=>{
  if(document.hidden){ hiddenSay=[text,resolve]; return; }
  if(fsBusy()){ const s0=speakSeq; afterFull(()=>{ if(speakSeq===s0) speak(text).then(resolve); else resolve(false); }); return; }
  lastSay=text; stopVoice();
  const tries=(speak.retry&&speak.retry.text===text)?speak.retry.n:0; speak.retry=null;
  const id=++speakSeq, me={id,text,resolve}; curSay=me;
  let fired=false; const done=why=>{ if(fired) return; fired=true; if(me.held) return;
    if(why==='cut'&&tries<2&&id===speakSeq){ setTimeout(()=>{ if(me.held) return; if(id!==speakSeq){ resolve(false); return; } speak.retry={text,n:tries+1}; speak(text).then(resolve); },400); return; }

function chime(){ if(!S.sound) return; try{ const c=getCtx(); if(!c) return; const t=c.currentTime;
  [[660,0],[880,0.12]].forEach(([f,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(0.16,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.35); o.connect(g); g.connect(c.destination); o.start(t+d); o.stop(t+d+0.4); }); }catch(e){} }

/* ================= 오늘 할 것(plan) ================= */
function pickByMat(){
  const lv=S.level, ms=S.msel.filter(m=>MATS[lv].includes(m)); if(ms.length<2){ S.mpick=[]; return; }
  const by={}; ms.forEach(m=>by[m]=shuffle(POOL[lv].filter(x=>x.m===m)));
  const total=Object.values(by).reduce((n,l)=>n+l.length,0), N=S.mn===99?total:Math.min(S.mn,total), out=[];
  for(let r=0;out.length<N&&r<40;r++){ shuffle(ms).forEach(m=>{ if(out.length<N&&by[m][r]) out.push(by[m][r].a); }); }
  S.mpick=out;
}
/* 사진 한 장 → 수업 한 덩이. 물체는 물질이 고르게, 같은 이름은 하나만(정해진 차례 — 미리 보기와 수업이 같게). 물질 카드·상자는 2가지 이상(모자라면 수준 물질 하나를 더 — 빈 상자도 고를 거리) */
/* 사진 수업의 수준(2026-11-22 선생님 다시 정함) — 물체 하나에 든 물질 수로 나누고, 수준마다 섞는 비율을 맞춤
   1: 한 가지 물질 물체만 · 2: 한 가지 30 : 두 가지 70 · 3: 두 가지 50 : 세 가지 이상 50 · 4: 여러 물질(겉만) 30 : 속 물질까지 70
   수준 1~3에서는 속(안 보이는 물질)을 빼고 보이는 부분으로만 셈. 사진 수업은 물질 종류를 수준으로 막지 않음(9가지 모두) */
const MIX={1:{one:1},2:{one:.3,two:.7},3:{two:.5,many:.5},4:{vis:.3,hid:.7}};
const CAT_NAME={one:'한 가지',two:'두 가지',many:'세 가지 이상',vis:'여러 물질(겉)',hid:'속 물질까지'};
const ALLMAT=['wood','metal','plastic','paper','cloth','rubber','glass','ceramic','stone'];
function catOf(o,lv){ if(lv>=4) return o.parts.some(p=>!p.box)?'hid':o.ms.length>=2?'vis':'one'; return o.ms.length>=3?'many':o.ms.length===2?'two':'one'; }
function lvObjs(sc,lv){ return sc.objs.map(o=>{ if(lv>=4||o.parts.every(p=>p.box)) return o; const parts=o.parts.filter(p=>p.box); return {a:o.a,box:o.box,parts,ms:[...new Set(parts.map(p=>p.m))]}; })
  .filter(o=>o.parts.length&&MIX[lv][catOf(o,lv)]); }
function unitFrom(sc,lv,pick){
  const os=pick.map(o=>({a:o.a,box:o.box,sc:sc.id,ms:o.ms,parts:o.parts,cat:catOf(o,lv)}));
  const items=[]; os.forEach(o=>o.parts.forEach(pt=>{ if(pt.box) items.push({a:pt.a,m:pt.m,sc:sc.id,box:pt.box,of:o.a}); }));
  const ms=[...new Set(os.flatMap(o=>o.ms))], extra=ALLMAT.filter(m=>!ms.includes(m)); let k=0;
  while(ms.length<2&&extra.length){ const i=(sc.id.length+k)%extra.length; ms.push(extra[i]); extra.splice(i,1); k++; }   /* 물질 카드·상자는 2가지 이상 */
  return {mats:ALLMAT.filter(m=>ms.includes(m)),items,objs:os,label:sc.t||'사진',sid:sc.id,bi:null,photo:1}; }
/* 여러 사진에 걸쳐 비율을 맞춰 물체를 고름: 물체를 하나 고를 때마다 지금 가장 모자란 종류를 고름(정해진 차례 — 미리 보기와 수업이 같게) */
function sceneUnits(scs,lv){ const mix=MIX[lv], cnt={}; let tot=0; const out=[];
  scs.forEach(sc=>{ if(!sc) return; const cand=lvObjs(sc,lv).sort((x,y)=>y.ms.length-x.ms.length); if(!cand.length) return; const pick=[];
    while(pick.length<OBJN[lv]){ const avail=cand.filter(o=>!pick.includes(o)&&!pick.some(p=>p.a===o.a)); if(!avail.length) break;
      let best=null, bd=-1e9; avail.forEach(o=>{ const c=catOf(o,lv), d=mix[c]*(tot+1)-(cnt[c]||0); if(d>bd+1e-9){ bd=d; best=o; } });
      pick.push(best); const c=catOf(best,lv); cnt[c]=(cnt[c]||0)+1; tot++; }
    out.push(unitFrom(sc,lv,pick)); });
  return out; }
function sceneUnit(sc,lv){ return sceneUnits([sc],lv)[0]||null; }
function mixCount(units,lv){ const c={}; units.forEach(u=>u.objs.forEach(o=>{ c[o.cat]=(c[o.cat]||0)+1; })); return Object.keys(MIX[lv]).map(k=>CAT_NAME[k]+' '+(c[k]||0)).join(' · '); }
/* 그림으로 보기(2026-11-22 선생님): 001·002가 쓰는 '일상 그림'(media/photos/<id>/art.jpg — 사진과 같은 짜임으로 그린 그림)으로 같은 수업을 함.
   물체 자리(0~1000 비율)가 그대로 맞아 사진 수업과 똑같이 돎. 일상 그림이 있는 사진만(없는 사진은 001 art-maker로 만들면 ART_IDS에 더함) */
const ART_IDS=new Set(['laptop','shampoo-bottles','washbasin','towel','ukulele','wall-clock-2','toilet','toothbrushes','basket-plant','potted-tree','street-cat','bell','board','bookshelf','bottles','bus-wheel','car-wheel','computer-desk','cup-drawings','desks','door','hallway','manhole','milk-basket','mug-monitor','parking-sign','recycle-bins','school-bus','shoe-rack','sink-cabinet','tissue','wall-clock','water-purifier']);
SCENES.forEach(sc=>{ if(ART_IDS.has(sc.id)) SC[sc.id+'~a']=Object.assign({},sc,{id:sc.id+'~a',src:PHO+sc.id+'/art.jpg',art:true}); });
/* 2026-11-22 선생님: 수준 1·2는 그림(일상 그림), 수준 3·4는 실물 사진 */
const artLv=()=>S.level<=2;
const viewOf=sc=>artLv()&&SC[sc.id+'~a']?SC[sc.id+'~a']:sc;
const libScenes=lv=>SCENES.filter(sc=>lvObjs(sc,lv).length&&(lv>2||ART_IDS.has(sc.id)));
/* 자동: 사진을 한 장씩 더하며 비율에 가장 가까워지는 사진을 고름(같으면 무작위) */
function pickScenes(){ const lv=S.level, mix=MIX[lv], L=shuffle(libScenes(lv)), chosen=[];
  const err=scs=>{ const c={}; let t=0; sceneUnits(scs,lv).forEach(u=>u.objs.forEach(o=>{ c[o.cat]=(c[o.cat]||0)+1; t++; })); return t?Object.keys(mix).reduce((e,k)=>e+Math.abs((c[k]||0)/t-mix[k]),0)-t*0.01:9; };
  while(chosen.length<S.pn){ let best=null, be=1e9; L.filter(sc=>!chosen.includes(sc)).forEach(sc=>{ const e=err([...chosen,sc]); if(e<be){ be=e; best=sc; } }); if(!best) break; chosen.push(best); }
  S.apick=chosen.map(sc=>sc.id); }
/* 묶음 자료 수준 3·4(2026-11-22 선생님): 실물 사진이 있는 물체는 사진으로 — 자료실 사진에서 이름이 같고(유리컵·쇠컵 = '컵', 도자기컵 = '머그컵')
   한 가지 물질이 같은 물체를 찾아 그 둘레를 잘라 씀. 사진이 없으면 그림 그대로 */
const PHOTO_NAME={'유리컵':'컵','쇠컵':'컵','도자기컵':'머그컵'};
function realPhoto(it){ const want=PHOTO_NAME[it.a]||it.a;
  for(const sc of SCENES){ const o=sc.objs.find(o=>o.a===want&&o.parts.length===1&&o.ms.length===1&&o.ms[0]===it.m); if(o) return Object.assign({},it,{sc:sc.id,box:o.box}); }
  return it; }
const realItems=(items,lv)=>lv>=3?items.map(realPhoto):items;
function makePlan(){
  const lv=S.level;
  if(S.form==='auto'){ if(!S.apick.length||S.apick.some(id=>!SC[id]||!lvObjs(SC[id],lv).length||(artLv()&&!ART_IDS.has(id)))) pickScenes(); return sceneUnits(S.apick.map(id=>viewOf(SC[id])),lv); }
  if(S.form==='choose') return sceneUnits(S.csel.filter(id=>!artLv()||ART_IDS.has(id)).map(id=>viewOf(SC[id])),lv);
  if(S.form==='recv') return sceneUnits(S.rsel.filter(id=>RECV.some(r=>r.id===id&&r.ok)).map(id=>SC[id]),lv);
  if(S.mode==='mat'){
    const ms=S.msel.filter(m=>MATS[lv].includes(m));
    if(!S.mpick.length||S.mpick.some(a=>!POOL[lv].some(x=>x.a===a&&ms.includes(x.m)))) pickByMat();
    const items=S.mpick.map(a=>POOL[lv].find(x=>x.a===a)).filter(Boolean);
    return [{mats:MATS[lv].filter(m=>items.some(x=>x.m===m)),items:realItems(items,lv),label:'물질 고르기',bi:null}];
  }
  const sel=(S.bsel||[]).filter(i=>BUN[lv][i]); if(!sel.length) sel.push(0);
  return sel.map(i=>({mats:BUN[lv][i].mats,items:realItems(BUN[lv][i].items,lv),label:'묶음 '+(i+1),bi:i}));
}
function planOk(plan){ return plan.length&&plan.every(b=>b.mats.length>=2&&b.items.length>=(b.photo?1:2)&&b.mats.length<=(b.photo?9:MAXM)); }

/* ================= 수업 진행 =================
   한 묶음: 보기(물체마다) → 물체 찾기(이름 듣고 그림) → 물질 고르기(물체 보고 물질) → 정리하기(물질 상자에 넣기) → 사진에서(실제 물건의 물질)
   → 문질러 찾기(학습 뒤 보상, 기록 안 함) → 끝 장면 */
let RUN=null;
/* 사진 고르기: 묶음 물체와 이름이 같은 사진은 뺌(종이 '컵'만 배운 날 쇠 '컵' 사진이 나와 헷갈리지 않게).
   다만 그 이름이 묶음에 여러 물질로 있으면(컵 묶음 — 같은 물체도 여러 물질로 만듦) 넣고, 이때는 그 이름 사진을 먼저 고름 */
function photosFor(bd){ const names=bd.items.map(x=>nm(x.a)), multi=n=>new Set(bd.items.filter(x=>nm(x.a)===n).map(x=>x.m)).size>1;
  const ok=shuffle(PHOTO.filter(p=>bd.mats.includes(p.m)&&(!names.includes(p.a)||multi(p.a))));
  return [...ok.filter(p=>names.includes(p.a)),...ok.filter(p=>!names.includes(p.a))].slice(0,2); }
function buildRun(lv,plan,idx){
  const bd=plan[idx], phases=[];
  PHASES.forEach(([k])=>{ if(!S.steps[k]) return;
    let items;
    if(bd.photo){   /* 사진: 보기·물체 찾기·모두 찾기는 물체, 물질 고르기·같은 물질·정리하기는 부분(6개까지) */
      if(k==='photo') return;
      if(k==='show') items=[...bd.objs];
      else if(k==='obj'){ if(new Set(bd.objs.map(o=>o.a)).size<2) return; items=shuffle(bd.objs); }
      else if(k==='in') items=lv>=4?bd.objs.filter(o=>o.parts.some(p=>!p.box)).slice(0,3):[];
      else if(k==='all') items=shuffle(bd.objs.filter(o=>o.ms.length>1)).slice(0,3);
      else if(k==='same') items=sameQs(bd);
      else items=shuffleNoRepeat(bd.items).slice(0,6); }
    else if(k==='all'||k==='in') return;
    else if(k==='show') items=[...bd.items];
    else if(k==='photo') items=photosFor(bd).map(p=>({a:p.a,m:p.m,ph:p}));
    else if(k==='same') items=sameQs(bd);
    else items=shuffleNoRepeat(bd.items);
    if(items.length) phases.push({k,items}); });
  const lid={}; Object.keys(MAT).forEach(m=>lid[m]=Math.floor(Math.random()*4));
  return {lv,plan,idx,b:bd.bi==null?-1:bd.bi,bd,phases,pi:0,ii:0,g:Date.now(),placed:{},token:0,lid,gk:nextGame()};
}
/* 같은 물질 찾기: 물질 하나를 보여 주고 그 물질로 만든 것을 모두 찾음 — 물질이 두 가지 이상 섞여 있을 때만, 한 덩이에 두 번까지 */
function sameQs(bd){ const ms=[...new Set(bd.items.map(x=>x.m))]; if(ms.length<2) return []; return shuffle(ms).slice(0,2).map(m=>({m,a:''})); }
/* 놀이 고르기: 돌아가며(4)는 물질 공장 → 두드려 보기 → 문질러 찾기 차례 */
function nextGame(){ const g=S.game; if(g===1) return 'rub'; if(g===2) return 'factory'; if(g===3) return 'tap'; if(g!==4) return 'rub';
  const L=['factory','tap','rub'], n=+(store.get('gturn')||0); store.set('gturn',String(n+1)); return L[n%3];
}
function shuffleNoRepeat(items){ /* 같은 물질이 세 번 이어 나오지 않게 */
  for(let t=0;t<30;t++){ const s=shuffle(items); let ok=true; for(let i=2;i<s.length;i++) if(s[i].m===s[i-1].m&&s[i].m===s[i-2].m) ok=false; if(ok) return s; }
  return shuffle(items);
}
let ALONE=null;   /* 학생 혼자: {plan, done:Set} */
async function startLesson(rs){

  await prepareVoice(plan);   /* 내장 → 선생님 키(Azure·Google) → 기기 */
  if(!rs&&S.who==='alone'&&plan.length>1){ ALONE={plan,done:new Set(),lv:S.level}; RUN=null; setTimeout(()=>showPicker(),350); return; }
  ALONE=null;
  RUN=buildRun(rs?rs.lv:S.level,plan,rs&&rs.plan?Math.min(rs.idx||0,plan.length-1):0);
  if(rs){ const pi=RUN.phases.findIndex(p=>p.k===rs.ph); if(pi>=0){ RUN.pi=pi; RUN.ii=Math.min(rs.ii||0,RUN.phases[pi].items.length-1); } }
  setTimeout(()=>runStep(),350);
}
function totalItems(){ return RUN.phases.reduce((n,p)=>n+p.items.length,0); }
function doneItems(){ let n=0; for(let i=0;i<RUN.pi;i++) n+=RUN.phases[i].items.length; return n+RUN.ii; }
function renderProg(){

  if(!RUN||RUN.ending||!RUN.phases.length){ pr.className=''; return; }
  const T=totalItems(), D=doneItems();
  ProgBar.draw(pr,T,D,{next:true,min:4,barClass:'bar',cellsClass:''});   /* 공통 모듈 progBar: 10칸까지 칸, 넘으면 이어진 막대 */
}
function saveSpot(){ if(!RUN||RUN.ending||ALONE) return; const p=RUN.phases[RUN.pi]; if(!p) return; RESUME[S.stu||'_']={lv:RUN.lv,plan:RUN.plan,idx:RUN.idx,ph:p.k,ii:RUN.ii,t:Date.now()}; saveResume(); }
window.addEventListener('pagehide',saveSpot);
function clearStage(){ const st=$('stage'); st.innerHTML=''; document.querySelectorAll('.drag').forEach(x=>x.remove());

function area(){ const r=$('stage').getBoundingClientRect(); return {w:r.width-32,h:r.height-70}; }
const portrait=()=>{ const A=area(); return A.w<A.h*1.05; };
function nextItem(){

function runStep(){

  const P=RUN.bd.photo; ({show:P?stepPShow:stepShow,obj:P?stepPObj:stepObj,mat:P?stepPMat:stepMat,in:stepIn,all:stepAll,same:stepSame,sort:stepSort,photo:stepPhoto})[ph.k](it,RUN.token);
}
let TIMERS=[]; function later(fn,ms){ TIMERS.push(setTimeout(fn,ms)); } function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }
const alive=tok=>RUN&&RUN.token===tok&&!S.admin;

/* 카드 만들기 */
/* 물체 그림: 그림 물체는 낱말 그림, 사진 물체(it.box)는 사진에서 그 물체 둘레를 정사각형으로 잘라 보여 줌 */
function cropStyle(it,s){ const sc=SC[it.sc]; if(!sc) return ''; const [x0,y0,x1,y1]=it.box, W=sc.w, H=sc.h;
  const bw=(x1-x0)*W/1000, bh=(y1-y0)*H/1000, side=Math.max(bw,bh)*1.08, cx=x0*W/1000+bw/2-side/2, cy=y0*H/1000+bh/2-side/2, k=s/side;
  return "background-image:url('"+sc.src+"');background-size:"+(W*k).toFixed(1)+'px '+(H*k).toFixed(1)+'px;background-position:'+(-cx*k).toFixed(1)+'px '+(-cy*k).toFixed(1)+'px;background-repeat:no-repeat;background-color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact'; }
function thumbHTML(it,s,sized){ if(typeof it==='string') it={a:it};
  return it.box?'<span class="crop" style="width:'+s+'px;height:'+s+'px;'+cropStyle(it,s)+'"></span>':'<img src="'+pic(it.a)+'" alt="" draggable="false"'+(sized?' style="width:'+s+'px;height:'+s+'px"':'')+'>'; }
function objCard(it,s,cls){ if(typeof it==='string') it={a:it}; const c=document.createElement('div'); c.className='oc'+(cls?' '+cls:''); c.dataset.a=it.a; c.style.width=c.style.height=s+'px'; c.innerHTML=thumbHTML(it,s-22); return c; }
function matCard(m,s,cls){ const c=document.createElement('div'); c.className='mc'+(cls?' '+cls:''); c.dataset.m=m; c.style.width=s+'px'; c.innerHTML='<div class="tex" style="background-image:'+texOf(m).replace(/"/g,"'")+'"></div><div class="lab" style="font-size:'+Math.max(14,Math.min(s*(MAT[m].label.length>2?0.15:0.19),36))+'px">'+MAT[m].label+'</div>'; return c; }
/* 보기 카드 줄: 세로 화면이고 3장 넘으면 두 줄 */
function optRow(n,cs,gap){ const row=document.createElement('div'); row.className='opts'; row.style.columnGap=gap+'px';
  if(portrait()&&n>3){ row.style.flexWrap='wrap'; row.style.maxWidth=(cs*2+gap+8)+'px'; row.style.rowGap=gap+'px'; } return row; }
function optSize(n,availW,availH,gap,lab){ const cols=(portrait()&&n>3)?2:n, rows=Math.ceil(n/cols);
  return Math.max(70,Math.min((availW-gap*(cols-1))/cols-8, (availH-gap*(rows-1))/rows-(lab?58:0), lab?230:250)); }

/* ---- 1. 보기: 물체 → "의자예요." → 물질 카드가 옆에 이어지며 "나무로 만들었어요." ---- */
async function stepShow(it,tok){
  const st=$('stage'), A=area(), por=portrait();
  const s=Math.min(por?A.h*0.3:A.h*0.56, por?A.w*0.6:A.w*0.32, 340);
  const pair=document.createElement('div'); pair.className='pair'; pair.style.flexDirection=por?'column':'row'; pair.style.gap=por?'14px':'0';
  const L=document.createElement('div'), R=document.createElement('div');
  L.innerHTML='<div class="cap">물체</div>'; R.innerHTML='<div class="cap">물질</div>'; R.className='slideIn';
  const oc=objCard(it.a,s); oc.style.cursor='default'; L.appendChild(oc);
  const tag=document.createElement('div'); tag.className='nameTag'; tag.textContent=nm(it.a); tag.style.opacity=0; tag.style.transition='opacity .6s'; L.appendChild(tag);

}

/* 고르기 공통: 견본 먼저 → 약 1초 뒤 보기가 서서히. 8초 뒤 안내 다시 → 16초 뒤 정답 빛남. 틀리면 정답 빛남(도움으로 기록) */
function choiceRound(tok,{say,cards,isRight,onRight,rec}){
  let wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; cards.filter(isRight).forEach(c=>c.classList.add('glow')); };
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(say).then(()=>{ if(!alive(tok)) return;
    later(()=>{ if(alive(tok)&&!over) speak(say); },8000);
    later(()=>{ if(alive(tok)&&!over) glow(); },16000);
  });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)) return;
    if(isRight(c)){ over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); chime();
      rec(wrong,helped||!!wrong); onRight(c); }
    else if(!wrong){ wrong=c; glow(); }
  }));
}
function logRow(ph,it,wrongId,help){
  if(!S.stu) return;
  LOG.push({s:S.stu,t:Date.now(),g:RUN.g,lv:RUN.lv,b:RUN.b>=0?RUN.b+1:RUN.bd.label,ph,a:it.a,m:it.m,res:help?'help':'first',w:wrongId||''}); saveLog();
}
const dim=(cards,c)=>cards.forEach(x=>{ if(x!==c) x.style.opacity=.25; });

/* ---- 2. 물체 찾기: 견본 = 이름 글자(말풍선), 보기 = 물체 그림 2~4장 ---- */
function stepObj(it,tok){
  const st=$('stage'), A=area(), k=Math.min(LV[RUN.lv].opts+1,4)-1;
  const pool=RUN.bd.items.filter(x=>x.a!==it.a&&fam(x.a)!==fam(it.a)&&!PAIRS.some(p=>p.includes(x.a)&&p.includes(it.a)));
  const dup=x=>picks.some(y=>fam(y.a)===fam(x.a));   /* 컵 넷: 한 화면에 '컵'은 하나만 */
  const picks=[]; shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.some(y=>y.m===x.m)&&!dup(x)) picks.push(x); }); shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.includes(x)&&!dup(x)) picks.push(x); });
  const opts=shuffle([it,...picks]), n=opts.length, gap=Math.max(16,A.w*0.03);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML='<div class="word" style="font-size:'+Math.min(A.h*0.1,70)+'px">'+esc(nm(it.a))+'</div>';
  const cs=optSize(n,A.w,A.h-Math.min(A.h*0.1,70)-90,gap,false), row=optRow(n,cs,gap);
  opts.forEach(x=>row.appendChild(objCard(x.a,cs,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];
  choiceRound(tok,{say:askObj(it.a),cards,isRight:c=>c.dataset.a===it.a,
    rec:(w,h)=>logRow('obj',it,w&&w.dataset.a,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});   /* 2026-11-22: 이름만이 아니라 물질까지 */
}

/* ---- 3. 물질 고르기: 견본 = 물체 그림(말풍선), 보기 = 물질 카드 2~3장 ---- */
function matOptions(it){ const k=LV[RUN.lv].opts-1; const others=shuffle(RUN.bd.mats.filter(m=>m!==it.m)).slice(0,k); return shuffle([it.m,...others]); }
function stepMat(it,tok){
  const st=$('stage'), A=area(), opts=matOptions(it), n=opts.length, gap=Math.max(16,A.w*0.03);
  const sh=Math.min(A.h*0.28,210);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML=it.box?'<span class="crop o" style="width:'+sh+'px;height:'+sh+'px;'+cropStyle(it,sh)+'"></span>':'<img class="o" src="'+pic(it.a)+'" alt="'+esc(it.a)+'" style="width:'+sh+'px;height:'+sh+'px">';
  const cs=optSize(n,A.w,A.h-sh-80,gap,true), row=optRow(n,cs,gap);
  opts.forEach(m=>row.appendChild(matCard(m,cs,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];

    rec:(w,h)=>logRow('mat',it,w&&w.dataset.m,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});
}

/* ---- 5. 사진에서: 실제 사진 속 물건만 밝게(말풍선) → 물질 카드 ---- */
/* 사진은 그 물건 둘레만 잘라 크게(둘레 여유를 두어 어디인지 알 수 있게), 그 물건 밖은 어둡게 */
function photoBox(p,maxW,maxH){
  const [x0,y0,x1,y1]=p.box, bw=x1-x0, bh=y1-y0, pad=Math.max(bw,bh)*0.45;
  let cx0=Math.max(0,x0-pad), cy0=Math.max(0,y0-pad), cx1=Math.min(p.w,x1+pad), cy1=Math.min(p.h,y1+pad);
  /* 너무 길쭉하지 않게(가로:세로 3:4 ~ 16:9) */
  const want=r=>{ const cw=cx1-cx0, ch=cy1-cy0;
    if(cw/ch<r){ const add=(ch*r-cw)/2; cx0=Math.max(0,cx0-add); cx1=Math.min(p.w,cx1+add); }
    else if(cw/ch>16/9){ const add=(cw*9/16-ch)/2; cy0=Math.max(0,cy0-add); cy1=Math.min(p.h,cy1+add); } };
  want(0.75);
  const cw=cx1-cx0, ch=cy1-cy0, k=Math.min(maxW/cw,maxH/ch), w=cw*k, h=ch*k;
  const d=document.createElement('div'); d.className='phWrap'; d.style.width=w+'px'; d.style.height=h+'px';
  d.innerHTML='<img src="'+PH_URL(p)+'" alt="" draggable="false" style="inset:auto;left:'+(-cx0*k)+'px;top:'+(-cy0*k)+'px;width:'+(p.w*k)+'px;height:'+(p.h*k)+'px">'
    +'<div class="hole" style="left:'+((x0-cx0)*k)+'px;top:'+((y0-cy0)*k)+'px;width:'+(bw*k)+'px;height:'+(bh*k)+'px"></div>';
  return d;
}
function stepPhoto(it,tok,kind){
  const st=$('stage'), A=area(), opts=matOptions(it), n=opts.length, gap=Math.max(16,A.w*0.03);
  const cs0=optSize(n,A.w,A.h*0.36,gap,true);
  const bub=document.createElement('div'); bub.className='bubble'; bub.style.padding='8px';
  const pb=photoBox(it.ph,Math.min(A.w*0.8,900),A.h-cs0-120); bub.appendChild(pb);
  const row=optRow(n,cs0,gap); opts.forEach(m=>row.appendChild(matCard(m,cs0,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];
  choiceRound(tok,{say:kind==='mat'?askMat(it.a):photoAsk(it.a),cards,isRight:c=>c.dataset.m===it.m,
    rec:(w,h)=>logRow(kind||'photo',it,w&&w.dataset.m,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; pb.classList.add('lit'); await wait(1600); if(alive(tok)) nextItem(); }});
}

/* ---- 4. 정리하기: 물질 상자를 늘 같은 자리에 두고, 물체를 하나씩 맞는 상자에(끌거나 상자를 누름). 틀리면 반응 없음 ---- */
function binEl(m,w,h){
  const b=document.createElement('div'); b.className='bin'; b.dataset.m=m; b.style.width=w+'px'; b.style.height=h+'px';
  const lh=Math.max(46,h*0.3);
  const pc=!MATTX[m]&&MATPC[m];   /* 결 사진이 없는 물질: 조각을 통째로 작게(잘린 조각은 알아보기 어려움) */
  b.innerHTML='<div class="lid'+(pc?' pc':'')+'" style="height:'+lh+'px;background-image:'+lidTex(m).replace(/"/g,"'")+'"><b style="font-size:'+Math.max(18,Math.min(lh*0.42,34))+'px">'+MAT[m].label+'</b><span class="slot"></span></div><div class="body"></div>';
  return b;
}
function fillBin(b,list,newA){ const body=b.querySelector('.body'), w=b.clientWidth; body.innerHTML='';
  const s=Math.max(28,Math.min(w/3.3,(b.clientHeight-b.querySelector('.lid').offsetHeight)/2.3));
  list.forEach(x=>{ const it=typeof x==='string'?{a:x}:x, isNew=newA&&it.a===(newA.a||newA)&&it.sc===newA.sc;
    if(it.box){ const sp=document.createElement('span'); sp.innerHTML=thumbHTML(it,s); const c=sp.firstChild; if(isNew) c.classList.add('new'); body.appendChild(c); return; }
    const im=document.createElement('img'); im.src=pic(it.a); im.alt=it.a; im.style.width=im.style.height=s+'px'; if(isNew) im.className='new'; body.appendChild(im); }); }
function binRow(mats,A,availH){
  const n=mats.length, gap=Math.max(14,A.w*0.02), cols=(portrait()&&n>2)?2:n, rows=Math.ceil(n/cols);
  const w=Math.min((A.w-gap*(cols-1))/cols-6,330), h=Math.min((availH-gap*(rows-1))/rows, w*1.2);
  const row=document.createElement('div'); row.className='bins'; row.style.columnGap=gap+'px';
  if(cols<n){ row.style.flexWrap='wrap'; row.style.maxWidth=(w*cols+gap*(cols-1)+8)+'px'; row.style.rowGap=gap+'px'; }
  mats.forEach(m=>row.appendChild(binEl(m,w,h))); return row;
}
function stepSort(it,tok){
  const st=$('stage'), A=area(), mats=RUN.bd.mats;
  const os=Math.min(A.h*0.26,200);
  const row=binRow(mats,A,A.h-os-40);
  const tray=document.createElement('div'); tray.className='tray';
  const ac=objCard(it,os); tray.appendChild(ac); st.appendChild(row); st.appendChild(tray);
  const bins=[...row.children];
  requestAnimationFrame(()=>bins.forEach(b=>fillBin(b,RUN.placed[b.dataset.m]||[])));
  let wrong=null, helped=false, over=false, drag=null;
  speak(sortAsk(it.a)).then(()=>{ if(!alive(tok)) return;   /* 2026-11-22 선생님: 이름만 말하고 기다리지 않고 묻기 */
    const again=()=>{ later(()=>{ if(alive(tok)&&!over){ if(drag||pdown) return again(); speak(sortAsk(it.a)); } },8000); }; again();
    later(()=>{ if(alive(tok)&&!over){ helped=true; bins.filter(b=>b.dataset.m===it.m).forEach(b=>b.classList.add('glow')); } },16000);
  });
  const tryPlace=async b=>{
    if(over||!alive(tok)) return;
    if(b.dataset.m!==it.m){ if(!wrong) wrong=b.dataset.m; return; }
    over=true; clearTimers(); b.classList.remove('glow'); chime(); logRow('sort',it,wrong,helped||!!wrong);
    ac.style.visibility='hidden';
    (RUN.placed[it.m]=RUN.placed[it.m]||[]).push({a:it.a,sc:it.sc,box:it.box}); fillBin(b,RUN.placed[it.m],it);
    await speak(praise()+' '+sortDone(it.a,it.m)); if(!alive(tok)) return; await wait(700); if(alive(tok)) nextItem();
  };
  bins.forEach(b=>b.addEventListener('pointerdown',()=>{ if(!drag) tryPlace(b); }));
  ac.addEventListener('pointerdown',e=>{ if(over) return; e.preventDefault(); try{ ac.setPointerCapture(e.pointerId); }catch(_){} drag={x:e.clientX,y:e.clientY,on:false,g:null}; });
  ac.addEventListener('pointermove',e=>{ if(!drag) return;
    if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){ drag.on=true; const g=document.createElement('div'); g.className='drag'; g.innerHTML=thumbHTML(it,os*0.8); g.style.width=g.style.height=os*0.8+'px'; document.body.appendChild(g); drag.g=g; ac.style.opacity=.3; }
    if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px'; } });
  const endDrag=e=>{ if(!drag) return; const d=drag; drag=null; if(d.g) d.g.remove(); ac.style.opacity=1;
    if(d.on){ const el=document.elementFromPoint(e.clientX,e.clientY); const b=el&&el.closest('.bin'); if(b) tryPlace(b); } };
  ac.addEventListener('pointerup',endDrag); ac.addEventListener('pointercancel',endDrag);
}

/* ---- 끝: 마친 묶음 기록 → (문질러 찾기) → 끝 장면. 놀이·끝 장면은 학습 뒤 보상이라 기록하지 않음 ---- */
function finishBundle(){
  const who=S.stu||'_';
  if(RUN.b>=0){ const key=RUN.lv+'-'+(RUN.b+1); DONE[who]=DONE[who]||{}; DONE[who][key]=(DONE[who][key]||0)+1; store.set('done',JSON.stringify(DONE)); }
  if(!ALONE&&RUN.idx<RUN.plan.length-1){ RESUME[who]={lv:RUN.lv,plan:RUN.plan,idx:RUN.idx+1,ph:(RUN.phases[0]||{k:'show'}).k,ii:0,t:Date.now()}; } else delete RESUME[who];
  saveResume();
  if(ALONE) ALONE.done.add(RUN.idx);
  /* 정리하기를 안 했으면 끝 장면 상자는 묶음 물체로 채움 */
  RUN.bd.items.forEach(({a,m,sc,box})=>{ const l=RUN.placed[m]=RUN.placed[m]||[]; if(!l.some(x=>(x.a||x)===a&&x.sc===sc)) l.push({a,sc,box}); });
  RUN.ending=true; RUN.gameDone=!S.game;
  startEnd();
}
function startEnd(){
  RUN.token++; const tok=RUN.token; clearTimers(); stopVoice(); clearStage(); renderProg();
  const play=()=>({rub:playRub,factory:playFactory,tap:playTap}[RUN.gk]||playRub)(tok);
  if(!RUN.gameDone){ if((RUN.introSeen=RUN.introSeen||{}).game) play(); else stageIntro('game',tok,()=>{ RUN.introSeen.game=1; play(); }); }   /* 놀이 알림은 늘(008과 같게) */
  else drawEnd(tok);
}
/* 단계 알림(2026-11-21 선생님 — 008처럼): 단계마다 시작 전에 한 장 — 단계 표(마친 ✓·지금 보라) · 큰 제목 · 그 단계를 보여 주는 작은 그림 · 시작.
   보기만 하다가 누르기·끌기로 할 일이 바뀌는 때를 미리 알려 전환을 예측하게(시각적 일과표). 효과·칭찬 소리 없이 매번 같게.
   제목은 한 번 들려줌(내장 목소리에 그 소리가 있을 때만 — 없으면 말 없이). 학생이 시작(또는 제목)을 눌러야 시작.
   한 묶음에서 단계마다 한 번만(RUN.introSeen). 설정 '더 정하기 → 단계 알림'으로 끔(문질러 찾기 알림은 늘) */
const INTRO_TITLE={show:'보기',obj:'물체 찾기',mat:'물질 고르기',in:'속 보기',all:'모두 찾기',same:'같은 물질 찾기',sort:'정리하기',photo:'사진에서'};
const titleOf=k=>k==='game'?GAME_TITLE[RUN.gk]||'놀이':INTRO_TITLE[k];
async function sayIfHave(t){ if(S.engineNow==='builtin'){ await voiceReady; if(!VSET||!VSET.has(await sha16(t))) return; } return speak(t); }
function stageIntro(k,tok,go){
  const st=$('stage'), bd=RUN.bd, arrow='<span class="gArrow">→</span>';
  const an=x=>x.box?'<span class="an crop" style="'+cropStyle(x,110)+'"></span>':'<img class="an" src="'+pic(x.a)+'" alt="">', mt=(m,c)=>'<span class="mt'+(c?' cover':'')+'" style="background-image:'+texOf(m).replace(/"/g,"'")+'"><b>'+MAT[m].label+'</b></span>';
  const it0=bd.items[0], ms=bd.mats.slice(0,3);
  /* 보기 칸에 같은 이름('컵')이 둘 나오지 않게 */
  const objs=[]; shuffle(bd.items).forEach(x=>{ if(objs.length<3&&!objs.some(y=>fam(y.a)===fam(x.a))) objs.push(x); });
  const php=RUN.phases.find(p=>p.k==='photo'), ph=php&&php.items[0]?php.items[0].ph:PHOTO.find(p=>bd.mats.includes(p.m));   /* 그 단계 첫 사진 */
  const scImg=bd.photo?'<img class="ph" src="'+SC[bd.sid].src+'" alt="">':'';
  const fig=k==='show'?(scImg?scImg+arrow+an(it0)+mt(it0.m):an(it0)+arrow+mt(it0.m))
    :k==='obj'?'<span class="wd">'+esc(nm(objs[0].a))+'</span>'+arrow+(scImg||shuffle(objs).map(x=>an(x)).join(''))
    :k==='mat'?an(it0)+arrow+ms.map(m=>mt(m)).join('')
    :k==='in'?(()=>{ const o=bd.objs.find(x=>x.parts.some(p=>!p.box))||bd.objs[0], src=insideSrc(o.a); return an(o)+arrow+(src?'<img class="an" src="'+src+'" alt="">':'<span class="wd">속</span>'); })()

    :k==='same'?mt(it0.m)+arrow+(scImg||bd.items.filter(x=>x.m===it0.m).slice(0,3).map(x=>an(x)).join(''))
    :k==='sort'?objs.map(x=>an(x)).join('')+arrow+ms.map(m=>mt(m)).join('')
    :k==='photo'?(ph?'<img class="ph" src="'+PH_URL(ph)+'" alt="">':'')+arrow+ms.map(m=>mt(m)).join('')
    :RUN.gk==='factory'?ms.map(m=>mt(m)).join('')+arrow+'<span class="miniMach">'+MACH_SVG+'</span>'
    :RUN.gk==='tap'?(scImg||objs.map(x=>an(x)).join(''))+'<span class="gArrow">♪</span>'
    :ms.map(m=>mt(m,1)).join('');
  const keys=stepKeys().filter(x=>x!=='end'), cur=keys.indexOf(k);
  const row='<div class="stepRow">'+keys.map((x,i)=>'<span class="'+(i<cur?'done':i===cur?'now':'')+'">'+(i<cur?'✓ ':'')+titleOf(x)+'</span>').join('<i></i>')+'</div>';

}
async function drawEnd(tok){
  const st=$('stage'), A=area();

  requestAnimationFrame(()=>[...row.children].forEach(b=>fillBin(b,RUN.placed[b.dataset.m]||[])));
