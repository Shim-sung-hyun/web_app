<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[차름 과학] 무엇으로 만들었을까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 차름 과학 — 무엇으로 만들었을까 (010). 과학 영역: 보라. 얼굴: 천 짜임 무늬 바탕 · 물질 결 카드 · 분리수거함 같은 물질 상자 · 문질러 찾기 */
:root{
  --f-display:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sci:#6A4C9C; --sci-d:#4E3478; --sci-l:#EEE8F6; --sci-m:#C9BCE0;
  --bg:#F6F4F8; --card:#FFFFFF; --ink:#2B2838; --muted:#6B6777; --line:#E2DCEB;
  --bubble:#EAF3FC; --bubble-b:#BCD6EF; --ok:#3E8E63;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.setup{overflow:auto}
button{font-family:inherit}
.hidden{display:none!important}

/* ===== 설정 화면 ===== */
#setupView{min-height:100%;padding:28px 16px 0;background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(106,76,156,.045) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(106,76,156,.035) 0 1px,transparent 1px 7px)}
body:not(.setup) #setupView{display:none}
.wrap{max-width:900px;margin:0 auto}
.title{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:var(--sci-d);line-height:1.1}
.title h1 small.kick{display:block;font-size:20px;color:var(--sci);margin:0 0 4px}
.title .mark{width:38px;height:38px;border-radius:9px;overflow:hidden;border:2px solid var(--sci-d);flex:0 0 auto}
.title .mark svg{display:block;width:100%;height:100%}
.sub{text-align:center;color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(60,40,100,.04);transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px var(--sci-m)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
.num{width:30px;height:30px;border-radius:8px;background:var(--sci);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:400;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:500;cursor:pointer;touch-action:manipulation}
.chip.on{background:var(--sci);border-color:var(--sci);color:#fff}
.chip.add{border-style:dashed;color:var(--sci)}
.lv{flex:1 1 220px;text-align:left;padding:12px 14px;min-height:74px}
.lv b{display:block;font-size:17px;margin-bottom:3px}
.lv span{font-size:13.5px;opacity:.85}
.mode{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.mode .chip{min-width:110px}
.pickNote{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.pickWarn{font-size:14px;color:#9A3328;margin:8px 0 0;font-weight:700}
.pickWarn:empty{display:none}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.bd{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bd.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.bd .bh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.bd .ord{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--sci);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:6px}
.bd .ms{display:flex;gap:6px;flex-wrap:wrap}
.bd .an{display:flex;flex-wrap:wrap;gap:2px}
.bd .an img{width:34px;height:34px;object-fit:contain}
.bd .done{font-size:12px;color:var(--ok)}
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.tchip i{display:inline-block;width:16px;height:16px;border-radius:4px;background-size:cover;border:1px solid rgba(0,0,0,.15)}
.mpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px}
.mpick button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 6px 8px;cursor:pointer;text-align:center;font-weight:700;font-size:16px}
.mpick button i{display:block;aspect-ratio:3/2;border-radius:10px;background-size:cover;margin-bottom:5px}
.mpick button span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.mpick button.on{border-color:var(--sci);box-shadow:0 0 0 2px var(--sci) inset;background:#FBF9FE}
.today{display:flex;flex-direction:column;gap:12px}
.today .plan h4{margin:0 0 6px;font-size:15px;color:var(--sci-d)}
.today .cols{display:flex;gap:10px;flex-wrap:wrap}
.today .col{width:128px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.today .col .lid{height:36px;background-size:cover;display:flex;align-items:center;justify-content:center}
.today .col .lid b{background:rgba(255,255,255,.92);border-radius:8px;padding:1px 10px;font-family:var(--f-display);font-weight:400;font-size:17px}
.today .col .ans{display:flex;flex-wrap:wrap;justify-content:center;padding:4px}
.today .col .ans img{width:38px;height:38px;object-fit:contain}
.steps{font-size:14px;color:var(--muted);line-height:1.7}
.resume{margin-top:12px;padding:10px 12px;border-radius:12px;background:#FFF8E6;border:1px solid #EBD9A6;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.more{margin:0 0 16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 4px}
details.more .card{margin-top:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.opt>span{min-width:120px;color:var(--muted)}
.sm{min-height:34px;padding:4px 12px;font-size:14px;border-radius:10px}
.startBar{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(to top,var(--bg) 70%,rgba(246,244,248,0));display:flex;justify-content:center;gap:12px;z-index:5}
#startBtn{min-width:260px;height:62px;border-radius:18px;border:0;background:var(--sci);color:#fff;font-family:var(--f-display);font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(78,52,120,.25)}
.newStu{display:flex;gap:8px;margin-top:10px}
.newStu input{flex:1;max-width:260px;height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:16px;font-family:inherit}

/* ===== 학생 화면 ===== */
#game{position:fixed;inset:0;background:#FBFAF8;display:none;user-select:none;-webkit-user-select:none}
body:not(.setup) #game{display:block}
body.admin #stage{pointer-events:none}
#prog{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
#prog i{display:block;width:44px;height:8px;border-radius:4px;background:#E6E1EC}
#prog i.d{background:#C9BCE0}#prog i.n{background:var(--sci)}
#prog.bar{width:min(520px,70vw);height:8px;border-radius:4px;background:#E6E1EC;overflow:hidden;gap:0}
#prog.bar b{display:block;height:100%;background:linear-gradient(90deg,#C9BCE0 0 calc(100% - 10px),var(--sci) 0);border-radius:4px;transition:width .4s}
#stage{position:absolute;inset:36px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:20px 16px 8px}
.recDot{position:absolute;left:10px;top:10px;width:10px;height:10px;border-radius:50%;background:#D24B3E;opacity:.75;z-index:4}

.bubble{position:relative;background:var(--bubble);border:2px solid var(--bubble-b);border-radius:24px;padding:12px;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);border:14px solid transparent;border-top:16px solid var(--bubble-b);border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--bubble);border-bottom:0;z-index:1}
.bubble img.o{display:block;object-fit:contain}
.bubble .word{font-family:var(--f-display);color:var(--ink);padding:4px 34px;line-height:1.1}
.opts{display:flex;justify-content:center;align-items:flex-start}
/* 보기 카드: 모두 같은 크기·같은 테두리(크기·자리가 답을 알려 주지 않게) */
.oc,.mc{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:8px;cursor:pointer;touch-action:none;transition:border-color .5s,box-shadow .5s,opacity .6s}
.oc img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.mc{display:flex;flex-direction:column;align-items:center}
.mc .tex{width:100%;aspect-ratio:1/1;border-radius:13px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mc .lab{font-family:var(--f-display);font-size:clamp(22px,3vw,36px);line-height:1.15;margin-top:6px;color:var(--ink)}
.fadeIn{opacity:0}
.glow{border-color:#E8B84A!important;box-shadow:0 0 0 6px rgba(232,184,74,.35)}
.right{border-color:var(--ok)!important}
.cap{font-size:clamp(14px,1.6vw,18px);color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:.08em}
.pair{display:flex;align-items:center;justify-content:center}
.pair .link{flex:0 0 auto;height:4px;border-radius:2px;background:var(--sci-m);transform-origin:left center;transform:scaleX(0);transition:transform .7s ease}
.pair .link.on{transform:scaleX(1)}
.nameTag{font-family:var(--f-display);font-size:clamp(24px,3.4vw,42px);color:var(--ink);text-align:center;margin-top:8px}
.slideIn{opacity:0;transform:translateX(24px);transition:opacity .7s ease,transform .7s ease}
.slideIn.on{opacity:1;transform:none}

/* 사진(일반화): 그 물건만 밝게 */
.phWrap{position:relative;overflow:hidden;border-radius:16px;background:#ddd}
.phWrap img{position:absolute;inset:0;width:100%;height:100%;display:block}
.phWrap .hole{position:absolute;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 3000px rgba(20,16,30,.48);transition:box-shadow 1s}
.phWrap.lit .hole{box-shadow:0 0 0 3000px rgba(20,16,30,0)}

/* 물질 상자(정리하기): 분리수거함처럼 위에 결 무늬 뚜껑과 투입구 */
.bins{display:flex;justify-content:center;align-items:flex-end}
.bin{position:relative;cursor:pointer;touch-action:none;border-radius:16px 16px 20px 20px;background:#fff;border:3px solid #D8D3CC;overflow:hidden;transition:border-color .5s,box-shadow .5s;display:flex;flex-direction:column}
.bin .lid{position:relative;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;border-bottom:3px solid rgba(0,0,0,.12)}
.bin .lid b{font-family:var(--f-display);font-weight:400;background:rgba(255,255,255,.93);border-radius:12px;padding:2px 16px;color:var(--ink);line-height:1.2}
.bin .slot{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:46%;height:9%;min-height:6px;border-radius:99px;background:rgba(30,24,40,.55);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.bin .body{flex:1;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;padding:6px;background:linear-gradient(#FBFAF8,#F1EEF4)}
.bin .body img{object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.bin .body img.new{animation:drop .7s ease-out}
@keyframes drop{from{transform:translateY(-60%) scale(1.3);opacity:0}to{transform:none;opacity:1}}
.tray{display:flex;justify-content:center;align-items:center}
.drag{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

/* 혼자 고르기 */
.pickGrid{display:grid;gap:18px;justify-content:center}
.pk{position:relative;background:#fff;border:3px solid #D8D3CC;border-radius:20px;padding:10px;cursor:pointer;touch-action:none;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px}
.pk img{object-fit:contain;pointer-events:none}
.pk.done{border-color:#BFD9C8;background:#F6FBF8}
.pk.done img{opacity:.55}
.pk .ck{position:absolute;right:10px;top:6px;font-size:30px;color:var(--ok);font-weight:700}

/* 놀이: 문질러 찾기 */
.scr{display:grid;justify-content:center}
.sp{position:relative;border-radius:20px;overflow:hidden;background:#fff;border:3px solid #D8D3CC;touch-action:none}
.sp .under{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4%;padding:8%}
.sp .under img{object-fit:contain;pointer-events:none}
.sp canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity 1s}
.sp .nm{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.93);border-radius:10px;padding:1px 12px;font-family:var(--f-display);font-size:clamp(18px,2.4vw,28px);z-index:2;pointer-events:none}

/* ===== 관리 메뉴 ===== */
.dock{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:none;max-width:calc(100vw - 24px);
  background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(40,30,70,.15)}
body.admin .dock{display:block}
#dockTop{top:10px} #dockBot{bottom:12px;max-width:calc(100vw - 2*200px)}
@media (max-width:900px){ #dockBot{bottom:104px;max-width:calc(100vw - 24px)} }
.dock .rowx{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:7px 10px;scrollbar-width:none}
.dock .rowx::-webkit-scrollbar{display:none}
.dock .g{display:flex;gap:6px;align-items:center;flex:0 0 auto;padding:0 8px;border-left:1px solid var(--line)}
.dock .g:first-child{border-left:0;padding-left:0}
.dock .lbl{font-size:12px;color:var(--muted);margin-right:2px;white-space:nowrap}
.dock button{flex:0 0 auto;min-height:42px;padding:5px 11px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;touch-action:pan-x;white-space:nowrap}
.dock button.on{background:var(--sci);border-color:var(--sci);color:#fff}
.dock button.now{box-shadow:inset 0 -3px 0 var(--sci)}
.dock button.go{background:var(--sci-d);border-color:var(--sci-d);color:#fff;font-weight:700}
.dock button:disabled{opacity:.35;cursor:default}
#dockNote{margin:0 10px 7px;text-align:center;font-size:13px;color:#8A5A12;background:#FFF6E0;border-radius:10px;padding:4px 10px}
#dockNote:empty{display:none}

/* 기록 */
#recView{position:fixed;inset:0;z-index:90;background:rgba(30,24,44,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#recView.on{display:flex}
#recBox{background:#fff;border-radius:18px;max-width:900px;width:100%;padding:20px 22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#recBox h2{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
#recBox h3{font-size:16px;margin:18px 0 8px;color:var(--sci-d)}
#recBox table{border-collapse:collapse;width:100%;font-size:14px}
#recBox th,#recBox td{border-bottom:1px solid #EEE;padding:6px 6px;text-align:left}
#recBox th{background:#F7F4FA;font-weight:700}
.bar100{display:inline-block;width:120px;height:9px;border-radius:5px;background:#EEE;vertical-align:middle;overflow:hidden;margin-right:6px}
.bar100 b{display:block;height:100%;background:var(--sci)}
.tip{font-size:13px;color:var(--muted);background:#F7F4FA;border-radius:10px;padding:10px 12px;line-height:1.7}
.sugg{background:#F1FAF4;border:1px solid #CFE7D8;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7}

/* 활동지 */
#sheet{display:none}

#spot{position:fixed;z-index:2147480500;border:3px solid #D24B3E;border-radius:14px;pointer-events:none;display:none;box-shadow:0 0 0 4000px rgba(0,0,0,.18)}
#spotTip{position:fixed;z-index:2147480501;max-width:300px;background:#fff;border:1px solid #DDD;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#spotTip b{display:block;margin-bottom:2px}
#spotTip .k{color:var(--muted);font-size:12px;float:right}

/* 교사 버튼 (3초 누르기) — 공통 규격 */
#adminBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:43px;height:43px;border-radius:50%;
  z-index:85;touch-action:none;--p:0;padding:0;opacity:.4;transition:opacity .3s;
  border:1px solid rgba(14,92,170,.55);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(170,245,255,.95), rgba(170,245,255,0) 70%),
    radial-gradient(circle at 50% 40%, #4FC4F5 0%, #1E8BE0 55%, #0D5FB8 100%);
  box-shadow:inset 0 -4px 10px rgba(150,240,255,.55), inset 0 3px 6px rgba(0,40,100,.45), 0 4px 10px rgba(0,60,130,.35), 0 1px 2px rgba(0,30,70,.4)}
#adminBtn::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
  background:linear-gradient(to bottom, rgba(255,255,255,.95), rgba(255,255,255,.35) 60%, rgba(255,255,255,.05));pointer-events:none}
#adminBtn::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(#22AFBC calc(var(--p)*360deg),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 22px,#000 23px);mask:radial-gradient(circle,transparent 22px,#000 23px);opacity:.9}
#adminBtn .ab-label{position:relative;display:block;text-align:center;font-family:var(--f-body);font-weight:700;font-size:8.5px;letter-spacing:.02em;line-height:1;color:#FFFFFF;text-shadow:0 1px 1.5px rgba(0,50,110,.65);pointer-events:none}
body.admin #adminBtn .ab-label{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:0;color:#9FF3F5;text-shadow:0 0 6px rgba(63,207,210,.7),0 1px 1px rgba(0,0,0,.6)}
body.admin #adminBtn{opacity:.6;border-color:rgba(10,20,26,.8);
  background:
    radial-gradient(ellipse 70% 45% at 50% 88%, rgba(110,230,240,.85), rgba(110,230,240,0) 70%),
    radial-gradient(circle at 50% 40%, #3D4F5A 0%, #17242C 60%, #05090C 100%);
  box-shadow:inset 0 -4px 10px rgba(90,220,235,.45), inset 0 3px 6px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4), 0 0 0 3px rgba(63,207,210,.35)}
body.setup #adminBtn{display:none}
@media print{
  body.printRec *{visibility:hidden} body.printRec #recBox, body.printRec #recBox *{visibility:visible} body.printRec #recBox{position:absolute;left:0;top:0;box-shadow:none} body.printRec #recView{position:static;background:none;padding:0} .noprint{display:none!important}
  body.printSheet>*:not(#sheet){display:none!important} body.printSheet #sheet{display:block}
  body{overflow:visible!important;background:#fff}
}
@media (max-width:600px){.title h1{font-size:34px}#startBtn{min-width:200px;font-size:24px}.today .col{width:104px}}
</style>
</head>
<body class="setup">

<div id="setupView"><div class="wrap">
  <div class="title"><span class="mark" id="mark" aria-hidden="true"></span><h1><small class="kick">차름 과학</small>무엇으로 만들었을까</h1></div>
  <p class="sub">물체의 이름과, 그 물체를 만든 물질을 나누어 봐요</p>

  <div class="card" id="c1"><h2><span class="num">1</span>누구와 할까요?</h2>
    <div class="row" id="stuRow"></div>
    <div class="newStu hidden" id="newStu"><input id="newName" maxlength="20" placeholder="학생 이름"><button class="chip sm on" id="newOk">넣기</button><button class="chip sm" id="newNo">그만</button></div>
    <div class="mode" id="whoRow"></div>
    <div id="resumeBox"></div>

/* ================= 한국어 ================= */
function batchim(w){const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;}
function rieul(w){const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28===8;}

function getCtx(){ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } return actx; }
function unlockAudio(){ try{ const c=getCtx(); if(!c) return; if(c.state==='suspended') c.resume();
  const b=c.createBuffer(1,240,24000), x=c.createBufferSource(); x.buffer=b; x.connect(c.destination); x.start(); }catch(e){} }
function cleanF(f,rate){
  const n=f.length, W=Math.round(rate*0.02), nw=Math.max(1,Math.floor(n/W)), rms=new Float32Array(nw); let mx=0;
  for(let w=0;w<nw;w++){ let t=0; for(let k=w*W;k<Math.min(n,(w+1)*W);k++) t+=f[k]*f[k]; rms[w]=Math.sqrt(t/W); if(rms[w]>mx) mx=rms[w]; }
  const th=Math.max(0.003,mx*0.04), seg=[]; let on=-1;
  for(let w=0;w<=nw;w++){ const up=w<nw&&rms[w]>=th; if(up&&on<0) on=w; if(!up&&on>=0){ seg.push([on,w-1]); on=-1; } }
  while(seg.length>1){ const l=seg[seg.length-1], pv=seg[seg.length-2]; if(l[1]-l[0]+1<=3 && l[0]-pv[1]>=15) seg.pop(); else break; }
  const a=seg.length?seg[0][0]:0, z=seg.length?seg[seg.length-1][1]:nw-1;
  const st=Math.max(0,(a-4)*W), en=Math.min(n,(z+1)*W+Math.round(rate*0.22));
  const body=f.slice(st,en), L=body.length, fi=Math.min(L,Math.round(rate*0.008)), fo=Math.min(L,Math.round(rate*0.04));
  for(let k=0;k<fi;k++) body[k]*=k/fi; for(let k=0;k<fo;k++) body[L-1-k]*=k/fo;
  const lead=Math.round(rate*0.06), out=new Float32Array(lead+L); out.set(body,lead); return {data:out,rate};
}
function playClip(clip){ return new Promise(res=>{ const c=getCtx(); if(!c){res(); return;} if(c.state==='suspended') c.resume();
  const b=c.createBuffer(1,clip.data.length,clip.rate); if(b.copyToChannel) b.copyToChannel(clip.data,0); else b.getChannelData(0).set(clip.data);

function sha1Bytes(msg){

  for(let r=0;out.length<N&&r<40;r++){ shuffle(ms).forEach(m=>{ if(out.length<N&&by[m][r]) out.push(by[m][r].a); }); }
  S.mpick=out;
}
function makePlan(){
  const lv=S.level;
  if(S.mode==='mat'){
    const ms=S.msel.filter(m=>MATS[lv].includes(m));
    if(!S.mpick.length||S.mpick.some(a=>!POOL[lv].some(x=>x.a===a&&ms.includes(x.m)))) pickByMat();
    const items=S.mpick.map(a=>POOL[lv].find(x=>x.a===a)).filter(Boolean);
    return [{mats:MATS[lv].filter(m=>items.some(x=>x.m===m)),items,label:'물질 고르기',bi:null}];
  }
  const sel=(S.bsel||[]).filter(i=>BUN[lv][i]); if(!sel.length) sel.push(0);
  return sel.map(i=>({mats:BUN[lv][i].mats,items:BUN[lv][i].items,label:'묶음 '+(i+1),bi:i}));
}
function planOk(plan){ return plan.length&&plan.every(b=>b.mats.length>=2&&b.items.length>=2&&b.mats.length<=MAXM); }

/* ================= 수업 진행 =================
   한 묶음: 보기(물체마다) → 물체 찾기(이름 듣고 그림) → 물질 고르기(물체 보고 물질) → 정리하기(물질 상자에 넣기) → 사진에서(실제 물건의 물질)
   → 문질러 찾기(학습 뒤 보상, 기록 안 함) → 끝 장면 */
let RUN=null;
function photosFor(bd){ const names=bd.items.map(x=>x.a); return shuffle(PHOTO.filter(p=>bd.mats.includes(p.m)&&!names.includes(p.a))).slice(0,2); }
function buildRun(lv,plan,idx){
  const bd=plan[idx], phases=[];
  PHASES.forEach(([k])=>{ if(!S.steps[k]) return;
    let items;
    if(k==='show') items=[...bd.items];
    else if(k==='photo') items=photosFor(bd).map(p=>({a:p.a,m:p.m,ph:p}));
    else items=shuffleNoRepeat(bd.items);
    if(items.length) phases.push({k,items}); });
  return {lv,plan,idx,b:bd.bi==null?-1:bd.bi,bd,phases,pi:0,ii:0,g:Date.now(),placed:{},token:0};
}
function shuffleNoRepeat(items){ /* 같은 물질이 세 번 이어 나오지 않게 */
  for(let t=0;t<30;t++){ const s=shuffle(items); let ok=true; for(let i=2;i<s.length;i++) if(s[i].m===s[i-1].m&&s[i].m===s[i-2].m) ok=false; if(ok) return s; }
  return shuffle(items);
}
let ALONE=null;   /* 학생 혼자: {plan, done:Set} */
function startLesson(rs){
  unlockAudio(); chooseEngine();
  const plan=rs&&rs.plan?rs.plan:makePlan();
  document.body.classList.remove('setup'); goFull();
  if(!rs&&S.who==='alone'&&plan.length>1){ ALONE={plan,done:new Set(),lv:S.level}; RUN=null; setTimeout(()=>showPicker(),350); return; }
  ALONE=null;
  RUN=buildRun(rs?rs.lv:S.level,plan,rs&&rs.plan?Math.min(rs.idx||0,plan.length-1):0);
  if(rs){ const pi=RUN.phases.findIndex(p=>p.k===rs.ph); if(pi>=0){ RUN.pi=pi; RUN.ii=Math.min(rs.ii||0,RUN.phases[pi].items.length-1); } }
  setTimeout(()=>runStep(),350);
}
function totalItems(){ return RUN.phases.reduce((n,p)=>n+p.items.length,0); }
function doneItems(){ let n=0; for(let i=0;i<RUN.pi;i++) n+=RUN.phases[i].items.length; return n+RUN.ii; }
function renderProg(){
  const pr=$('prog'); pr.innerHTML='';
  if(!RUN||RUN.ending||!RUN.phases.length){ pr.className=''; return; }
  const T=totalItems(), D=doneItems();
  if(T>10){ pr.className='bar'; pr.innerHTML='<b style="width:'+Math.max(4,Math.round((D+1)/T*100))+'%"></b>'; return; }
  pr.className=''; for(let i=0;i<T;i++){ const c=document.createElement('i'); if(i<D) c.className='d'; else if(i===D) c.className='n'; pr.appendChild(c); }
}
function saveSpot(){ if(!RUN||RUN.ending||ALONE) return; const p=RUN.phases[RUN.pi]; if(!p) return; RESUME[S.stu||'_']={lv:RUN.lv,plan:RUN.plan,idx:RUN.idx,ph:p.k,ii:RUN.ii,t:Date.now()}; saveResume(); }
window.addEventListener('pagehide',saveSpot);
function clearStage(){ const st=$('stage'); st.innerHTML=''; document.querySelectorAll('.drag').forEach(x=>x.remove());
  if(S.stu&&!document.body.classList.contains('setup')){ const d=document.createElement('div'); d.className='recDot'; d.title='기록 중'; st.appendChild(d); } }
function area(){ const r=$('stage').getBoundingClientRect(); return {w:r.width-32,h:r.height-70}; }
const portrait=()=>{ const A=area(); return A.w<A.h*1.05; };
function nextItem(){
  if(!RUN) return;
  RUN.ii++;
  if(RUN.ii>=RUN.phases[RUN.pi].items.length){ RUN.pi++; RUN.ii=0; }
  if(RUN.pi>=RUN.phases.length){ finishBundle(); return; }
  saveSpot(); runStep();
}
function runStep(){
  if(!RUN) return;
  if(!RUN.phases.length){ finishBundle(); return; }
  RUN.token++; clearTimers(); stopVoice(); clearStage(); renderProg(); saveSpot();
  const ph=RUN.phases[RUN.pi], it=ph.items[RUN.ii];
  ({show:stepShow,obj:stepObj,mat:stepMat,sort:stepSort,photo:stepPhoto})[ph.k](it,RUN.token);
}
let TIMERS=[]; function later(fn,ms){ TIMERS.push(setTimeout(fn,ms)); } function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; }
const alive=tok=>RUN&&RUN.token===tok&&!S.admin;

/* 카드 만들기 */
function objCard(a,s,cls){ const c=document.createElement('div'); c.className='oc'+(cls?' '+cls:''); c.dataset.a=a; c.style.width=c.style.height=s+'px'; c.innerHTML='<img src="'+pic(a)+'" alt="'+esc(a)+'" draggable="false">'; return c; }
function matCard(m,s,cls){ const c=document.createElement('div'); c.className='mc'+(cls?' '+cls:''); c.dataset.m=m; c.style.width=s+'px'; c.innerHTML='<div class="tex" style="background-image:'+TEX[m].replace(/"/g,"'")+'"></div><div class="lab" style="font-size:'+Math.max(14,Math.min(s*(MAT[m].label.length>2?0.15:0.19),36))+'px">'+MAT[m].label+'</div>'; return c; }
/* 보기 카드 줄: 세로 화면이고 3장 넘으면 두 줄 */
function optRow(n,cs,gap){ const row=document.createElement('div'); row.className='opts'; row.style.columnGap=gap+'px';
  if(portrait()&&n>3){ row.style.flexWrap='wrap'; row.style.maxWidth=(cs*2+gap+8)+'px'; row.style.rowGap=gap+'px'; } return row; }
function optSize(n,availW,availH,gap,lab){ const cols=(portrait()&&n>3)?2:n, rows=Math.ceil(n/cols);
  return Math.max(70,Math.min((availW-gap*(cols-1))/cols-8, (availH-gap*(rows-1))/rows-(lab?58:0), lab?230:250)); }

/* ---- 1. 보기: 물체 → "의자예요." → 물질 카드가 옆에 이어지며 "나무로 만들었어요." ---- */
async function stepShow(it,tok){
  const st=$('stage'), A=area(), por=portrait();

/* 고르기 공통: 견본 먼저 → 약 1초 뒤 보기가 서서히. 8초 뒤 안내 다시 → 16초 뒤 정답 빛남. 틀리면 정답 빛남(도움으로 기록) */
function choiceRound(tok,{say,cards,isRight,onRight,rec}){
  let wrong=null, helped=false, over=false, armed=false;
  const glow=()=>{ helped=true; cards.filter(isRight).forEach(c=>c.classList.add('glow')); };
  later(()=>{ if(alive(tok)&&!over){ cards.forEach(c=>{ c.style.opacity=1; }); armed=true; } },1000);
  speak(say).then(()=>{ if(!alive(tok)) return;
    later(()=>{ if(alive(tok)&&!over) speak(say); },8000);
    later(()=>{ if(alive(tok)&&!over) glow(); },16000);
  });
  cards.forEach(c=>tapper(c,()=>{
    if(!armed||over||!alive(tok)) return;
    if(isRight(c)){ over=true; clearTimers(); c.classList.remove('glow'); c.classList.add('right'); chime();
      rec(wrong,helped||!!wrong); onRight(c); }
    else if(!wrong){ wrong=c; glow(); }
  }));
}
function logRow(ph,it,wrongId,help){
  if(!S.stu) return;
  LOG.push({s:S.stu,t:Date.now(),g:RUN.g,lv:RUN.lv,b:RUN.b>=0?RUN.b+1:RUN.bd.label,ph,a:it.a,m:it.m,res:help?'help':'first',w:wrongId||''}); saveLog();
}
const dim=(cards,c)=>cards.forEach(x=>{ if(x!==c) x.style.opacity=.25; });

/* ---- 2. 물체 찾기: 견본 = 이름 글자(말풍선), 보기 = 물체 그림 2~4장 ---- */
function stepObj(it,tok){
  const st=$('stage'), A=area(), k=Math.min(LV[RUN.lv].opts+1,4)-1;
  const pool=RUN.bd.items.filter(x=>x.a!==it.a&&!PAIRS.some(p=>p.includes(x.a)&&p.includes(it.a)));
  const picks=[]; shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.some(y=>y.m===x.m)) picks.push(x); }); shuffle(pool).forEach(x=>{ if(picks.length<k&&!picks.includes(x)) picks.push(x); });
  const opts=shuffle([it,...picks]), n=opts.length, gap=Math.max(16,A.w*0.03);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML='<div class="word" style="font-size:'+Math.min(A.h*0.1,70)+'px">'+esc(it.a)+'</div>';
  const cs=optSize(n,A.w,A.h-Math.min(A.h*0.1,70)-90,gap,false), row=optRow(n,cs,gap);
  opts.forEach(x=>row.appendChild(objCard(x.a,cs,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];
  choiceRound(tok,{say:askObj(it.a),cards,isRight:c=>c.dataset.a===it.a,
    rec:(w,h)=>logRow('obj',it,w&&w.dataset.a,h),
    onRight:async c=>{ dim(cards,c); await speak(isLine(it.a)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});
}

/* ---- 3. 물질 고르기: 견본 = 물체 그림(말풍선), 보기 = 물질 카드 2~3장 ---- */
function matOptions(it){ const k=LV[RUN.lv].opts-1; const others=shuffle(RUN.bd.mats.filter(m=>m!==it.m)).slice(0,k); return shuffle([it.m,...others]); }
function stepMat(it,tok){
  const st=$('stage'), A=area(), opts=matOptions(it), n=opts.length, gap=Math.max(16,A.w*0.03);
  const sh=Math.min(A.h*0.28,210);
  const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML='<img class="o" src="'+pic(it.a)+'" alt="'+esc(it.a)+'" style="width:'+sh+'px;height:'+sh+'px">';
  const cs=optSize(n,A.w,A.h-sh-80,gap,true), row=optRow(n,cs,gap);
  opts.forEach(m=>row.appendChild(matCard(m,cs,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];
  choiceRound(tok,{say:askMat(it.a),cards,isRight:c=>c.dataset.m===it.m,
    rec:(w,h)=>logRow('mat',it,w&&w.dataset.m,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; await wait(900); if(alive(tok)) nextItem(); }});
}

/* ---- 5. 사진에서: 실제 사진 속 물건만 밝게(말풍선) → 물질 카드 ---- */
/* 사진은 그 물건 둘레만 잘라 크게(둘레 여유를 두어 어디인지 알 수 있게), 그 물건 밖은 어둡게 */
function photoBox(p,maxW,maxH){
  const [x0,y0,x1,y1]=p.box, bw=x1-x0, bh=y1-y0, pad=Math.max(bw,bh)*0.45;
  let cx0=Math.max(0,x0-pad), cy0=Math.max(0,y0-pad), cx1=Math.min(p.w,x1+pad), cy1=Math.min(p.h,y1+pad);
  /* 너무 길쭉하지 않게(가로:세로 3:4 ~ 16:9) */
  const want=r=>{ const cw=cx1-cx0, ch=cy1-cy0;
    if(cw/ch<r){ const add=(ch*r-cw)/2; cx0=Math.max(0,cx0-add); cx1=Math.min(p.w,cx1+add); }
    else if(cw/ch>16/9){ const add=(cw*9/16-ch)/2; cy0=Math.max(0,cy0-add); cy1=Math.min(p.h,cy1+add); } };
  want(0.75);
  const cw=cx1-cx0, ch=cy1-cy0, k=Math.min(maxW/cw,maxH/ch), w=cw*k, h=ch*k;
  const d=document.createElement('div'); d.className='phWrap'; d.style.width=w+'px'; d.style.height=h+'px';
  d.innerHTML='<img src="'+PH_URL(p)+'" alt="" draggable="false" style="inset:auto;left:'+(-cx0*k)+'px;top:'+(-cy0*k)+'px;width:'+(p.w*k)+'px;height:'+(p.h*k)+'px">'
    +'<div class="hole" style="left:'+((x0-cx0)*k)+'px;top:'+((y0-cy0)*k)+'px;width:'+(bw*k)+'px;height:'+(bh*k)+'px"></div>';
  return d;
}
function stepPhoto(it,tok){
  const st=$('stage'), A=area(), opts=matOptions(it), n=opts.length, gap=Math.max(16,A.w*0.03);
  const cs0=optSize(n,A.w,A.h*0.36,gap,true);
  const bub=document.createElement('div'); bub.className='bubble'; bub.style.padding='8px';
  const pb=photoBox(it.ph,Math.min(A.w*0.8,900),A.h-cs0-120); bub.appendChild(pb);
  const row=optRow(n,cs0,gap); opts.forEach(m=>row.appendChild(matCard(m,cs0,'fadeIn')));
  st.appendChild(bub); st.appendChild(row);
  const cards=[...row.children];
  choiceRound(tok,{say:askMat(it.a),cards,isRight:c=>c.dataset.m===it.m,
    rec:(w,h)=>logRow('photo',it,w&&w.dataset.m,h),
    onRight:async c=>{ dim(cards,c); await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; pb.classList.add('lit'); await wait(1600); if(alive(tok)) nextItem(); }});
}

/* ---- 4. 정리하기: 물질 상자를 늘 같은 자리에 두고, 물체를 하나씩 맞는 상자에(끌거나 상자를 누름). 틀리면 반응 없음 ---- */
function binEl(m,w,h){
  const b=document.createElement('div'); b.className='bin'; b.dataset.m=m; b.style.width=w+'px'; b.style.height=h+'px';
  const lh=Math.max(46,h*0.3);
  b.innerHTML='<div class="lid" style="height:'+lh+'px;background-image:'+TEX[m].replace(/"/g,"'")+'"><b style="font-size:'+Math.max(18,Math.min(lh*0.42,34))+'px">'+MAT[m].label+'</b><span class="slot"></span></div><div class="body"></div>';
  return b;
}
function fillBin(b,list,newA){ const body=b.querySelector('.body'), w=b.clientWidth; body.innerHTML='';
  const s=Math.max(28,Math.min(w/3.3,(b.clientHeight-b.querySelector('.lid').offsetHeight)/2.3));
  list.forEach(a=>{ const im=document.createElement('img'); im.src=pic(a); im.alt=a; im.style.width=im.style.height=s+'px'; if(a===newA) im.className='new'; body.appendChild(im); }); }
function binRow(mats,A,availH){
  const n=mats.length, gap=Math.max(14,A.w*0.02), cols=(portrait()&&n>2)?2:n, rows=Math.ceil(n/cols);
  const w=Math.min((A.w-gap*(cols-1))/cols-6,330), h=Math.min((availH-gap*(rows-1))/rows, w*1.2);
  const row=document.createElement('div'); row.className='bins'; row.style.columnGap=gap+'px';
  if(cols<n){ row.style.flexWrap='wrap'; row.style.maxWidth=(w*cols+gap*(cols-1)+8)+'px'; row.style.rowGap=gap+'px'; }
  mats.forEach(m=>row.appendChild(binEl(m,w,h))); return row;
}
function stepSort(it,tok){
  const st=$('stage'), A=area(), mats=RUN.bd.mats;
  const os=Math.min(A.h*0.26,200);
  const row=binRow(mats,A,A.h-os-40);
  const tray=document.createElement('div'); tray.className='tray';
  const ac=objCard(it.a,os); tray.appendChild(ac); st.appendChild(row); st.appendChild(tray);
  const bins=[...row.children];
  requestAnimationFrame(()=>bins.forEach(b=>fillBin(b,RUN.placed[b.dataset.m]||[])));
  let wrong=null, helped=false, over=false, drag=null;
  speak(nameLine(it.a)).then(()=>{ if(!alive(tok)) return;
    const again=()=>{ later(()=>{ if(alive(tok)&&!over){ if(drag||pdown) return again(); speak(nameLine(it.a)).then(again); } },3000); }; again();   /* 놀이 신호: 말이 끝나고 3초마다, 낱말만 */
    later(()=>{ if(alive(tok)&&!over){ helped=true; bins.filter(b=>b.dataset.m===it.m).forEach(b=>b.classList.add('glow')); } },16000);
  });
  const tryPlace=async b=>{
    if(over||!alive(tok)) return;
    if(b.dataset.m!==it.m){ if(!wrong) wrong=b.dataset.m; return; }
    over=true; clearTimers(); b.classList.remove('glow'); chime(); logRow('sort',it,wrong,helped||!!wrong);
    ac.style.visibility='hidden';
    (RUN.placed[it.m]=RUN.placed[it.m]||[]).push(it.a); fillBin(b,RUN.placed[it.m],it.a);
    await speak(fullLine(it.a,it.m)); if(!alive(tok)) return; await wait(700); if(alive(tok)) nextItem();
  };
  bins.forEach(b=>b.addEventListener('pointerdown',()=>{ if(!drag) tryPlace(b); }));
  ac.addEventListener('pointerdown',e=>{ if(over) return; e.preventDefault(); try{ ac.setPointerCapture(e.pointerId); }catch(_){} drag={x:e.clientX,y:e.clientY,on:false,g:null}; });
  ac.addEventListener('pointermove',e=>{ if(!drag) return;
    if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){ drag.on=true; const g=document.createElement('img'); g.className='drag'; g.src=pic(it.a); g.style.width=g.style.height=os*0.8+'px'; document.body.appendChild(g); drag.g=g; ac.style.opacity=.3; }
    if(drag.on){ drag.g.style.left=e.clientX+'px'; drag.g.style.top=e.clientY+'px'; } });
  const endDrag=e=>{ if(!drag) return; const d=drag; drag=null; if(d.g) d.g.remove(); ac.style.opacity=1;
    if(d.on){ const el=document.elementFromPoint(e.clientX,e.clientY); const b=el&&el.closest('.bin'); if(b) tryPlace(b); } };
  ac.addEventListener('pointerup',endDrag); ac.addEventListener('pointercancel',endDrag);
}

/* ---- 끝: 마친 묶음 기록 → (문질러 찾기) → 끝 장면. 놀이·끝 장면은 학습 뒤 보상이라 기록하지 않음 ---- */
function finishBundle(){
  const who=S.stu||'_';
  if(RUN.b>=0){ const key=RUN.lv+'-'+(RUN.b+1); DONE[who]=DONE[who]||{}; DONE[who][key]=(DONE[who][key]||0)+1; store.set('done',JSON.stringify(DONE)); }
  if(!ALONE&&RUN.idx<RUN.plan.length-1){ RESUME[who]={lv:RUN.lv,plan:RUN.plan,idx:RUN.idx+1,ph:(RUN.phases[0]||{k:'show'}).k,ii:0,t:Date.now()}; } else delete RESUME[who];
  saveResume();
  if(ALONE) ALONE.done.add(RUN.idx);
  /* 정리하기를 안 했으면 끝 장면 상자는 묶음 물체로 채움 */
  RUN.bd.items.forEach(({a,m})=>{ const l=RUN.placed[m]=RUN.placed[m]||[]; if(!l.includes(a)) l.push(a); });
  RUN.ending=true; RUN.gameDone=!S.game;
  startEnd();
}
function startEnd(){
  RUN.token++; const tok=RUN.token; clearTimers(); stopVoice(); clearStage(); renderProg();
  if(!RUN.gameDone) playRub(tok); else drawEnd(tok);
}
async function drawEnd(tok){
  const st=$('stage'), A=area();
  const row=binRow(RUN.bd.mats,A,A.h-10); st.appendChild(row);
  requestAnimationFrame(()=>[...row.children].forEach(b=>fillBin(b,RUN.placed[b.dataset.m]||[])));
  await wait(600); if(!alive(tok)) return;
  await speak(END_LINE); if(!alive(tok)) return;
  if(ALONE){ await wait(4000); if(alive(tok)) showPicker(); return; }
  if(RUN.idx<RUN.plan.length-1){ await wait(4500); if(!alive(tok)) return; RUN=buildRun(RUN.lv,RUN.plan,RUN.idx+1); runStep(); }
}

/* ---- 문질러 찾기(보상 놀이): 물질 결로 덮인 판을 손으로 문지르면 그 물질로 만든 물체가 나타남. 진 것·시간 재기 없음 ---- */
function playRub(tok){
  const st=$('stage'), A=area(), mats=RUN.bd.mats, n=mats.length, gap=Math.max(14,A.w*0.02);
  const cols=portrait()?Math.min(n,2):n, rows=Math.ceil(n/cols);
  const s=Math.min((A.w-gap*(cols-1))/cols-6,(A.h-gap*(rows-1))/rows-6,360);
  const g=document.createElement('div'); g.className='scr'; g.style.gridTemplateColumns='repeat('+cols+','+s+'px)'; g.style.gap=gap+'px'; st.appendChild(g);
  let left=n, finished=false;
  const finish=()=>{ if(finished) return; finished=true; later(()=>{ if(!alive(tok)) return; RUN.gameDone=true; startEnd(); },2200); };
  mats.forEach(m=>{
    const p=document.createElement('div'); p.className='sp'; p.style.width=p.style.height=s+'px';
    const objs=RUN.bd.items.filter(x=>x.m===m).map(x=>x.a), is=objs.length>2?s*0.36:s*0.42;
    p.innerHTML='<div class="under">'+objs.map(a=>'<img src="'+pic(a)+'" alt="" style="width:'+is+'px;height:'+is+'px">').join('')+'</div><span class="nm">'+MAT[m].label+'</span>';
    const cv=document.createElement('canvas'), dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(s*dpr); cv.height=Math.round(s*dpr); p.appendChild(cv); g.appendChild(p);
    const cx=cv.getContext('2d'), im=new Image();
    im.onload=()=>{ cx.drawImage(im,0,0,cv.width,cv.height); }; im.src=TEX[m].slice(5,-2);
    cx.fillStyle='#bbb'; cx.fillRect(0,0,cv.width,cv.height);
    let down=false, last=null, open=false;
    const R=s*0.11*dpr;
    const rub=e=>{ const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*dpr, y=(e.clientY-r.top)*dpr;
      cx.globalCompositeOperation='destination-out'; cx.lineCap='round'; cx.lineWidth=R*2; cx.beginPath();
      if(last){ cx.moveTo(last[0],last[1]); cx.lineTo(x,y); cx.stroke(); } else { cx.arc(x,y,R,0,Math.PI*2); cx.fill(); }
      last=[x,y]; cx.globalCompositeOperation='source-over'; };
    const check=()=>{ if(open) return; try{ const d=cx.getImageData(0,0,cv.width,cv.height).data; let c=0,t=0; const sp=Math.max(1,Math.round(cv.width/48));
        for(let y=0;y<cv.height;y+=sp) for(let x=0;x<cv.width;x+=sp){ t++; if(d[(y*cv.width+x)*4+3]<40) c++; }
        if(c/t>0.5){ open=true; cv.style.opacity=0; chime(); left--; if(!left) finish(); } }catch(_){ open=true; cv.style.opacity=0; left--; if(!left) finish(); } };
    p.addEventListener('pointerdown',e=>{ if(!alive(tok)) return; e.preventDefault(); down=true; last=null; try{ p.setPointerCapture(e.pointerId); }catch(_){} rub(e); });
    p.addEventListener('pointermove',e=>{ if(down&&alive(tok)) rub(e); });
    const up=()=>{ if(!down) return; down=false; last=null; check(); };
    p.addEventListener('pointerup',up); p.addEventListener('pointercancel',up);
  });
  speak(RUB_LINE);
  later(()=>{ if(!alive(tok)||finished) return; g.querySelectorAll('canvas').forEach(c=>c.style.opacity=0); finish(); },60000);   /* 1분이 지나면 남은 판도 저절로 열림 */
}

    if(hard.length) sug+=' 도움이 더 필요한 물체('+hard.slice(0,3).map(x=>x[0].split('|')[0]).join(', ')+')가 든 묶음을 다시 해 봅니다.';
    h+='<h3>다음에 해 볼 것</h3><div class="sugg">'+sug+' '+(ex?'':btn)+'</div>';

      +rows.slice().reverse().slice(0,400).map(r=>'<tr><td>'+dayOf(r.t)+' '+new Date(r.t).toTimeString().slice(0,5)+'</td><td>'+r.lv+'-'+esc(r.b)+'</td><td>'+PH_NAME[r.ph]+'</td><td>'+esc(r.a)+'</td><td>'+mName(r.m)+'</td><td>'+(r.res==='first'?'바로':'도움 받아')+'</td><td>'+esc(wName(r))+'</td></tr>').join('')+'</table></details>';
  }

  h+='<div class="row noprint" style="margin-top:12px"><button class="chip sm" id="recCsv">CSV 내보내기</button><button class="chip sm" id="recPrint">출력 (A4)</button></div>';

<script id="holdBubble">
/* 관리 버튼을 3초 누르는 동안: (휴대폰·태블릿을 손가락으로 누를 때만) 버튼 조금 위에 투명한 아쿠아 원이 세 번. 전자칠판·PC는 버튼 둘레 고리만 */
(function(){
  const btn = document.querySelector('#adminBtn, #aqua'); if (!btn) return;
  const st = document.createElement('style');
  st.textContent = '.hb-dot{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:2147483000;opacity:0;'
    + 'background:radial-gradient(circle at 50% 40%,rgba(200,250,252,.75),rgba(120,225,232,.35) 60%,rgba(80,200,210,.2));'
    + 'border:1.5px solid rgba(70,185,200,.55);box-shadow:0 0 10px rgba(130,230,238,.55)}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.className = 'hb-dot'; document.body.appendChild(dot);
  let down = false, raf = 0, useDot = false;
  const mobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const prog = () => { const v = getComputedStyle(btn).getPropertyValue('--p').trim(); const n = parseFloat(v) || 0; return /%$/.test(v) ? n / 100 : n; };
  const hide = () => { dot.style.opacity = 0; btn.style.opacity = ''; };
  const loop = () => {
    const p = prog();
    if (down && p > 0.01 && p < 1) {
      const r = btn.getBoundingClientRect(), S = 40;
      dot.style.left = Math.max(4, Math.min(innerWidth - S - 4, r.left + r.width / 2 - S / 2)) + 'px';
      dot.style.top = Math.max(4, r.top - S - 34) + 'px';
      btn.style.opacity = '.75';
      if (!useDot) return void (raf = requestAnimationFrame(loop));
      dot.style.opacity = (0.9 * Math.sin(Math.PI * ((p * 3) % 1))).toFixed(3);
    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);
  const up = () => { down = false; cancelAnimationFrame(raf); hide(); };
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, up, true));
})();
</script>
<script id="adminGate">
/* 관리 메뉴 열기 2단계: 관리 버튼을 3초 누른 뒤, 왼쪽 위에 3초 동안 나타나는 작은 점을 눌러야 열림 */
window.AdminGate = (function () {
  const st = document.createElement('style');
  st.textContent = '#agDot{position:fixed;left:18px;top:18px;width:62px;height:62px;border-radius:50%;z-index:2147483600;display:none;cursor:pointer;touch-action:none;'
    + 'background:radial-gradient(circle at 50% 38%,rgba(210,252,253,.9),rgba(120,225,232,.55) 60%,rgba(70,190,205,.4));border:2px solid rgba(34,175,188,.75);box-shadow:0 0 10px rgba(120,225,232,.6)}'
    + '#agDot svg{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}'
    + '#agDot circle{fill:none;stroke:#22AFBC;stroke-width:4;stroke-linecap:round}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.id = 'agDot'; dot.setAttribute('aria-label', '관리 열기');
  dot.innerHTML = '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="34"/></svg>';
  document.body.appendChild(dot);
  const ring = dot.querySelector('circle'), L = 2 * Math.PI * 34;
  ring.style.strokeDasharray = L;
  let cb = null, t0 = 0, raf = 0, WAIT = 3000;
  const hide = () => { dot.style.display = 'none'; cancelAnimationFrame(raf); cb = null; };
  const tick = () => { const p = (performance.now() - t0) / WAIT; if (p >= 1 || !cb) return hide(); ring.style.strokeDashoffset = L * p; raf = requestAnimationFrame(tick); };
  let armed = false;
  dot.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!cb) return; armed = true; cancelAnimationFrame(raf); try { dot.setPointerCapture(e.pointerId); } catch (x) {} });
  const done = e => { e.preventDefault(); e.stopPropagation(); if (!armed) return; armed = false; const f = cb; cb = null; setTimeout(() => { dot.style.display = 'none'; }, 60); if (f) f(); };
  dot.addEventListener('pointerup', done); dot.addEventListener('pointercancel', done);
  dot.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  return { ask(fn) { cb = fn; t0 = performance.now(); ring.style.strokeDashoffset = 0; dot.style.display = 'block'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, cancel: hide };
})();
</script>
<script id="reportLink">

<script id="endLesson">
/* 수업 끝내기: 관리 메뉴를 열면 전체 화면에서 나오고(잠깐 나가기), 관리 메뉴에 있는 동안 왼쪽 아래 "⏻ 수업 끝내기"(두 번 눌러야)로 앱을 아예 끝냄 */
(function(){
  var BOARD='https://www.charum.org/webapp';
  var ctxs=[]; ['AudioContext','webkitAudioContext'].forEach(function(n){ var C=window[n]; if(!C||C.__endWrap) return;
    var W=function(){ var c=new (Function.prototype.bind.apply(C,[null].concat([].slice.call(arguments))))(); ctxs.push(c); return c; };
    W.prototype=C.prototype; W.__endWrap=true; try{ window[n]=W; }catch(e){} });
  var css=document.createElement('style');
  css.textContent='#endBtn{position:fixed;left:12px;bottom:52px;z-index:2147480001;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
   +'#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
   +'#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
   +'#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin(){ try{ return document.body.classList.contains('admin'); }catch(e){ return false; } }
  function exitFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
  function hush(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio,video').forEach(function(m){ try{ m.pause(); }catch(e){} }); ctxs.forEach(function(c){ try{ c.suspend(); }catch(e){} }); }
  function end(){
    hush(); try{ window.dispatchEvent(new Event('pagehide')); }catch(e){} exitFull();
    var cv=document.createElement('div'); cv.id='endCover';
    cv.innerHTML='<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="'+BOARD+'">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick=function(){ location.reload(); };
    ['pointerdown','click','touchstart','keydown'].forEach(function(t){ cv.addEventListener(t,function(e){ e.stopPropagation(); });   /* 단추가 받은 뒤 막음(잡는 단계에서 막으면 "다시 시작"까지 막힘, 2026-10-26) */ });
    setTimeout(function(){ try{ window.close(); }catch(e){} },150);
    setInterval(hush,1000);
  }
  var was=false, sureT=0;
  function tick(){
    var b=document.getElementById('endBtn');
    if(!b){ b=document.createElement('button'); b.id='endBtn'; b.type='button'; b.title='앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML='<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
        if(!b.classList.contains('sure')){ b.classList.add('sure'); b.querySelector('.t').textContent='한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT=setTimeout(function(){ b.classList.remove('sure'); b.querySelector('.t').textContent='수업 끝내기'; },3000); return; }
        end(); });
      ['click','pointerup'].forEach(function(t){ b.addEventListener(t,function(e){ e.stopPropagation(); }); });
      document.body.appendChild(b); }

    was=a;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,400);
})();

<script id="printFit">
/* 차름 공통: 출력 — 전체 화면이면 먼저 나간 뒤 인쇄(전체 화면에서 바로 인쇄하면 미리보기가 왼쪽 위에 작게 붙음),
   PrintFit.page(방향, 여백mm, 덧붙일 인쇄 CSS) 로 이번 한 번의 종이 방향을 정함(인쇄가 끝나면 원래대로) */
(function(){
  var P=window.print.bind(window);
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  window.print=function(){
    if(!fsEl()){ P(); return; }
    var done=false; function go(){ if(done) return; done=true; setTimeout(P,300); }
    document.addEventListener('fullscreenchange',go,{once:true});
    document.addEventListener('webkitfullscreenchange',go,{once:true});
    try{ var ex=document.exitFullscreen||document.webkitExitFullscreen; var r=ex&&ex.call(document); if(r&&r.catch) r.catch(go); }catch(e){ go(); }
    setTimeout(go,1200);
  };
  function st(){ var s=document.getElementById('printPage'); if(!s){ s=document.createElement('style'); s.id='printPage'; document.head.appendChild(s); } return s; }
  window.PrintFit={
    orient:function(w,h){ return w>h*1.02?'landscape':'portrait'; },
    /* 종이 안쪽 크기(mm): 이 높이에 맞춰 그림을 꽉 채움 */
    inner:function(o,m){ return o==='landscape'?{w:297-2*m,h:210-2*m}:{w:210-2*m,h:297-2*m}; },
    page:function(o,m,css){ st().textContent='@media print{@page{size:A4 '+o+';margin:'+m+'mm}'+(css||'')+'}'; }
  };
  window.addEventListener('afterprint',function(){ var s=document.getElementById('printPage'); if(s) s.textContent=''; });
})();
</script>
