<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>001 예시 사진 만들기 (제작자용)</title>
<style>
:root{--ink:#1C2A31;--muted:#56666E;--line:#C9D4D8;--bg:#EDF1F2;--acc:#1F6C75;--ok:#1b7f3a;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:15px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 12px 0 0}
button{font:inherit;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
#stat{color:var(--muted)}
.wrap{display:grid;grid-template-columns:220px 1fr 320px;gap:12px;padding:12px;height:calc(100vh - 56px)}
#list{overflow:auto;display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid transparent;border-radius:10px;padding:5px;cursor:pointer}
.item.on{border-color:var(--acc)}
.item img{width:64px;height:44px;object-fit:cover;border-radius:6px;flex:none}
.item small{display:block;color:var(--muted)}
.item .ok{color:var(--ok);font-weight:700}
#stage{position:relative;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#box{position:relative;line-height:0}
#photo{display:block;max-width:100%;max-height:calc(100vh - 90px);user-select:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#side{overflow:auto;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shape{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.shape.sel{border-color:var(--acc);box-shadow:0 0 0 2px #9fd3d8}
.shape input[type=text]{font:inherit;width:120px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.shape select{font:inherit;padding:3px}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
#msg{min-height:1.4em}
#msg.bad{color:var(--bad);font-weight:700} #msg.ok{color:var(--ok);font-weight:700}
#art{max-width:100%;border-radius:8px;display:none}
</style>
</head>
<body>
<header>
  <h1>001 예시 사진 만들기</h1>
  <input id="gkey" type="password" autocomplete="off" placeholder="Gemini 키" style="width:170px;padding:6px 8px;border:1px solid #C9D4D8;border-radius:8px">
  <button class="pri" id="bAna">이 사진 분석</button>
  <button id="bAll">분석 안 한 것 모두</button>
  <button id="bOk">✓ 확인함</button>
  <button id="bSave" class="pri">결과 내려받기 (photos.json)</button>
  <span id="stat"></span>
</header>
<div class="wrap">
  <div id="list"></div>
  <div id="stage"><div id="box"><img id="photo" alt=""><svg id="ov"></svg></div></div>
  <div id="side">
    <div class="card"><h3 id="title">사진</h3><div id="msg"></div>
      <p class="hint">도형의 점(모서리)을 끌어서 실제 모서리에 맞춰요. 동그라미·타원은 네 귀퉁이 점으로 크기를 맞춰요. 틀린 도형은 빼고, 빠진 도형은 더해요. 다 맞으면 <b>✓ 확인함</b>.</p>
      <div class="row"><button data-add="circle">+ 동그라미</button><button data-add="ellipse">+ 타원</button><button data-add="triangle">+ 세모</button><button data-add="quad">+ 네모</button></div>
    </div>
    <div class="card"><h3>도형</h3><div id="shapes"></div></div>
    <div class="card"><h3>끝 그림 (고르기)</h3>
      <div class="row"><button id="bArt">끝 그림은 art-maker에서</button><button id="bArtOk" disabled>이 그림 쓰기 (내려받기)</button></div>
      <img id="art" alt="끝 그림">
      <p class="hint">마음에 들 때만 "이 그림 쓰기". 내려받은 그림 파일도 결과와 함께 보내 주세요.</p>
    </div>
  </div>
</div>
<script>
/* 분석은 제작자의 Gemini 키로(이 기기에 저장된 webapp.geminiKey를 먼저 채움). 중계 서버(gemini-relay)·Worker는 쓰지 않음 */
let GKEY=''; try{ GKEY=localStorage.getItem('webapp.geminiKey')||''; }catch(e){}
let GMODEL='';
async function gemModel(){
  if(GMODEL) return GMODEL;
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':GKEY}}); if(!r.ok) throw new Error('키 확인 '+r.status);
  const names=((await r.json()).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/^gemini/.test(n)&&/flash/.test(n)&&!/(tts|image|audio|live|embedding|lite|thinking)/.test(n));
  const v=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0)-(/preview|exp/.test(n)?0.05:0);
  names.sort((a,b)=>v(b)-v(a)); if(!names.length) throw new Error('쓸 수 있는 모델이 없어요'); return GMODEL=names[0];
}
const TYPES={circle:{l:'동그라미',corners:0},ellipse:{l:'타원',corners:0},triangle:{l:'세모',corners:3},quad:{l:'네모',corners:4}};
const COLOR={circle:'#FF6F61',ellipse:'#9B6CF0',triangle:'#F2A93B',quad:'#2BA3DA'};
const PROMPT = `You are helping a special-education teacher make a shape-recognition lesson for students with developmental disabilities.
The app will show the photo faded and draw lines exactly on top of the shapes you find. So every outline you return must follow the real outline in the photo.

Think like a teacher who looks at everyday things and says "this looks like a circle". Real objects are never perfect shapes, so:
- APPROXIMATE shapes are welcome. Something roughly round counts as a circle (acorns, chestnuts, balls, fruit, buttons, coins, dots, round lids).
- BREAK objects into simple parts. Example: a mug on a saucer = ellipse (top rim of the mug) + quadrilateral (the side/body of the mug seen from the side) + ellipse (the saucer). A bottle = quadrilateral (body) + ellipse (cap top). A house = triangle (roof) + quadrilateral (wall) + quadrilateral (window).
- Each separate thing gets its own shape. Example: three acorns = three circles.

Shape types:
- circle: round-ish things seen from the front or roughly round objects
- ellipse: oval things, or round things seen at an angle (rims of cups, bowls, plates, saucers, cans)
- triangle: three-sided things or parts (roofs, pizza slices, signs, pointed parts)
- quadrilateral: four-sided things or parts (books, windows, doors, phones, screens, boards, planks, the side of a cup, labels, keys)

Rules:
- Include shapes a child can see: at least about 3% of the image width. Skip tiny details.
- Only include things whose WHOLE outline is inside the photo. Skip anything cut off by the edge of the photo (for example a laptop screen that runs off the side) or mostly hidden behind something, because its corners would not be real.
- Do not include people's faces or bodies.
- If there are many things of the same shape (keyboard keys, tiles, buttons, planks, windows), include 4 or 5 of them (not just one), spread out across different parts of the photo, not bunched together. Never more than 5 of the same type.
- At most 12 shapes in total. Try to include more than one shape type when the photo allows it.
- "object": a short, everyday Korean noun for the thing or part (1-3 words, e.g. 도토리, 컵 입구, 컵 몸통, 컵 받침, 창문, 책, 나무판).
- "box_2d": [ymin, xmin, ymax, xmax], integers normalized to 0-1000, tightly around that shape's outline only.
- "points": for triangle and quadrilateral, the corner points as [y, x] pairs normalized to 0-1000 in clockwise order, placed exactly on the visible corners in the photo (3 for triangle, 4 for quadrilateral). Use the OUTER edge of the whole object (for a phone or tablet, the edge of its body or case, not just the screen). Things seen at an angle (a book lying on a desk, a laptop, a tilted phone) look like slanted diamonds or parallelograms in the photo: put each point on its real corner and follow the slanted edges. Never turn them into a straight upright rectangle. For circle and ellipse, an empty list.
- "right_angles": for a quadrilateral, true if the real object has right-angled (90 degree) corners in real life, such as a book, window, door, phone, sheet of paper, picture frame, screen or box face, even when the photo shows it at an angle. Otherwise false. Always false for other shapes.
- "real_ratio": for a quadrilateral, the REAL object's width divided by its height when seen straight on, keeping the same up/down direction as in the photo. Use what you know about the real object, not how stretched it looks in the photo (a standing book cover about 0.7, an upright A4 sheet about 0.71, a wide picture frame about 1.4, a phone lying sideways about 2.1, a square tile 1). Use 0 for other shapes.
If there are no suitable shapes, return an empty "shapes" list.`;
const SCHEMA = {
  type:'OBJECT',
  properties:{ shapes:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
    type:{type:'STRING', enum:['circle','ellipse','triangle','quadrilateral']},
    object:{type:'STRING'},
    box_2d:{type:'ARRAY', items:{type:'INTEGER'}},
    points:{type:'ARRAY', items:{type:'ARRAY', items:{type:'INTEGER'}}},
    right_angles:{type:'BOOLEAN'},
    real_ratio:{type:'NUMBER'}
  }, required:['type','object','box_2d','points','right_angles','real_ratio'] } } },
  required:['shapes']
};

const clamp=v=>Math.max(0,Math.min(1000,Math.round(+v)));
function normShape(s){
  if(!s) return null;
  let t=String(s.type||'').toLowerCase();
  if(['square','rectangle','quadrilateral','trapezoid'].includes(t)) t='quad'; if(t==='oval') t='ellipse';
  if(!TYPES[t]) return null;
  const b=(s.box_2d||[]).map(Number); if(b.length!==4||b.some(isNaN)) return null;
  let y0=clamp(b[0]),x0=clamp(b[1]),y1=clamp(b[2]),x1=clamp(b[3]);
  if(y1<y0)[y0,y1]=[y1,y0]; if(x1<x0)[x0,x1]=[x1,x0];
  if(x1-x0<15||y1-y0<15) return null;
  let pts=Array.isArray(s.points)?s.points.filter(p=>Array.isArray(p)&&p.length===2).map(([y,x])=>[clamp(x),clamp(y)]):[];
  if(pts.length!==TYPES[t].corners||pts.length===0) pts=null;
  return {type:t, obj:String(s.object||'').trim().slice(0,10), box:{x0,y0,x1,y1}, pts, realRight:t==='quad'&&s.right_angles===true, ratio:(t==='quad'&&+s.real_ratio>0.15&&+s.real_ratio<7)?+s.real_ratio:0};
}


let S={shapes:[]}; /* cartoonPrompt가 S.shapes를 보지 않도록 자리만 */
function cartoonPrompt(){
  /* 도형 목록·위치를 넣으면 작은 그림 모델이 그 자리에 없던 모양을 새로 그려 넣음(휴대폰 위 타원 두 개) → 넣지 않음.
     사진을 그대로 옮겨 그리는 것만 시킴: 덜 바꿀수록 더 깔끔하고 사진과 같음. 찾은 도형은 앱이 따로 보여 줌 */
  return `Turn image 0 into a clean, high-quality illustration of the very same scene.
Copy the photo faithfully: every object stays exactly where it is, with the same shape, size, angle, number and real colors. Keep all edges and outlines in the same place.
Do not add, remove, move, merge or invent anything. Do not put new shapes, patterns or objects on top of anything.
Style: smooth soft shading, simplified textures, crisp clean outlines, gentle light, slightly brighter colors. No text, letters, numbers or logos.`;
}

/* 차름 사진 모음(media/photos/photos.json)을 읽어 이 화면이 쓰는 꼴(id·title·file·art·line·ok·shapes)로. 주소는 늘 GitHub 절대 주소 */
const PHOTOS='https://shim-sung-hyun.github.io/web_app/media/photos/';
let CAT=null;
async function loadPhotos(){
  const r=await fetch(PHOTOS+'photos.json',{cache:'no-store'}); CAT=await r.json(); const base=CAT.base||PHOTOS;
  return CAT.photos.map(p=>{ const f=p.files||{}, u=(p.uses&&p.uses.shape)||null;
    return {id:p.id,title:p.title,file:f.photo?base+f.photo:null,art:f.art?base+f.art:null,line:f.line?base+f.line:null,
      hasShape:!!u,ok:!!(u&&u.ok),shapes:u&&u.shapes&&u.shapes.length?u.shapes:null,src:p}; }).filter(x=>x.file);
}
const $=id=>document.getElementById(id);
const KEY='sf001.maker';
let ALL=[], DATA=[], cur=-1, sel=-1, artUrl='';
function saveLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(DATA.map(d=>({id:d.id,shapes:d.shapes,ok:d.ok,art:d.art})))); }catch(e){} }
function say(t,c){ const m=$('msg'); m.textContent=t||''; m.className=c||''; }
async function load(){
  ALL=await loadPhotos();
  /* 도형 찾기(001)에 쓸 사진 가운데 아직 확인하지 않은 것만(이미 확인해 올린 것·퍼즐에만 쓰는 사진은 뺌, 내보낼 때는 목록 그대로).
     기증 사진은 목록에 넣을 때 uses.shape = {ok:false, shapes:[…]}로 들어옴 */
  DATA=ALL.filter(d=>d.hasShape&&!d.ok);
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){}
  DATA.forEach(d=>{ const s=saved.find(x=>x.id===d.id); if(s){ d.shapes=s.shapes; d.ok=s.ok; d.art=s.art; } });
  list(); if(DATA.length) pick(0); else say('남은 사진이 없어요. 모두 확인했어요.','ok');
}
function list(){
  $('list').innerHTML=DATA.map((d,i)=>`<div class="item${i===cur?' on':''}" data-i="${i}"><img src="${d.file}" alt=""><div>${d.title}<small>${d.ok?'<span class="ok">✓ 확인</span>':d.shapes?('도형 '+d.shapes.length+'개'):'분석 전'}${d.art?' · 그림':''}</small></div></div>`).join('');
  $('list').querySelectorAll('.item').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  const n=DATA.filter(d=>d.ok).length, done=ALL.length-DATA.length; $('stat').textContent=`확인 ${n} / ${DATA.length}`+(done?` · 앞서 확인해 올린 ${done}장은 뺐어요`:'');
}
function pick(i){ cur=i; sel=-1; artUrl=''; $('art').style.display='none'; $('bArtOk').disabled=true; const d=DATA[i]; $('title').textContent=d.title+' ('+d.id+')'; say(''); $('photo').onload=draw; $('photo').src=d.file; list(); side(); }
/* ---- 그리기: 좌표는 0~1000 ---- */
function draw(){
  const d=DATA[cur], im=$('photo'), W=im.clientWidth, H=im.clientHeight, ov=$('ov');
  ov.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const X=v=>v/1000*W, Y=v=>v/1000*H; let h='';
  (d.shapes||[]).forEach((s,k)=>{
    const c=COLOR[s.type], on=k===sel, sw=on?4:3;
    if(s.pts){ h+=`<polygon points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${c}33" stroke="${c}" stroke-width="${sw}" data-k="${k}"/>`;
      s.pts.forEach((p,j)=>h+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${on?11:8}" fill="#fff" stroke="${c}" stroke-width="3" data-k="${k}" data-p="${j}" style="cursor:move"/>`); }
    else{ const b=s.box; h+=`<ellipse cx="${X((b.x0+b.x1)/2)}" cy="${Y((b.y0+b.y1)/2)}" rx="${X(b.x1-b.x0)/2}" ry="${Y(b.y1-b.y0)/2}" fill="${c}33" stroke="${c}" stroke-width="${sw}" data-k="${k}"/>`;
      [[b.x0,b.y0,'x0','y0'],[b.x1,b.y0,'x1','y0'],[b.x1,b.y1,'x1','y1'],[b.x0,b.y1,'x0','y1']].forEach(([x,y,a,bb])=>h+=`<rect x="${X(x)-8}" y="${Y(y)-8}" width="16" height="16" fill="#fff" stroke="${c}" stroke-width="3" data-k="${k}" data-bx="${a}" data-by="${bb}" style="cursor:move"/>`); }
    const lx=s.pts?Math.min(...s.pts.map(p=>p[0])):s.box.x0, ly=s.pts?Math.min(...s.pts.map(p=>p[1])):s.box.y0;
    h+=`<text x="${X(lx)+4}" y="${Y(ly)-6}" font-size="15" font-weight="700" fill="${c}" stroke="#fff" stroke-width="3" paint-order="stroke">${k+1} ${s.obj}</text>`;
  });
  ov.innerHTML=h;
}
/* ---- 끌기 ---- */
let drag=null;
$('ov').addEventListener('pointerdown',e=>{
  const t=e.target, k=t.dataset.k; if(k==null) return; sel=+k; side();
  if(t.dataset.p!=null||t.dataset.bx){ drag={k:+k,p:t.dataset.p!=null?+t.dataset.p:null,bx:t.dataset.bx,by:t.dataset.by}; $('ov').setPointerCapture(e.pointerId); }
  draw(); e.preventDefault();
});
$('ov').addEventListener('pointermove',e=>{
  if(!drag) return; const r=$('photo').getBoundingClientRect(), d=DATA[cur], s=d.shapes[drag.k];
  const x=Math.max(0,Math.min(1000,Math.round((e.clientX-r.left)/r.width*1000))), y=Math.max(0,Math.min(1000,Math.round((e.clientY-r.top)/r.height*1000)));
  if(drag.p!=null){ s.pts[drag.p]=[x,y]; const xs=s.pts.map(p=>p[0]), ys=s.pts.map(p=>p[1]); s.box={x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}; }
  else{ s.box[drag.bx]=x; s.box[drag.by]=y; const b=s.box; if(b.x1<b.x0)[b.x0,b.x1]=[b.x1,b.x0]; if(b.y1<b.y0)[b.y0,b.y1]=[b.y1,b.y0]; if(drag.bx==='x0'&&b.x0===x){} }
  d.ok=false; draw();
});
['pointerup','pointercancel'].forEach(t=>$('ov').addEventListener(t,()=>{ if(drag){ drag=null; saveLocal(); list(); } }));
addEventListener('resize',()=>cur>=0&&draw());
/* ---- 옆 목록 ---- */
function side(){
  const d=DATA[cur]; const ss=d.shapes||[];
  $('shapes').innerHTML=ss.length?ss.map((s,k)=>`<div class="shape${k===sel?' sel':''}" data-k="${k}"><div class="row"><b style="color:${COLOR[s.type]}">${k+1}</b>
    <select data-f="type">${Object.keys(TYPES).map(t=>`<option value="${t}" ${t===s.type?'selected':''}>${TYPES[t].l}</option>`).join('')}</select>
    <input type="text" data-f="obj" value="${s.obj.replace(/"/g,'&quot;')}" maxlength="10">
    <button data-f="del">빼기</button></div>
    ${s.type==='quad'?`<label class="hint"><input type="checkbox" data-f="right" ${s.realRight?'checked':''}> 실제로 직각인 물건(책·문·화면 등)</label>`:''}</div>`).join(''):'<p class="hint">아직 도형이 없어요. 분석하거나 더해 주세요.</p>';
  $('shapes').querySelectorAll('.shape').forEach(el=>{ const k=+el.dataset.k, s=ss[k];
    el.onclick=e=>{ if(e.target.tagName==='DIV'||e.target.tagName==='B'){ sel=k; side(); draw(); } };
    el.querySelector('[data-f=type]').onchange=e=>{ setType(s,e.target.value); d.ok=false; side(); draw(); saveLocal(); list(); };
    el.querySelector('[data-f=obj]').oninput=e=>{ s.obj=e.target.value.trim()||'이것'; d.ok=false; draw(); saveLocal(); };
    el.querySelector('[data-f=del]').onclick=()=>{ ss.splice(k,1); sel=-1; d.ok=false; side(); draw(); saveLocal(); list(); };
    const rc=el.querySelector('[data-f=right]'); if(rc) rc.onchange=()=>{ s.realRight=rc.checked; d.ok=false; saveLocal(); };
  });
}
function setType(s,t){
  const b=s.box; s.type=t;
  if(t==='quad') s.pts=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];
  else if(t==='triangle') s.pts=[[Math.round((b.x0+b.x1)/2),b.y0],[b.x1,b.y1],[b.x0,b.y1]];
  else s.pts=null;
  if(t!=='quad'){ s.realRight=false; s.ratio=0; }
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const d=DATA[cur]; d.shapes=d.shapes||[];
  const s={type:'circle',obj:'',box:{x0:400,y0:400,x1:600,y1:600},pts:null,realRight:false,ratio:0}; setType(s,b.dataset.add);
  d.shapes.push(s); sel=d.shapes.length-1; d.ok=false; side(); draw(); saveLocal(); list(); });
$('bOk').onclick=()=>{ const d=DATA[cur]; if(!d.shapes||!d.shapes.length){ say('도형이 없어요.','bad'); return; }
  if(d.shapes.some(x=>!String(x.obj||'').trim()||x.obj==='이것')){ say('이름이 없는 도형이 있어요. 학생이 아는 물건 이름을 넣거나 빼 주세요.','bad'); return; } d.ok=true; saveLocal(); list(); say('확인했어요.','ok'); if(cur<DATA.length-1) setTimeout(()=>pick(cur+1),400); };
/* ---- 분석(앱과 같은 지시·같은 정리) ---- */
async function imgB64(src){ const im=new Image(); im.crossOrigin='anonymous'; im.src=src; await im.decode(); const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); return c.toDataURL('image/jpeg',0.86).split(',')[1]; }
async function analyzeOne(i){
  const d=DATA[i]; const data=await imgB64(d.file);
  const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data}},{text:PROMPT}]}],generationConfig:{responseMimeType:'application/json',responseSchema:SCHEMA,temperature:0.2}};
  /* 오래 기다려도 되는 확인 페이지라 ?long=1(서버가 170초까지), 504(시간 초과)·503(붐빔)이면 30초 쉬고 한 번 더 */
  GKEY=($('gkey').value||GKEY).trim(); if(!/^(AIza[\w-]{20,}|AQ\.[\w.\-]{20,})$/.test(GKEY)) throw new Error('Gemini 키를 넣어 주세요');
  const model=await gemModel();
  let r, j;
  for(let t=0;t<2;t++){
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':GKEY},body:JSON.stringify(body),cache:'no-store'});
    j=await r.json().catch(()=>({}));
    if(!(r.status===504||r.status===503)||t===1) break;
    say(d.title+': Google이 늦게 답해서 30초 뒤 다시 해요…'); await new Promise(z=>setTimeout(z,30000));
  }
  if(!r.ok) throw new Error(r.status+' '+((j.error&&j.error.message)||''));
  j.model=j.model||model;
  const text=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join(''); const m=text.match(/\{[\s\S]*\}/);
  const raw=m?JSON.parse(m[0]).shapes||[]:[];
  d.shapes=raw.map(normShape).filter(Boolean); d.ok=false; d.model=j.model||''; saveLocal();
}
$('bAna').onclick=async()=>{ const i=cur; say('분석하는 중… (30초~3분)'); $('bAna').disabled=true;
  try{ await analyzeOne(i); if(cur===i){ side(); draw(); say('도형 '+DATA[i].shapes.length+'개 ('+(DATA[i].model||'')+'). 맞춰 보고 확인해 주세요.','ok'); } }
  catch(e){ say('분석 실패: '+e.message,'bad'); } finally{ $('bAna').disabled=false; list(); } };
$('bAll').onclick=async()=>{ $('bAll').disabled=true;
  for(let i=0;i<DATA.length;i++){ if(DATA[i].shapes) continue; $('stat').textContent=`분석 ${i+1}/${DATA.length}…`;
    try{ await analyzeOne(i); }catch(e){ say(DATA[i].title+': '+e.message,'bad'); if(/429/.test(e.message)) break; } list(); if(i===cur){ side(); draw(); } }
  $('bAll').disabled=false; list(); };
/* ---- 끝 그림 ---- */
$('bArt').onclick=()=>window.open('art-maker.html','_blank');   /* 끝 그림은 art-maker(Gemini 그림)에서 */
$('bArtOk').onclick=async()=>{ if(!artUrl) return; const d=DATA[cur];
  const im=new Image(); im.src=artUrl; await im.decode(); const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0);
  const a=document.createElement('a'); a.href=c.toDataURL('image/jpeg',0.88); a.download=d.id+'-art.jpg'; a.click(); d.art=true; saveLocal(); list(); };
/* ---- 결과 ---- */
/* 차름 사진 모음 목록 전체를 그대로 두고, 여기서 손본 사진의 도형 분석(uses.shape)만 바꿔 photos.json으로 내려받음 → Claude에게 */
$('bSave').onclick=()=>{ const out=JSON.parse(JSON.stringify(CAT));
  for(const d of DATA){ const p=out.photos.find(x=>x.id===d.id); if(!p) continue; p.uses=p.uses||{}; p.uses.shape={ok:!!d.ok,shapes:d.shapes||[]}; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'})); a.download='photos.json'; a.click(); };
load();
</script>
