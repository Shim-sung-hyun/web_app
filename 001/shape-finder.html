const PROMPT = `You are helping a special-education teacher make a shape-recognition lesson for students with developmental disabilities.
The app will show the photo faded and draw lines exactly on top of the shapes you find. So every outline you return must follow the real outline in the photo.

Think like a teacher who looks at everyday things and says "this looks like a circle". Real objects are never perfect shapes, so:
- APPROXIMATE shapes are welcome. Something roughly round counts as a circle (acorns, chestnuts, balls, fruit, buttons, coins, dots, round lids).
- BREAK objects into simple parts. Example: a mug on a saucer = ellipse (top rim of the mug) + quadrilateral (the side/body of the mug seen from the side) + ellipse (the saucer). A bottle = quadrilateral (body) + ellipse (cap top). A house = triangle (roof) + quadrilateral (wall) + quadrilateral (window).
- Each separate thing gets its own shape. Example: three acorns = three circles.

Shape types:
- circle: round-ish things seen from the front or roughly round objects
- ellipse: oval things, or round things seen at an angle (rims of cups, bowls, plates, saucers, cans)
- triangle: three-sided things or parts (roofs, pizza slices, signs, pointed parts)
- quadrilateral: four-sided things or parts (books, windows, doors, phones, screens, boards, planks, the side of a cup, labels, keys)

Rules:
- Include shapes a child can see: at least about 3% of the image width. Skip tiny details.
- Only include things whose WHOLE outline is inside the photo. Skip anything cut off by the edge of the photo (for example a laptop screen that runs off the side) or mostly hidden behind something, because its corners would not be real.
- Do not include people's faces or bodies.
- If there are many things of the same shape (keyboard keys, tiles, buttons, planks, windows), include 4 or 5 of them (not just one), spread out across different parts of the photo, not bunched together. Never more than 5 of the same type.
- At most 12 shapes in total. Try to include more than one shape type when the photo allows it.
- "object": a short, everyday Korean noun for the thing or part (1-3 words, e.g. 도토리, 컵 입구, 컵 몸통, 컵 받침, 창문, 책, 나무판).
- "box_2d": [ymin, xmin, ymax, xmax], integers normalized to 0-1000, tightly around that shape's outline only.
- "points": for triangle and quadrilateral, the corner points as [y, x] pairs normalized to 0-1000 in clockwise order, placed exactly on the visible corners in the photo (3 for triangle, 4 for quadrilateral). Use the OUTER edge of the whole object (for a phone or tablet, the edge of its body or case, not just the screen). Things seen at an angle (a book lying on a desk, a laptop, a tilted phone) look like slanted diamonds or parallelograms in the photo: put each point on its real corner and follow the slanted edges. Never turn them into a straight upright rectangle. For circle and ellipse, an empty list.
- "right_angles": for a quadrilateral, true if the real object has right-angled (90 degree) corners in real life, such as a book, window, door, phone, sheet of paper, picture frame, screen or box face, even when the photo shows it at an angle. Otherwise false. Always false for other shapes.
- "real_ratio": for a quadrilateral, the REAL object's width divided by its height when seen straight on, keeping the same up/down direction as in the photo. Use what you know about the real object, not how stretched it looks in the photo (a standing book cover about 0.7, an upright A4 sheet about 0.71, a wide picture frame about 1.4, a phone lying sideways about 2.1, a square tile 1). Use 0 for other shapes.
If there are no suitable shapes, return an empty "shapes" list.`;
const SCHEMA = {
  type:'OBJECT',
  properties:{ shapes:{ type:'ARRAY', items:{ type:'OBJECT', properties:{
    type:{type:'STRING', enum:['circle','ellipse','triangle','quadrilateral']},
    object:{type:'STRING'},
    box_2d:{type:'ARRAY', items:{type:'INTEGER'}},
    points:{type:'ARRAY', items:{type:'ARRAY', items:{type:'INTEGER'}}},
    right_angles:{type:'BOOLEAN'},
    real_ratio:{type:'NUMBER'}

  required:['shapes']

async function callGemini(withSchema,img){
  img=img||S.img;

    contents:[{parts:[{inline_data:{mime_type:'image/jpeg', data:img.url.split(',')[1]}},{text:PROMPT}]}],
    generationConfig: withSchema ? {responseMimeType:'application/json', responseSchema:SCHEMA, temperature:0.2} : {temperature:0.2}
  };
  /* 내 사진은 선생님 본인의 Gemini 키로 분석(2026-10-21). 예시 사진은 미리 분석해 두어 키가 필요 없음 */
  if(!S.apiKey) throw Object.assign(new Error('Gemini 키가 필요해요.'),{status:401,needKey:true});
  if(!await checkKey()) throw Object.assign(new Error('Gemini 키를 확인해 주세요.'),{status:401,needKey:true});
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent`,{
    method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey}, body:JSON.stringify(body)});
  if(!r) throw new TypeError('network');
  if(!r.ok){ let msg=''; try{msg=(await r.json()).error.message||'';}catch(e){} const e=new Error(msg); e.status=r.status; throw e; }

  const m=text.match(/\{[\s\S]*\}/); if(!m) throw Object.assign(new Error('응답을 읽지 못했어요.'),{status:0});
  return JSON.parse(m[0]);

async function analyze(img){

function friendly(e){

/* 같은 도형은 최대 5개, 사진 곳곳에 고르게. 겹치는 것은 하나만. 전체 최대 12개 */
const PER_TYPE=5, MAX_ALL=12;
function iou(a,b){
  const x0=Math.max(a.box.x0,b.box.x0), y0=Math.max(a.box.y0,b.box.y0), x1=Math.min(a.box.x1,b.box.x1), y1=Math.min(a.box.y1,b.box.y1);
  const inter=Math.max(0,x1-x0)*Math.max(0,y1-y0), ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0);

function spread(list,n){
  if(list.length<=n) return list;
  const c=s=>[(s.box.x0+s.box.x1)/2,(s.box.y0+s.box.y1)/2];
  const ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0);
  const rest=[...list].sort((a,b)=>ar(b)-ar(a)), out=[rest.shift()];
  while(out.length<n && rest.length){
    let best=0, bd=-1;
    rest.forEach((s,i)=>{const p=c(s); const d=Math.min(...out.map(o=>{const q=c(o); return Math.hypot(p[0]-q[0],p[1]-q[1]);})); if(d>bd){bd=d; best=i;}});
    out.push(rest.splice(best,1)[0]);
  }
  return out;
}
function pickShapes(list){
  const kept=[];
  list.forEach(s=>{ if(!kept.some(k=>k.type===s.type && iou(k,s)>0.6)) kept.push(s); });
  let out=[];
  TYPE_ORDER.forEach(t=>{ out=out.concat(spread(kept.filter(s=>s.type===t),PER_TYPE)); });
  if(out.length>MAX_ALL){ const ar=s=>(s.box.x1-s.box.x0)*(s.box.y1-s.box.y0); out=out.sort((a,b)=>ar(b)-ar(a)).slice(0,MAX_ALL); }
  return out;
}
const clamp=v=>Math.max(0,Math.min(1000,Math.round(+v)));
function normShape(s){
  if(!s) return null;
  let t=String(s.type||'').toLowerCase();
  if(['square','rectangle','quadrilateral','trapezoid'].includes(t)) t='quad'; if(t==='oval') t='ellipse';
  if(!TYPES[t]) return null;
  const b=(s.box_2d||[]).map(Number); if(b.length!==4||b.some(isNaN)) return null;
  let y0=clamp(b[0]),x0=clamp(b[1]),y1=clamp(b[2]),x1=clamp(b[3]);
  if(y1<y0)[y0,y1]=[y1,y0]; if(x1<x0)[x0,x1]=[x1,x0];
  if(x1-x0<15||y1-y0<15) return null;
  let pts=Array.isArray(s.points)?s.points.filter(p=>Array.isArray(p)&&p.length===2).map(([y,x])=>[clamp(x),clamp(y)]):[];
  if(pts.length!==TYPES[t].corners||pts.length===0) pts=null;
  const obj=String(s.object||'').trim().slice(0,10);
  if(!obj||obj==='이것') return null;   /* 이름 없는 도형은 쓰지 않음(학생이 아는 말로만) */
  return {type:t, obj, box:{x0,y0,x1,y1}, pts, realRight:t==='quad'&&s.right_angles===true, ratio:(t==='quad'&&+s.real_ratio>0.15&&+s.real_ratio<7)?+s.real_ratio:0};
}

function buildLesson(shapes){
  S.shapes=shapes;
  S.types=TYPE_ORDER.filter(t=>shapes.some(s=>s.type===t));
  S.steps=[{kind:'showAll'}];
  if(S.paint) S.types.forEach(t=>S.steps.push({kind:'paint',type:t}));
  S.types.forEach(t=>{
    if(TYPES[t].corners===0) return;
    if(S.level===2) S.steps.push({kind:'edge',type:t},{kind:'vertex',type:t});
    if(S.level===3) S.steps.push({kind:'angle',type:t});
  });
  S.tasks=S.types.map(t=>({kind:'type',type:t}));
  if(S.level===3 && shapes.some(hasRight) && shapes.some(s=>!hasRight(s))) S.tasks.push({kind:'right'});
  S.li=0; S.ti=0; S.log=[]; S.foundAll=new Set(); S.said={}; S.lastPhrase={}; S.defsSaid=new Set();
  const L=[...S.types.map(t=>`${nm(t)}. ${learnLine(t)}.`)];
  S.types.forEach(t=>{ const nn=nm(t), c=ofType(t).length;
    if(S.paint) L.push(c>1?`붓으로 ${nn} ${KO_COUNT[c-1]} 개를 모두 칠해요.`:`붓으로 ${eul(nn)} 칠해요.`);
    L.push(`${nn} ${KO_COUNT[c-1]} 개를 찾아 눌러요.`); });
  shapes.forEach(x=>L.push(`${eun(x.obj)} ${shapeOf(x.type)}.`));
  if(S.level===2) L.push('변을 눌러서 세어요. 곧은 선을 변이라고 해요.','꼭짓점을 눌러서 세어요. 두 곧은 선이 만나는 점을 꼭짓점이라고 해요.');
  if(S.level===3) L.push('각을 눌러서 세어요. 한 점에서 그은 두 반직선으로 이루어진 도형을 각이라고 해요.',...Object.values(ANGLE_DEF),'직각이에요.','각이에요.');
  S.voiceL=L; prefetchVoice(L);
}

/* 확대 → 도형이 사진에서 빠져나와 오른쪽으로 → 이름 */
function flyShape(s, target, delay){
  const wrap=document.querySelector('#ph .photo-wrap'); if(!wrap||!target) return;
  const r=wrap.getBoundingClientRect(), b=pxBounds(s);
  const pad=Math.max(b.x1-b.x0,b.y1-b.y0)*0.12, kx=r.width/S.img.w, ky=r.height/S.img.h;
  const vx=b.x0-pad, vy=b.y0-pad, vw=b.x1-b.x0+2*pad, vh=b.y1-b.y0+2*pad;
  const left=r.left+vx*kx, top=r.top+vy*ky, w=vw*kx, h=vh*ky;
  const k=(S.zoom.ph&&S.zoom.ph.k)||1;
  const el=document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('class','fly'); el.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`); el.setAttribute('preserveAspectRatio','none');
  el.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px`;
  el.innerHTML=renderItems([{s,style:'focus'}],strokeBase()/Math.sqrt(k),'fl'+Math.random().toString(36).slice(2,6));
  document.body.appendChild(el);
  const tr=target.getBoundingClientRect();
  const sc=Math.min(tr.width/w,tr.height/h)*0.9;
  const dx=tr.left+tr.width/2-(left+w/2), dy=tr.top+tr.height/2-(top+h/2);
  const end=`translate(${dx}px,${dy}px) scale(${sc})`;
  const a=el.animate([
    {transform:'translate(0,0) scale(1)',opacity:1},
    {transform:'translate(0,-6px) scale(1.15)',opacity:1,offset:.2},
    {transform:end,opacity:1,offset:.85},
    {transform:end,opacity:0}
  ],{duration:1300,delay,easing:'cubic-bezier(.55,0,.25,1)',fill:'both'});
  a.onfinish=a.oncancel=()=>el.remove();
  const tk=token; setTimeout(()=>{ if(tk!==token) el.remove(); },1300+delay+50);
}
/* FLIP: 줄이 늘어날 때 기존 줄이 부드럽게 위로 */
function flip(box, mutate){
  const before=new Map([...box.children].map(k=>[k,k.getBoundingClientRect()]));
  mutate();
  if(reduceMotion()) return;
  [...box.children].forEach(k=>{
    const b=before.get(k); if(!b) return;
    const a=k.getBoundingClientRect();
    const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2), sc=b.height/(a.height||1);
    if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(sc-1)<.02) return;
    k.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.3,0,.2,1)'});
  });
}
function roundExtra(t){ return ''; }

/* 붓으로 칠하기: 같은 도형을 모두 칠함. 다 칠하면 그 안에 사진 속 물체가 선명하게 드러남 */
function clearCrop(s){
  const b=pxBounds(s), w=b.x1-b.x0, h=b.y1-b.y0, pad=Math.max(w,h)*0.08;
  return `<svg class="meter" viewBox="${(b.x0-pad).toFixed(1)} ${(b.y0-pad).toFixed(1)} ${(w+2*pad).toFixed(1)} ${(h+2*pad).toFixed(1)}" aria-hidden="true">${renderItems([{s,style:'clear'}],Math.max(w,h)/45,'cc'+Math.random().toString(36).slice(2,7))}</svg>`;
}
function showPaint(t){
  const name=nm(t);
  const list=[...ofType(t)].sort((a,b)=>a.box.x0-b.box.x0||a.box.y0-b.box.y0);
  const ask=`붓으로 ${eul(name)} 칠해요`;
  const uid='p'+Math.random().toString(36).slice(2,7);
  const meter=i=>`<svg class="meter" viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="${uid}m${i}">${iconShape(t,'')}</clipPath></defs>
      ${iconShape(t,'fill="#F1F4F5" stroke="none"')}
      <rect id="${uid}f${i}" x="0" y="100" width="100" height="0" fill="${hex()}" clip-path="url(#${uid}m${i})"/>
      ${iconShape(t,`fill="none" stroke="${hex()}" stroke-width="6" stroke-linejoin="round"`)}</svg>`;
  screen('learn','paint',`
    <div class="task-head">${brushSVG(hex(),'mini')}<h2 class="say">${esc(ask)}</h2></div>
    <div class="stage-split">${photoHTML('ph')}
      <div class="panel">
        <div class="meters">${list.map((s,i)=>`<div class="meter-item" id="${uid}i${i}">${meter(i)}</div>`).join('')}</div>
        <div class="line" id="pmsg">${esc(name)}${list.length>1?` ${list.length}개`:''}</div>
      </div>
    </div>`, list.length>1?`붓으로 ${name} ${KO_COUNT[list.length-1]} 개를 모두 칠해요.`:ask+'.', {next:nextLearn,dots:learnDots()});
  fitIds=['ph']; fitPhoto('ph');
  zoomTo('ph',unionPx(list),false);
  const pre=`<defs>${list.map((s,i)=>`<clipPath id="${uid}c${i}">${shapeEl(s,'')}</clipPath>`).join('')}</defs>`
    +list.map((s,i)=>`<g id="${uid}g${i}" clip-path="url(#${uid}c${i})"></g>`).join('')+`<g id="${uid}d"></g>`;
  drawOverlay('ph',list.map(s=>({s,style:'outline'})),pre);
  const wr=document.querySelector('#ph .photo-wrap').getBoundingClientRect();
  const r=26/(wr.width/S.img.w);
  const samples=list.map(s=>{
    const bb=pxBounds(s), out=[], G=18;
    for(let i=0;i<G;i++) for(let j=0;j<G;j++){
      const x=bb.x0+(i+.5)/G*(bb.x1-bb.x0), y=bb.y0+(j+.5)/G*(bb.y1-bb.y0);
      if(inside(s,x,y)) out.push([x,y,false]);
    }
    return {pts:out, n:0, done:false};
  });
  const vp=document.querySelector('#ph .vp'); vp.classList.add('paint');
  let paths=null, pts=[];
  const allDone=()=>samples.every(q=>q.done);
  const complete=i=>{
    const q=samples[i], s=list[i]; q.done=true;
    const g=$(uid+'g'+i); g.innerHTML=shapeEl(s,`fill="${hex()}"`);
    const mf=$(uid+'f'+i); if(mf){mf.setAttribute('y',0); mf.setAttribute('height',100);}
    const msg=withP(phrase('painted'),`${eun(s.obj)} ${shapeOf(t)}.`);
    $('pmsg').textContent=msg;
    S.log.push({task:`${name} 칠하기`, result:'다 칠함', obj:s.obj});
    later(650,()=>{
      g.innerHTML='';
      $(uid+'d').insertAdjacentHTML('beforeend',`<image class="fadein" href="${S.img.url}" x="0" y="0" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" clip-path="url(#${uid}c${i})"/>`);
      const mi=$(uid+'i'+i); mi.innerHTML=clearCrop(s); mi.classList.add('got');
    });
    if(allDone()){ vp.classList.remove('paint'); paths=null; speakThen(msg,2200,nextLearn,true); }
    else speakSoon(msg);
  };
  let cur=-1;
  const mark=(x,y)=>{
    const i=cur, q=samples[i]; if(i<0||q.done) return;
    for(const p of q.pts){ if(!p[2] && (p[0]-x)**2+(p[1]-y)**2<=r*r*0.9){p[2]=true; q.n++;} }
    const pct=q.pts.length?q.n/q.pts.length:1;
    const mf=$(uid+'f'+i); if(mf){mf.setAttribute('y',100-pct*100); mf.setAttribute('height',pct*100);}
    if(pct>=0.78) complete(i);
  };
  /* 붓을 댄 곳의 도형 하나만 칠함 (가까운 도형으로 번지지 않게) */
  const pickShape=(x,y)=>{
    const open=list.map((s,i)=>i).filter(i=>!samples[i].done);
    const ins=open.filter(i=>inside(list[i],x,y)).sort((a,b)=>area(list[a])-area(list[b]));
    if(ins.length) return ins[0];
    let best=-1, bd=Infinity;
    open.forEach(i=>{ const b=pxBounds(list[i]); const dx=Math.max(b.x0-x,0,x-b.x1), dy=Math.max(b.y0-y,0,y-b.y1), d=Math.hypot(dx,dy); if(d<bd){bd=d; best=i;} });
    return bd<=r*1.5?best:-1;
  };
  vp.addEventListener('pointerdown',e=>{
    if(allDone()) return; e.preventDefault(); try{vp.setPointerCapture(e.pointerId);}catch(_){}
    const [x,y]=toImg('ph',e); pts=[[x,y]];
    cur=pickShape(x,y); if(cur<0){ paths=null; return; }
    paths=list.map((s,i)=>{
      if(i!==cur) return null;
      const pa=document.createElementNS('http://www.w3.org/2000/svg','path');
      pa.setAttribute('fill','none'); pa.setAttribute('stroke',hex()); pa.setAttribute('stroke-opacity','.85');
      pa.setAttribute('stroke-width',(r*2).toFixed(1)); pa.setAttribute('stroke-linecap','round'); pa.setAttribute('stroke-linejoin','round');
      pa.setAttribute('d',`M${x.toFixed(1)} ${y.toFixed(1)} l0.1 0`);
      $(uid+'g'+i).appendChild(pa); return pa;
    });
    mark(x,y);
  });
  vp.addEventListener('pointermove',e=>{
    if(!paths||allDone()) return;
    const [x,y]=toImg('ph',e), last=pts[pts.length-1];
    if((x-last[0])**2+(y-last[1])**2 < (r*0.3)**2) return;
    pts.push([x,y]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
    paths.forEach((pa,i)=>{ if(pa&&!samples[i].done) pa.setAttribute('d',d); });
    const steps=Math.ceil(Math.hypot(x-last[0],y-last[1])/(r*0.5));
    for(let k=1;k<=steps;k++) mark(last[0]+(x-last[0])*k/steps, last[1]+(y-last[1])*k/steps);
  });
  const end=()=>{paths=null; cur=-1;};
  vp.addEventListener('pointerup',end); vp.addEventListener('pointercancel',end);
}

/* 꼭짓점·각 세기 */
/* 변·꼭짓점·각: 사진 속 실제 도형으로 배움 */
const ANGLE_DEF={
  '직각':'종이를 반듯하게 두 번 접었을 때 생기는 각을 직각이라고 해요.',
};
const ANGLE_COLOR={'직각':'#1F6C75','각':'#E07A1F'};
/* 직각(88.5°~91.5°)인 각만 정확히 90°로 맞추고, 나머지 각은 사진 그대로 둠 */
function rotV(v,deg){ const r=deg*Math.PI/180, c=Math.cos(r), s2=Math.sin(r); return [v[0]*c-v[1]*s2, v[0]*s2+v[1]*c]; }
function interiorAngles(P){ const n=P.length; return P.map((p,i)=>{ const u1=unit(P[(i+n-1)%n],p), u2=unit(P[(i+1)%n],p); return Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])))*180/Math.PI; }); }
function idealPolygon(P){
  const n=P.length, deg=interiorAngles(P), total=(n-2)*180;
  const kind=deg.map(d=>Math.abs(d-90)<=RIGHT_TOL?'R':'X');
  const lo=k=>k==='R'?90:5, hi=k=>k==='R'?90:175;
  let T=deg.map((d,i)=>Math.min(hi(kind[i]),Math.max(lo(kind[i]),d)));
  for(let it=0;it<30;it++){
    const diff=total-T.reduce((a,b)=>a+b,0); if(Math.abs(diff)<0.01) break;
    const free=T.map((t,i)=>i).filter(i=>kind[i]!=='R' && (diff>0?T[i]<hi(kind[i]):T[i]>lo(kind[i])));
    if(!free.length) break;
    free.forEach(i=>{ T[i]=Math.min(hi(kind[i]),Math.max(lo(kind[i]),T[i]+diff/free.length)); });
  }
  if(Math.abs(total-T.reduce((a,b)=>a+b,0))>0.5){
    if(n===4) T=[90,90,90,90];
    else { const sum=deg.reduce((a,b)=>a+b,0); T=deg.map(d=>d*total/sum); }
  }
  const cr=(a,b)=>a[0]*b[1]-a[1]*b[0];
  const d0=unit(P[1],P[0]), sgn=Math.sign(cr([P[1][0]-P[0][0],P[1][1]-P[0][1]],[P[2][0]-P[1][0],P[2][1]-P[1][1]]))||1;
  const L=P.map((p,i)=>Math.hypot(P[(i+1)%n][0]-p[0],P[(i+1)%n][1]-p[1]));
  const Q=[[0,0],[d0[0]*L[0],d0[1]*L[0]]];
  let d=d0;
  for(let i=1;i<=n-2;i++){
    d=rotV(d,sgn*(180-T[i]));
    if(i<n-2) Q.push([Q[i][0]+d[0]*L[i],Q[i][1]+d[1]*L[i]]);
  }
  const A=Q[n-2], e=rotV(d0,sgn*T[0]);
  const den=cr(d,e); const t=Math.abs(den)<1e-9?L[n-2]:cr([0-A[0],0-A[1]],e)/den;
  Q.push([A[0]+d[0]*t,A[1]+d[1]*t]);
  const bx=v=>[Math.min(...v),Math.max(...v)];
  const [qx0,qx1]=bx(Q.map(q=>q[0])), [qy0,qy1]=bx(Q.map(q=>q[1])), [px0,px1]=bx(P.map(q=>q[0])), [py0,py1]=bx(P.map(q=>q[1]));
  const k=Math.max(px1-px0,py1-py0)/Math.max(qx1-qx0,qy1-qy0,1e-6);
  const qc=[(qx0+qx1)/2,(qy0+qy1)/2], pc=[(px0+px1)/2,(py0+py1)/2];
  return Q.map(q=>[pc[0]+(q[0]-qc[0])*k, pc[1]+(q[1]-qc[1])*k]);
}
/* 비스듬히 찍힌 직각 물체를 스캔하듯 반듯하게 펴기 (원근 보정) */
function orderQuad(P){
  let Q=P.map(p=>[...p]);
  const area2=Q.reduce((a,p,i)=>{const q=Q[(i+1)%4]; return a+p[0]*q[1]-q[0]*p[1];},0);
  if(area2<0) Q.reverse();
  let k=0; Q.forEach((p,i)=>{ if(p[0]+p[1]<Q[k][0]+Q[k][1]) k=i; });
  return Q.slice(k).concat(Q.slice(0,k));
}
/* 펴진 모양의 가로세로 비율: 실제 물체의 비율(Gemini가 알려 줌, 예: 책 표지 0.7)을 따름 */
function flatRect(P,ratio){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.max(d(P[0],P[1]),d(P[3],P[2])), H=Math.max(d(P[1],P[2]),d(P[0],P[3]));
  if(ratio){ const A=((d(P[0],P[1])+d(P[3],P[2]))/2)*((d(P[1],P[2])+d(P[0],P[3]))/2); H=Math.sqrt(A/ratio); W=ratio*H; }
  const cx=P.reduce((a,p)=>a+p[0],0)/4, cy=P.reduce((a,p)=>a+p[1],0)/4;
  return {W,H,R:[[cx-W/2,cy-H/2],[cx+W/2,cy-H/2],[cx+W/2,cy+H/2],[cx-W/2,cy+H/2]]};
}
function homography(from,to){
  const A=[],b=[];
  for(let i=0;i<4;i++){ const [u,v]=from[i], [x,y]=to[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); b.push(x); A.push([0,0,0,u,v,1,-u*y,-v*y]); b.push(y); }
  for(let c=0;c<8;c++){ let m=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r;
    [A[c],A[m]]=[A[m],A[c]]; [b[c],b[m]]=[b[m],b[c]];
    for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }
  return b.map((v,i)=>v/A[i][i]);
}
async function warpQuad(s,P,W,H){
  if(s._warp) return s._warp;
  const im=await loadImg(S.img.url);
  const c=document.createElement('canvas'); c.width=S.img.w; c.height=S.img.h;
  const g=c.getContext('2d'); g.drawImage(im,0,0,S.img.w,S.img.h);
  const sw=S.img.w, sh=S.img.h, src=g.getImageData(0,0,sw,sh).data;
  const sc=Math.min(1,700/Math.max(W,H)), ow=Math.max(2,Math.round(W*sc)), oh=Math.max(2,Math.round(H*sc));
  const h=homography([[0,0],[ow,0],[ow,oh],[0,oh]],P);
  const out=new ImageData(ow,oh), o=out.data;
  for(let v=0;v<oh;v++) for(let u=0;u<ow;u++){
    const den=h[6]*u+h[7]*v+1, x=(h[0]*u+h[1]*v+h[2])/den, y=(h[3]*u+h[4]*v+h[5])/den;
    const x0=Math.max(0,Math.min(sw-2,Math.floor(x))), y0=Math.max(0,Math.min(sh-2,Math.floor(y))), fx=Math.min(1,Math.max(0,x-x0)), fy=Math.min(1,Math.max(0,y-y0));
    const i00=(y0*sw+x0)*4, i10=i00+4, i01=i00+sw*4, i11=i01+4, j=(v*ow+u)*4;
    for(let ch=0;ch<3;ch++) o[j+ch]=(src[i00+ch]*(1-fx)+src[i10+ch]*fx)*(1-fy)+(src[i01+ch]*(1-fx)+src[i11+ch]*fx)*fy;
    o[j+3]=255;
  }
  const oc=document.createElement('canvas'); oc.width=ow; oc.height=oh; oc.getContext('2d').putImageData(out,0,0);
  s._warp=oc.toDataURL('image/jpeg',0.9); return s._warp;
}
function showParts(t, mode){
  const name=nm(t);
  const s=[...ofType(t)].sort((a,b)=>(mode==='angle'?(b.realRight?1:0)-(a.realRight?1:0):0)||area(b)-area(a))[0];
  const flat=mode==='angle' && t==='quad' && s.realRight;
  const P0=flat?orderQuad(geo(s).P):geo(s).P, FR=flat?flatRect(P0,s.ratio):null;
  const P=flat?FR.R:mode==='angle'?idealPolygon(P0):P0, n=P.length;
  let ready=!flat, warpURL='';
  const poly=a=>`<polygon points="${P.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" ${a}/>`;
  const AP=flat?P.concat(P0):P;
  const b={x0:Math.min(...AP.map(p=>p[0])),y0:Math.min(...AP.map(p=>p[1])),x1:Math.max(...AP.map(p=>p[0])),y1:Math.max(...AP.map(p=>p[1]))}, w=b.x1-b.x0, h=b.y1-b.y0, pad=Math.max(w,h)*0.24, U=Math.max(w,h)/300;
  const vb=[b.x0-pad,b.y0-pad,w+2*pad,h+2*pad].map(v=>v.toFixed(1)).join(' ');
  const cx=P.reduce((a,p)=>a+p[0],0)/n, cy=P.reduce((a,p)=>a+p[1],0)/n;
  const word=mode==='edge'?'변':mode==='vertex'?'꼭짓점':'각';
  const intro=mode==='edge'?'곧은 선을 변이라고 해요.':mode==='vertex'?'두 곧은 선이 만나는 점을 꼭짓점이라고 해요.':'한 점에서 그은 두 반직선으로 이루어진 도형을 각이라고 해요.';
  const ask=`${eul(word)} 눌러서 세어요`;
  const ang=P.map((p,i)=>{
    const u1=unit(P[(i+n-1)%n],p), u2=unit(P[(i+1)%n],p);
    const deg=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])))*180/Math.PI;
    const kind=Math.abs(deg-90)<=RIGHT_TOL?'직각':'각';
    const len=Math.min(Math.hypot(P[(i+n-1)%n][0]-p[0],P[(i+n-1)%n][1]-p[1]),Math.hypot(P[(i+1)%n][0]-p[0],P[(i+1)%n][1]-p[1]));
    let bi=[u1[0]+u2[0],u1[1]+u2[1]]; const bl=Math.hypot(bi[0],bi[1])||1; bi=[bi[0]/bl,bi[1]/bl];
    return {u1,u2,deg,kind,R:Math.min(len*0.28,70*U),bi};
  });
  const cid='pc'+Math.random().toString(36).slice(2,7);
  screen('learn',mode,`
    <div class="task-head">${shapeIcon(t,null,'mini')}<h2 class="say">${esc(ask)}</h2></div>
    <div class="count-wrap">
      <svg class="count-svg" id="cs" viewBox="${vb}" role="img" aria-label="${esc(name)}"></svg>
      <div class="panel">
        <div class="sub-name" style="font-size:24px">${esc(intro)}</div>
        <div class="slots" id="slots">${P.map(()=>'<span></span>').join('')}</div>
        <div class="feedback" id="fb"><span>${esc(name)}</span></div>
      </div>
    </div>`, flat?null:`${ask}. ${intro}`, {next:nextLearn,dots:learnDots()});
  const tapped=[], c=hex(), INK='#1C2A31';
  const f=v=>v.toFixed(1);
  const draw=()=>{
    let g = mode==='angle' ? (warpURL?`<image href="${warpURL}" x="${P[0][0].toFixed(1)}" y="${P[0][1].toFixed(1)}" width="${FR.W.toFixed(1)}" height="${FR.H.toFixed(1)}" preserveAspectRatio="none" opacity=".55"/>`:'') : `<defs><clipPath id="${cid}">${shapeEl(s,'')}</clipPath></defs>
      <image href="${S.img.url}" x="0" y="0" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" opacity=".45" clip-path="url(#${cid})"/>`;
    g+=poly(`fill="${c}" fill-opacity="${mode==='angle'?.16:.10}" stroke="${INK}" stroke-opacity="${mode==='edge'?1:.55}" stroke-width="${f((mode==='edge'?7:4)*U)}" stroke-linejoin="round"`);
    if(mode==='edge'){

        if(on) g+=`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="${c}" stroke-width="${f(12*U)}" stroke-linecap="round"/>`;
        g+=`<line class="hit" data-i="${i}" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" stroke="transparent" stroke-width="${f(46*U)}" stroke-linecap="round" style="cursor:pointer"/>`;
        if(on){ const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2, o=unit([mx,my],[cx,cy]);

        g+=`<g class="hit" data-i="${i}" style="cursor:pointer"><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(34*U)}" fill="transparent"/>
          <circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f((on?15:19)*U)}" fill="${on?c:'#FFFFFF'}" stroke="${c}" stroke-width="${f(6*U)}"/></g>`;
        if(on){ const o=unit(p,[cx,cy]); g+=`<text x="${f(p[0]+o[0]*38*U)}" y="${f(p[1]+o[1]*38*U+10*U)}" text-anchor="middle" font-family="Jua, sans-serif" font-size="${f(30*U)}" fill="${c}">${tapped.indexOf(i)+1}</text>`; }
      });
    }
    if(mode==='angle'){
      P.forEach((p,i)=>{ const a=ang[i], on=tapped.includes(i), R=a.R;
        const s1=[p[0]+a.u1[0]*R,p[1]+a.u1[1]*R], e1=[p[0]+a.u2[0]*R,p[1]+a.u2[1]*R];
        const sweep=(a.u1[0]*a.u2[1]-a.u1[1]*a.u2[0])>0?1:0, col=on?ANGLE_COLOR[a.kind]:c;
        if(on){
          [a.u1,a.u2].forEach(u=>{ g+=`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(p[0]+u[0]*R*2)}" y2="${f(p[1]+u[1]*R*2)}" stroke="${col}" stroke-width="${f(8*U)}" stroke-linecap="round"/>`; });
          if(a.kind==='직각'){ const r=R*0.7, q1=[p[0]+a.u1[0]*r,p[1]+a.u1[1]*r], q2=[q1[0]+a.u2[0]*r,q1[1]+a.u2[1]*r], q3=[p[0]+a.u2[0]*r,p[1]+a.u2[1]*r];
            g+=`<polygon points="${f(p[0])},${f(p[1])} ${q1.map(f)} ${q2.map(f)} ${q3.map(f)}" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="${f(5*U)}"/>`; }
          else g+=`<path d="M${f(p[0])} ${f(p[1])} L${s1.map(f)} A${f(R)} ${f(R)} 0 0 ${sweep} ${e1.map(f)} Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="${f(5*U)}"/>`;
          const o=unit(p,[cx,cy]), lx=p[0]+o[0]*40*U, ly=p[1]+o[1]*40*U;
          if(a.kind==='직각') g+=`<text x="${f(lx)}" y="${f(ly+9*U)}" text-anchor="middle" font-family="Jua, sans-serif" font-size="${f(26*U)}" fill="${col}" stroke="#fff" stroke-width="${f(5*U)}" paint-order="stroke">직각</text>`;
        } else {
          g+=`<path d="M${s1.map(f)} A${f(R)} ${f(R)} 0 0 ${sweep} ${e1.map(f)}" fill="none" stroke="${c}" stroke-width="${f(6*U)}" stroke-dasharray="${f(8*U)} ${f(6*U)}" stroke-linecap="round"/>`;
        }
        const hx=p[0]+a.bi[0]*R*0.7, hy=p[1]+a.bi[1]*R*0.7;
        g+=`<circle class="hit" data-i="${i}" cx="${f(hx)}" cy="${f(hy)}" r="${f(Math.max(R*0.95,30*U))}" fill="transparent" style="cursor:pointer"/>`;
      });
    }
    const svg=$('cs'); svg.innerHTML=g;
    svg.querySelectorAll('.hit').forEach(el=>el.onpointerdown=e=>{e.preventDefault(); tap(+el.dataset.i);});
    document.querySelectorAll('#slots span').forEach((sp,i)=>{sp.classList.toggle('on',i<tapped.length); sp.textContent=i<tapped.length?i+1:'';});
  };
  const tap=i=>{
    if(!ready||tapped.includes(i)||tapped.length>=n) return;
    tapped.push(i); draw();
    const k=tapped.length, fb=$('fb');
    let line=NUM_WORD[k-1]+'.', newDefs=[];
    if(mode==='angle'){
      const kind=ang[i].kind; line+=` ${kind}이에요.`;
      /* 아이가 빨리 눌러 앞 말이 생략돼도, 아직 들려주지 못한 정의는 이번에 함께 말함 */
      newDefs=[...new Set(tapped.map(j=>ang[j].kind))].filter(x=>ANGLE_DEF[x]&&!S.defsSaid.has(x));
      newDefs.forEach(x=>{ line+=' '+ANGLE_DEF[x]; });
      fb.className='feedback'; fb.innerHTML=`<span style="color:${ANGLE_COLOR[kind]}">${esc(k+'. '+kind)}</span>`;
    } else { fb.className='feedback'; fb.innerHTML=`<span>${k}</span>`; }
    const markDefs=()=>newDefs.forEach(x=>S.defsSaid.add(x));
    if(k<n){ speakSoon(line,markDefs); return; }
    const head=`${eun(name)} ${word}${batchim(word)?'이':'가'}`;
    let msg = mode==='edge' ? `${head} ${n}개 있어요.` : `${head} ${n}개 있는 도형이에요.`;
    let sayMsg = mode==='edge' ? `${head} ${KO_COUNT[n-1]} 개 있어요.` : `${head} ${KO_COUNT[n-1]} 개 있는 도형이에요.`;
    if(mode==='angle'){
      const cnt={}; ang.forEach(a=>cnt[a.kind]=(cnt[a.kind]||0)+1);
      if(cnt['직각']){ msg+=` 직각이 ${cnt['직각']}개 있어요.`; sayMsg+=` 직각이 ${KO_COUNT[cnt['직각']-1]} 개 있어요.`; }
    }
    fb.className='feedback ok'; fb.innerHTML=ICON.check+`<span>${esc(msg)}</span>`;
    S.log.push({task:`${name} ${word} 세기`, result:'다 셈'});
    speakThen(line+' '+sayMsg,1800,()=>{ markDefs(); nextLearn(); },true);
  };
  if(!flat){ draw(); return; }
  /* 반듯하게 펴기: 사진 속 비스듬한 모양 → 스캔하듯 직사각형으로 */
  const tk=token, svg=$('cs'), fq='fq'+cid, pts=Q=>Q.map(p=>p.map(f).join(',')).join(' ');
  svg.innerHTML=`<defs><clipPath id="${fq}"><polygon points="${pts(P0)}"/></clipPath></defs>
    <image href="${S.img.url}" x="0" y="0" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" clip-path="url(#${fq})" id="${fq}i"/>
    <polygon id="${fq}p" points="${pts(P0)}" fill="none" stroke="${c}" stroke-width="${f(6*U)}" stroke-linejoin="round"/>`;
  const fb=$('fb'); fb.className='feedback'; fb.innerHTML=`<span>${esc(eun(s.obj))} 비스듬히 찍혔어요.</span>`;
  const warpP=warpQuad(s,P0,FR.W,FR.H).catch(()=>'');
  speakThen(`${eun(s.obj)} 비스듬히 찍혔어요. 반듯하게 펴 볼게요.`,300,async()=>{
    warpURL=await warpP; if(tk!==token) return;
    if(warpURL) svg.insertAdjacentHTML('afterbegin',`<image id="${fq}w" href="${warpURL}" x="${f(P[0][0])}" y="${f(P[0][1])}" width="${f(FR.W)}" height="${f(FR.H)}" preserveAspectRatio="none" opacity="0"/>`);
    const t0=performance.now(), D=reduceMotion()?1:1500;
    const step=now=>{
      if(tk!==token) return;
      const k=Math.min(1,(now-t0)/D), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const Q=P0.map((p,i)=>[p[0]+(P[i][0]-p[0])*e, p[1]+(P[i][1]-p[1])*e]);
      $(fq+'p').setAttribute('points',pts(Q));
      const oi=$(fq+'i'), wi=$(fq+'w'); if(oi) oi.setAttribute('opacity',(1-e).toFixed(3)); if(wi) wi.setAttribute('opacity',e.toFixed(3));
      if(k<1){ requestAnimationFrame(step); return; }
      draw(); ready=true;
      fb.innerHTML=`<span>${esc(eun(s.obj))} 네 모서리가 반듯해요.</span>`;
      speak(`${ask}. ${intro}`);
    };
    requestAnimationFrame(step);
  });
}

/* ================= 3. 찾기 ================= */
function isTarget(s,task){return task.kind==='type'?s.type===task.type:hasRight(s);}
function cropHTML(s){
  const b=pxBounds(s), w=b.x1-b.x0, h=b.y1-b.y0, pad=Math.max(w,h)*0.3;
  const vb=[b.x0-pad,b.y0-pad,w+2*pad,h+2*pad].map(v=>v.toFixed(1)).join(' ');
  return `<svg class="crop" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><image href="${S.img.url}" width="${S.img.w}" height="${S.img.h}" preserveAspectRatio="none" opacity=".4"/>${renderItems([{s,style:'clear'}],Math.max(w,h)/70,'cr'+Math.random().toString(36).slice(2,6))}</svg>`;
}
function showFind(){
  const task=S.tasks[S.ti];
  const targets=S.shapes.filter(s=>isTarget(s,task));
  const iconType=task.kind==='type'?task.type:'quad';
  const n=targets.length, what = task.kind==='type' ? nm(task.type) : '직각이 있는 도형';
  const ask=`${what} ${n}개를 찾아 눌러요`;
  const askSay=`${what} ${KO_COUNT[n-1]||n} 개를 찾아 눌러요.`;
  const headIcon = task.kind==='type' ? shapeIcon(task.type,null,'mini')
    : `<svg class="mini" viewBox="0 0 100 100"><path d="M25 20v55h55" fill="none" stroke="#1C2A31" stroke-width="7" stroke-linecap="round"/><path d="M25 57h18v18" fill="none" stroke="${hex()}" stroke-width="6"/></svg>`;
  screen('find','find',`
    <div class="task-head">${headIcon}<h2 class="say">${esc(ask)}</h2></div>
    <div class="stage-split">${photoHTML('ph')}
      <div class="panel find-panel">
        <div class="feedback" id="fb">${ICON.find}<span>${esc(eul(what))} 찾아요</span></div>
        <div class="slots-row" id="slots">${targets.map(()=>shapeIcon(iconType,'#B9C5CA','',false)).join('')}</div>
        <div class="found" id="found"></div>
      </div>
    </div>`, askSay, {next:nextFind,dots:[S.tasks.length,S.ti]});
  if(!S.foundAll) S.foundAll=new Set();
  const found=new Set(); let wrong=0, hinted=false;
  const vp=document.querySelector('#ph .vp'); vp.classList.add('tap');
  const redraw=(extra=[])=>{
    const shown=[...new Set([...S.foundAll,...found])].filter(s=>!extra.some(x=>x.s===s));
    drawOverlay('ph',[...baseAll([...shown,...extra.map(x=>x.s)]),...shown.map(s=>({s,style:'clear'})),...extra]);
  };
  fitIds=['ph']; fitPhoto('ph'); redraw();
  vp.addEventListener('pointerdown',e=>{
    if(found.size===targets.length) return;
    e.preventDefault();
    const [x,y]=toImg('ph',e);
    const sc=document.querySelector('#ph .photo-wrap').getBoundingClientRect().width/S.img.w;
    const tolFor=s=>{const b=pxBounds(s); return Math.max(30/sc, 0.2*Math.min(b.x1-b.x0,b.y1-b.y0));};
    const hits=S.shapes.filter(s=>inside(s,x,y,tolFor(s))).sort((a,b)=>area(a)-area(b));
    const fb=$('fb');
    const hit=hits.find(s=>isTarget(s,task)&&!found.has(s));
    if(hit){
      found.add(hit); S.foundAll.add(hit);
      S.log.push({task:what+' 찾기', result:hinted?'도움 받아 맞힘':wrong?'다시 해서 맞힘':'바로 맞힘', obj:hit.obj});
      wrong=0; hinted=false; redraw();
      const left=targets.length-found.size;
      const say1 = withP(phrase('praise'), task.kind==='type' ? `${eun(hit.obj)} ${shapeOf(hit.type)}.` : `${hit.obj}에 직각이 있어요.`);
      const say2 = ' '+(left ? phrase('more')||'' : phrase('all')||'다 찾았어요')+(left?'.':'!');
      const sayAll=(say1+(say2.trim()==='.'?'':say2)).trim();
      fb.className='feedback ok'; fb.innerHTML=ICON.check+`<span>${esc(sayAll)}</span>`;
      $('slots').innerHTML=targets.map((_,i)=>i<found.size?shapeIcon(iconType,null,''):shapeIcon(iconType,'#B9C5CA','',false)).join('');
      $('found').innerHTML=`<div class="pop">${cropHTML(hit)}<div class="row2">${shapeIcon(hit.type,null,'')}<div class="line">${esc(hit.obj)} · ${esc(nm(hit.type))}</div></div></div>`;
      if(!left) speakThen(sayAll,2200,nextFind,true); else speakSoon(sayAll);
      return;
    }
    if(hits.some(s=>found.has(s)&&isTarget(s,task))){
      fb.className='feedback'; fb.innerHTML='<span>찾았어요. 또 찾아요.</span>'; speakSoon('찾았어요. 또 찾아요.'); return;
    }
    wrong++;
    const other=hits[0];
    const oWhat=other?`${eun(other.obj)} ${shapeOf(other.type)}.`:'';
    const rest=targets.filter(s=>!found.has(s));
    if(S.errorMode==='retry' && wrong===1){
      redraw(other?[{s:other,style:'wrong'}]:[]);
      fb.className='feedback'; fb.innerHTML=`<span>${esc(oWhat)} 다시 찾아요.</span>`; speakSoon(oWhat+' 다시 찾아요.');
      return;
    }
    hinted=true;
    redraw(rest.map(s=>({s,style:'hint'})));
    fb.className='feedback hint'; fb.innerHTML=ICON.point+`<span>${esc(oWhat)} 여기 있어요. 눌러요.</span>`;
    speakSoon(oWhat+' 여기 있어요. 눌러요.');
  });
}
function nextFind(){
  S.ti++;
  if(S.ti<S.tasks.length) showFind();
  else showEnd();
}

/* ================= 4. 끝: 그림으로 바꾸기 ================= */
const CARTOON_PROMPT=`Redraw this photo as a bright, friendly illustration in a clean modern animation style: soft rounded forms, smooth simple shading, cheerful clear colors, crisp dark outlines around every object (so it could also be used as a coloring page).
Keep the same scene, camera angle, objects, positions and sizes, so the original photo is easy to recognize.
Make round, oval, triangular and four-sided objects look clean and simple so their shapes are easy to see, but do not mark, label, highlight, glow or outline them differently from everything else.
Not babyish: it should also suit teenagers. Do not add characters, people, animals, faces, eyes, text, letters, numbers or logos. Remove any writing or brand names.`;
const CARTOON_EN={circle:'circle',ellipse:'oval (ellipse)',triangle:'triangle',quad:'rectangle / four-sided shape'};
function cartoonPrompt(){
  /* 끝 그림: 학생이 공부한 사진을 예쁜 그림으로. 도형은 또렷하게 살리되 표시·빛·글자 없이(학습 티 나지 않게). 아기 같지 않게 */
  return CARTOON_PROMPT;
}
function startCartoon(){
  /* 예시 사진: 제작자가 미리 그려 둔 그림. 내 사진: 보관한 그림이 있으면 그것, 없으면 선생님 키(결제 연결)로 한 번 그려 보관 */
  if(!S.img){ S.cartoon={status:'none'}; return; }
  if(S.demo){ S.cartoon=S.sampleArt?{status:'done',url:S.sampleArt}:{status:'none'}; return; }
  if(S.mineArt){ S.cartoon={status:'done',url:S.mineArt}; return; }
  if(S.cartoon&&S.cartoon.status!=='none') return;
  const today=new Date().toISOString().slice(0,10);
  if(!S.apiKey||store.get('imgBlock')===today){ S.cartoon={status:'none'}; return; }
  S.cartoon={status:'pending'}; const myImg=S.img, mid=S.mineId;
  (async()=>{ if(!await checkKey()||!S.imageModel) throw new Error('그림 모델이 없어요'); return drawCartoon(); })()
    .then(url=>{ if(mid) mineSetArt(mid,url); if(S.img!==myImg) return; S.cartoon={status:'done',url}; S.mineArt=url; onCartoon(); })
    .catch(e=>{ const m=String(e.message||e); if(/^(400|403|429)/.test(m)) store.set('imgBlock',today);   /* 결제를 연결하지 않은 키: 오늘은 다시 묻지 않음 */
      if(S.img!==myImg) return; S.cartoon={status:'error',msg:m}; onCartoon(); });
}
async function drawCartoon(){
  const body={contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:S.img.url.split(',')[1]}},{text:cartoonPrompt()}]}],generationConfig:{responseModalities:['TEXT','IMAGE']}};
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.imageModel)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.apiKey},body:JSON.stringify(body)});
  if(!r.ok){ let m=''; try{m=(await r.json()).error.message||'';}catch(e){} throw new Error(r.status+' '+m); }
  const j=await r.json();
  const part=((j.candidates||[])[0]?.content?.parts||[]).find(p=>p.inlineData||p.inline_data);
  if(!part) throw new Error('그림이 오지 않았어요');
  const d=part.inlineData||part.inline_data;
  return `data:${d.mimeType||d.mime_type||'image/png'};base64,${d.data}`;
}
const artDB=new Promise(r=>{ try{ const q=indexedDB.open('shapeFinderArt',1); q.onupgradeneeded=()=>q.result.createObjectStore('art'); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }catch(e){ r(null); } });
async function artKey(url){ try{ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(url+'|'+cartoonPrompt())); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
async function artGet(k){ const db=await artDB; if(!db||!k) return null; return new Promise(r=>{ try{ const q=db.transaction('art').objectStore('art').get(k); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }catch(e){ r(null); } }); }
async function artPut(k,v){ const db=await artDB; if(!db||!k) return; try{ db.transaction('art','readwrite').objectStore('art').put(v,k); }catch(e){} }
function artHTML(){
  const c=S.cartoon||{status:'none'};
  if(c.status==='done') return `<img class="cartoon" src="${c.url}" alt="도형이 강조된 그림">`;
  const note = c.status==='pending' ? `<div class="art-note">${waitingHTML()}<span>그림으로 바꾸고 있어요</span></div>`
    : c.status==='error' ? `<div class="art-note admin-only" style="font-size:15px;font-family:var(--f-body)">그림을 만들지 못했어요(칠한 사진으로 했어요): ${esc(c.msg.slice(0,120))}</div>` : '';
  return photoHTML('eph')+note;
}
function paintArt(){
  const art=$('art'); if(!art) return;
  art.innerHTML=artHTML();
  if(!(S.cartoon&&S.cartoon.status==='done')){
    fitIds=['eph']; fitPhoto('eph'); drawOverlay('eph',S.shapes.map(s=>({s,style:'focus'})));
    if(S.cartoon&&S.cartoon.status==='pending') spin();

}
function onCartoon(){
  if(S.view==='artwait'){ if(S.wantArt){ S.wantArt=false; showArtFromColor(); } else showEnd(); }
}
function endTools(swap){
  const rows=(S.inList&&S.logAll.length?S.logAll:S.log).map(l=>`<tr><td>${esc(l.task)}</td><td>${esc(l.result)}${l.obj?' ('+esc(l.obj)+')':''}</td></tr>`).join('');
  return `<div class="row end-btns">
        <button class="btn admin-only" id="same" type="button">${S.inList&&S.mode!=='solo'&&S.list.length>1?'처음부터 한 번 더':'같은 사진 한 번 더'}</button>
        <button class="btn primary admin-only" id="again" type="button">다른 사진으로</button>
        ${backBtnHTML()}${swap?`<button class="btn end-swap" id="swapBtn" type="button" ${swap.off?'disabled':''}>${swap.label}</button>`:''}
        <button class="btn admin-only" id="printBtn" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg>출력 (색칠용)</button>
      </div>
      <details class="log admin-only"><summary>교사용 기록 (${S.level}단계 · ${S.errorMode==='show'?'바로 정답 보여주기':'한 번 더 기회'}${S.demo?' · 예시 사진':''})</summary>
        <table><thead><tr><th>과제</th><th>결과</th></tr></thead><tbody>${rows||'<tr><td colspan="2">기록 없음</td></tr>'}</tbody></table>
        <p class="status" style="margin:8px 0 0">이 기록은 화면을 닫으면 사라져요. 필요하면 사진으로 남겨 두세요.</p>
      </details>`;

function bindEndTools(){
  $('again').onclick=()=>{ if(S.inList){ showSetup(); setTimeout(()=>{ const c=$('pickCard'); if(c) c.scrollIntoView({block:'center'}); },60); return; } newSession(); showPhoto(); };

/* 끝: 기본은 사진이 그림으로 스르르 바뀌고 그대로 멈춤(교사가 마침). '바로 색칠'이면 그림의 연필 선 위에 색칠.
   그림이 아직이면 잠깐 기다림(최대 40초) */
function showEnd(){
  finishItem();
  if(S.inList&&S.mode!=='solo'&&S.list.length>1&&!S.endSingle){ if(S.idx<S.list.length-1){ showMid(); return; } showGallery(); return; }
  const c=S.cartoon||{status:'none'};
  if(c.status==='pending'){
    if(S.view!=='artwait'){
      screen('end','artwait',`<div class="center"><h2 class="say">다 했어요</h2><div class="end-photo">${photoHTML('eph',false)}</div>${waitingHTML()}</div>`,'다 했어요.');
      fitIds=['eph']; fitPhoto('eph'); spin(); later(40000,()=>{ if(S.view==='artwait'){ S.cartoon={status:'error',msg:'시간이 지났어요'}; showEnd(); } });
    }
    return;
  }
  if(!S.cartoonOn){ showColor(); return; }
  const done=c.status==='done';
  screen('end','art',`<div class="end-wrap"><div class="end-art reveal-art${done?'':' still'}" id="art">
      <div class="ra">${done?`<img class="cartoon" src="${c.url}" alt="그림">`:''}<img class="photo-under" src="${S.img.url}" alt=""></div></div>${endTools({label:'🖍️ 이 그림으로 그리기'})}</div>`,
    done?'다 했어요. 사진이 그림이 되었어요.':'다 했어요.');
  bindEndTools(); $('swapBtn').onclick=()=>showColor();
}
/* 그림에서 많이 쓴 색 고르기: 작게 줄여 색을 묶고, 많이 쓴 것부터 서로 다른 색 12가지(흰색에 가까운 바탕색은 빼고), 색상 순으로 */
async function artPalette(){
  const src=S.cartoon&&S.cartoon.status==='done'?S.cartoon.url:null; if(!src) return null;

(function(){

  let down = false, raf = 0, useDot = false;
  const mobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const hide = () => { dot.style.opacity = 0; btn.style.opacity = ''; };
  const loop = () => {

    if (down && p > 0.01 && p < 1) {

    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);

})();

  css.textContent='#endBtn{position:fixed;left:12px;bottom:52px;z-index:2147480001;display:none;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #B4473B;color:#9A3328;font:700 14px/1.2 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.1);cursor:pointer;touch-action:none}#endBtn.on{display:inline-flex}#endBtn.sure{background:#B4473B;color:#fff}'
   +'#endCover{position:fixed;inset:0;z-index:2147483600;background:#F3F1EC;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#2B3236}'
   +'#endCover .c{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}#endCover h1{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;font-size:44px;margin:0}#endCover p{margin:0;color:#5E676B;font-size:16px}'
   +'#endCover .r{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}#endCover button,#endCover a{font:700 18px/1 "Noto Sans KR",sans-serif;padding:14px 26px;border-radius:14px;border:1.5px solid #8B979B;background:#fff;color:#2B3236;text-decoration:none;cursor:pointer}#endCover .p{background:#2B3236;color:#fff;border-color:#2B3236}@media print{#endBtn{display:none!important}}';
  document.head.appendChild(css);
  function admin(){ try{ return document.body.classList.contains('admin'); }catch(e){ return false; } }
  function exitFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement) document.webkitExitFullscreen(); }catch(e){} }
  function hush(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio,video').forEach(function(m){ try{ m.pause(); }catch(e){} }); ctxs.forEach(function(c){ try{ c.suspend(); }catch(e){} }); }
  function end(){
    hush(); try{ window.dispatchEvent(new Event('pagehide')); }catch(e){} exitFull();
    var cv=document.createElement('div'); cv.id='endCover';
    cv.innerHTML='<div class="c"><h1>수업을 마쳤어요</h1><p>이 창(탭)을 닫아도 됩니다. 하던 것은 이 기기에 저장되어 있습니다.</p><div class="r"><button type="button" class="p" id="endAgain">다시 시작</button><a href="'+BOARD+'">차름 게시판으로</a></div></div>';
    document.body.appendChild(cv);
    cv.querySelector('#endAgain').onclick=function(){ location.reload(); };
    ['pointerdown','click','touchstart','keydown'].forEach(function(t){ cv.addEventListener(t,function(e){ e.stopPropagation(); },true); });
    setTimeout(function(){ try{ window.close(); }catch(e){} },150);
    setInterval(hush,1000);   /* 늦게 시작한 소리도 멈춤 */
  }
  var was=false, sureT=0;
  function tick(){
    var b=document.getElementById('endBtn');
    if(!b){ b=document.createElement('button'); b.id='endBtn'; b.type='button'; b.title='앱을 끝내요(전체 화면에서 나가고 탭을 닫아요)';
      b.innerHTML='<span aria-hidden="true">⏻</span><span class="t">수업 끝내기</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation();
        if(!b.classList.contains('sure')){ b.classList.add('sure'); b.querySelector('.t').textContent='한 번 더 누르면 끝나요'; clearTimeout(sureT);
          sureT=setTimeout(function(){ b.classList.remove('sure'); b.querySelector('.t').textContent='수업 끝내기'; },3000); return; }
        end(); });
      ['click','pointerup'].forEach(function(t){ b.addEventListener(t,function(e){ e.stopPropagation(); }); });
      document.body.appendChild(b); }
    var a=admin();
    b.classList.toggle('on',a);
    if(a&&!was) exitFull();   /* 관리 메뉴를 열면 전체 화면에서 나옴(잠깐 나가기) */
    was=a;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tick); else tick();
  setInterval(tick,400);
})();
</script>
<script id="printFit">
/* 차름 공통: 출력 — 전체 화면이면 먼저 나간 뒤 인쇄(전체 화면에서 바로 인쇄하면 미리보기가 왼쪽 위에 작게 붙음),
   PrintFit.page(방향, 여백mm, 덧붙일 인쇄 CSS) 로 이번 한 번의 종이 방향을 정함(인쇄가 끝나면 원래대로) */
(function(){
  var P=window.print.bind(window);
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  window.print=function(){
    if(!fsEl()){ P(); return; }
    var done=false; function go(){ if(done) return; done=true; setTimeout(P,300); }
    document.addEventListener('fullscreenchange',go,{once:true});
    document.addEventListener('webkitfullscreenchange',go,{once:true});
    try{ var ex=document.exitFullscreen||document.webkitExitFullscreen; var r=ex&&ex.call(document); if(r&&r.catch) r.catch(go); }catch(e){ go(); }
    setTimeout(go,1200);
  };
  function st(){ var s=document.getElementById('printPage'); if(!s){ s=document.createElement('style'); s.id='printPage'; document.head.appendChild(s); } return s; }
  window.PrintFit={
    orient:function(w,h){ return w>h*1.02?'landscape':'portrait'; },
    /* 종이 안쪽 크기(mm): 이 높이에 맞춰 그림을 꽉 채움 */
    inner:function(o,m){ return o==='landscape'?{w:297-2*m,h:210-2*m}:{w:210-2*m,h:297-2*m}; },
    page:function(o,m,css){ st().textContent='@media print{@page{size:A4 '+o+';margin:'+m+'mm}'+(css||'')+'}'; }
  };
  window.addEventListener('afterprint',function(){ var s=document.getElementById('printPage'); if(s) s.textContent=''; });
})();
</script>
