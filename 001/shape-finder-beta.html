/* ================= 색칠용 출력: 색을 빼고 선만 ================= */
const loadImg=url=>new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url;});
async function makeLineArt(){
  const cartoon=!!(S.cartoon&&S.cartoon.status==='done');
  const im=await loadImg(cartoon?S.cartoon.url:S.img.url);
  const sc=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));
  const W=Math.round(im.naturalWidth*sc), H=Math.round(im.naturalHeight*sc);
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.drawImage(im,0,0,W,H);
  const src=g.getImageData(0,0,W,H), d=src.data, N=W*H;
  let a=new Float32Array(N);
  for(let i=0;i<N;i++) a[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  const blur=f=>{ const o=new Float32Array(N);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ let t=0,n=0;
      for(let j=-1;j<=1;j++) for(let k=-1;k<=1;k++){ const yy=y+j, xx=x+k; if(yy>=0&&yy<H&&xx>=0&&xx<W){t+=f[yy*W+xx]; n++;} }
      o[y*W+x]=t/n; } return o; };
  a=blur(blur(a)); if(!cartoon) a=blur(a);
  const m=new Float32Array(N); const hist=new Uint32Array(1024);
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-a[i-W-1]-2*a[i-1]-a[i+W-1]+a[i-W+1]+2*a[i+1]+a[i+W+1];
    const gy=-a[i-W-1]-2*a[i-W]-a[i-W+1]+a[i+W-1]+2*a[i+W]+a[i+W+1];
    const v=Math.hypot(gx,gy); m[i]=v; hist[Math.min(1023,v|0)]++;
  }
  const keep=cartoon?0.10:0.07; let acc=0, T=1023;
  for(;T>0;T--){ acc+=hist[T]; if(acc>=N*keep) break; }
  const ink=cartoon?20:150;
  for(let i=0;i<N;i++){
    const v=m[i]>T ? ink+(255-ink)*Math.max(0,1-(m[i]-T)/(T*0.6)) : 255;
    d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255;
  }
  g.putImageData(src,0,0);
  if(!cartoon){
    const k=W/S.img.w; g.strokeStyle='#111'; g.lineJoin='round'; g.lineWidth=Math.max(3,W/170);
    S.shapes.forEach(s=>{ const q=geo(s); g.beginPath();
      if(q.e) g.ellipse(q.cx*k,q.cy*k,q.rx*k,q.ry*k,0,0,Math.PI*2);
      else { q.P.forEach((p,i)=>i?g.lineTo(p[0]*k,p[1]*k):g.moveTo(p[0]*k,p[1]*k)); g.closePath(); }
      g.stroke(); });
  }
  return c.toDataURL('image/png');
}
async function printSheet(){
  const b=$('printBtn'); const label=b.innerHTML; b.disabled=true; b.textContent='준비하고 있어요…';
  try{
    const url=await makeLineArt();
    const legend=S.types.map(t=>`<span>${shapeIcon(t,'#111','',false)}${esc(nm(t))}, ${esc(objList(ofType(t),5))}</span>`).join('');
    $('printArea').innerHTML=`<div class="pa-head"><h1>도형에 색칠해요</h1><div>이름: ____________</div></div>
      <img class="pa-img" id="paImg" src="${url}" alt=""><div class="pa-legend">${legend}</div>`;
    try{ await $('paImg').decode(); }catch(e){}
    window.print();
  }catch(e){ b.textContent='출력하지 못했어요'; await new Promise(r=>setTimeout(r,1500)); }
  b.disabled=false; b.innerHTML=label;
}

/* ================= 빠뜨린 곳 알려 주기 =================
   필요한 것을 안 하고 넘어가려 할 때, 그곳을 빨간 테두리로 비추고 말풍선으로 할 일을 알려 줌.
   비춘 곳은 바로 누를 수 있고, 아무 데나 누르면 사라짐 */
const SPOT={el:null,sel:''};
(function(){ const a=document.createElement('div'); a.id='spot'; const b=document.createElement('div'); b.id='spotTip'; document.body.append(a,b); })();
/* sel: CSS 선택자 (화면이 다시 그려져도 위치를 다시 찾음) */
function spotlight(sel,msg){
  const el=document.querySelector(sel); if(!el) return; SPOT.el=el; SPOT.sel=sel;
  try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){ el.scrollIntoView(); }
  document.getElementById('spotTip').textContent=msg;
  setTimeout(()=>{ if(SPOT.sel!==sel) return; document.getElementById('spot').style.display='block'; document.getElementById('spotTip').style.display='block'; placeSpot();
    const cur=document.querySelector(sel); if(cur&&cur.focus&&/INPUT|SELECT|TEXTAREA/.test(cur.tagName)) try{ cur.focus({preventScroll:true}); }catch(e){} },350);
}
function placeSpot(){
  const el=SPOT.sel&&document.querySelector(SPOT.sel); if(!el) return; SPOT.el=el; const r=el.getBoundingClientRect(), pad=6, sp=document.getElementById('spot'), tip=document.getElementById('spotTip');
  Object.assign(sp.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  const tw=tip.offsetWidth, th=tip.offsetHeight, below=r.bottom+pad+12+th<innerHeight-8||r.top-pad-12-th<8;
  const left=Math.min(Math.max(12,r.left+r.width/2-tw/2),innerWidth-tw-12);
  tip.className=below?'below':'above'; tip.style.left=left+'px'; tip.style.top=(below?r.bottom+pad+12:r.top-pad-12-th)+'px';
  tip.style.setProperty('--ax',Math.min(tw-26,Math.max(12,r.left+r.width/2-left-7))+'px');
}
function hideSpot(){ SPOT.el=null; SPOT.sel=''; document.getElementById('spot').style.display='none'; document.getElementById('spotTip').style.display='none'; }
document.addEventListener('pointerdown',()=>{ if(SPOT.el) hideSpot(); },true);
window.addEventListener('resize',()=>{ if(SPOT.el) placeSpot(); });
document.addEventListener('scroll',()=>{ if(SPOT.el) placeSpot(); },true);
</script>
<script id="holdBubble">
/* 관리 버튼을 3초 누르는 동안: (휴대폰·태블릿을 손가락으로 누를 때만) 버튼 조금 위(손가락에 가리지 않는 곳)에 투명한 아쿠아 원이 1초에 한 번씩 부드럽게 세 번 깜빡. 전자칠판·PC는 버튼 둘레 고리만. 손을 떼면 바로 사라짐 */
(function(){
  const btn = document.querySelector('#adminBtn, #aqua'); if (!btn) return;
  const st = document.createElement('style');
  st.textContent = '.hb-dot{position:fixed;width:40px;height:40px;border-radius:50%;pointer-events:none;z-index:2147483000;opacity:0;'
    + 'background:radial-gradient(circle at 50% 40%,rgba(200,250,252,.75),rgba(120,225,232,.35) 60%,rgba(80,200,210,.2));'
    + 'border:1.5px solid rgba(70,185,200,.55);box-shadow:0 0 10px rgba(130,230,238,.55)}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.className = 'hb-dot'; document.body.appendChild(dot);
  let down = false, raf = 0, useDot = false;
  const mobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const prog = () => { const v = getComputedStyle(btn).getPropertyValue('--p').trim(); const n = parseFloat(v) || 0; return /%$/.test(v) ? n / 100 : n; };
  const hide = () => { dot.style.opacity = 0; btn.style.opacity = ''; };
  const loop = () => {
    const p = prog();
    if (down && p > 0.01 && p < 1) {
      const r = btn.getBoundingClientRect(), S = 40;
      dot.style.left = Math.max(4, Math.min(innerWidth - S - 4, r.left + r.width / 2 - S / 2)) + 'px';
      dot.style.top = Math.max(4, r.top - S - 34) + 'px';
      btn.style.opacity = '.75';
      if (!useDot) return void (raf = requestAnimationFrame(loop));
      dot.style.opacity = (0.9 * Math.sin(Math.PI * ((p * 3) % 1))).toFixed(3);   /* 1초마다 한 번: 천천히 나타났다 사라짐 */
    } else hide();
    if (down) raf = requestAnimationFrame(loop); else hide();
  };
  btn.addEventListener('pointerdown', e => { useDot = e.pointerType !== 'mouse' && (mobileOS || Math.min(screen.width, screen.height) < 1040); down = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }, true);
  const up = () => { down = false; cancelAnimationFrame(raf); hide(); };
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, up, true));
})();
</script>
<script id="adminGate">
/* 관리 메뉴 열기 2단계: 관리 버튼을 3초 누른 뒤, 왼쪽 위에 3초 동안 나타나는 작은 점을 눌러야 열림(학생이 보고 따라 하기 어렵게) */
window.AdminGate = (function () {
  const st = document.createElement('style');
  st.textContent = '#agDot{position:fixed;left:18px;top:18px;width:62px;height:62px;border-radius:50%;z-index:2147483600;display:none;cursor:pointer;touch-action:none;'
    + 'background:radial-gradient(circle at 50% 38%,rgba(210,252,253,.9),rgba(120,225,232,.55) 60%,rgba(70,190,205,.4));border:2px solid rgba(34,175,188,.75);box-shadow:0 0 10px rgba(120,225,232,.6)}'
    + '#agDot svg{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}'
    + '#agDot circle{fill:none;stroke:#22AFBC;stroke-width:4;stroke-linecap:round}';
  document.head.appendChild(st);
  const dot = document.createElement('div'); dot.id = 'agDot'; dot.setAttribute('aria-label', '관리 열기');
  dot.innerHTML = '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="34"/></svg>';
  document.body.appendChild(dot);
  const ring = dot.querySelector('circle'), L = 2 * Math.PI * 34;
  ring.style.strokeDasharray = L;
  let cb = null, t0 = 0, raf = 0, WAIT = 3000;
  const hide = () => { dot.style.display = 'none'; cancelAnimationFrame(raf); cb = null; };
  const tick = () => { const p = (performance.now() - t0) / WAIT; if (p >= 1 || !cb) return hide(); ring.style.strokeDashoffset = L * p; raf = requestAnimationFrame(tick); };
  let armed = false;
  dot.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!cb) return; armed = true; cancelAnimationFrame(raf); try { dot.setPointerCapture(e.pointerId); } catch (x) {} });
  const done = e => { e.preventDefault(); e.stopPropagation(); if (!armed) return; armed = false; const f = cb; cb = null; setTimeout(() => { dot.style.display = 'none'; }, 60); if (f) f(); };
  dot.addEventListener('pointerup', done); dot.addEventListener('pointercancel', done);   /* 전자칠판은 손을 뗄 때 pointercancel이 오기도 함 */
  dot.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
  return { ask(fn) { cb = fn; t0 = performance.now(); ring.style.strokeDashoffset = 0; dot.style.display = 'block'; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); }, cancel: hide };
})();
</script>
